<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>命格选取 · 第一轮候选 01 · 当前基线</title>
  <style>
    /* Purpose: Static interactive prototype: talent-select SELECT page (05) baseline. Motion copied from runtime TalentDraw.module.css (candidate-breathe / seal-breathe / rebirth-flow / rebirth-seal-halo and the candidateCardSelected / candidateCardPending states). Owner: Interface system. Responsibility: Candidate only; pure DOM interaction, no localStorage/sessionStorage/fetch. */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #28324b;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      background: #eef1f7;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      position: relative;
      isolation: isolate;
      display: grid;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: stretch;
      background: #eef1f7;
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    @media (min-width: 48rem) {
      .viewport { width: min(100%, 30rem); }
    }

    .screen {
      position: relative;
      z-index: 2;
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      padding: 15.6px 9.6px 0;
      border: 1.2px solid #d8deea;
      border-radius: 40.8px;
      background: linear-gradient(180deg, #fafbff 0%, #f2f4f9 100%);
      box-shadow: 0 24px 57.6px rgb(62 70 100 / 9%);
      overscroll-behavior: contain;
    }

    .header { position: relative; z-index: 5; flex: 0 0 auto; padding: 0 7.2px; }

    .meta {
      margin-bottom: 4.8px;
      color: #929bb0;
      font-size: 8.4px;
      letter-spacing: 0.02em;
    }

    .titleCopy h1 {
      margin: 0;
      color: #28324b;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.2;
    }
    .titleCopy p { display: none; }

    .selectionView {
      display: flex;
      min-height: 0;
      flex: 1 1 auto;
      flex-direction: column;
      overflow: hidden;
      padding-bottom: 108px;
    }

    .rebirthHeading,
    .slotHeading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.6rem;
      color: #929bb0;
      font-size: 10.8px;
      letter-spacing: 0.02em;
    }

    .rebirthHeading { margin-top: 12px; }
    .slotHeading { margin-top: 14.4px; }

    .rebirthSlots,
    .selectedSlots {
      display: flex;
      flex-wrap: wrap;
      gap: 9.6px;
      margin: 9.6px 9.6px 0;
      padding: 7.2px 2.4px;
      overflow: visible;
    }

    .rebirthSlot,
    .selectedSlot {
      position: relative;
      display: inline-flex;
      min-width: 0;
      height: 38.4px;
      min-height: 38.4px;
      max-height: 38.4px;
      align-items: center;
      justify-content: center;
      padding: 0 14.4px;
      border: 1.2px dashed rgb(146 155 176 / 55%);
      border-radius: 999px;
      background: transparent;
      color: #a4adbf;
      cursor: pointer;
      text-align: center;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    .rebirthSlot { flex: 1 1 calc(50% - 4.8px); max-width: calc(50% - 4.8px); }
    .selectedSlot { flex: 1 1 calc(33.333% - 7.2px); max-width: calc(33.333% - 7.2px); }

    .rebirthSlot strong,
    .selectedSlot strong {
      display: block;
      overflow: hidden;
      margin: 0;
      font-size: 13.2px;
      font-weight: 650;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rebirthSlot:not(.filled) strong,
    .selectedSlot:not(.filled) strong { color: #b0b8c9; font-weight: 500; }

    /* 轮回天赋槽：流光渐变 + 流光动画照抄运行时（rebirth-flow 13s / rebirth-seal-halo 7.2s） */
    .rebirthSlot.filled {
      --rebirth-flow: linear-gradient(110deg, rgb(167 146 224 / 34%), rgb(143 185 236 / 30%), rgb(130 207 187 / 28%), rgb(236 193 140 / 32%), rgb(227 157 189 / 30%), rgb(167 146 224 / 34%));
      border: 1.2px solid rgb(167 146 224 / 28%);
      background: var(--rebirth-flow);
      background-size: 420% 420%;
      color: #28324b;
      box-shadow: 0 0 0 1.2px rgb(255 255 255 / 72%), 0 0 9.6px rgb(167 146 224 / 22%), 0 0 16.8px rgb(143 185 236 / 18%), 0 0 21.6px rgb(236 193 140 / 14%);
      animation: rebirth-flow 13s ease-in-out 0s infinite, rebirth-seal-halo 7.2s ease-in-out 0s infinite;
    }
    .rebirthSlot.filled strong { color: #28324b; }

    @keyframes rebirth-flow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes rebirth-seal-halo {
      0%, 100% { box-shadow: 0 0 0 1.2px rgb(255 255 255 / 72%), 0 0 9.6px rgb(167 146 224 / 22%), 0 0 16.8px rgb(143 185 236 / 18%), 0 0 21.6px rgb(236 193 140 / 14%); }
      33% { box-shadow: 0 0 0 1.2px rgb(255 255 255 / 84%), 0 0 12px rgb(130 207 187 / 28%), 0 0 19.2px rgb(227 157 189 / 20%), 0 0 26.4px rgb(167 146 224 / 16%); }
      66% { box-shadow: 0 0 0 1.2px rgb(255 255 255 / 80%), 0 0 12px rgb(236 193 140 / 26%), 0 0 21.6px rgb(143 185 236 / 22%), 0 0 28.8px rgb(227 157 189 / 18%); }
    }

    /* 选中槽：seal-breathe 3.6s 按稀有度错峰（照抄运行时） */
    .selectedSlot.filled {
      --glow: 115 130 187;
      --breath-delay: 0s;
      border-style: solid;
      border-color: rgb(var(--glow) / 58%);
      background: rgb(var(--glow) / 14%);
      color: rgb(var(--glow));
      box-shadow: 0 0 0 1.2px rgb(255 255 255 / 68%), 0 2.4px 9.6px rgb(var(--glow) / 18%), 0 0 14.4px rgb(var(--glow) / 22%);
      animation: seal-breathe 3.6s ease-in-out var(--breath-delay, 0s) infinite;
    }
    .selectedSlot.filled strong { color: rgb(var(--glow)); }
    .selectedSlot.filled[data-rarity="普通"] { --glow: 128 143 162; --breath-delay: -0.4s; }
    .selectedSlot.filled[data-rarity="精良"] { --glow: 78 143 116; --breath-delay: -1.1s; }
    .selectedSlot.filled[data-rarity="稀有"] { --glow: 80 120 196; --breath-delay: -1.8s; }
    .selectedSlot.filled[data-rarity="史诗"] { --glow: 144 104 184; --breath-delay: -2.5s; }
    .selectedSlot.filled[data-rarity="传说"] { --glow: 170 132 54; --breath-delay: -3.2s; }

    @keyframes seal-breathe {
      0%, 100% { box-shadow: 0 0 0 1.2px rgb(255 255 255 / 68%), 0 2.4px 9.6px rgb(var(--glow) / 18%), 0 0 14.4px rgb(var(--glow) / 22%); }
      50% { box-shadow: 0 0 0 1.2px rgb(255 255 255 / 86%), 0 3.6px 12px rgb(var(--glow) / 28%), 0 0 21.6px rgb(var(--glow) / 36%); }
    }

    .candidateHead {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16.8px;
      padding: 0 7.2px 7.2px;
    }
    .candidateHead::after {
      position: absolute;
      right: 7.2px;
      bottom: 0;
      left: 7.2px;
      height: 1.2px;
      background: linear-gradient(90deg, transparent, rgb(146 155 176 / 40%) 11%, rgb(146 155 176 / 40%) 89%, transparent);
      content: "";
    }
    .candidateHead strong { color: #28324b; font-size: 12px; font-weight: 680; }
    .candidateHead small { margin-left: 4.8px; color: #929bb0; font-size: 7.2px; font-weight: 500; }

    .reroll {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.36rem;
      min-height: 26.4px;
      padding: 0 8.4px;
      border: 1.2px solid #d8deea;
      border-radius: 8.4px;
      background: rgb(255 255 255 / 80%);
      color: #7382bb;
      cursor: pointer;
      font: inherit;
      font-size: 7.8px;
    }
    .reroll svg { width: 1.05rem; height: 1.05rem; }
    .reroll:disabled { cursor: not-allowed; opacity: 0.45; }

    .candidateList {
      display: grid;
      align-content: start;
      min-height: 0;
      flex: 1 1 0;
      gap: 12px;
      margin: 6px 0 0;
      padding: 16.8px 19.2px 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    /* 候选卡：candidate-breathe 3.6s 按稀有度错峰（照抄运行时） */
    .candidateCard {
      --glow: 115 130 187;
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 91.2px;
      height: auto;
      padding: 10.8px 12px 12px;
      border: 1.2px solid rgb(var(--glow) / 58%);
      border-radius: 10.8px;
      background: linear-gradient(90deg, rgb(var(--glow) / 15%), rgb(255 255 255 / 90%) 42%);
      box-shadow: 0 0 0 1.2px rgb(255 255 255 / 68%), 0 3.6px 12px rgb(var(--glow) / 18%), 0 0 19.2px rgb(var(--glow) / 20%);
      color: #28324b;
      cursor: pointer;
      text-align: left;
      animation: candidate-breathe 3.6s ease-in-out var(--breath-delay, 0s) infinite;
    }

    .candidateCard:hover {
      border-color: rgb(var(--glow) / 58%);
      background: linear-gradient(90deg, rgb(var(--glow) / 12%), rgb(255 255 255 / 94%) 42%);
    }

    .candidateCard.selected {
      animation: none;
      cursor: default;
      opacity: 0.42;
      box-shadow: none;
    }

    .candidateCard[data-rarity="普通"] { --glow: 128 143 162; --breath-delay: -0.4s; }
    .candidateCard[data-rarity="精良"] { --glow: 78 143 116; --breath-delay: -1.1s; }
    .candidateCard[data-rarity="稀有"] { --glow: 80 120 196; --breath-delay: -1.8s; }
    .candidateCard[data-rarity="史诗"] { --glow: 144 104 184; --breath-delay: -2.5s; }
    .candidateCard[data-rarity="传说"] { --glow: 170 132 54; --breath-delay: -3.2s; }

    .candidateCard.pending {
      display: flex;
      align-items: center;
      border-style: dashed;
      border-color: #d8deea;
      background: rgb(255 255 255 / 70%);
      color: #929bb0;
      cursor: wait;
      box-shadow: none;
      animation: none;
    }

    @keyframes candidate-breathe {
      0%, 100% { box-shadow: 0 0 0 1.2px rgb(255 255 255 / 68%), 0 3.6px 12px rgb(var(--glow) / 18%), 0 0 19.2px rgb(var(--glow) / 20%); }
      50% { box-shadow: 0 0 0 1.2px rgb(255 255 255 / 84%), 0 4.8px 14.4px rgb(var(--glow) / 26%), 0 0 26.4px rgb(var(--glow) / 32%); }
    }

    .candidateCopy {
      position: relative;
      display: flex;
      min-width: 0;
      width: 100%;
      flex-direction: column;
      padding-left: 6px;
      padding-right: 0;
    }

    .candidateRarity {
      position: absolute;
      top: 0;
      right: 0;
      padding: 3.6px 6px;
      border-radius: 6px;
      background: rgb(var(--glow) / 12%);
      color: rgb(var(--glow));
      font-size: 7.2px;
      font-weight: 700;
    }

    .candidateCopy > strong {
      display: block;
      padding-right: 38.4px;
      overflow: hidden;
      color: #28324b;
      font-size: 10.6px;
      font-weight: 680;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .candidateCopy > span {
      display: block;
      max-height: 45px;
      margin-top: 4.8px;
      overflow-y: auto;
      overscroll-behavior: contain;
      color: #707b92;
      font-size: 7.8px;
      line-height: 1.4;
      white-space: normal;
      scrollbar-width: none;
    }
    .candidateCopy > span::-webkit-scrollbar { display: none; }

    .candidateCopy > i {
      display: block;
      max-height: 33px;
      margin-top: 3.6px;
      overflow-y: auto;
      overscroll-behavior: contain;
      color: #929bb0;
      font-size: 7.2px;
      font-style: italic;
      line-height: 1.35;
      scrollbar-width: none;
    }
    .candidateCopy > i::-webkit-scrollbar { display: none; }

    .candidateEffects {
      display: flex;
      flex-wrap: wrap;
      gap: 3.6px;
      width: 100%;
      margin-top: 7.2px;
      margin-bottom: 3.6px;
      padding-left: 6px;
      padding-top: 0;
    }

    .candidateEffects i {
      padding: 2.4px 4.8px;
      border-radius: 4.8px;
      background: rgb(var(--glow) / 10%);
      color: rgb(var(--glow));
      font-size: 7px;
      font-style: normal;
      line-height: 1.15;
    }

    .candidateEffects .systemEffect {
      background: rgb(40 50 75 / 6%);
      color: #596277;
    }

    .pendingCopy { font-size: 0.75rem; }

    /* 双文字底栏（运行时 BottomActionBar 规格） */
    .bottomBar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: 10px;
      padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
      border-top: 1px solid #d8deea;
      background: rgb(250 251 255 / 96%);
      backdrop-filter: blur(10px);
    }

    .backButton,
    .confirmButton {
      display: grid;
      min-height: 46px;
      place-items: center;
      padding: 8px 12px;
      border: 1px solid #d8deea;
      border-radius: 24px;
      background: #fff;
      color: #28324b;
      cursor: pointer;
      font: inherit;
      text-align: center;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .backButton:active,
    .confirmButton:active { transform: scale(0.97); }

    .confirmButton {
      border: 1px solid #7382bb;
      background: linear-gradient(135deg, #8b97c7, #5f6ea8);
      color: #fff;
    }

    .confirmButton:disabled {
      border: 1px solid #d8deea;
      background: linear-gradient(135deg, #c3cadf, #aab3cf);
      color: rgb(255 255 255 / 80%);
      cursor: not-allowed;
    }

    .backButton strong,
    .backButton small,
    .confirmButton strong,
    .confirmButton small { display: block; }

    .backButton strong,
    .confirmButton strong { font-size: 14px; font-weight: 650; }
    .backButton small,
    .confirmButton small { margin-top: 2px; font-size: 11px; font-weight: 500; }
    .backButton small { color: #707b92; }
    .confirmButton small { color: rgb(255 255 255 / 78%); }
  </style>
</head>
<body>
  <div class="frame">
    <div class="viewport">
      <div class="screen">
        <header class="header">
          <div class="meta" aria-hidden="true"><span>AI LIFE SIM · 命书</span><span>05 / 08</span></div>
          <div class="titleCopy">
            <h1 id="pageTitle">选择命格</h1>
            <p style="display:none">从十二个候选中选满三条，可携带 2 项轮回天赋。</p>
          </div>
        </header>

        <div class="selectionView">
          <div class="rebirthHeading">
            <span>轮回 · 可选</span>
            <span id="rebirthCount">0 / 2</span>
          </div>
          <div class="rebirthSlots" aria-label="已选择的轮回天赋">
            <button type="button" class="rebirthSlot" data-slot="0" aria-label="轮回天赋槽1，打开天赋库"><strong>+</strong></button>
            <button type="button" class="rebirthSlot" data-slot="1" aria-label="轮回天赋槽2，打开天赋库"><strong>+</strong></button>
          </div>

          <div class="slotHeading">
            <span>普通命格</span>
            <span id="selectedCount">0 / 3</span>
          </div>
          <div class="selectedSlots" aria-label="已选普通命格">
            <button type="button" class="selectedSlot" data-ui="0" aria-label="普通命格槽1，空"><strong>+</strong></button>
            <button type="button" class="selectedSlot" data-ui="1" aria-label="普通命格槽2，空"><strong>+</strong></button>
            <button type="button" class="selectedSlot" data-ui="2" aria-label="普通命格槽3，空"><strong>+</strong></button>
          </div>

          <div class="candidateHead">
            <strong>普通命格候选 <small id="candidateTotal">12 / 12 条</small></strong>
            <button type="button" class="reroll" id="rerollButton" aria-label="重新抽取未选择的普通命格">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v5h5"/><path d="M20 20v-5h-5"/><path d="M20 9A8 8 0 0 0 5.6 5.6L4 9"/><path d="M4 15a8 8 0 0 0 14.4 3.4L20 15"/></svg>
              <span>重抽未选</span>
            </button>
          </div>

          <div class="candidateList" id="candidateList" aria-label="普通命格候选"></div>
        </div>
      </div>

      <div class="bottomBar">
        <a class="backButton" href="../talent-draw/iteration-round-01.html" title="返回命格抽取">
          <strong>返回</strong>
          <small>返回命格抽取</small>
        </a>
        <button type="button" class="confirmButton" id="confirmButton" disabled title="确认命格">
          <strong id="confirmTitle">确认命格</strong>
          <small id="confirmHint">还需选择 3 条普通命格</small>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var patterns = [
        { name: '喜欢运动', rarity: '普通', description: '身体素质全面提升，锻炼效果显著增强。', effect: '每日锻炼额外获得体魄成长。', attr: '体魄 +2', sys: '健康恢复 +8%' },
        { name: '讲信用', rarity: '普通', description: '承诺必达，人际信任积累更快。', effect: '长期守信可获得隐藏际遇。', attr: '人脉 +2', sys: '声誉成长 +10%' },
        { name: '善于观察', rarity: '普通', description: '对细节敏感，更容易发现线索。', effect: '探索时提高关键信息发现率。', attr: '悟性 +1', sys: '探索发现 +12%' },
        { name: '心态好', rarity: '普通', description: '情绪稳定，压力影响大幅降低。', effect: '面对挫折时心态恢复更快。', attr: '心志 +2', sys: '压力衰减 +10%' },
        { name: '完美主义', rarity: '精良', description: '对品质有执念，产出质量更高。', effect: '专业产出额外获得品质加成。', attr: '技艺 +2', sys: '工作产出 +12%' },
        { name: '夜猫子', rarity: '精良', description: '夜晚精力充沛，灵感涌动。', effect: '夜间学习与创作效率提升。', attr: '灵感 +2', sys: '夜间效率 +15%' },
        { name: '天生灵觉', rarity: '稀有', description: '对灵气波动异常敏锐。', effect: '可感知隐藏的灵性节点。', attr: '灵性 +3', sys: '灵缘触发 +18%' },
        { name: '将门虎子', rarity: '稀有', description: '家学渊源，武艺根基扎实。', effect: '战斗相关成长速度提升。', attr: '体魄 +3', sys: '武学成长 +15%' },
        { name: '慧眼识人', rarity: '稀有', description: '一眼看穿人心，识人无碍。', effect: '社交中可识破虚言与伪善。', attr: '人脉 +3', sys: '识破概率 +20%' },
        { name: '天命眷顾', rarity: '史诗', description: '气运加身，逢凶化吉。', effect: '关键时刻更易触发好结果。', attr: '气运 +4', sys: '幸运触发 +22%' },
        { name: '凤凰血脉', rarity: '史诗', description: '涅槃重生，生命韧性极强。', effect: '重大挫败后可快速恢复。', attr: '体魄 +4', sys: '恢复上限 +20%' },
        { name: '万古第一', rarity: '传说', description: '旷世之资，潜力深不可测。', effect: '所有成长上限突破桎梏。', attr: '全属性 +3', sys: '上限突破 +30%' }
      ]
      var rebirthOptions = ['万古第一', '凤凰血脉']
      var selected = []   // 已选候选下标（最多 3）
      var selectedSlots = [null, null, null]
      var rebirthSlots = [null, null]
      var rebirthPicked = false

      var candidateList = document.getElementById('candidateList')
      var selectedSlotEls = document.querySelectorAll('.selectedSlot')
      var rebirthSlotEls = document.querySelectorAll('.rebirthSlot')
      var confirmButton = document.getElementById('confirmButton')
      var confirmTitle = document.getElementById('confirmTitle')
      var confirmHint = document.getElementById('confirmHint')
      var selectedCountEl = document.getElementById('selectedCount')
      var rebirthCountEl = document.getElementById('rebirthCount')

      function renderSlots() {
        selectedSlotEls.forEach(function (el, ui) {
          var index = selectedSlots[ui]
          var pattern = index === null ? null : patterns[index]
          el.classList.toggle('filled', Boolean(pattern))
          if (pattern) {
            el.setAttribute('data-rarity', pattern.rarity)
            el.querySelector('strong').textContent = pattern.name
          } else {
            el.removeAttribute('data-rarity')
            el.querySelector('strong').textContent = '+'
          }
        })
        selectedCountEl.textContent = selected.length + ' / 3'

        rebirthSlotEls.forEach(function (el, i) {
          var name = rebirthSlots[i]
          el.classList.toggle('filled', Boolean(name))
          el.querySelector('strong').textContent = name || '+'
        })
        rebirthCountEl.textContent = rebirthSlots.filter(Boolean).length + ' / 2'

        if (selected.length === 3) {
          confirmTitle.textContent = '确认命格'
          confirmHint.textContent = '三条普通命格已选择 · 进入属性分配'
          confirmButton.disabled = false
        } else {
          confirmTitle.textContent = '确认命格'
          confirmHint.textContent = '还需选择 ' + (3 - selected.length) + ' 条普通命格'
          confirmButton.disabled = true
        }
      }

      patterns.forEach(function (pattern, index) {
        var card = document.createElement('button')
        card.type = 'button'
        card.className = 'candidateCard'
        card.setAttribute('data-rarity', pattern.rarity)
        card.setAttribute('aria-pressed', 'false')
        card.innerHTML =
          '<span class="candidateCopy">' +
            '<strong>' + pattern.name + '</strong>' +
            '<span>' + pattern.description + '</span>' +
            '<i>' + pattern.effect + '</i>' +
          '</span>' +
          '<small class="candidateRarity">' + pattern.rarity + '</small>' +
          '<span class="candidateEffects">' +
            '<i>' + pattern.attr + '</i>' +
            '<i class="systemEffect">' + pattern.sys + '</i>' +
          '</span>'
        card.addEventListener('click', function () {
          var pos = selected.indexOf(index)
          if (pos >= 0) {
            selected.splice(pos, 1)
            var slotPos = selectedSlots.indexOf(index)
            if (slotPos >= 0) selectedSlots[slotPos] = null
          } else if (selected.length < 3) {
            selected.push(index)
            var empty = selectedSlots.indexOf(null)
            if (empty >= 0) selectedSlots[empty] = index
          }
          card.classList.toggle('selected', selected.indexOf(index) >= 0)
          card.setAttribute('aria-pressed', selected.indexOf(index) >= 0 ? 'true' : 'false')
          renderSlots()
        })
        candidateList.appendChild(card)
      })

      selectedSlotEls.forEach(function (el, ui) {
        el.addEventListener('click', function () {
          var index = selectedSlots[ui]
          if (index === null) return
          selectedSlots[ui] = null
          var pos = selected.indexOf(index)
          if (pos >= 0) selected.splice(pos, 1)
          var card = candidateList.children[index]
          card.classList.remove('selected')
          card.setAttribute('aria-pressed', 'false')
          renderSlots()
        })
      })

      rebirthSlotEls.forEach(function (el, i) {
        el.addEventListener('click', function () {
          if (rebirthSlots[i]) {
            rebirthSlots[i] = null
          } else if (!rebirthPicked) {
            rebirthSlots[i] = rebirthOptions[i]
            if (rebirthSlots.every(Boolean)) rebirthPicked = true
          }
          renderSlots()
        })
      })

      document.getElementById('rerollButton').addEventListener('click', function () {
        var btn = this
        btn.disabled = true
        btn.querySelector('span').textContent = '刷新中…'
        setTimeout(function () {
          btn.disabled = false
          btn.querySelector('span').textContent = '重抽未选'
        }, 800)
      })

      renderSlots()
    })()
  </script>
</body>
</html>
