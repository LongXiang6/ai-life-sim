<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>命格选取 · 第三轮候选 02 · 进度胶囊</title>
  <style>
    /* Purpose: Static interactive prototype: talent-select SELECT page (05) round-03 candidate 02: the pinned progress collapses into a floating centered capsule pill (counter + three slots), rebirth section stays as its own block below, and candidate cards keep the full detail copy. Warm paper/ink language; motion copied from runtime TalentDraw.module.css (candidate-breathe / seal-breathe / rebirth-flow / rebirth-seal-halo and the candidateCardSelected state). Owner: Interface system. Responsibility: Candidate only; pure DOM interaction, no localStorage/sessionStorage/fetch. */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #2e2922;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      position: relative;
      isolation: isolate;
      display: grid;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      place-items: stretch;
      background: #fdf9f1;
      color-scheme: light;
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    @media (min-width: 48rem) {
      .viewport {
        width: min(100%, 30rem);
      }
    }

    .page {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scrollbar-width: none;
      background: #fdf9f1;
      color: #2e2922;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    }

    .page::-webkit-scrollbar {
      display: none;
    }

    .paper {
      position: relative;
      isolation: isolate;
      display: grid;
      gap: 12px;
      width: 100%;
      align-content: start;
      padding: 20px 20px 96px;
    }

    .runningHead {
      display: flex;
      height: 16px;
      justify-content: space-between;
      gap: 8px;
      color: #a0907a;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .titleCopy {
      text-align: center;
      padding: 4px 0 0;
    }
    .titleCopy h1 {
      margin: 0;
      color: #241f18;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }
    .titleCopy h1 .semantic-emoji {
      margin-right: 6px;
      font-size: 17px;
      vertical-align: -1px;
    }
    .titleCopy p {
      margin: 5px 0 0;
      color: #8a7f6e;
      font-size: 11px;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }

    /* 吸顶进度胶囊：居中的悬浮胶囊（计数 + 三个槽位），滚动时始终可见，宽度不撑满 */
    .progressBar {
      position: sticky;
      top: 6px;
      z-index: 3;
      display: flex;
      justify-content: center;
      margin: 2px 18px 0;
      padding: 6px 10px;
      border: 1px solid #e5e1d6;
      border-radius: 999px;
      background: #faf4e8;
      box-shadow: 0 2.4px 9.6px rgb(150 122 66 / 12%);
    }

    .progressRow {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
    }

    .progressLabel {
      display: inline-flex;
      align-items: baseline;
      gap: 3px;
      flex: 0 0 auto;
      color: #a0907a;
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }
    .progressLabel b { color: #6b4d1d; font-size: 11px; }

    .selectedSlot {
      position: relative;
      display: inline-flex;
      min-width: 0;
      height: 30px;
      min-height: 30px;
      max-height: 30px;
      flex: 1 1 0;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      border: 1px dashed #d5ccba;
      border-radius: 999px;
      background: transparent;
      color: #b5ab96;
      cursor: pointer;
      font: inherit;
      text-align: center;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    .selectedSlot strong {
      display: block;
      overflow: hidden;
      margin: 0;
      font-size: 12px;
      font-weight: 650;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .selectedSlot:not(.filled) strong { color: #b5ab96; font-weight: 500; }

    /* 选中槽：seal-breathe 3.6s 按稀有度错峰（照抄运行时） */
    .selectedSlot.filled {
      --glow: 150 122 66;
      --breath-delay: 0s;
      border-style: solid;
      border-color: rgb(var(--glow) / 58%);
      background: rgb(var(--glow) / 14%);
      color: rgb(var(--glow));
      box-shadow: 0 0 0 1.2px rgb(255 255 255 / 68%), 0 2.4px 9.6px rgb(var(--glow) / 18%), 0 0 14.4px rgb(var(--glow) / 22%);
      animation: seal-breathe 3.6s ease-in-out var(--breath-delay, 0s) infinite;
    }
    .selectedSlot.filled strong { color: rgb(var(--glow)); }
    .selectedSlot.filled[data-rarity="普通"] { --glow: 128 143 162; --breath-delay: -0.4s; }
    .selectedSlot.filled[data-rarity="精良"] { --glow: 78 143 116; --breath-delay: -1.1s; }
    .selectedSlot.filled[data-rarity="稀有"] { --glow: 80 120 196; --breath-delay: -1.8s; }
    .selectedSlot.filled[data-rarity="史诗"] { --glow: 144 104 184; --breath-delay: -2.5s; }
    .selectedSlot.filled[data-rarity="传说"] { --glow: 170 132 54; --breath-delay: -3.2s; }

    @keyframes seal-breathe {
      0%, 100% { box-shadow: 0 0 0 1.2px rgb(255 255 255 / 68%), 0 2.4px 9.6px rgb(var(--glow) / 18%), 0 0 14.4px rgb(var(--glow) / 22%); }
      50% { box-shadow: 0 0 0 1.2px rgb(255 255 255 / 86%), 0 3.6px 12px rgb(var(--glow) / 28%), 0 0 21.6px rgb(var(--glow) / 36%); }
    }

    /* 轮回天赋：独立小节，位于候选区上方 */
    .rebirthSection {
      padding: 12px 14px;
      border: 1px solid #e5e1d6;
      border-radius: 18px;
      background: #fffdf8;
    }

    .rebirthHead {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .rebirthHead span { color: #a0907a; font-size: 11px; font-weight: 650; }
    .rebirthHead b { color: #6b4d1d; font-size: 11px; }

    .rebirthSlots {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .rebirthSlot {
      position: relative;
      display: inline-flex;
      min-width: 0;
      height: 36px;
      min-height: 36px;
      max-height: 36px;
      flex: 1 1 0;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px dashed #d5ccba;
      border-radius: 999px;
      background: transparent;
      color: #b5ab96;
      cursor: pointer;
      font: inherit;
      text-align: center;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    .rebirthSlot strong {
      display: block;
      overflow: hidden;
      margin: 0;
      font-size: 12.5px;
      font-weight: 650;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rebirthSlot:not(.filled) strong { color: #b5ab96; font-weight: 500; }

    /* 轮回天赋槽：流光渐变 + 流光动画照抄运行时（rebirth-flow 13s / rebirth-seal-halo 7.2s） */
    .rebirthSlot.filled {
      --rebirth-flow: linear-gradient(110deg, rgb(196 156 96 / 34%), rgb(212 178 116 / 30%), rgb(224 196 140 / 28%), rgb(236 193 140 / 32%), rgb(214 160 92 / 30%), rgb(196 156 96 / 34%));
      border: 1.2px solid rgb(196 156 96 / 28%);
      background: var(--rebirth-flow);
      background-size: 420% 420%;
      color: #2e2922;
      box-shadow: 0 0 0 1.2px rgb(255 255 255 / 72%), 0 0 9.6px rgb(196 156 96 / 22%), 0 0 16.8px rgb(212 178 116 / 18%), 0 0 21.6px rgb(236 193 140 / 14%);
      animation: rebirth-flow 13s ease-in-out 0s infinite, rebirth-seal-halo 7.2s ease-in-out 0s infinite;
    }
    .rebirthSlot.filled strong { color: #2e2922; }

    @keyframes rebirth-flow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes rebirth-seal-halo {
      0%, 100% { box-shadow: 0 0 0 1.2px rgb(255 255 255 / 72%), 0 0 9.6px rgb(196 156 96 / 22%), 0 0 16.8px rgb(212 178 116 / 18%), 0 0 21.6px rgb(236 193 140 / 14%); }
      33% { box-shadow: 0 0 0 1.2px rgb(255 255 255 / 84%), 0 0 12px rgb(214 160 92 / 28%), 0 0 19.2px rgb(224 196 140 / 20%), 0 0 26.4px rgb(196 156 96 / 16%); }
      66% { box-shadow: 0 0 0 1.2px rgb(255 255 255 / 80%), 0 0 12px rgb(236 193 140 / 26%), 0 0 21.6px rgb(212 178 116 / 22%), 0 0 28.8px rgb(214 160 92 / 18%); }
    }

    /* 候选区：主体 */
    .candidateBand {
      padding: 2px 0 0;
    }

    .candidateHead {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
    }
    .candidateHead::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgb(214 201 177 / 50%) 11%, rgb(214 201 177 / 50%) 89%, transparent);
      content: "";
    }
    .candidateHead strong { color: #241f18; font-size: 13px; font-weight: 700; }
    .candidateHead small { margin-left: 4px; color: #a0907a; font-size: 10px; font-weight: 500; }

    .reroll {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 26px;
      padding: 0 9px;
      border: 1px solid #d8c9a8;
      border-radius: 13px;
      background: #faf4e8;
      color: #6b4d1d;
      cursor: pointer;
      font: inherit;
      font-size: 10.5px;
      font-weight: 650;
    }
    .reroll svg { width: 14px; height: 14px; }
    .reroll:disabled { cursor: not-allowed; opacity: 0.45; }

    .candidateList {
      display: grid;
      gap: 10px;
    }

    /* 候选卡：完整详细介绍 + candidate-breathe 3.6s 按稀有度错峰（照抄运行时） */
    .candidateCard {
      --glow: 150 122 66;
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 88px;
      height: auto;
      padding: 12px 14px 14px;
      border: 1px solid rgb(var(--glow) / 48%);
      border-radius: 16px;
      background: linear-gradient(90deg, rgb(var(--glow) / 10%), rgb(255 255 255 / 92%) 42%);
      box-shadow: 0 0 0 1.2px rgb(255 255 255 / 68%), 0 3.6px 12px rgb(var(--glow) / 16%), 0 0 19.2px rgb(var(--glow) / 18%);
      color: #2e2922;
      cursor: pointer;
      font: inherit;
      text-align: left;
      animation: candidate-breathe 3.6s ease-in-out var(--breath-delay, 0s) infinite;
    }

    .candidateCard:hover {
      border-color: rgb(var(--glow) / 58%);
      background: linear-gradient(90deg, rgb(var(--glow) / 12%), rgb(255 255 255 / 94%) 42%);
    }

    .candidateCard.selected {
      animation: none;
      cursor: default;
      opacity: 0.42;
      box-shadow: none;
    }

    .candidateCard[data-rarity="普通"] { --glow: 128 143 162; --breath-delay: -0.4s; }
    .candidateCard[data-rarity="精良"] { --glow: 78 143 116; --breath-delay: -1.1s; }
    .candidateCard[data-rarity="稀有"] { --glow: 80 120 196; --breath-delay: -1.8s; }
    .candidateCard[data-rarity="史诗"] { --glow: 144 104 184; --breath-delay: -2.5s; }
    .candidateCard[data-rarity="传说"] { --glow: 170 132 54; --breath-delay: -3.2s; }

    @keyframes candidate-breathe {
      0%, 100% { box-shadow: 0 0 0 1.2px rgb(255 255 255 / 68%), 0 3.6px 12px rgb(var(--glow) / 18%), 0 0 19.2px rgb(var(--glow) / 20%); }
      50% { box-shadow: 0 0 0 1.2px rgb(255 255 255 / 84%), 0 4.8px 14.4px rgb(var(--glow) / 26%), 0 0 26.4px rgb(var(--glow) / 32%); }
    }

    .candidateCopy {
      position: relative;
      display: flex;
      min-width: 0;
      width: 100%;
      flex-direction: column;
    }

    .candidateRarity {
      position: absolute;
      top: 0;
      right: 0;
      padding: 3px 6px;
      border-radius: 8px;
      background: rgb(var(--glow) / 12%);
      color: rgb(var(--glow));
      font-size: 10px;
      font-weight: 700;
    }

    .candidateCopy > strong {
      display: block;
      padding-right: 52px;
      overflow: hidden;
      color: #241f18;
      font-size: 12.5px;
      font-weight: 680;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .candidateCopy > span {
      display: block;
      margin-top: 4px;
      color: #8a7f6e;
      font-size: 11px;
      line-height: 1.45;
      white-space: normal;
    }

    .candidateCopy > i {
      display: block;
      margin-top: 3px;
      color: #a0907a;
      font-size: 10.5px;
      font-style: italic;
      line-height: 1.35;
    }

    .candidateEffects {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      width: 100%;
      margin-top: 8px;
    }

    .candidateEffects i {
      padding: 2px 7px;
      border-radius: 8px;
      background: rgb(var(--glow) / 10%);
      color: rgb(var(--glow));
      font-size: 10px;
      font-style: normal;
      line-height: 1.15;
    }

    .candidateEffects .systemEffect {
      background: rgb(46 41 34 / 6%);
      color: #7a7160;
    }

    /* 双文字等宽纯白同底按钮（与角色塑造定版一致） */
    .bottomBar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 4;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: 10px;
      padding: 10px 20px 16px;
      border-top: 1px solid #eadfce;
      background: #fdf9f1;
    }

    .backButton,
    .confirmButton {
      display: grid;
      min-height: 46px;
      place-items: center;
      gap: 0;
      padding: 8px 12px;
      border: 1px solid #e5e1d6;
      border-radius: 24px;
      background: #fff;
      color: #2e2922;
      cursor: pointer;
      font: inherit;
      text-align: center;
      text-decoration: none;
    }

    .confirmButton {
      border: 1px solid #d8c9a8;
      background: #fff;
    }

    .confirmButton:disabled { opacity: 0.5; cursor: not-allowed; }

    .backButton strong,
    .backButton small,
    .confirmButton strong,
    .confirmButton small { display: block; }

    .backButton strong,
    .confirmButton strong { font-size: 14px; font-weight: 650; }
    .backButton small,
    .confirmButton small { margin-top: 2px; color: #8a7f6e; font-size: 11px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="viewport">
      <div class="page">
        <main class="paper">
          <div class="runningHead" aria-hidden="true"><span>AI LIFE SIM · 命书</span><span>05 / 08</span></div>

          <header class="titleCopy">
            <h1><span class="semantic-emoji" aria-hidden="true">🗝️</span>选择命格</h1>
            <p>从十二个候选中选满三条，可携带 2 项轮回天赋。</p>
          </header>

          <section class="progressBar" aria-label="普通命格选择进度">
            <div class="progressRow">
              <span class="progressLabel">普通命格 <b id="selectedCount">0 / 3</b></span>
              <button type="button" class="selectedSlot" data-ui="0" aria-label="普通命格槽1，空"><strong>+</strong></button>
              <button type="button" class="selectedSlot" data-ui="1" aria-label="普通命格槽2，空"><strong>+</strong></button>
              <button type="button" class="selectedSlot" data-ui="2" aria-label="普通命格槽3，空"><strong>+</strong></button>
            </div>
          </section>

          <section class="rebirthSection" aria-labelledby="rebirth-title">
            <div class="rebirthHead">
              <span id="rebirth-title">轮回 · 可选</span>
              <b id="rebirthCount">0 / 2</b>
            </div>
            <div class="rebirthSlots" aria-label="已选择的轮回天赋">
              <button type="button" class="rebirthSlot" data-slot="0" aria-label="轮回天赋槽1，打开天赋库"><strong>+</strong></button>
              <button type="button" class="rebirthSlot" data-slot="1" aria-label="轮回天赋槽2，打开天赋库"><strong>+</strong></button>
            </div>
          </section>

          <section class="candidateBand" aria-labelledby="candidate-title">
            <div class="candidateHead">
              <strong id="candidate-title">普通命格候选 <small id="candidateTotal">12 / 12 条</small></strong>
              <button type="button" class="reroll" id="rerollButton" aria-label="重新抽取未选择的普通命格">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v5h5"/><path d="M20 20v-5h-5"/><path d="M20 9A8 8 0 0 0 5.6 5.6L4 9"/><path d="M4 15a8 8 0 0 0 14.4 3.4L20 15"/></svg>
                <span>重抽未选</span>
              </button>
            </div>
            <div class="candidateList" id="candidateList" aria-label="普通命格候选"></div>
          </section>
        </main>
      </div>

      <div class="bottomBar">
        <a class="backButton" href="../talent-draw/candidates/candidate-02-minimal.html" title="返回命格抽取">
          <strong>返回</strong>
          <small>返回命格抽取</small>
        </a>
        <button type="button" class="confirmButton" id="confirmButton" disabled title="确认命格">
          <strong id="confirmTitle">确认命格</strong>
          <small id="confirmHint">还需选择 3 条普通命格</small>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var patterns = [
        { name: '喜欢运动', rarity: '普通', description: '身体素质全面提升，锻炼效果显著增强。', effect: '每日锻炼额外获得体魄成长。', attr: '体魄 +2', sys: '健康恢复 +8%' },
        { name: '讲信用', rarity: '普通', description: '承诺必达，人际信任积累更快。', effect: '长期守信可获得隐藏际遇。', attr: '人脉 +2', sys: '声誉成长 +10%' },
        { name: '善于观察', rarity: '普通', description: '对细节敏感，更容易发现线索。', effect: '探索时提高关键信息发现率。', attr: '悟性 +1', sys: '探索发现 +12%' },
        { name: '心态好', rarity: '普通', description: '情绪稳定，压力影响大幅降低。', effect: '面对挫折时心态恢复更快。', attr: '心志 +2', sys: '压力衰减 +10%' },
        { name: '完美主义', rarity: '精良', description: '对品质有执念，产出质量更高。', effect: '专业产出额外获得品质加成。', attr: '技艺 +2', sys: '工作产出 +12%' },
        { name: '夜猫子', rarity: '精良', description: '夜晚精力充沛，灵感涌动。', effect: '夜间学习与创作效率提升。', attr: '灵感 +2', sys: '夜间效率 +15%' },
        { name: '天生灵觉', rarity: '稀有', description: '对灵气波动异常敏锐。', effect: '可感知隐藏的灵性节点。', attr: '灵性 +3', sys: '灵缘触发 +18%' },
        { name: '将门虎子', rarity: '稀有', description: '家学渊源，武艺根基扎实。', effect: '战斗相关成长速度提升。', attr: '体魄 +3', sys: '武学成长 +15%' },
        { name: '慧眼识人', rarity: '稀有', description: '一眼看穿人心，识人无碍。', effect: '社交中可识破虚言与伪善。', attr: '人脉 +3', sys: '识破概率 +20%' },
        { name: '天命眷顾', rarity: '史诗', description: '气运加身，逢凶化吉。', effect: '关键时刻更易触发好结果。', attr: '气运 +4', sys: '幸运触发 +22%' },
        { name: '凤凰血脉', rarity: '史诗', description: '涅槃重生，生命韧性极强。', effect: '重大挫败后可快速恢复。', attr: '体魄 +4', sys: '恢复上限 +20%' },
        { name: '万古第一', rarity: '传说', description: '旷世之资，潜力深不可测。', effect: '所有成长上限突破桎梏。', attr: '全属性 +3', sys: '上限突破 +30%' }
      ]
      var rebirthOptions = ['万古第一', '凤凰血脉']
      var selected = []
      var selectedSlots = [null, null, null]
      var rebirthSlots = [null, null]

      var candidateList = document.getElementById('candidateList')
      var selectedSlotEls = document.querySelectorAll('.selectedSlot')
      var rebirthSlotEls = document.querySelectorAll('.rebirthSlot')
      var confirmButton = document.getElementById('confirmButton')
      var confirmTitle = document.getElementById('confirmTitle')
      var confirmHint = document.getElementById('confirmHint')
      var selectedCountEl = document.getElementById('selectedCount')
      var rebirthCountEl = document.getElementById('rebirthCount')

      function renderSlots() {
        selectedSlotEls.forEach(function (el, ui) {
          var index = selectedSlots[ui]
          var pattern = index === null ? null : patterns[index]
          el.classList.toggle('filled', Boolean(pattern))
          if (pattern) {
            el.setAttribute('data-rarity', pattern.rarity)
            el.querySelector('strong').textContent = pattern.name
          } else {
            el.removeAttribute('data-rarity')
            el.querySelector('strong').textContent = '+'
          }
        })
        selectedCountEl.textContent = selected.length + ' / 3'

        rebirthSlotEls.forEach(function (el, i) {
          var name = rebirthSlots[i]
          el.classList.toggle('filled', Boolean(name))
          el.querySelector('strong').textContent = name || '+'
        })
        rebirthCountEl.textContent = rebirthSlots.filter(Boolean).length + ' / 2'

        if (selected.length === 3) {
          confirmTitle.textContent = '确认命格'
          confirmHint.textContent = '三条普通命格已选择 · 进入属性分配'
          confirmButton.disabled = false
        } else {
          confirmTitle.textContent = '确认命格'
          confirmHint.textContent = '还需选择 ' + (3 - selected.length) + ' 条普通命格'
          confirmButton.disabled = true
        }
      }

      patterns.forEach(function (pattern, index) {
        var card = document.createElement('button')
        card.type = 'button'
        card.className = 'candidateCard'
        card.setAttribute('data-rarity', pattern.rarity)
        card.setAttribute('aria-pressed', 'false')
        card.innerHTML =
          '<span class="candidateCopy">' +
            '<strong>' + pattern.name + '</strong>' +
            '<span>' + pattern.description + '</span>' +
            '<i>' + pattern.effect + '</i>' +
          '</span>' +
          '<small class="candidateRarity">' + pattern.rarity + '</small>' +
          '<span class="candidateEffects">' +
            '<i>' + pattern.attr + '</i>' +
            '<i class="systemEffect">' + pattern.sys + '</i>' +
          '</span>'
        card.addEventListener('click', function () {
          var pos = selected.indexOf(index)
          if (pos >= 0) {
            selected.splice(pos, 1)
            var slotPos = selectedSlots.indexOf(index)
            if (slotPos >= 0) selectedSlots[slotPos] = null
          } else if (selected.length < 3) {
            selected.push(index)
            var empty = selectedSlots.indexOf(null)
            if (empty >= 0) selectedSlots[empty] = index
          }
          card.classList.toggle('selected', selected.indexOf(index) >= 0)
          card.setAttribute('aria-pressed', selected.indexOf(index) >= 0 ? 'true' : 'false')
          renderSlots()
        })
        candidateList.appendChild(card)
      })

      selectedSlotEls.forEach(function (el, ui) {
        el.addEventListener('click', function () {
          var index = selectedSlots[ui]
          if (index === null) return
          selectedSlots[ui] = null
          var pos = selected.indexOf(index)
          if (pos >= 0) selected.splice(pos, 1)
          var card = candidateList.children[index]
          card.classList.remove('selected')
          card.setAttribute('aria-pressed', 'false')
          renderSlots()
        })
      })

      rebirthSlotEls.forEach(function (el, i) {
        el.addEventListener('click', function () {
          if (rebirthSlots[i]) {
            rebirthSlots[i] = null
          } else if (!rebirthSlots[i] && !rebirthSlots.every(Boolean)) {
            rebirthSlots[i] = rebirthOptions[i]
          }
          renderSlots()
        })
      })

      document.getElementById('rerollButton').addEventListener('click', function () {
        var btn = this
        btn.disabled = true
        btn.querySelector('span').textContent = '刷新中…'
        setTimeout(function () {
          btn.disabled = false
          btn.querySelector('span').textContent = '重抽未选'
        }, 800)
      })

      renderSlots()
    })()
  </script>
</body>
</html>
