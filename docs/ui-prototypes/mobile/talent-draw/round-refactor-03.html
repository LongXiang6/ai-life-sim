<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>命格抽取重构第三轮 · 极简层级与圆印归位</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #efeeea;
      --paper: #fffefa;
      --ink: #262522;
      --ink-soft: #66635d;
      --ink-faint: #969189;
      --rule: #d7d3ca;
      --rule-light: #e9e6df;
      --accent: #756aa5;
      --accent-rgb: 117, 106, 165;
      --wave-rgb: 132, 123, 180;
      --glyph-rgb: 93, 82, 164;
      --serif: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
      --sans: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      --route-ease: cubic-bezier(0.16, 0.8, 0.2, 1);
      --travel-ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; }
    html { min-width: 0; background: var(--canvas); }
    body { min-width: 0; margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--sans); font-size: 14px; letter-spacing: 0; }
    button, summary { color: inherit; font: inherit; letter-spacing: 0; }
    button, a, summary { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, summary:focus-visible, [role="radio"]:focus-visible { outline: 1px dotted var(--ink-soft); outline-offset: 3px; }
    a { color: inherit; }

    .review-shell { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 22px 0 42px; }
    .review-topbar, .review-meta, .candidate-head, .choice-row, .running-head,
    .progress-line, .chapter-action { display: flex; align-items: center; justify-content: space-between; }
    .review-topbar { gap: 20px; color: var(--ink-soft); font-size: 12px; }
    .review-topbar a { min-height: 34px; padding: 8px 0; text-decoration-color: var(--rule); text-underline-offset: 4px; }
    .review-status { color: var(--accent); font-weight: 650; }
    .review-title { max-width: 20em; margin: 18px 0 0; font-family: var(--serif); font-size: 34px; font-weight: 600; line-height: 1.25; }
    .review-lead { max-width: 60em; margin: 9px 0 0; color: var(--ink-soft); font-size: 12px; line-height: 1.7; }
    .review-meta { gap: 18px; margin-top: 18px; padding: 9px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); color: var(--ink-faint); font-size: 10px; }

    .candidate-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
    .candidate { min-width: 0; padding: 11px 10px 13px; border: 1px solid var(--rule); background: rgba(255, 254, 250, 0.58); cursor: pointer; transition: border-color 160ms, box-shadow 160ms, transform 160ms; }
    .candidate:hover { border-color: rgba(var(--accent-rgb), 0.52); transform: translateY(-2px); }
    .candidate[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
    .candidate-head { align-items: baseline; gap: 10px; padding: 0 2px 9px; }
    .candidate-code { color: var(--accent); font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .candidate-route { min-width: 0; color: var(--ink-soft); font-family: var(--serif); font-size: 12px; text-align: right; }

    .phone {
      --node-size: 48px;
      --birth-scale: 0.8;
      --settled-opacity: 0.66;
      --marker-opacity: 0.62;
      --guide-opacity: 0.32;
      position: relative;
      width: min(100%, 320px);
      height: 650px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--rule);
      background: var(--paper);
      box-shadow: 0 12px 28px rgba(38, 37, 34, 0.08);
    }
    .folio-page { position: relative; height: 100%; overflow: hidden; padding: 17px 25px 68px; }
    .running-head { min-height: 18px; align-items: flex-start; gap: 12px; color: var(--ink-faint); font-size: 8px; font-weight: 650; }
    .running-head span:last-child, .count { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
    .chapter-head { margin-top: 12px; }
    .chapter-kicker { margin: 0 0 4px; color: var(--ink-faint); font-size: 8px; font-weight: 650; }
    .chapter-title { margin: 0; font-family: var(--serif); font-size: 25px; font-weight: 600; line-height: 1.28; }
    .chapter-lead { margin: 6px 0 0; color: var(--ink-soft); font-family: var(--serif); font-size: 10px; line-height: 1.55; }

    .orbit-stage { position: relative; width: 310px; height: 310px; margin: 0 0 0 50%; transform: translateX(-50%); isolation: isolate; }
    .orbit-guide { position: absolute; z-index: 0; top: 50%; left: 50%; width: 256px; height: 256px; border: 1px solid rgba(var(--accent-rgb), var(--guide-opacity)); border-radius: 50%; opacity: 0.28; transform: translate(-50%, -50%); }
    .aura { position: absolute; z-index: 1; top: 50%; left: 50%; width: 220px; height: 220px; transform: translate(-50%, -50%); isolation: isolate; }
    .aura-core { position: absolute; inset: 0; display: grid; place-items: center; isolation: isolate; }
    .aura-layer { position: absolute; z-index: -1; border-radius: 50%; }
    .aura-layer.l5 { width: 220px; height: 220px; background: rgba(151, 141, 198, 0.022); }
    .aura-layer.l4 { width: 194px; height: 194px; background: rgba(151, 141, 198, 0.043); }
    .aura-layer.l3 { width: 166px; height: 166px; background: rgba(151, 141, 198, 0.065); }
    .aura-layer.l2 { width: 138px; height: 138px; background: rgba(151, 141, 198, 0.09); }
    .aura-layer.l1 { width: 110px; height: 110px; background: radial-gradient(circle, #fff 0%, #faf9fd 68%, rgba(174, 166, 211, 0.22) 100%); }
    .aura-glyph { position: relative; z-index: 9; color: rgb(var(--glyph-rgb)); font-family: var(--serif); font-size: 31px; font-weight: 500; line-height: 1; text-shadow: 0 0 14px rgba(var(--wave-rgb), 0.16); }
    .resolving .aura-glyph { animation: parse-pulse 1.02s var(--route-ease) both; }
    .core-status { position: absolute; z-index: 10; top: calc(50% + 55px); right: 0; left: 0; color: var(--ink-faint); font-size: 7px; text-align: center; transition: color 180ms; }
    .resolving .core-status { color: var(--accent); }

    .arrival-wave { position: absolute; z-index: 3; top: 50%; left: 50%; width: 72px; height: 72px; border: 0.8px solid rgba(var(--glyph-rgb), 0.24); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%) scale(0.64); animation: arrival-wave 1.35s cubic-bezier(0.12, 0.62, 0.2, 1) both; }
    .target-marker { position: absolute; z-index: 4; top: 50%; left: 50%; display: grid; width: 22px; height: 22px; place-items: center; color: var(--ink-faint); font-size: 6px; font-variant-numeric: tabular-nums; opacity: var(--marker-opacity); transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))); transition: opacity 300ms; }
    .target-marker::before { position: absolute; inset: 4px; border: 1px solid var(--rule-light); border-radius: 50%; content: ""; }
    .target-marker.claimed { opacity: 0.12; }

    .fate-node {
      --tier: 100, 116, 139;
      --rarity-scale: 0.86;
      position: absolute;
      z-index: 6;
      top: 50%;
      left: 50%;
      display: grid;
      width: var(--node-size);
      height: var(--node-size);
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: rgb(var(--tier));
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.46);
      filter: saturate(0.88);
      pointer-events: none;
      transition: transform 240ms var(--route-ease), opacity 240ms ease, filter 300ms ease;
    }
    .fate-node::before { position: absolute; inset: 5px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, 0.94) 0 4%, rgba(var(--tier), 0.25) 29%, rgba(var(--tier), 0.1) 52%, transparent 74%); filter: blur(5px); content: ""; transform: scale(var(--rarity-scale)); }
    .fate-node::after { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(var(--tier), 0.1), transparent 66%); filter: blur(var(--node-blur, 7px)); content: ""; }
    .fate-node span { position: relative; z-index: 2; display: block; width: 34px; font-size: 7px; font-weight: 760; line-height: 1.08; text-align: center; text-shadow: 0 1px 2px #fff, 0 0 7px #fff; opacity: 0.82; transition: opacity 180ms ease; }
    .fate-node.born:not(.travelling) span { opacity: 0; transition-duration: 0ms; }
    .fate-node.born { opacity: 1; transform: translate(-50%, -50%) scale(var(--birth-scale)); filter: saturate(1.03) brightness(1.02); }
    .fate-node.travelling { transition: transform 820ms var(--travel-ease), opacity 220ms ease, filter 300ms ease; }
    .fate-node.settled { opacity: var(--settled-opacity); transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(var(--rarity-scale)); }
    .fate-node.common { --tier: 100, 116, 139; --rarity-scale: 0.86; --node-blur: 7px; }
    .fate-node.fine { --tier: 25, 138, 67; --rarity-scale: 0.92; --node-blur: 8px; }
    .fate-node.rare { --tier: 37, 99, 185; --rarity-scale: 1; --node-blur: 10px; }
    .fate-node.epic { --tier: 128, 56, 192; --rarity-scale: 1.06; --node-blur: 12px; }
    .fate-node.legendary { --tier: 169, 103, 8; --rarity-scale: 1.12; --node-blur: 14px; }
    .complete .fate-node.settled { opacity: calc(var(--settled-opacity) - 0.08); }

    .v1 { --node-size: 48px; --birth-scale: 0.82; --settled-opacity: 0.68; --marker-opacity: 0.66; --guide-opacity: 0.32; }
    .v2 { --node-size: 44px; --birth-scale: 1.16; --settled-opacity: 0.52; --marker-opacity: 0.45; --guide-opacity: 0.22; }
    .v2 .chapter-title { font-size: 27px; }
    .v2 .core-status { font-size: 8px; font-weight: 650; }
    .v2 .fate-node.born { z-index: 8; }
    .v2 .progress-line .count { font-size: 15px; }
    .v3 { --node-size: 44px; --birth-scale: 0.86; --settled-opacity: 0.58; --marker-opacity: 0.4; --guide-opacity: 0; }
    .v3 .target-marker::before { inset: 8px; border: 0; background: var(--rule); }
    .v3 .target-marker.claimed { opacity: 0; }
    .v3 .fate-node::before { background: radial-gradient(circle, rgba(255, 255, 255, 0.92) 0 5%, rgba(var(--tier), 0.2) 31%, rgba(var(--tier), 0.07) 54%, transparent 74%); }
    .v3 .fate-node::after { opacity: 0.64; }

    .progress-line { min-height: 34px; margin-top: -5px; padding: 0 2px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); color: var(--ink-faint); font-size: 8px; }
    .progress-line .state-copy { min-width: 0; }
    .progress-line .count { color: var(--ink); font-family: var(--serif); font-size: 13px; }
    .chapter-end { position: absolute; right: 25px; bottom: 12px; left: 25px; border-top: 1px solid var(--rule); }
    .chapter-action { width: 100%; min-height: 53px; gap: 9px; padding: 3px 0; border: 0; background: transparent; color: var(--ink); cursor: pointer; text-align: left; }
    .chapter-action:disabled { color: var(--ink-faint); cursor: not-allowed; }
    .action-number { width: 22px; color: var(--ink-faint); font-size: 8px; font-variant-numeric: tabular-nums; }
    .action-copy { min-width: 0; flex: 1; }
    .action-copy strong, .action-copy small { display: block; }
    .action-copy strong { font-family: var(--serif); font-size: 13px; font-weight: 600; }
    .action-copy small { margin-top: 2px; color: var(--ink-faint); font-size: 7px; }
    .action-arrow { width: 17px; height: 17px; }

    .choice-row { align-items: stretch; gap: 10px; margin-top: 10px; }
    .select-candidate { min-width: 102px; min-height: 36px; padding: 6px 12px; border: 1px solid var(--rule); background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 10px; }
    .candidate[aria-checked="true"] .select-candidate { border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .route-notes { min-width: 0; flex: 1; border-top: 1px solid var(--rule-light); border-bottom: 1px solid var(--rule-light); }
    .route-notes summary { min-height: 36px; padding: 10px 0; color: var(--ink-soft); cursor: pointer; font-family: var(--serif); font-size: 10px; }
    .route-notes p { margin: 0 0 10px; color: var(--ink-faint); font-size: 9px; line-height: 1.6; }

    @keyframes parse-pulse { 0%, 100% { transform: scale(1); } 24% { transform: scale(1.12); } 42% { transform: scale(0.995); } 62% { transform: scale(1.075); } 82% { transform: scale(1); } }
    @keyframes arrival-wave { 0% { opacity: 0; border-width: 0.9px; transform: translate(-50%, -50%) scale(0.64); } 10% { opacity: 0.24; } 72% { opacity: 0.05; border-width: 0.35px; } 100% { opacity: 0; border-width: 0.2px; transform: translate(-50%, -50%) scale(4.08); } }
    @keyframes page-old { to { opacity: 0; transform: translateY(-7px); } }
    @keyframes page-new { from { opacity: 0; transform: translateY(7px); } }
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: page-old 220ms cubic-bezier(0.4, 0, 0.2, 1) both; }
    ::view-transition-new(root) { animation: page-new 280ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }

    @media (max-width: 980px) { .candidate-grid { grid-template-columns: 1fr; } }
    @media (max-width: 680px) {
      .review-shell { width: min(100% - 18px, 430px); padding-top: 14px; }
      .review-topbar { align-items: flex-start; }
      .review-title { margin-top: 12px; font-size: 28px; }
      .review-meta { align-items: flex-start; }
      .candidate { padding-right: 8px; padding-left: 8px; }
      .phone { width: min(100%, 342px); }
    }
    @media (max-width: 389px) {
      .review-shell { width: calc(100% - 12px); }
      .candidate-route { font-size: 11px; }
      .phone { width: min(100%, 330px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="review-shell">
    <div class="review-topbar"><a href="index.html">返回命格抽取历史</a><span class="review-status" id="selection-status" aria-live="polite">待选择 · 尚未选定</span></div>
    <h1 class="review-title">极简层级 · 圆印归位</h1>
    <p class="review-lead">第二轮选择 TD-RF2-3。本轮将十二方格改为半透明圆形光印，并让每次解析成功、中心浮现、径向滑行与进度递增保持同一事件节奏。</p>
    <div class="review-meta"><span>第四章 · 命格抽取</span><span>TD-RF3 · 01—03</span></div>
    <section class="candidate-grid" id="options" role="radiogroup" aria-label="命格抽取重构第三轮候选"></section>
  </main>

  <script>
    (() => {
      const rarities = [
        ['common', '普通'], ['fine', '精良'], ['common', '普通'], ['rare', '稀有'],
        ['fine', '精良'], ['common', '普通'], ['epic', '史诗'], ['fine', '精良'],
        ['rare', '稀有'], ['common', '普通'], ['legendary', '传说'], ['common', '普通']
      ];
      const variants = [
        { id: 'TD-RF3-1', cls: 'v1', name: '序位圆印', note: '01—12 序位持续可见，圆印抵达后覆盖对应序位；进度最容易核对。' },
        { id: 'TD-RF3-2', cls: 'v2', name: '中心解析', note: '当前新生圆印在中央更大、更亮，已归位圆印主动退后；主次最明确。' },
        { id: 'TD-RF3-3', cls: 'v3', name: '留白星位', note: '移除外圈导线，序位只保留微点，圆印光层更薄；最接近极简主义。' }
      ];

      function auraMarkup() {
        return '<span class="aura-core"><i class="aura-layer l5"></i><i class="aura-layer l4"></i><i class="aura-layer l3"></i><i class="aura-layer l2"></i><i class="aura-layer l1"></i><b class="aura-glyph">命</b></span>';
      }

      function candidateMarkup(variant) {
        return `<article class="candidate" role="radio" aria-checked="false" tabindex="0" data-choice="${variant.id}">
          <header class="candidate-head"><span class="candidate-code">${variant.id}</span><span class="candidate-route">${variant.name}</span></header>
          <div class="phone draw-view ${variant.cls}" data-view="${variant.cls}"><div class="folio-page">
            <div class="running-head"><span>AI LIFE SIM · 命书</span><span>04 / 抽取</span></div>
            <header class="chapter-head"><p class="chapter-kicker">第四章 · 命格抽取</p><h2 class="chapter-title">命格抽取</h2><p class="chapter-lead">十二枚命印将从中心依次解析并归位。</p></header>
            <section class="orbit-stage" aria-label="半透明圆形命印归位"><i class="orbit-guide"></i><div class="aura">${auraMarkup()}</div><span class="core-status">等待解析</span><div class="target-markers"></div><div class="fate-nodes"></div></section>
            <div class="progress-line"><span class="state-copy" role="status" aria-live="polite">等待第一枚命印</span><span class="count">0 / 12</span></div>
            <footer class="chapter-end"><button class="chapter-action draw-button" type="button"><span class="action-number">01</span><span class="action-copy"><strong class="button-label">开始抽取</strong><small class="button-hint">解析成功后，圆印将由中心归位</small></span><svg class="action-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M6 14l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></footer>
          </div></div>
          <div class="choice-row"><button class="select-candidate" type="button">选择此版</button><details class="route-notes"><summary>层级说明</summary><p>${variant.note}</p></details></div>
        </article>`;
      }

      document.getElementById('options').innerHTML = variants.map(candidateMarkup).join('');

      document.querySelectorAll('.draw-view').forEach((view) => {
        const markers = view.querySelector('.target-markers');
        const nodes = view.querySelector('.fate-nodes');
        rarities.forEach((item, index) => {
          const angle = (index * 30 - 90) * Math.PI / 180;
          const x = Math.round(Math.cos(angle) * 128);
          const y = Math.round(Math.sin(angle) * 128);
          const style = `--x:${x}px;--y:${y}px`;
          markers.insertAdjacentHTML('beforeend', `<span class="target-marker" style="${style}" data-index="${index}">${String(index + 1).padStart(2, '0')}</span>`);
          nodes.insertAdjacentHTML('beforeend', `<span class="fate-node ${item[0]}" style="${style}" data-index="${index}" data-phase="waiting"><span>${item[1]}</span></span>`);
        });
      });

      function selectCandidate(candidate) {
        document.querySelectorAll('.candidate').forEach((item) => {
          const selected = item === candidate;
          item.setAttribute('aria-checked', String(selected));
          item.querySelector('.select-candidate').textContent = selected ? '已选择' : '选择此版';
        });
        document.getElementById('selection-status').textContent = `待确认 · 当前选择 ${candidate.dataset.choice}`;
      }

      document.querySelectorAll('.candidate').forEach((candidate) => {
        candidate.addEventListener('click', (event) => {
          if (event.target.closest('.draw-button, details, a')) return;
          selectCandidate(candidate);
        });
        candidate.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          selectCandidate(candidate);
        });
        candidate.querySelector('.select-candidate').addEventListener('click', (event) => {
          event.stopPropagation();
          selectCandidate(candidate);
        });
      });

      const wait = (duration) => new Promise((resolve) => window.setTimeout(resolve, duration));

      function restartResolvePulse(view) {
        view.classList.remove('resolving');
        void view.offsetWidth;
        view.classList.add('resolving');
        const wave = document.createElement('i');
        wave.className = 'arrival-wave';
        view.querySelector('.orbit-stage').appendChild(wave);
        window.setTimeout(() => wave.remove(), 1500);
      }

      async function runDraw(view) {
        const button = view.querySelector('.draw-button');
        const count = view.querySelector('.count');
        const status = view.querySelector('.state-copy');
        const coreStatus = view.querySelector('.core-status');
        const buttonLabel = view.querySelector('.button-label');
        const buttonHint = view.querySelector('.button-hint');
        const actionNumber = view.querySelector('.action-number');
        const nodes = Array.from(view.querySelectorAll('.fate-node'));
        const markers = Array.from(view.querySelectorAll('.target-marker'));

        view.classList.add('drawing');
        button.disabled = true;
        buttonLabel.textContent = '命印解析中';
        buttonHint.textContent = '抵达星位后计入进度';

        for (let index = 0; index < nodes.length; index += 1) {
          const ordinal = String(index + 1).padStart(2, '0');
          const node = nodes[index];
          status.textContent = `正在解析第 ${ordinal} 枚命印`;
          coreStatus.textContent = `解析 ${ordinal}`;
          actionNumber.textContent = ordinal;
          await wait(180);

          node.dataset.phase = 'born';
          node.classList.add('born');
          status.textContent = `第 ${ordinal} 枚解析成功，正在归位`;
          coreStatus.textContent = `归位 ${ordinal}`;
          restartResolvePulse(view);
          await wait(240);

          node.dataset.phase = 'travelling';
          node.classList.add('travelling', 'settled');
          await wait(820);

          node.classList.remove('born', 'travelling');
          node.dataset.phase = 'settled';
          markers[index].classList.add('claimed');
          count.textContent = `${index + 1} / 12`;
          coreStatus.textContent = `已归位 ${String(index + 1).padStart(2, '0')}`;
          status.textContent = index + 1 < nodes.length ? `已归位 ${index + 1} 枚命印` : '十二命印已全部归位';
          await wait(40);
        }

        view.classList.remove('drawing', 'resolving');
        view.classList.add('complete');
        button.disabled = false;
        button.dataset.done = 'true';
        buttonLabel.textContent = '进入下一阶段';
        buttonHint.textContent = '第五章 · 神话传承';
        actionNumber.textContent = '05';
        button.setAttribute('aria-label', '十二命印已完成，进入下一阶段');
      }

      document.querySelectorAll('.draw-view').forEach((view) => {
        const button = view.querySelector('.draw-button');
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          selectCandidate(view.closest('.candidate'));
          if (button.dataset.done === 'true') {
            window.location.href = '../mythic-inheritance/final.html';
            return;
          }
          if (view.classList.contains('drawing')) return;
          runDraw(view);
        });
      });
    })();
  </script>
</body>
</html>
