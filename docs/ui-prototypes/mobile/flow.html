<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Life Sim · 移动端界面串联测试</title>
  <link rel="stylesheet" href="assets/library.css">
  <style>
    .prototype-workbench { min-height: 976px; }
    .preview-stage {
      align-items: start;
      overflow: auto;
    }
    .preview-frame-wrap {
      flex: 0 0 auto;
      width: 430px;
      height: auto;
      aspect-ratio: 430 / 932;
      border: 0;
      border-radius: 0;
      outline: 1px solid var(--ew-line);
    }
    @media (max-width: 680px) {
      .preview-stage { justify-content: start; padding: 0; }
      .preview-frame-wrap { width: 100vw; }
    }
  </style>
</head>
<body class="prototype-hub">
  <main class="hub-shell">
    <header class="hub-header">
      <div class="hub-heading">
        <a class="hub-back" href="index.html">← 返回界面总览</a>
        <p class="eyebrow">AI LIFE SIM · MOBILE FLOW V1</p>
        <h1>移动端界面串联测试</h1>
        <p>串联当前定版页面，保留各页原有视觉与交互，可按主流程完整点击。</p>
      </div>
      <div class="hub-status" aria-live="polite">
        <span>当前界面</span>
        <strong id="current-screen">欢迎界面</strong>
        <span id="flow-position">01 / 10 主流程</span>
        <span>观察视口 · 430 × 932</span>
      </div>
    </header>

    <section class="prototype-workbench" aria-label="移动端原型测试台">
      <nav class="screen-rail" aria-label="界面目录">
        <p class="rail-title">FLOW / SCREEN</p>
        <div class="screen-list" id="screen-list"></div>
      </nav>

      <div class="preview-stage">
        <div class="preview-frame-wrap">
          <iframe class="preview-frame" id="preview-frame" title="AI Life Sim 移动端界面预览" src="welcome/round-19-rf4-b-refinement.html?preview=20260723-ui-sync-16"></iframe>
        </div>
      </div>

      <aside class="hub-notes">
        <p class="rail-title">TEST NOTES</p>
        <h2>流程检查</h2>
        <p>保持原定版背景、配色、纹样、光效和布局，只核对串联与交互。</p>
        <dl>
          <div><dt>主流程</dt><dd>欢迎 → 世界 → 配置 → 角色 → 命格抽取 → 命格选取 → 属性 → 预览 → 模拟 → 结算</dd></div>
          <div><dt>辅助入口</dt><dd>账号、设置、说明与反馈从欢迎页进入。</dd></div>
          <div><dt>统一视口</dt><dd>所有界面在 430 × 932 下观察。</dd></div>
        </dl>
        <div class="hub-controls">
          <button class="hub-control" id="previous-screen" type="button">上一界面</button>
          <button class="hub-control" id="next-screen" type="button">下一界面</button>
        </div>
      </aside>
    </section>
  </main>

  <script>
    (function () {
      const screens = [
        ['welcome', '欢迎界面', 'welcome/round-19-rf4-b-refinement.html'],
        ['world-select', '世界选择', 'world-select/round-20-ws-rf23-b1-adaptation.html'],
        ['world-customize', '世界配置', 'world-customize/round-07-ws-b1-adaptation.html'],
        ['character-create', '角色创建', 'character-create/round-15-ws-b1-adaptation.html'],
        ['talent-draw', '命格抽取', 'talent-draw/round-refactor-18-rf17-2-b1-adaptation.html'],
        ['mythic-inheritance', '命格选取 · 转世天赋', 'mythic-inheritance/round-14-legacy-layout-b1-rebirth.html'],
        ['attribute-alloc', '属性分配', 'attribute-alloc/final.html'],
        ['fate-preview', '命运预览', 'fate-preview/round-refactor-01-style-1.html'],
        ['game-story', '核心模拟', 'game-story/round-refactor-20-style-1.html'],
        ['game-over', '人生结算', 'game-over/final.html'],
        ['account', '账号与云端', 'account/final.html'],
        ['settings', '设置', 'settings/final.html'],
        ['help', '说明', 'help/final.html'],
        ['feedback', '反馈与建议', 'feedback/final.html'],
      ]
      const mainFlowCount = 10
      const previewRevision = '20260723-ui-sync-16'
      const frame = document.querySelector('#preview-frame')
      const list = document.querySelector('#screen-list')
      const currentName = document.querySelector('#current-screen')
      const flowPosition = document.querySelector('#flow-position')
      let activeIndex = 0

      list.innerHTML = screens.map(function (screen, index) {
        return '<button class="screen-link" type="button" data-index="' + index + '"><span>' + String(index + 1).padStart(2, '0') + '</span><span>' + screen[1] + '</span></button>'
      }).join('')

      function setActive(index, load) {
        activeIndex = Math.max(0, Math.min(index, screens.length - 1))
        const screen = screens[activeIndex]
        document.querySelectorAll('.screen-link').forEach(function (button, buttonIndex) {
          if (buttonIndex === activeIndex) button.setAttribute('aria-current', 'page')
          else button.removeAttribute('aria-current')
        })
        currentName.textContent = screen[1]
        flowPosition.textContent = activeIndex < mainFlowCount
          ? String(activeIndex + 1).padStart(2, '0') + ' / ' + mainFlowCount + ' 主流程'
          : '辅助界面'
        if (!load) return
        frame.classList.add('is-loading')
        frame.src = screen[2] + '?preview=' + previewRevision
      }

      list.addEventListener('click', function (event) {
        const button = event.target.closest('[data-index]')
        if (button) setActive(Number(button.dataset.index), true)
      })
      document.querySelector('#previous-screen').addEventListener('click', function () {
        setActive((activeIndex - 1 + screens.length) % screens.length, true)
      })
      document.querySelector('#next-screen').addEventListener('click', function () {
        setActive((activeIndex + 1) % screens.length, true)
      })
      frame.addEventListener('load', function () { frame.classList.remove('is-loading') })
      window.addEventListener('message', function (event) {
        if (!event.data || event.data.type !== 'ai-life-sim-prototype-ready') return
        const index = screens.findIndex(function (screen) { return screen[0] === event.data.screen })
        if (index >= 0) setActive(index, false)
        frame.classList.remove('is-loading')
      })

      setActive(0, false)
    })()
  </script>
</body>
</html>
