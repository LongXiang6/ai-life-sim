<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界配置 · 最终首版</title><link rel="stylesheet" href="../assets/library.css"><script src="../assets/prototype.js" defer></script>
<style>
:root{--canvas:#f3f1ec;--paper:#fbfaf7;--surface:#fffefd;--ink:#292724;--soft:#6e6961;--faint:#9a9389;--line:#d9d3c9;--light:#e9e5de;--mist:#9ca9ac}*{box-sizing:border-box}body{background:var(--canvas);color:var(--ink)}button,input,textarea,select{font:inherit}.shell{width:min(900px,calc(100% - 24px));padding:18px 0 42px}.topbar{margin-bottom:18px;color:var(--soft);font-size:12px}.eyebrow{color:var(--soft)}h1{font-family:"Songti SC","STSong","SimSun",serif;font-size:28px}.subtitle{color:var(--soft);font-size:12px}.stage{display:grid;justify-items:center;margin-top:18px}.phone{width:min(292px,calc(100vw - 32px));height:692px;margin:0;border-color:var(--line);background:var(--paper);box-shadow:0 13px 30px rgba(62,55,44,.075)}.screen{height:100%;overflow:auto;padding:22px 15px 72px}.step{color:var(--faint);font-size:7px;font-weight:700;letter-spacing:.16em}.title{margin-top:6px;font-family:"Songti SC","STSong","SimSun",serif;font-size:20px;font-weight:600}.sub{margin-top:5px;color:var(--soft);font-size:8px;line-height:1.55}.field-label,.section-label{display:flex;justify-content:space-between;color:var(--soft);font-size:7px}.field-label{margin-top:14px}.field-label span:last-child,.section-label span:last-child{color:var(--faint);font-size:6px}.description{width:100%;height:76px;margin-top:6px;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-size:7px;line-height:1.55;resize:none;outline:none}.description:focus{border-color:var(--mist)}.section-label{margin:14px 0 5px}.dimension{padding:9px 0;border-top:1px solid var(--light)}.dimension:last-child{border-bottom:1px solid var(--light)}.dim-head{display:grid;grid-template-columns:26px 1fr auto;gap:7px;align-items:center}.mark{display:grid;width:26px;height:26px;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--soft);font-family:"Songti SC",serif;font-size:8px}.copy b,.copy span{display:block}.copy b{font-family:"Songti SC",serif;font-size:8px;font-weight:600}.copy span{margin-top:2px;color:var(--faint);font-size:5px}.modes{display:grid;grid-template-columns:repeat(3,1fr);width:91px;padding:2px;border:1px solid var(--light);border-radius:7px;background:var(--surface)}.mode{height:22px;padding:0;border:0;border-radius:5px;background:transparent;color:var(--faint);font-size:5px;cursor:pointer}.mode.active{background:var(--ink);color:var(--surface)}.current{display:flex;align-items:center;justify-content:space-between;margin-top:7px;padding-left:33px;color:var(--faint);font-size:5px}.current select,.current input{width:132px;height:29px;padding:0 7px;border:1px solid var(--light);border-radius:7px;background:var(--surface);color:var(--ink);font-size:6px;outline:none}.current .ai-value{display:flex;width:132px;height:29px;align-items:center;padding:0 7px;border:1px dashed var(--line);border-radius:7px;color:var(--soft);font-size:6px}.bottom{position:absolute;right:0;bottom:0;left:0;padding:7px 15px 10px;border-top:1px solid var(--line);background:rgba(251,250,247,.95);backdrop-filter:blur(10px)}.bar{display:flex;justify-content:space-between}.action{width:64px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--soft);font-size:7px}.primary{width:112px;border-color:var(--ink);background:var(--ink);color:var(--surface);font-family:"Songti SC",serif;font-size:9px}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body data-screen="world-customize"><main class="shell"><div class="topbar"><span>移动端创建流程</span><span>02 / 06</span></div><p class="eyebrow">WORLD CUSTOMIZE · FINAL V1</p><h1>配置世界</h1><p class="subtitle">沿用 M2 的右上紧凑模式控件，保留世界描述、四维宪章及 AI / 选择 / 自定三种设定方式。</p><section class="stage"><div class="phone"><div class="screen"><div class="step">NEW LIFE · 02</div><div class="title">配置你的世界</div><div class="sub">确认现代地球的描述与底层规则。</div><label class="field-label" for="world-desc"><span>世界描述</span><span class="count">62 / 5000</span></label><textarea class="description" id="world-desc">现代文明正处于互联网兴起的年代，科技与时代机会共同改变生活。城市扩张，信息加速，普通人的选择也会留下长久回声。</textarea><div class="section-label"><span>世界宪章</span><span>4 个维度</span></div><div class="dimensions">
<section class="dimension" data-options="由 AI 判断|单一大陆|多大陆|群岛世界"><div class="dim-head"><div class="mark">形</div><div class="copy"><b>世界空间形态</b><span>决定世界的空间结构</span></div><div class="modes"><button class="mode active">AI</button><button class="mode">选择</button><button class="mode">自定</button></div></div><div class="current"><span>当前结果</span><div class="value ai-value">由 AI 判断</div></div></section>
<section class="dimension" data-options="由 AI 判断|唯物主义|唯心主义|多元规则"><div class="dim-head"><div class="mark">本</div><div class="copy"><b>世界观本质</b><span>决定底层运行规则</span></div><div class="modes"><button class="mode">AI</button><button class="mode active">选择</button><button class="mode">自定</button></div></div><div class="current"><span>当前选择</span><select class="value"><option>唯物主义</option><option>唯心主义</option><option>多元规则</option></select></div></section>
<section class="dimension" data-options="由 AI 判断|无超凡力量|科技强化|灵能体系"><div class="dim-head"><div class="mark">力</div><div class="copy"><b>力量体系</b><span>决定力量来源与成长方式</span></div><div class="modes"><button class="mode active">AI</button><button class="mode">选择</button><button class="mode">自定</button></div></div><div class="current"><span>当前结果</span><div class="value ai-value">由 AI 判断</div></div></section>
<section class="dimension" data-options="由 AI 判断|1 阶|3 阶|5 阶"><div class="dim-head"><div class="mark">限</div><div class="copy"><b>力量上限</b><span>决定力量体系的天花板</span></div><div class="modes"><button class="mode">AI</button><button class="mode active">选择</button><button class="mode">自定</button></div></div><div class="current"><span>当前选择</span><select class="value"><option>1 阶</option><option>3 阶</option><option>5 阶</option></select></div></section>
</div></div><footer class="bottom"><div class="bar"><button class="action" data-flow-to="world-select" data-flow-back>返回</button><button class="action primary" data-flow-to="character-create">确认世界</button></div></footer></div></section></main>
<script>
const desc=document.querySelector('.description'),count=document.querySelector('.count');desc.addEventListener('input',()=>count.textContent=desc.value.length+' / 5000');
document.querySelectorAll('.dimension').forEach(section=>{const buttons=[...section.querySelectorAll('.mode')],current=section.querySelector('.current'),options=section.dataset.options.split('|');buttons.forEach((button,index)=>button.addEventListener('click',()=>{buttons.forEach(x=>x.classList.remove('active'));button.classList.add('active');current.style.opacity='0';current.style.transform='translateY(5px)';setTimeout(()=>{if(index===0)current.innerHTML='<span>当前结果</span><div class="value ai-value">由 AI 判断</div>';if(index===1)current.innerHTML='<span>当前选择</span><select class="value">'+options.slice(1).map(x=>'<option>'+x+'</option>').join('')+'</select>';if(index===2)current.innerHTML='<span>当前自定</span><input class="value" aria-label="自定义设定" placeholder="输入自定义内容…">';current.style.transition='opacity .2s ease,transform .2s ease';current.style.opacity='1';current.style.transform='none'},matchMedia('(prefers-reduced-motion: reduce)').matches?0:160)}))});
</script></body></html>
