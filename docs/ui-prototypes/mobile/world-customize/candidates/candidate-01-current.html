<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>世界配置 · 第一轮候选 01 · 当前基线</title>
  <style>
    /* Purpose: Static interactive prototype restoring the runtime world-customize baseline. Owner: Interface system. Responsibility: Candidate only; pure DOM interaction, no localStorage/sessionStorage/fetch. */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #28324b;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      position: relative;
      isolation: isolate;
      display: grid;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      place-items: stretch;
      background: #eef1f7;
      color-scheme: light;
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    @media (min-width: 48rem) {
      .viewport {
        width: min(100%, 30rem);
      }
    }

    .page {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scrollbar-width: none;
      background: #eef1f7;
      color: #28324b;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    }

    .page::-webkit-scrollbar {
      display: none;
    }

    .paper {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 100%;
      padding: 15px 16px 88px;
      border: 1px solid #d8deea;
      border-radius: 34px;
      background: linear-gradient(135deg, rgba(255, 215, 95, 0.11) 0%, rgba(255, 215, 95, 0) 34%), linear-gradient(#fafbff, #f2f4f9);
      box-shadow: 0 20px 48px rgba(62, 70, 100, 0.09);
    }

    .runningHead {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      color: #929bb0;
      font-size: 9px;
      font-weight: 650;
    }

    .header h1 {
      margin: 0;
      color: #28324b;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.15;
    }

    .worldSummary {
      position: relative;
      display: block;
      margin-top: 10px;
      padding: 12px 15px;
      border: 1px solid #d8deea;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 28px rgba(62, 70, 100, 0.055);
    }

    .summaryTop {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .summaryTop span:first-child {
      color: #7382bb;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.3;
    }

    .summaryTop span:last-child {
      color: #929bb0;
      font-size: 9px;
      font-variant-numeric: tabular-nums;
    }

    .summaryDifficulty {
      position: absolute;
      top: 24px;
      right: 15px;
      display: grid;
      min-width: 88px;
      min-height: 42px;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      align-items: center;
      column-gap: 6px;
      row-gap: 1px;
      padding: 6px 7px 6px 10px;
      border: 1px solid #d8deea;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.96), 0 4px 11px rgba(62, 70, 100, 0.045);
      cursor: pointer;
      color: inherit;
      font: inherit;
      text-align: left;
    }

    .summaryDifficulty > span:first-child {
      grid-column: 1;
      grid-row: 1;
      color: #929bb0;
      font-size: 9px;
      font-weight: 650;
      line-height: 1.15;
    }

    .summaryDifficulty strong {
      grid-column: 1;
      grid-row: 2;
      color: #28324b;
      font-size: 10.5px;
      font-weight: 680;
      line-height: 1.2;
    }

    .summaryDifficultyIcon {
      display: grid;
      width: 9px;
      height: 9px;
      grid-column: 2;
      grid-row: 1 / span 2;
      place-items: center;
      padding: 3px;
      border-radius: 50%;
      box-sizing: content-box;
      background: #7382bb;
      color: #fff;
    }

    .summaryDifficultyIcon svg {
      width: 9px;
      height: 9px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .worldSummary h3 {
      max-width: calc(100% - 100px);
      margin: 7px 0 0;
      color: #28324b;
      font-size: 16.5px;
      font-weight: 700;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .summaryEra {
      max-width: calc(100% - 100px);
      margin-top: 3px;
      color: #707b92;
      font-size: 9px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .summaryRule {
      display: grid;
      min-height: 32px;
      grid-template-columns: 44px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      margin-top: 15px;
      padding: 6px 8px;
      border-radius: 9px;
      background: #f1f3fa;
    }

    .summaryRule > span {
      color: #929bb0;
      font-size: 9px;
      line-height: 1.45;
    }

    .summaryRule > p {
      min-width: 0;
      margin: 0;
      color: #707b92;
      font-size: 9px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .summaryFacts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      margin-top: 6px;
    }

    .summaryFacts div {
      min-width: 0;
      padding: 6px 7px;
      border-radius: 9px;
      background: #f1f3fa;
    }

    .summaryFacts span,
    .summaryFacts strong {
      display: block;
      overflow-wrap: anywhere;
    }

    .summaryFacts span {
      color: #929bb0;
      font-size: 9px;
    }

    .summaryFacts strong {
      margin-top: 3px;
      color: #707b92;
      font-size: 9px;
      font-weight: 650;
    }

    .paperSection {
      margin-top: 8px;
      padding: 9px 10px 10px;
      border: 1px solid #d8deea;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.94);
    }

    .sectionHeading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .sectionHeading strong,
    .sectionHeading label {
      color: #28324b;
      font-size: 11.6px;
      font-weight: 650;
    }

    .sectionHeading span {
      color: #929bb0;
      font-size: 9px;
      text-align: right;
    }

    .rulePreviewGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .rulePreviewItem {
      display: grid;
      min-width: 0;
      min-height: 52px;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: start;
      gap: 6px;
      padding: 7px;
      border: 1px solid #d8deea;
      border-radius: 9px;
      background: #f1f3fa;
    }

    .rulePreviewIcon {
      color: #7382bb;
      font-size: 11px;
      line-height: 1.4;
    }

    .rulePreviewCopy strong,
    .rulePreviewCopy small {
      display: block;
      overflow-wrap: anywhere;
    }

    .rulePreviewCopy strong {
      color: #28324b;
      font-size: 8.6px;
      font-weight: 680;
      line-height: 1.3;
    }

    .rulePreviewCopy small {
      margin-top: 3px;
      color: #707b92;
      font-size: 8px;
      line-height: 1.4;
    }

    .festivalControl {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
    }

    .festivalControl button {
      min-width: 0;
      min-height: 30px;
      padding: 4px 8px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: #f1f3fa;
      color: #707b92;
      font: inherit;
      font-size: 8.5px;
      line-height: 1.35;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .festivalControl button[data-active="true"] {
      border-color: #cfd7ee;
      background: #edf0fb;
      color: #7382bb;
      font-weight: 680;
    }

    .dimensionList {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .dimensionCard {
      display: grid;
      gap: 8px;
      padding: 9px 0;
      border-top: 1px solid #e5e9f2;
    }

    .dimensionCard:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .dimensionCard:last-child {
      padding-bottom: 0;
    }

    .dimensionCopy h3 {
      margin: 0;
      color: #28324b;
      font-size: 9.6px;
      font-weight: 650;
    }

    .dimensionCopy h3 .semantic-emoji {
      margin-right: 3px;
      font-size: 10px;
    }

    .dimensionCopy p {
      margin: 3px 0 0;
      overflow: hidden;
      color: #929bb0;
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modeControl {
      display: grid;
      grid-template-columns: repeat(3, auto);
      gap: 3px;
      margin-top: 6px;
    }

    .modeControl button {
      min-height: 27px;
      padding: 0 8px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: #f1f3fa;
      color: #707b92;
      font: inherit;
      font-size: 9px;
      cursor: pointer;
    }

    .modeControl button[data-active="true"] {
      border-color: #cfd7ee;
      background: #edf0fb;
      color: #7382bb;
      font-weight: 680;
    }

    .currentValue {
      display: grid;
      min-height: 30px;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .fieldInput {
      width: 100%;
      min-height: 30px;
      padding: 0 8px;
      border: 1px solid #d8deea;
      border-radius: 7px;
      background: #fbfcff;
      color: #929bb0;
      font: inherit;
      font-size: 9px;
    }

    .selectTrigger {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 30px;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 0 22px 0 8px;
      border: 1px solid #d8deea;
      border-radius: 7px;
      background: #fbfcff;
      color: #28324b;
      cursor: pointer;
      font: inherit;
      font-size: 9px;
      text-align: left;
    }

    .selectTrigger .chevron {
      position: absolute;
      top: 9px;
      right: 8px;
      width: 8px;
      height: 8px;
      border-right: 1px solid #929bb0;
      border-bottom: 1px solid #929bb0;
      transform: rotate(45deg);
    }

    .customInput {
      width: 100%;
      min-height: 44px;
      padding: 6px 8px;
      border: 1px solid #d8deea;
      border-radius: 7px;
      background: #fbfcff;
      color: #28324b;
      font: inherit;
      font-size: 9px;
      line-height: 1.45;
      resize: none;
    }

    .choiceSheet {
      margin-top: 4px;
      padding: 4px;
      border: 1px solid #d8deea;
      border-radius: 9px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(62, 70, 100, 0.12);
    }

    .choiceSheet button {
      display: block;
      width: 100%;
      min-height: 28px;
      padding: 4px 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #28324b;
      cursor: pointer;
      font: inherit;
      font-size: 9px;
      text-align: left;
    }

    .choiceSheet button[data-selected="true"] {
      background: #edf0fb;
      color: #7382bb;
      font-weight: 680;
    }

    .choiceSheet small {
      display: block;
      color: #929bb0;
      font-size: 8px;
    }

    /* 底部：蓝白渐变确认钮 03 */
    .bottomBar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      padding: 12px 20px 16px;
      background: #eef1f7;
    }

    .backCircle {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid #d8deea;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 4px 12px rgba(62, 70, 100, 0.08);
      cursor: pointer;
    }

    .backCircle svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #28324b;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .confirmButton {
      display: grid;
      min-height: 52px;
      place-items: center;
      gap: 0;
      padding: 10px 14px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #4b5a8c 0%, #7382bb 55%, #93a1d6 100%);
      box-shadow: 0 8px 20px rgba(115, 130, 187, 0.35);
      color: #fff;
      cursor: pointer;
      font: inherit;
      text-align: center;
    }

    .confirmButton strong,
    .confirmButton small {
      display: block;
    }

    .confirmButton strong {
      font-size: 14px;
      font-weight: 650;
    }

    .confirmButton small {
      margin-top: 2px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 10.5px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="viewport">
      <div class="page">
        <main class="paper">
          <div class="runningHead" aria-hidden="true"><span>AI LIFE SIM · 命书</span><span>02 / 08</span></div>
          <header class="header">
            <h1>世界创作工坊</h1>
          </header>

          <section class="worldSummary" aria-live="polite" aria-label="当前世界规则摘要">
            <div class="summaryTop">
              <span>保存世界</span>
              <span>当前选择</span>
            </div>
            <button type="button" class="summaryDifficulty" aria-label="人生难度" id="difficultyButton">
              <span>难度</span>
              <strong id="difficultyLabel">普通</strong>
              <span class="summaryDifficultyIcon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" /></svg>
              </span>
            </button>
            <h3 id="worldName">星际纪元</h3>
            <div class="summaryEra" id="worldEra">公元 2200 年</div>
            <div class="summaryRule">
              <span>规则摘要</span>
              <p id="worldRule">人类踏入深空，文明在星海间重新书写秩序与命运。</p>
            </div>
            <div class="summaryFacts" aria-label="世界概览">
              <div><span>来源</span><strong id="factSource">已保存</strong></div>
              <div><span>年代</span><strong id="factEra">公元 2200</strong></div>
              <div><span>难度</span><strong id="factDifficulty">普通</strong></div>
            </div>
          </section>

          <section class="paperSection" aria-labelledby="preview-title">
            <div class="sectionHeading">
              <strong id="preview-title">世界规则预览</strong>
              <span>四项规则实时预览</span>
            </div>
            <div class="rulePreviewGrid" id="rulePreview"></div>
          </section>

          <section class="paperSection" aria-labelledby="festival-title">
            <div class="sectionHeading">
              <strong id="festival-title">节日范围</strong>
              <span>统一游戏历法</span>
            </div>
            <div class="festivalControl" role="group" aria-label="节日范围">
              <button type="button" data-active="true" data-scope="china">仅中国节日</button>
              <button type="button" data-active="false" data-scope="china-and-international">中国及国际节日</button>
            </div>
          </section>

          <section class="paperSection" aria-labelledby="rules-title">
            <div class="sectionHeading">
              <strong id="rules-title">世界规则</strong>
              <span>从基础形态到力量边界</span>
            </div>
            <ol class="dimensionList" id="dimensionList"></ol>
          </section>
        </main>
      </div>
      <div class="bottomBar">
        <button type="button" class="backCircle" title="返回世界选择" aria-label="返回世界选择">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6" /></svg>
        </button>
        <button type="button" class="confirmButton" title="确认世界">
          <strong>确认世界</strong>
          <small>星际纪元 · 下一步塑造角色</small>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var difficulties = ['普通', '困难', '噩梦', '地狱']
      var difficultyIndex = 0
      var dimensions = [
        { icon: '🗺️', label: '世界空间形态', description: '决定世界的空间形态', options: ['九州大地', '天圆地方', '星海浮岛'] },
        { icon: '🌐', label: '世界观本质', description: '决定世界的底层运行规则', options: ['灵气复苏', '天道规则', '科技至衡'] },
        { icon: '⚡', label: '力量体系', description: '决定世界的力量来源和修炼方式', options: ['武学内力', '修真灵力', '异能觉醒'] },
        { icon: '🏔️', label: '力量框架', description: '决定世界力量阶位是否有固定边界', options: ['有限体系', '开放进阶'] }
      ]
      var previewValues = ['九州大地', '灵气复苏', '修真灵力', '有限体系']

      function updateDifficulty(label) {
        document.getElementById('difficultyLabel').textContent = label
        document.getElementById('factDifficulty').textContent = label
      }

      document.getElementById('difficultyButton').addEventListener('click', function () {
        difficultyIndex = (difficultyIndex + 1) % difficulties.length
        updateDifficulty(difficulties[difficultyIndex])
      })

      /* 规则预览 */
      var rulePreview = document.getElementById('rulePreview')
      dimensions.forEach(function (dim, index) {
        var item = document.createElement('div')
        item.className = 'rulePreviewItem'
        item.innerHTML = '<span class="rulePreviewIcon">' + dim.icon + '</span><span class="rulePreviewCopy"><strong>' + dim.label + '</strong><small>' + previewValues[index] + '</small></span>'
        rulePreview.appendChild(item)
      })

      /* 节日范围 */
      document.querySelectorAll('.festivalControl button').forEach(function (button) {
        button.addEventListener('click', function () {
          document.querySelectorAll('.festivalControl button').forEach(function (el) { el.dataset.active = 'false' })
          button.dataset.active = 'true'
        })
      })

      /* 维度卡片：模式切换 + 选择弹层 */
      var dimensionList = document.getElementById('dimensionList')
      dimensions.forEach(function (dim, index) {
        var li = document.createElement('li')
        li.className = 'dimensionCard'
        var modes = ['AI', '选择', '自定']
        var modeKeys = ['ai', 'adaptive', 'custom']
        var activeMode = index === 0 ? 'adaptive' : 'ai'
        var selectedOption = previewValues[index]

        li.innerHTML = '<div class="dimensionCopy"><h3><span class="semantic-emoji">' + dim.icon + '</span>' + dim.label + '</h3><p>' + dim.description + '</p></div>' +
          '<div class="modeControl" role="group" aria-label="' + dim.label + '设定方式">' +
          modes.map(function (label, i) {
            return '<button type="button" data-mode="' + modeKeys[i] + '" data-active="' + (modeKeys[i] === activeMode ? 'true' : 'false') + '">' + label + '</button>'
          }).join('') +
          '</div><div class="currentValue"></div>'

        var currentValue = li.querySelector('.currentValue')
        var selectTrigger = null

        function renderValue() {
          currentValue.innerHTML = ''
          if (activeMode === 'ai') {
            currentValue.innerHTML = '<input class="fieldInput" value="由 AI 判断" disabled />'
          } else if (activeMode === 'adaptive') {
            var wrapper = document.createElement('div')
            wrapper.className = 'selectTrigger'
            wrapper.setAttribute('role', 'button')
            wrapper.tabIndex = 0
            wrapper.innerHTML = '<span>' + selectedOption + '</span><span class="chevron"></span>'
            var open = false
            var sheet = null
            function closeSheet() { if (sheet) { sheet.remove(); sheet = null; open = false } }
            wrapper.addEventListener('click', function () {
              if (open) { closeSheet(); return }
              sheet = document.createElement('div')
              sheet.className = 'choiceSheet'
              dim.options.forEach(function (option) {
                var button = document.createElement('button')
                button.type = 'button'
                button.dataset.selected = option === selectedOption ? 'true' : 'false'
                button.innerHTML = option
                button.addEventListener('click', function () {
                  selectedOption = option
                  previewValues[index] = option
                  renderValue()
                })
                sheet.appendChild(button)
              })
              currentValue.appendChild(sheet)
              open = true
            })
            wrapper.addEventListener('click', function () { })
            currentValue.appendChild(wrapper)
            selectTrigger = wrapper
          } else {
            var textarea = document.createElement('textarea')
            textarea.className = 'customInput'
            textarea.rows = 2
            textarea.placeholder = '输入自定义内容...'
            textarea.value = selectedOption === '由 AI 判断' ? '' : selectedOption
            textarea.addEventListener('input', function () {
              selectedOption = textarea.value.trim() || '由 AI 判断'
              previewValues[index] = selectedOption
            })
            currentValue.appendChild(textarea)
          }
          updatePreviewCopy(index)
        }

        li.querySelectorAll('.modeControl button').forEach(function (button) {
          button.addEventListener('click', function () {
            activeMode = button.dataset.mode
            li.querySelectorAll('.modeControl button').forEach(function (el) { el.dataset.active = 'false' })
            button.dataset.active = 'true'
            renderValue()
          })
        })

        renderValue()
        dimensionList.appendChild(li)
      })

      function updatePreviewCopy(index) {
        var items = rulePreview.querySelectorAll('.rulePreviewItem')
        var small = items[index] && items[index].querySelector('small')
        if (small) small.textContent = previewValues[index]
      }
    })()
  </script>
</body>
</html>
