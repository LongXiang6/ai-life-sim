  <style>

    .world-customize-b1 .ws-focus-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }

    .world-customize-b1 .ws-difficulty { position: absolute; top: 24px; right: 15px; display: grid; min-width: 88px; min-height: 42px; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; align-items: center; column-gap: 6px; row-gap: 1px; padding: 6px 7px 6px 10px; border: 1px solid #d8deea; border-radius: 13px; background: rgba(255, 255, 255, .8); box-shadow: inset 0 1px rgba(255, 255, 255, .96), 0 4px 11px rgba(62, 70, 100, .045); }
    .world-customize-b1 .ws-difficulty > span:first-child { grid-column: 1; grid-row: 1; color: #929bb0; font-size: 7.2px; font-weight: 650; line-height: 1.15; }

    .world-customize-b1 .ws-rule span { color: #929bb0; font-size: 7px; line-height: 1.45; }

    .world-customize-b1 .cf-choice-option[aria-selected="true"] { border-color: #cfd7ee; background: #edf0fb; color: #5268a5; font-weight: 680; }
    .world-customize-b1 .cf-choice-option[aria-selected="true"]::after { content: ""; width: 5px; height: 8px; margin-right: 3px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translateY(-1px); }

    .world-customize-b1 .cf-meta,

    .world-customize-b1 .ws-difficulty > span:first-child,

<body class="world-customize-b1" data-screen="world-customize" data-creation-step="2">
  <main class="creation-shell">
    <header class="creation-review">
      <p class="creation-review-label">CREATION FLOW · 02 / 08</p>
      <h1>世界配置</h1>
      <p class="creation-review-copy">沿用世界选择 B1 的冷白层次与悬浮操作语法，继续配置这段人生的基础规则。</p>
    </header>

    <section class="creation-stage" aria-label="世界配置移动端界面">
      <div class="creation-phone" data-relative-phone data-relative-phone-width="320" data-relative-phone-height="694">
        <div data-flow-art></div>
        <div class="cf-screen">
          <header class="cf-header" data-creation-header data-title="配置世界" data-subtitle="确认这段人生的底层规则。"></header>

          <section class="cf-summary" aria-label="当前世界规则摘要">
            <div class="ws-focus-top"><span class="ws-focus-source" data-world-source>保存世界</span><span class="ws-focus-index">当前选择</span></div>
            <div class="ws-difficulty" aria-label="人生难度：普通"><span>难度</span><strong data-world-difficulty>普通</strong><span data-icon="arrow" aria-hidden="true"></span></div>
            <h3 data-world-name>潮汐城邦</h3>
            <div class="ws-focus-era" data-world-era>群岛历 218 年</div>
            <div class="ws-rule"><span>规则摘要</span><p data-world-description>潮汐决定城市的贸易节律、迁徙方向与每个人回家的时间。</p></div>
            <div class="ws-rule-facts" aria-label="世界概览"><div><span>来源</span><strong data-world-source-fact>已保存</strong></div><div><span>年代</span><strong data-world-era-fact>群岛历</strong></div><div><span>难度</span><strong data-world-difficulty-fact>普通</strong></div></div>
          </section>

          <section class="cf-section">
            <div class="cf-section-head"><strong>世界规则</strong><small>从基础形态到力量边界</small></div>
            <ol class="cf-setting-list">
              <li class="cf-setting" data-setting="space"><div class="cf-setting-copy"><div class="cf-setting-heading"><strong>空间形态</strong><small>世界的空间结构</small></div><div class="cf-segmented" data-mode-group><button type="button" data-mode="ai">AI</button><button class="is-active" type="button" data-mode="select">选择</button><button type="button" data-mode="custom">自定</button></div><div data-setting-value><button class="cf-select cf-choice-trigger" type="button" data-choice-trigger data-setting-key="space" aria-haspopup="listbox" aria-controls="cf-choice-options" aria-expanded="false"><span>群岛世界</span><span class="cf-choice-chevron" aria-hidden="true"></span></button></div></div></li>
              <li class="cf-setting" data-setting="essence"><div class="cf-setting-copy"><div class="cf-setting-heading"><strong>世界本质</strong><small>底层运行规则</small></div><div class="cf-segmented" data-mode-group><button type="button" data-mode="ai">AI</button><button class="is-active" type="button" data-mode="select">选择</button><button type="button" data-mode="custom">自定</button></div><div data-setting-value><button class="cf-select cf-choice-trigger" type="button" data-choice-trigger data-setting-key="essence" aria-haspopup="listbox" aria-controls="cf-choice-options" aria-expanded="false"><span>多元规则</span><span class="cf-choice-chevron" aria-hidden="true"></span></button></div></div></li>
              <li class="cf-setting" data-setting="power"><div class="cf-setting-copy"><div class="cf-setting-heading"><strong>力量体系</strong><small>力量来源与成长方式</small></div><div class="cf-segmented" data-mode-group><button class="is-active" type="button" data-mode="ai">AI</button><button type="button" data-mode="select">选择</button><button type="button" data-mode="custom">自定</button></div><div data-setting-value><input class="cf-field" value="由 AI 判断" aria-label="力量体系 AI 结果" disabled></div></div></li>
              <li class="cf-setting" data-setting="limit"><div class="cf-setting-copy"><div class="cf-setting-heading"><strong>力量上限</strong><small>力量体系的天花板</small></div><div class="cf-segmented" data-mode-group><button type="button" data-mode="ai">AI</button><button class="is-active" type="button" data-mode="select">选择</button><button type="button" data-mode="custom">自定</button></div><div data-setting-value><button class="cf-select cf-choice-trigger" type="button" data-choice-trigger data-setting-key="limit" aria-haspopup="listbox" aria-controls="cf-choice-options" aria-expanded="false"><span>3 阶</span><span class="cf-choice-chevron" aria-hidden="true"></span></button></div></div></li>
            </ol>
          </section>
        </div>

        <footer class="cf-footer">
          <button class="cf-back" type="button" data-flow-to="world-select" data-flow-back aria-label="返回世界选择" title="返回世界选择"><span data-icon="back"></span></button>
          <button class="cf-next" type="button" data-flow-to="character-create"><span class="cf-next-number">03</span><span class="cf-next-copy"><strong>确认世界</strong><small data-world-next-hint>潮汐城邦 · 下一步塑造角色</small></span><span class="cf-next-arrow" data-icon="arrow"></span></button>
        </footer>
        <div class="cf-choice-dialog" data-choice-dialog hidden>
          <section class="cf-choice-sheet">
            <div class="cf-choice-options" id="cf-choice-options" data-choice-options role="listbox" aria-label="规则选项"></div>
          </section>
        </div>
        <div class="cf-toast" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const maps = {
        space: ['单一大陆', '多大陆', '群岛世界'],
        essence: ['唯物主义', '多元规则', '唯心主义'],
        power: ['无超凡力量', '科技强化', '潮汐契约'],
        limit: ['1 阶', '3 阶', '5 阶'],
      }
      const selected = { space: 2, essence: 1, power: 1, limit: 1 }
      const modes = { space: 'select', essence: 'select', power: 'ai', limit: 'select' }
      const labels = { space: '空间形态', essence: '世界本质', power: '力量体系', limit: '力量上限' }
      const choiceDialog = document.querySelector('[data-choice-dialog]')
      const choiceOptions = document.querySelector('[data-choice-options]')
      let choiceTrigger = null

      function settingValue(key) {
        const setting = document.querySelector(`[data-setting="${key}"]`)
        if (modes[key] === 'ai') return '由 AI 判断'
        if (modes[key] === 'custom') return setting.querySelector('[data-setting-value] input')?.value.trim() || ''
        return maps[key][selected[key]]
      }

      function persistConfig() {
        if (!window.PrototypeFlow) return
        const worldConfig = {}
        Object.keys(maps).forEach(function (key) { worldConfig[key] = { mode: modes[key], value: settingValue(key) } })
        PrototypeFlow.state.write({ worldConfig: worldConfig })
      }

      function renderSetting(key) {
        const setting = document.querySelector(`[data-setting="${key}"]`)
        setting.querySelectorAll('[data-mode]').forEach(function (button) {
          button.classList.toggle('is-active', button.dataset.mode === modes[key])
        })
        const value = setting.querySelector('[data-setting-value]')
        if (modes[key] === 'ai') value.innerHTML = `<input class="cf-field" value="由 AI 判断" aria-label="${labels[key]} AI 结果" disabled>`
        if (modes[key] === 'custom') value.innerHTML = `<input class="cf-field" aria-label="${labels[key]}自定义设定" placeholder="输入自定义内容..." value="">`
        if (modes[key] === 'select') value.innerHTML = choiceControl(key)
      }

      function choiceControl(key) {
        return `<button class="cf-select cf-choice-trigger" type="button" data-choice-trigger data-setting-key="${key}" aria-haspopup="listbox" aria-controls="cf-choice-options" aria-expanded="false"><span>${maps[key][selected[key]]}</span><span class="cf-choice-chevron" aria-hidden="true"></span></button>`
      }

      function closeChoice() {
        if (choiceDialog.hidden) return
        choiceDialog.hidden = true
        if (choiceTrigger) {
          choiceTrigger.setAttribute('aria-expanded', 'false')
          choiceTrigger.focus()
          choiceTrigger = null
        }
      }

      function openChoice(trigger) {
        const key = trigger.dataset.settingKey
        choiceTrigger = trigger
        choiceOptions.replaceChildren(...maps[key].map(function (item, index) {
          const option = document.createElement('button')
          option.className = 'cf-choice-option'
          option.type = 'button'
          option.setAttribute('role', 'option')
          option.dataset.choiceOption = String(index)
          option.textContent = item
          option.setAttribute('aria-selected', String(index === selected[key]))
          return option
        }))
        trigger.setAttribute('aria-expanded', 'true')
        choiceDialog.hidden = false
        const host = choiceDialog.parentElement
        const hostBox = host.getBoundingClientRect()
        const triggerBox = trigger.getBoundingClientRect()
        const scale = hostBox.width / host.offsetWidth
        const left = (triggerBox.left - hostBox.left) / scale
        const width = triggerBox.width / scale
        let top = (triggerBox.bottom - hostBox.top) / scale + 4
        choiceDialog.style.setProperty('--cf-choice-left', `${left}px`)
        choiceDialog.style.setProperty('--cf-choice-width', `${width}px`)
        choiceDialog.style.setProperty('--cf-choice-top', `${top}px`)
        const sheetHeight = choiceDialog.querySelector('.cf-choice-sheet').getBoundingClientRect().height / scale
        const hostHeight = hostBox.height / scale
        if (top + sheetHeight > hostHeight - 10) {
          top = Math.max(10, (triggerBox.top - hostBox.top) / scale - sheetHeight - 4)
          choiceDialog.style.setProperty('--cf-choice-top', `${top}px`)
        }
        choiceOptions.querySelector('[aria-selected="true"]').focus()
      }

      document.addEventListener('click', function (event) {
        const trigger = event.target.closest('[data-choice-trigger]')
        if (trigger) { openChoice(trigger); return }
        const option = event.target.closest('[data-choice-option]')
        if (!option || !choiceTrigger) {
          if (!choiceDialog.hidden && !event.target.closest('.cf-choice-sheet')) closeChoice()
          return
        }
        const key = choiceTrigger.dataset.settingKey
        selected[key] = Number(option.dataset.choiceOption)
        choiceTrigger.querySelector('span').textContent = maps[key][selected[key]]
        persistConfig()
        CreationFlow.notify(`${labels[key]} · ${maps[key][selected[key]]}`)
        closeChoice()
      })

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeChoice()
      })
      window.addEventListener('resize', closeChoice)
      document.querySelector('.cf-screen').addEventListener('scroll', closeChoice, { passive: true })

      document.querySelectorAll('[data-setting]').forEach(function (setting) {
        setting.querySelectorAll('[data-mode]').forEach(function (button) {
          button.addEventListener('click', function () {
            const key = setting.dataset.setting
            const mode = button.dataset.mode
            modes[key] = mode
            setting.querySelectorAll('[data-mode]').forEach(function (item) { item.classList.toggle('is-active', item === button) })
            const value = setting.querySelector('[data-setting-value]')
            if (mode === 'ai') value.innerHTML = `<input class="cf-field" value="由 AI 判断" aria-label="${labels[key]} AI 结果" disabled>`
            if (mode === 'custom') value.innerHTML = `<input class="cf-field" aria-label="${labels[key]}自定义设定" placeholder="输入自定义内容...">`
            if (mode === 'select') value.innerHTML = choiceControl(key)
            persistConfig()
            CreationFlow.notify(`${labels[key]} · ${mode === 'ai' ? 'AI 判断' : mode === 'custom' ? '自定义' : '选择'}`)
          })
        })
      })

      document.addEventListener('input', function (event) {
        if (event.target.closest('[data-setting-value]')) persistConfig()
      })

      document.addEventListener('DOMContentLoaded', function () {
        const flow = PrototypeFlow.state.read()
        const world = flow.world || {}
        const sourceLabels = { saved: ['保存世界', '已保存'], custom: ['自定义世界', '自定义'], preset: ['预设世界', '预设'] }
        const source = sourceLabels[world.source] || sourceLabels.saved
        document.querySelector('[data-world-source]').textContent = source[0]
        document.querySelector('[data-world-source-fact]').textContent = source[1]
        document.querySelector('[data-world-name]').textContent = world.name || '潮汐城邦'
        document.querySelector('[data-world-era]').textContent = world.era || '群岛历 218 年'
        document.querySelector('[data-world-era-fact]').textContent = world.era || '群岛历'
        document.querySelector('[data-world-description]').textContent = world.description || '潮汐决定城市的贸易节律、迁徙方向与每个人回家的时间。'
        document.querySelector('[data-world-difficulty]').textContent = world.difficulty || '普通'
        document.querySelector('[data-world-difficulty-fact]').textContent = world.difficulty || '普通'
        document.querySelector('.ws-difficulty').setAttribute('aria-label', `人生难度：${world.difficulty || '普通'}`)
        document.querySelector('[data-world-next-hint]').textContent = `${world.name || '潮汐城邦'} · 下一步塑造角色`

        Object.entries(flow.worldConfig || {}).forEach(function (entry) {
          const key = entry[0]
          const stored = entry[1]
          if (!maps[key] || !stored) return
          modes[key] = ['ai', 'select', 'custom'].includes(stored.mode) ? stored.mode : modes[key]
          const optionIndex = maps[key].indexOf(stored.value)
          if (optionIndex >= 0) selected[key] = optionIndex
          renderSetting(key)
          if (modes[key] === 'custom') document.querySelector(`[data-setting="${key}"] [data-setting-value] input`).value = stored.value || ''
        })
        persistConfig()
      }, { once: true })
    })()
  </script>
</body>
</html>
