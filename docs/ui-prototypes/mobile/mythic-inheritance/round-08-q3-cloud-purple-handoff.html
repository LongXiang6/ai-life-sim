function nh(n){return n.length===4?`${n.slice(0,2)}<br>${n.slice(2)}`:n}function phone(v){return `<article class="option-card" data-choice="${v.id} ${v.name}" onclick="selectChoice(this)"><div class="phone ${v.cls}"><div class="screen"><header class="head"><div class="step">NEW LIFE · 05</div><div class="head-row"><h4>选择命格</h4><span class="count"><b>0</b> / 3</span></div></header><div class="contracts">${[1,2,3].map(i=>`<button class="contract" aria-label="普通命槽 ${i}，空"><small>星契 0${i}</small></button>`).join('')}</div><div class="mythic-rail"><span class="mythic-glyph"><i></i></span><div class="rail-copy"><b data-mythic-name>${mythics[0][0]}</b><p data-mythic-summary>${mythics[0][1]}</p></div><button class="mythic-trigger open-library" aria-label="打开神话总库">${svg.library}</button></div><div class="utility"><span>十二星位 · 天顶观测</span><span class="utils"><button class="icon replay" aria-label="重播云紫宽环转场">${svg.replay}</button><button class="icon reroll" aria-label="重排待选命格">${svg.shuffle}</button></span></div><div class="content"><div class="astrolabe handoff"><div class="cloud"><i class="layer l5"></i><i class="layer l4"></i><i class="layer l3"></i><i class="layer l2"></i><i class="layer l1"></i></div><div class="orbit"></div><div class="inner"></div><div class="stars"></div><div class="band"></div><div class="zenith"></div>${ordinary.map((x,i)=>`<button class="celestial ${x.rarity}" data-i="${i}" aria-label="查看命格：${x.name}"><span aria-hidden="true">${nh(x.name)}</span></button>`).join('')}<button class="core" aria-label="暂停星盘切换"><b></b></button></div><div class="detail"><strong></strong><p></p><div class="maps"><div><small>属性映射</small><b></b></div><div><small>系统映射</small><b></b></div></div><button class="add" aria-label="将当前命格加入普通命槽">${svg.add}</button></div></div><div class="scrim"></div><section class="library" aria-hidden="true" aria-label="神话总库"><div class="lib-head"><div><b>神话总库</b><p>跨世界共用 · 本局可留空</p></div><button class="lib-close" aria-label="关闭神话总库">${svg.close}</button></div><div class="mythic-list">${mythics.map((m,i)=>`<button class="mythic-card ${i===0?'selected':''}" data-mi="${i}" aria-label="${i===0?'当前神话传承：':'选择神话传承：'}${m[0]}" aria-pressed="${i===0}"><div><b>${m[0]}</b><p>${m[1]}</p></div><span class="mark" aria-hidden="true">${idle}${check}</span></button>`).join('')}</div><div class="lib-foot"><small>独立于三个普通星契</small><button class="clear-mythic" aria-label="清空本局神话传承">${svg.clear}</button></div></section><footer class="bottom"><div class="footer"><button class="footer-btn secondary" aria-label="返回上一步">${svg.back}</button><span class="footer-hint">完成命格选择</span><button class="footer-btn primary confirm" aria-label="确认命格选择" disabled>${svg.ok}<span>确认</span></button></div></footer></div></div><div class="option-copy"><span class="tag">${v.id} · ${v.tag}</span><h3>${v.name}</h3><p>${v.desc}</p></div><p class="option-note">共同基线：P1 云紫宽环同位 220px 五层光场、Q3 双层轨道和混合底栏。稀有度只改变名称光源与详情强调。</p></article>`}document.querySelector('#options').innerHTML=variants.map(phone).join('');
function bind(p){
  let active=0,paused=false,transitioning=false,timer,moveTimer,handTimer;
  const nodes=[...p.querySelectorAll('.celestial')],core=p.querySelector('.core'),detail=p.querySelector('.detail'),astro=p.querySelector('.astrolabe'),slots=[...p.querySelectorAll('.contract')],rgb={common:'var(--common)',fine:'var(--fine)',rare:'var(--rare)',epic:'var(--epic)',legendary:'var(--legendary)'},reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function pulse(){core.classList.remove('pulse');void core.offsetWidth;core.classList.add('pulse')}
  function draw(feed=true){
    nodes.forEach((n,i)=>{const pos=(i-active+12)%12,a=(-90+pos*30)*Math.PI/180;n.style.setProperty('--x',Math.cos(a)*104+'px');n.style.setProperty('--y',Math.sin(a)*104+'px');n.style.setProperty('--order',pos);n.classList.toggle('focused',i===active)});
    const x=ordinary[active],r=rgb[x.rarity];core.querySelector('b').textContent=x.name;detail.style.setProperty('--rgb',r);detail.querySelector('strong').textContent=x.name;detail.querySelector('p').textContent=x.copy;detail.querySelectorAll('.maps b')[0].textContent=x.attr;detail.querySelectorAll('.maps b')[1].textContent=x.system;
    if(feed){pulse();astro.classList.remove('moving');void astro.offsetWidth;astro.classList.add('moving');clearTimeout(moveTimer);moveTimer=setTimeout(()=>astro.classList.remove('moving'),760)}
  }
  function cycle(){if(!transitioning){active=(active+11)%12;draw()}}
  function reset(){clearInterval(timer);if(!paused&&!transitioning)timer=setInterval(cycle,4000)}
  function replay(){
    clearInterval(timer);clearTimeout(handTimer);transitioning=true;paused=false;core.classList.remove('paused');core.setAttribute('aria-label','暂停星盘切换');astro.classList.remove('revealing','moving');astro.classList.add('preparing','handoff');core.querySelector('b').textContent='命';void astro.offsetWidth;astro.classList.remove('preparing');
    const hold=reduced?0:240;
    handTimer=setTimeout(()=>{core.querySelector('b').textContent=ordinary[active].name;astro.classList.add('revealing');astro.classList.remove('handoff');handTimer=setTimeout(()=>{astro.classList.remove('revealing');transitioning=false;reset()},reduced?20:1450)},hold)
  }
  function count(){const n=slots.filter(x=>x.classList.contains('filled')).length;p.querySelector('.count b').textContent=n;p.querySelector('.confirm').disabled=n===0}
  draw(false);replay();
  nodes.forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();if(transitioning)return;active=+n.dataset.i;draw();reset()}));
  core.addEventListener('click',e=>{e.stopPropagation();if(transitioning)return;paused=!paused;core.classList.toggle('paused',paused);core.setAttribute('aria-label',paused?'继续星盘切换':'暂停星盘切换');reset()});
  p.querySelector('.replay').addEventListener('click',e=>{e.stopPropagation();replay()});
  p.querySelector('.reroll').addEventListener('click',e=>{e.stopPropagation();if(!transitioning){active=(active+7)%12;draw();reset()}});
  p.querySelector('.add').addEventListener('click',e=>{e.stopPropagation();const s=slots.find(x=>!x.classList.contains('filled'));if(!s)return;const x=ordinary[active];s.classList.add('filled');s.style.setProperty('--slot',rgb[x.rarity]);s.innerHTML=`<small>已签订</small><b>${x.name}</b>`;s.setAttribute('aria-label',`移除普通命格：${x.name}`);count()});
  slots.forEach((s,i)=>s.addEventListener('click',e=>{e.stopPropagation();if(!s.classList.contains('filled'))return;s.classList.remove('filled');s.style.removeProperty('--slot');s.innerHTML=`<small>星契 0${i+1}</small>`;s.setAttribute('aria-label',`普通命槽 ${i+1}，空`);count()}));
  const lib=p.querySelector('.library'),scrim=p.querySelector('.scrim'),open=()=>{lib.classList.add('open');scrim.classList.add('open');lib.setAttribute('aria-hidden','false')},close=()=>{lib.classList.remove('open');scrim.classList.remove('open');lib.setAttribute('aria-hidden','true')};
  p.querySelector('.open-library').addEventListener('click',e=>{e.stopPropagation();open()});p.querySelector('.lib-close').addEventListener('click',e=>{e.stopPropagation();close()});scrim.addEventListener('click',e=>{e.stopPropagation();close()});
  p.querySelectorAll('.mythic-card').forEach(c=>c.addEventListener('click',e=>{e.stopPropagation();const m=mythics[+c.dataset.mi];p.querySelector('[data-mythic-name]').textContent=m[0];p.querySelector('[data-mythic-summary]').textContent=m[1];p.querySelectorAll('.mythic-card').forEach(x=>{const yes=x===c;x.classList.toggle('selected',yes);x.setAttribute('aria-pressed',yes)});close()}));
  p.querySelector('.clear-mythic').addEventListener('click',e=>{e.stopPropagation();p.querySelector('[data-mythic-name]').textContent='本局不携带';p.querySelector('[data-mythic-summary]').textContent='仍可从跨世界总库选择一项神话传承。';p.querySelectorAll('.mythic-card').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')});close()});
  p.addEventListener('click',e=>e.stopPropagation())
}
document.querySelectorAll('.phone').forEach(bind);
</script></body></html>
