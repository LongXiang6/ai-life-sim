    @media(max-width:1180px){.option-grid{grid-template-columns:minmax(0,1fr)}.option-card{width:min(100%,430px);margin-inline:auto}}@media(max-width:430px){.shell{width:min(100% - 20px,1180px);padding-top:18px}.topbar{gap:8px;margin-bottom:20px}.topbar a,.topbar span{font-size:12px}.phone{max-width:calc(100vw - 42px)}.option-copy,.option-note{margin-right:12px;margin-left:12px}.option-copy{padding-right:0;padding-left:0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}.astrolabe.moving .zenith,.astrolabe.moving .meridian,.astrolabe.moving .orbit{animation:none!important}}@media(prefers-reduced-transparency:reduce){.mythic-rail,.detail,.bottom,.library,.contract{background:hsl(250 34% 98%);backdrop-filter:none}.scrim{background:hsl(247 35% 18% / .28)}}
  </style>

<body>
<main class="shell">
  <div class="topbar"><a href="index.html">← 返回神话传承历史</a><span data-selection>尚未选择</span></div>
  <p class="eyebrow">MYTHIC INHERITANCE · ROUND 07 · P1</p>
  <h1>第七轮：星系主视觉与全局按钮语法</h1>
  <p class="subtitle">P1「柔轨余辉」晋级，P2、P3 淘汰。本轮移除机械转盘感，改为浅色星盘，并同时比较普通星契、神话库图形选择键与底栏按钮系统。</p>
  <p class="round-note"><b>本轮仍是优胜劣汰，不是定版。</b>三稿均保留 4 秒顺时针离散转位、顶部天顶观测位、中心点击暂停与 P1 单次柔光余辉；差异集中在星盘表达和可推广的按钮语言。</p>
  <section class="option-grid" id="options"></section>
  <p class="selection">点击 Q1、Q2 或 Q3 继续下一轮。方案内的星体、星签、神话总库和底栏按钮都可直接操作。</p>
</main>
<script>
const ordinary=[
  {name:'见微知命',rarity:'fine',copy:'细微变化常常比宏大征兆更早显露。',attr:'悟性 +2',system:'洞察事件 +12%'},{name:'雨幕听心',rarity:'rare',copy:'雨声帮助你辨认他人未说出口的情绪。',attr:'心智 +3',system:'共情事件 +15%'},{name:'不燃之烬',rarity:'legendary',copy:'真正熄灭之物也会留下拒绝消散的余温。',attr:'体魄 +5',system:'逆境成长 +24%'},{name:'簿命长风',rarity:'common',copy:'漂泊时你更容易适应新的生活节奏。',attr:'魅力 +1',system:'迁徙适应 +6%'},{name:'山海余响',rarity:'epic',copy:'古老地域会在你心中留下难以磨灭的回声。',attr:'悟性 +3',system:'传承事件 +18%'},{name:'借月生花',rarity:'fine',copy:'寂静时刻更容易孕育清晰而温柔的创造。',attr:'魅力 +2',system:'创作灵感 +10%'},{name:'逆鳞',rarity:'rare',copy:'重要之物受威胁时，你会异常坚定。',attr:'体魄 +3',system:'守护意志 +15%'},{name:'人间烟火',rarity:'common',copy:'寻常生活更容易恢复精力与安定感。',attr:'心智 +1',system:'日常恢复 +6%'},{name:'星骨',rarity:'legendary',copy:'遥远未知会持续牵引你越过既定边界。',attr:'悟性 +5',system:'探索机遇 +24%'},{name:'守拙',rarity:'fine',copy:'缓慢练习会换来不易崩塌的根基。',attr:'体魄 +2',system:'成长稳定 +10%'},{name:'渡鸦信使',rarity:'rare',copy:'失散的信息会沿意外路径重新抵达。',attr:'魅力 +3',system:'信息事件 +15%'},{name:'梦中故园',rarity:'epic',copy:'重要地点会在梦中保存未理解的记忆。',attr:'心智 +4',system:'记忆回响 +18%'}
];
const mythics=[['长夜见灯','绝路之中，微小而真实的希望更容易被你看见。'],['未竟之愿','真正重要却未完成的愿望，会留下仍可追寻的回声。'],['凡心不灭','宏大力量改变一切时，你仍保留重新选择自己的余地。'],['与潮同归','失去无法避免时，你更容易理解告别并留下新的连接。']];
const svg={
  library:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-24 12 12)"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>',
  shuffle:'<svg viewBox="0 0 24 24"><path d="M4 7h3c5 0 5 10 10 10h3M17 14l3 3-3 3M4 17h3c2 0 3-.8 4-2M15 7h5M17 4l3 3-3 3"/></svg>',back:'<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',ok:'<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',add:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',close:'<svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>',clear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m7 17 10-10"/></svg>'
};
const marks={q1:{idle:'<svg class="idle" viewBox="0 0 30 30"><circle cx="15" cy="15" r="7"/><ellipse cx="15" cy="15" rx="13" ry="5" transform="rotate(-24 15 15)"/><path d="M15 11v8M11 15h8"/></svg>',check:'<svg class="check" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13"/><path d="m9 15 4 4 8-9"/></svg>'},q2:{idle:'<svg class="idle" viewBox="0 0 30 30"><path d="m15 2.5 3.2 8.5 8.8-2.8-5.4 7.5 7.2 5.7-9.2-.5-.8 9.1-3.8-8.3-8.2 4.2 4.3-8.1-8-4.5 9.1-.8z"/><path d="M12 15h6M15 12v6"/></svg>',check:'<svg class="check" viewBox="0 0 30 30"><path d="m15 2.5 3.2 8.5 8.8-2.8-5.4 7.5 7.2 5.7-9.2-.5-.8 9.1-3.8-8.3-8.2 4.2 4.3-8.1-8-4.5 9.1-.8z"/><path d="m9.5 15 3.5 3.5 7.5-8"/></svg>'},q3:{idle:'<svg class="idle" viewBox="0 0 30 30"><circle cx="15" cy="15" r="11"/><path d="M19 5.5a11 11 0 0 0 0 19M15 11v8M11 15h8"/></svg>',check:'<svg class="check" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13"/><path d="M19 3.7a13 13 0 0 0 0 22.6M9.5 15l3.5 3.5 7.5-8"/></svg>'}};
const variants=[
  {id:'Q1',cls:'q1',name:'天穹星仪',tag:'precision astrolabe',desc:'最克制的精密刻度与天顶观测弧；平整星签。底栏采用 36px 圆角方形纯图标，适合高密度流程。'},
  {id:'Q2',cls:'q2',name:'星座经纬',tag:'constellation grid',desc:'以极细星座连线和单次经纬点亮建立空间关系；星签也延续连线。底栏使用图标 + 短文字，跨页面语义最明确。'},
  {id:'Q3',cls:'q3',name:'星核引力',tag:'stellar gravity',desc:'轻量星云与双层轨道强化稀有度引力；星契略微浮起。底栏混合次级纯图标与主操作图标 + 短文字。'}
];
const constellation='<svg class="constellation" viewBox="0 0 172 172" aria-hidden="true"><path d="M18 99 48 65 76 85 112 47 147 73 128 116 91 130 52 113 18 99M48 65l4 48M76 85l15 45M112 47l16 69"/><circle cx="18" cy="99" r="1.3"/><circle cx="48" cy="65" r="1.6"/><circle cx="76" cy="85" r="1.2"/><circle cx="112" cy="47" r="1.5"/><circle cx="147" cy="73" r="1.2"/><circle cx="128" cy="116" r="1.5"/><circle cx="91" cy="130" r="1.2"/><circle cx="52" cy="113" r="1.3"/></svg>';
function footer(v){if(v.id==='Q1')return `<button class="footer-action secondary" aria-label="返回上一步">${svg.back}</button><span class="footer-hint">神话传承可留空</span><button class="footer-action primary confirm" aria-label="确认命格选择" disabled>${svg.ok}</button>`;if(v.id==='Q2')return `<button class="footer-action secondary" aria-label="返回上一步">${svg.back}<span>返回</span></button><button class="footer-action primary confirm" aria-label="确认命格选择" disabled>${svg.ok}<span>确认</span></button>`;return `<button class="footer-action secondary" aria-label="返回上一步">${svg.back}</button><span class="footer-hint">完成命格选择</span><button class="footer-action primary confirm" aria-label="确认命格选择" disabled>${svg.ok}<span>确认</span></button>`}
function phone(v){const mark=marks[v.cls];return `<article class="option-card" data-choice="${v.id} ${v.name}" onclick="selectChoice(this)"><div class="phone ${v.cls}"><div class="screen"><header class="head"><div class="step">NEW LIFE · 05</div><div class="head-row"><h4>选择命格</h4><span class="count"><b>0</b> / 3</span></div></header><div class="contracts">${[1,2,3].map(i=>`<button class="contract" aria-label="普通命槽 ${i}，空"><small>星契 0${i}</small></button>`).join('')}</div><div class="mythic-rail"><span class="mythic-glyph"><i></i></span><div class="rail-copy"><b data-mythic-name>${mythics[0][0]}</b><p data-mythic-summary>${mythics[0][1]}</p></div><button class="mythic-trigger open-library" aria-label="打开神话总库">${svg.library}</button></div><div class="utility"><span>十二星位 · 天顶观测</span><button class="icon-control reroll" aria-label="重排待选命格">${svg.shuffle}</button></div><div class="content"><div class="astrolabe"><div class="orbit"></div><div class="meridian"></div><div class="starfield"></div>${constellation}<div class="zenith"></div>${ordinary.map((x,i)=>`<button class="celestial ${x.rarity}" data-i="${i}" aria-label="查看命格：${x.name}"></button>`).join('')}<button class="stellar-core" aria-label="暂停星盘切换"><b></b></button></div><div class="detail"><strong></strong><p></p><div class="maps"><div><small>属性映射</small><b></b></div><div><small>系统映射</small><b></b></div></div><button class="normal-add" aria-label="将当前命格加入普通命槽">${svg.add}</button></div></div><div class="scrim"></div><section class="library" aria-hidden="true" aria-label="神话总库"><div class="lib-head"><div><b>神话总库</b><p>跨世界共用 · 本局可留空</p></div><button class="lib-close" aria-label="关闭神话总库">${svg.close}</button></div><div class="mythic-list">${mythics.map((m,i)=>`<button class="mythic-card ${i===0?'selected':''}" data-mi="${i}" aria-label="${i===0?'取消或更换当前传承：':'选择神话传承：'}${m[0]}" aria-pressed="${i===0}"><div><b>${m[0]}</b><p>${m[1]}</p></div><span class="select-mark" aria-hidden="true">${mark.idle}${mark.check}</span></button>`).join('')}</div><div class="lib-foot"><small>独立于三个普通星契</small><button class="clear-mythic" aria-label="清空本局神话传承">${svg.clear}</button></div></section><footer class="bottom"><div class="footer-bar">${footer(v)}</div></footer></div></div><div class="option-copy"><span class="tag">${v.id} · ${v.tag}</span><h3>${v.name}</h3><p>${v.desc}</p></div><p class="option-note">图形选择键：${v.id==='Q1'?'轨道环加号 / 实色环勾选':v.id==='Q2'?'线框星印 / 实色星印勾选':'日蚀环 / 实色封印'}。所有图标控件均保留可访问名称与明确按压、焦点、禁用状态。</p></article>`}
document.querySelector('#options').innerHTML=variants.map(phone).join('');
function bind(p){let active=0,paused=false,timer,feedbackTimer;const nodes=[...p.querySelectorAll('.celestial')],core=p.querySelector('.stellar-core'),detail=p.querySelector('.detail'),astrolabe=p.querySelector('.astrolabe'),zenith=p.querySelector('.zenith'),contracts=[...p.querySelectorAll('.contract')],rgb={common:'var(--common)',fine:'var(--fine)',rare:'var(--rare)',epic:'var(--epic)',legendary:'var(--legendary)'};
  function pulse(el,name){el.classList.remove(name);void el.offsetWidth;el.classList.add(name)}
  function draw(feedback=true){nodes.forEach((n,i)=>{const pos=(i-active+12)%12,a=(-90+pos*30)*Math.PI/180;n.style.left=(50+Math.cos(a)*42)+'%';n.style.top=(50+Math.sin(a)*42)+'%';n.classList.toggle('focused',i===active)});const x=ordinary[active],r=rgb[x.rarity];astrolabe.style.setProperty('--focus-rgb',r);zenith.style.setProperty('--focus-rgb',r);core.style.setProperty('--rgb',r);core.querySelector('b').textContent=x.name;detail.style.setProperty('--rgb',r);detail.querySelector('strong').textContent=x.name;detail.querySelector('p').textContent=x.copy;detail.querySelectorAll('.maps b')[0].textContent=x.attr;detail.querySelectorAll('.maps b')[1].textContent=x.system;if(feedback){pulse(core,'pulse');astrolabe.classList.remove('moving');void astrolabe.offsetWidth;astrolabe.classList.add('moving');clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>astrolabe.classList.remove('moving'),760)}}
  function cycle(){active=(active+11)%12;draw()}
  function reset(){clearInterval(timer);if(!paused)timer=setInterval(cycle,4000)}
  function updateCount(){const n=contracts.filter(x=>x.classList.contains('filled')).length;p.querySelector('.count b').textContent=n;p.querySelector('.confirm').disabled=n===0}
  draw(false);reset();
  nodes.forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();active=+n.dataset.i;draw();reset()}));core.addEventListener('click',e=>{e.stopPropagation();paused=!paused;core.classList.toggle('paused',paused);core.setAttribute('aria-label',paused?'继续星盘切换':'暂停星盘切换');reset()});
  p.querySelector('.normal-add').addEventListener('click',e=>{e.stopPropagation();const s=contracts.find(x=>!x.classList.contains('filled'));if(!s)return;const x=ordinary[active];s.classList.add('filled');s.style.setProperty('--slot-rgb',rgb[x.rarity]);s.dataset.talent=active;s.innerHTML=`<small>已签订</small><b>${x.name}</b>`;s.setAttribute('aria-label',`移除普通命格：${x.name}`);updateCount()});contracts.forEach((s,i)=>s.addEventListener('click',e=>{e.stopPropagation();if(!s.classList.contains('filled'))return;s.classList.remove('filled');s.style.removeProperty('--slot-rgb');delete s.dataset.talent;s.innerHTML=`<small>星契 0${i+1}</small>`;s.setAttribute('aria-label',`普通命槽 ${i+1}，空`);updateCount()}));
  const lib=p.querySelector('.library'),scrim=p.querySelector('.scrim'),open=()=>{lib.classList.add('open');scrim.classList.add('open');lib.setAttribute('aria-hidden','false')},close=()=>{lib.classList.remove('open');scrim.classList.remove('open');lib.setAttribute('aria-hidden','true')};p.querySelector('.open-library').addEventListener('click',e=>{e.stopPropagation();open()});p.querySelector('.lib-close').addEventListener('click',e=>{e.stopPropagation();close()});scrim.addEventListener('click',e=>{e.stopPropagation();close()});p.querySelectorAll('.mythic-card').forEach(c=>c.addEventListener('click',e=>{e.stopPropagation();const m=mythics[+c.dataset.mi];p.querySelector('[data-mythic-name]').textContent=m[0];p.querySelector('[data-mythic-summary]').textContent=m[1];p.querySelectorAll('.mythic-card').forEach(x=>{const selected=x===c;x.classList.toggle('selected',selected);x.setAttribute('aria-pressed',selected);x.setAttribute('aria-label',`${selected?'当前神话传承：':'选择神话传承：'}${mythics[+x.dataset.mi][0]}`)});close()}));p.querySelector('.clear-mythic').addEventListener('click',e=>{e.stopPropagation();p.querySelector('[data-mythic-name]').textContent='本局不携带';p.querySelector('[data-mythic-summary]').textContent='仍可从跨世界总库选择一项神话传承。';p.querySelectorAll('.mythic-card').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false');x.setAttribute('aria-label',`选择神话传承：${mythics[+x.dataset.mi][0]}`)});close()});p.querySelector('.reroll').addEventListener('click',e=>{e.stopPropagation();active=(active+7)%12;draw();reset()});p.addEventListener('click',e=>e.stopPropagation())
}
document.querySelectorAll('.phone').forEach(bind);
</script>
</body>
</html>
