  <main class="shell">
    <div class="topbar"><a href="index.html">← 返回神话传承历史</a><span data-selection>尚未选择</span></div>
    <p class="eyebrow">MYTHIC INHERITANCE · ROUND 11 · T2</p>
    <h1>第十一轮：双搏水波的形态</h1>
    <p class="subtitle">T2「双搏心律」晋级，T1、T3 淘汰。双搏两次峰值拉开到约 405ms，整组缩短为 1.62s；本轮只比较小水波与事件大水波的层次、厚度和消散速度。</p>
    <p class="round-note"><b>继续优胜劣汰，不是定版。</b>三稿共同保留 minimal-white、十二星名可读、中心“命”、天顶与详情强化；每次搏动产生到达星盘边缘的小水波，轮转、节点点击和重排均产生抵达手机边缘的大水波。</p>
    <section class="option-grid" id="options"></section>
    <p class="selection">点击 U1、U2 或 U3 选择下一轮方向。点击中心“命”可同时暂停或恢复双搏、水波与星盘轮转。</p>
  </main>
  <script>
    const ordinary=[
      {name:'见微知命',rarity:'fine',copy:'细微变化常常比宏大征兆更早显露。',attr:'悟性 +2',system:'洞察事件 +12%'},{name:'雨幕听心',rarity:'rare',copy:'雨声帮助你辨认他人未说出口的情绪。',attr:'心智 +3',system:'共情事件 +15%'},{name:'不燃之烬',rarity:'legendary',copy:'真正熄灭之物也会留下拒绝消散的余温。',attr:'体魄 +5',system:'逆境成长 +24%'},{name:'簿命长风',rarity:'common',copy:'漂泊时你更容易适应新的生活节奏。',attr:'魅力 +1',system:'迁徙适应 +6%'},{name:'山海余响',rarity:'epic',copy:'古老地域会在你心中留下难以磨灭的回声。',attr:'悟性 +3',system:'传承事件 +18%'},{name:'借月生花',rarity:'fine',copy:'寂静时刻更容易孕育清晰而温柔的创造。',attr:'魅力 +2',system:'创作灵感 +10%'},{name:'逆鳞',rarity:'rare',copy:'重要之物受威胁时，你会异常坚定。',attr:'体魄 +3',system:'守护意志 +15%'},{name:'人间烟火',rarity:'common',copy:'寻常生活更容易恢复精力与安定感。',attr:'心智 +1',system:'日常恢复 +6%'},{name:'星骨',rarity:'legendary',copy:'遥远未知会持续牵引你越过既定边界。',attr:'悟性 +5',system:'探索机遇 +24%'},{name:'守拙',rarity:'fine',copy:'缓慢练习会换来不易崩塌的根基。',attr:'体魄 +2',system:'成长稳定 +10%'},{name:'渡鸦信使',rarity:'rare',copy:'失散的信息会沿意外路径重新抵达。',attr:'魅力 +3',system:'信息事件 +15%'},{name:'梦中故园',rarity:'epic',copy:'重要地点会在梦中保存未理解的记忆。',attr:'心智 +4',system:'记忆回响 +18%'}
    ];
    const mythics=[['长夜见灯','绝路之中，微小而真实的希望更容易被你看见。'],['未竟之愿','真正重要却未完成的愿望，会留下仍可追寻的回声。'],['凡心不灭','宏大力量改变一切时，你仍保留重新选择自己的余地。'],['与潮同归','失去无法避免时，你更容易理解告别并留下新的连接。']];
    const svg={library:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-24 12 12)"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>',shuffle:'<svg viewBox="0 0 24 24"><path d="M4 7h3c5 0 5 10 10 10h3M17 14l3 3-3 3M4 17h3c2 0 3-.8 4-2M15 7h5M17 4l3 3-3 3"/></svg>',back:'<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',ok:'<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',add:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',close:'<svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>',clear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m7 17 10-10"/></svg>'};
    const idle='<svg class="idle" viewBox="0 0 30 30"><circle cx="15" cy="15" r="11"/><path d="M19 5.5a11 11 0 0 0 0 19M15 11v8M11 15h8"/></svg>',check='<svg class="check" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13"/><path d="M19 3.7a13 13 0 0 0 0 22.6M9.5 15l3.5 3.5 7.5-8"/></svg>';
    const variants=[
      {id:'U1',cls:'u1',name:'单环远波',tag:'single far ripple',desc:'每次搏动只保留一圈清楚的远行水纹，大波由主波头和极淡尾迹构成；最克制。',kicker:'单环水纹'},
      {id:'U2',cls:'u2',name:'主波余响',tag:'main and afterwave',desc:'小水波带一圈柔和余波，大波由主波头与两层渐淡尾迹接力；水感和层次最明确。',kicker:'余波水纹'},
      {id:'U3',cls:'u3',name:'极缓薄纹',tag:'slow thin ripple',desc:'边线更薄、扩散更缓，主波和尾迹以更长时间消失在屏幕边缘；最安静。',kicker:'薄水纹'}
    ];
    function nameHtml(name){return name.length===4?`${name.slice(0,2)}<br>${name.slice(2)}`:name}
    function phone(v){return `<article class="option-card" data-choice="${v.id} ${v.name}" onclick="selectChoice(this)"><div class="phone ${v.cls}"><div class="screen"><header class="head"><div class="step">NEW LIFE · 05</div><div class="head-row"><h4>选择命格</h4><span class="count"><b>0</b> / 3</span></div></header><div class="contracts">${[1,2,3].map(i=>`<button class="contract" aria-label="普通命槽 ${i}，空"><small>星契 0${i}</small></button>`).join('')}</div><div class="mythic-rail"><span class="mythic-glyph"><i></i></span><div class="rail-copy"><b data-mythic-name>${mythics[0][0]}</b><p data-mythic-summary>${mythics[0][1]}</p></div><button class="mythic-trigger open-library" aria-label="打开神话总库">${svg.library}</button></div><div class="utility"><span class="utility-label">十二星位 · 天顶观测</span><button class="icon reroll" aria-label="重排待选命格">${svg.shuffle}</button></div><div class="content"><div class="astrolabe"><div class="cloud"><i class="layer l5"></i><i class="layer l4"></i><i class="layer l3"></i><i class="layer l2"></i><i class="layer l1"></i></div><div class="orbit"></div><div class="inner"></div><div class="stars"></div><i class="cycle-wave cycle-main"></i><i class="cycle-wave cycle-tail tail-a"></i><i class="cycle-wave cycle-tail tail-b"></i><div class="zenith"></div>${ordinary.map((x,i)=>`<button class="celestial ${x.rarity}" data-i="${i}" aria-label="查看命格：${x.name}"><span aria-hidden="true">${nameHtml(x.name)}</span></button>`).join('')}<button class="core" aria-label="暂停心跳与星盘轮转"><i class="heart-wave wa1" style="--delay:.68s"></i><i class="heart-wave wb1" style="--delay:1.085s"></i><i class="heart-wave wa2" style="--delay:2.3s"></i><i class="heart-wave wb2" style="--delay:2.705s"></i><b>命</b></button></div><div class="detail"><span class="detail-kicker">${v.kicker}</span><strong></strong><p></p><div class="maps"><div><small>属性映射</small><b></b></div><div><small>系统映射</small><b></b></div></div><button class="add" aria-label="将当前命格加入普通命槽">${svg.add}</button></div></div><div class="scrim"></div><section class="library" aria-hidden="true" aria-label="神话总库"><div class="lib-head"><div><b>神话总库</b><p>跨世界共用 · 本局可留空</p></div><button class="lib-close" aria-label="关闭神话总库">${svg.close}</button></div><div class="mythic-list">${mythics.map((m,i)=>`<button class="mythic-card ${i===0?'selected':''}" data-mi="${i}" aria-label="${i===0?'当前神话传承：':'选择神话传承：'}${m[0]}" aria-pressed="${i===0}"><div><b>${m[0]}</b><p>${m[1]}</p></div><span class="mark" aria-hidden="true">${idle}${check}</span></button>`).join('')}</div><div class="lib-foot"><small>独立于三个普通星契</small><button class="clear-mythic" aria-label="清空本局神话传承">${svg.clear}</button></div></section><footer class="bottom"><div class="footer"><button class="footer-btn secondary" aria-label="返回上一步">${svg.back}</button><span class="footer-hint">完成命格选择</span><button class="footer-btn primary confirm" aria-label="确认命格选择" disabled>${svg.ok}<span>确认</span></button></div></footer></div></div><div class="option-copy"><span class="tag">${v.id} · ${v.tag}</span><h3>${v.name}</h3><p>${v.desc}</p></div><p class="option-note">共同基线：1.62s 双搏的两次峰值相隔约 405ms；小水波抵达星盘边缘，所有星盘切换事件都触发带尾迹的大水波并扩散到手机边缘。</p></article>`}
    document.querySelector('#options').innerHTML=variants.map(phone).join('');
    function bind(phone){
      let active=0,paused=false,timer;
      const nodes=[...phone.querySelectorAll('.celestial')],core=phone.querySelector('.core'),astro=phone.querySelector('.astrolabe'),largeWaves=[...phone.querySelectorAll('.cycle-wave')],detail=phone.querySelector('.detail'),slots=[...phone.querySelectorAll('.contract')];
      const rgb={common:'var(--common)',fine:'var(--fine)',rare:'var(--rare)',epic:'var(--epic)',legendary:'var(--legendary)'};
      function emitLargeWave(){largeWaves.forEach(wave=>wave.classList.remove('active'));void astro.offsetWidth;largeWaves.forEach(wave=>wave.classList.add('active'))}
      function draw(large=false){nodes.forEach((node,i)=>{const pos=(i-active+12)%12,angle=(-90+pos*30)*Math.PI/180;node.style.setProperty('--x',Math.cos(angle)*104+'px');node.style.setProperty('--y',Math.sin(angle)*104+'px');node.classList.toggle('focused',i===active)});const item=ordinary[active],rarity=rgb[item.rarity];detail.style.setProperty('--rgb',rarity);detail.querySelector('strong').textContent=item.name;detail.querySelector('p').textContent=item.copy;detail.querySelectorAll('.maps b')[0].textContent=item.attr;detail.querySelectorAll('.maps b')[1].textContent=item.system;if(large)emitLargeWave()}
      function cycle(){active=(active+11)%12;draw(true)}
      function resetTimer(){clearInterval(timer);if(!paused)timer=setInterval(cycle,4000)}
      function count(){const amount=slots.filter(slot=>slot.classList.contains('filled')).length;phone.querySelector('.count b').textContent=amount;phone.querySelector('.confirm').disabled=amount===0}
      draw();resetTimer();
      nodes.forEach(node=>node.addEventListener('click',event=>{event.stopPropagation();active=Number(node.dataset.i);draw(true);resetTimer()}));
      core.addEventListener('click',event=>{event.stopPropagation();paused=!paused;core.classList.toggle('paused',paused);astro.classList.toggle('paused-state',paused);core.setAttribute('aria-label',paused?'恢复心跳与星盘轮转':'暂停心跳与星盘轮转');resetTimer()});
      phone.querySelector('.reroll').addEventListener('click',event=>{event.stopPropagation();active=(active+7)%12;draw(true);resetTimer()});
      phone.querySelector('.add').addEventListener('click',event=>{event.stopPropagation();const item=ordinary[active];if(slots.some(slot=>slot.dataset.name===item.name))return;const slot=slots.find(candidate=>!candidate.classList.contains('filled'));if(!slot)return;slot.classList.add('filled');slot.dataset.name=item.name;slot.innerHTML=`<small>已签订</small><b>${item.name}</b>`;slot.setAttribute('aria-label',`移除普通命格：${item.name}`);count()});
      slots.forEach((slot,i)=>slot.addEventListener('click',event=>{event.stopPropagation();if(!slot.classList.contains('filled'))return;slot.classList.remove('filled');delete slot.dataset.name;slot.innerHTML=`<small>星契 0${i+1}</small>`;slot.setAttribute('aria-label',`普通命槽 ${i+1}，空`);count()}));
      const library=phone.querySelector('.library'),scrim=phone.querySelector('.scrim'),open=()=>{library.classList.add('open');scrim.classList.add('open');library.setAttribute('aria-hidden','false')},close=()=>{library.classList.remove('open');scrim.classList.remove('open');library.setAttribute('aria-hidden','true')};
      phone.querySelector('.open-library').addEventListener('click',event=>{event.stopPropagation();open()});phone.querySelector('.lib-close').addEventListener('click',event=>{event.stopPropagation();close()});scrim.addEventListener('click',event=>{event.stopPropagation();close()});
      phone.querySelectorAll('.mythic-card').forEach(card=>card.addEventListener('click',event=>{event.stopPropagation();const item=mythics[Number(card.dataset.mi)];phone.querySelector('[data-mythic-name]').textContent=item[0];phone.querySelector('[data-mythic-summary]').textContent=item[1];phone.querySelectorAll('.mythic-card').forEach(candidate=>{const selected=candidate===card;candidate.classList.toggle('selected',selected);candidate.setAttribute('aria-pressed',String(selected))});close()}));
      phone.querySelector('.clear-mythic').addEventListener('click',event=>{event.stopPropagation();phone.querySelector('[data-mythic-name]').textContent='本局不携带';phone.querySelector('[data-mythic-summary]').textContent='仍可从跨世界总库选择一项神话传承。';phone.querySelectorAll('.mythic-card').forEach(card=>{card.classList.remove('selected');card.setAttribute('aria-pressed','false')});close()});
      phone.addEventListener('click',event=>event.stopPropagation());
    }
    document.querySelectorAll('.phone').forEach(bind);
  </script>
</body>
</html>
