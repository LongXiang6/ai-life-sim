function bind(p){let active=0,paused=false,timer,motionTimer;const nodes=[...p.querySelectorAll('.node')],core=p.querySelector('.core'),detail=p.querySelector('.detail'),wheel=p.querySelector('.wheel'),focus=p.querySelector('.focus'),rgb={common:'var(--common)',fine:'var(--fine)',rare:'var(--rare)',epic:'var(--epic)',legendary:'var(--legendary)'},reduced=matchMedia('(prefers-reduced-motion: reduce)');

  function draw(feedback=true){nodes.forEach((n,i)=>{const pos=(i-active+12)%12,a=(-90+pos*30)*Math.PI/180;n.style.left=(50+Math.cos(a)*40)+'%';n.style.top=(50+Math.sin(a)*40)+'%';n.classList.toggle('focused',i===active)});const x=ordinary[active],r=rgb[x.rarity];wheel.style.setProperty('--focus-rgb',r);focus.style.setProperty('--focus-rgb',r);core.style.setProperty('--rgb',r);core.querySelector('b').textContent=x.name;detail.style.setProperty('--rgb',r);detail.querySelector('strong').textContent=x.name;detail.querySelector('p').textContent=x.copy;detail.querySelectorAll('.maps b')[0].textContent=x.attr;detail.querySelectorAll('.maps b')[1].textContent=x.system;if(feedback&&!reduced.matches){restartClass(core,'pulse');restartClass(focus,'breathe');wheel.classList.remove('moving');void wheel.offsetWidth;wheel.classList.add('moving');clearTimeout(motionTimer);motionTimer=setTimeout(()=>wheel.classList.remove('moving'),760)}}
  function cycle(){active=(active+11)%12;draw()}
  function reset(){clearInterval(timer);if(!paused&&!reduced.matches)timer=setInterval(cycle,4000)}
  draw(false);reset();
  nodes.forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();active=+n.dataset.i;draw();reset()}));core.addEventListener('click',e=>{e.stopPropagation();paused=!paused;core.classList.toggle('paused',paused);core.setAttribute('aria-label',paused?'继续自动旋转':'暂停自动旋转');reset()});
  p.querySelector('.select-normal').addEventListener('click',e=>{e.stopPropagation();const s=[...p.querySelectorAll('.slot')].find(x=>!x.classList.contains('filled'));if(s){s.classList.add('filled');s.innerHTML=`<b>${ordinary[active].name}</b>`;p.querySelector('.count b').textContent=p.querySelectorAll('.slot.filled').length}});p.querySelectorAll('.slot').forEach((s,i)=>s.addEventListener('click',e=>{e.stopPropagation();if(s.classList.contains('filled')){s.classList.remove('filled');s.innerHTML=`<em>命槽 ${i+1}</em>`;p.querySelector('.count b').textContent=p.querySelectorAll('.slot.filled').length}}));
  const lib=p.querySelector('.library'),scrim=p.querySelector('.scrim'),open=()=>{lib.classList.add('open');scrim.classList.add('open');lib.setAttribute('aria-hidden','false')},close=()=>{lib.classList.remove('open');scrim.classList.remove('open');lib.setAttribute('aria-hidden','true')};p.querySelector('.open-library').onclick=e=>{e.stopPropagation();open()};p.querySelector('.close').onclick=e=>{e.stopPropagation();close()};scrim.onclick=e=>{e.stopPropagation();close()};p.querySelectorAll('.mythic-card').forEach(c=>c.onclick=e=>{e.stopPropagation();const m=mythics[+c.dataset.mi];p.querySelector('[data-mythic-name]').textContent=m[0];p.querySelector('[data-mythic-summary]').textContent=m[1];p.querySelectorAll('.mythic-card').forEach(x=>{x.classList.toggle('selected',x===c);x.querySelector('span').textContent=x===c?'已携带':'选择'});close()});p.querySelector('.clear').onclick=e=>{e.stopPropagation();p.querySelector('[data-mythic-name]').textContent='本局不携带';p.querySelector('[data-mythic-summary]').textContent='你可以从跨世界总库重新选择一项传承。';p.querySelectorAll('.mythic-card').forEach(x=>{x.classList.remove('selected');x.querySelector('span').textContent='选择'});close()};p.querySelector('.reroll').onclick=e=>{e.stopPropagation();active=(active+7)%12;draw();reset()};p.addEventListener('click',e=>e.stopPropagation())
}
document.querySelectorAll('.phone').forEach(bind);
</script></body></html>
