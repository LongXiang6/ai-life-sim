<!doctype html>
<html lang="zh-CN" data-theme="light-aurora">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>神话传承第五轮 · N2 左轮命盘</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="../assets/library-history.css"><script src="../assets/prototype.js" defer></script>
  <style>
    :root{color-scheme:light;--primary:hsl(239 84% 67%);--primary-strong:hsl(242 47% 38%);--primary-soft:hsl(244 68% 96%/.92);--bg:hsl(250 38% 98%);--bg2:hsl(248 35% 95%);--text:hsl(244 47% 20%);--muted:hsl(220 9% 46%);--faint:hsl(220 9% 61%);--border:hsl(246 34% 87%/.9);--glass:hsl(0 0% 100%/.76);--glass-up:hsl(0 0% 100%/.9);--modal:hsl(250 38% 99%/.97);--mythic:126 88 190;--common:123 132 149;--fine:70 155 112;--rare:76 123 205;--epic:151 83 203;--legendary:224 154 48;--ease:cubic-bezier(.2,.72,.22,1)}
    *{box-sizing:border-box}button{font:inherit}.option-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.phone{height:650px;background:radial-gradient(circle at 78% 7%,color-mix(in srgb,var(--primary) 10%,transparent),transparent 28%),linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text)}.screen{position:relative;display:flex;height:100%;flex-direction:column;overflow:hidden}.head{padding:14px 12px 5px}.step{color:var(--primary);font-size:7px;font-weight:800;letter-spacing:.16em}.head-row{display:flex;align-items:end;justify-content:space-between;margin-top:4px}.head h4{margin:0;font-size:18px}.count{color:var(--muted);font-size:7px}.count b{color:var(--primary-strong);font-size:10px}
    .tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:0 12px 6px}.slot{display:grid;height:34px;place-content:center;border:1px dashed color-mix(in srgb,var(--primary) 25%,transparent);border-radius:10px;background:var(--glass);color:var(--faint)}.slot em{font-size:5px;font-style:normal}.slot b{font-size:7px}.slot.filled{border-style:solid;background:var(--primary-soft);color:var(--primary-strong)}
    .rail{display:grid;grid-template-columns:24px minmax(0,1fr) 27px;min-height:44px;margin:0 12px 4px;padding:5px 6px;align-items:center;gap:6px;border:1px solid rgba(var(--mythic),.28);border-radius:10px;background:linear-gradient(135deg,var(--glass-up),rgba(var(--mythic),.08));box-shadow:0 5px 14px rgba(var(--mythic),.05)}.mark,.icon-btn{display:grid;place-items:center}.mark{width:24px;height:24px;border-radius:50%;background:rgba(var(--mythic),.1);color:rgb(var(--mythic));font-size:10px}.rail-copy{min-width:0}.rail-copy b,.rail-copy p{display:block;overflow:hidden;margin:0;text-overflow:ellipsis;white-space:nowrap}.rail-copy b{font-size:7px}.rail-copy p{margin-top:2px;color:var(--muted);font-size:5px}.icon-btn{width:27px;height:27px;padding:0;border:1px solid rgba(var(--mythic),.2);border-radius:9px;background:var(--glass);color:rgb(var(--mythic))}.icon-btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8}.utility{display:flex;min-height:27px;align-items:center;justify-content:space-between;padding:0 12px 3px;color:var(--faint);font-size:6px}.utility .icon-btn{width:25px;height:25px;color:var(--primary-strong)}
    .content{min-height:0;flex:1;padding:0 5px 64px;overflow-y:auto}.wheel{position:relative;width:254px;height:254px;margin:0 auto}.wheel::before{position:absolute;inset:17px;border:1px solid color-mix(in srgb,var(--primary) 13%,transparent);border-radius:50%;box-shadow:inset 0 0 34px color-mix(in srgb,var(--primary) 4%,transparent);content:""}.focus{position:absolute;z-index:3;top:3px;left:50%;width:45px;height:45px;border:1.5px dashed color-mix(in srgb,var(--primary-strong) 55%,transparent);border-radius:50%;transform:translateX(-50%);pointer-events:none}.focus::after{position:absolute;top:-6px;left:50%;width:4px;height:4px;border-radius:50%;background:var(--primary);content:"";transform:translateX(-50%)}
    .node{--rgb:var(--common);position:absolute;z-index:4;display:grid;width:37px;height:37px;padding:4px;place-items:center;border:1px solid rgba(var(--rgb),.62);border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.98),rgba(var(--rgb),.15));box-shadow:0 0 7px rgba(var(--rgb),.2);color:rgb(var(--rgb));font-size:5.5px;font-weight:750;line-height:1.1;text-align:center;transform:translate(-50%,-50%);transition:left .72s var(--ease),top .72s var(--ease),box-shadow .25s}.node.common{--rgb:var(--common)}.node.fine{--rgb:var(--fine)}.node.rare{--rgb:var(--rare)}.node.epic{--rgb:var(--epic)}.node.legendary{--rgb:var(--legendary)}.node.focused{z-index:6}
    .core{--rgb:var(--epic);position:absolute;z-index:5;top:50%;left:50%;display:grid;width:112px;height:112px;padding:16px;place-content:center;border:1px solid rgba(var(--rgb),.22);border-radius:50%;background:radial-gradient(circle,var(--bg) 18%,rgba(var(--rgb),.14) 50%,transparent 72%);box-shadow:0 0 27px rgba(var(--rgb),.13);color:var(--text);text-align:center;transform:translate(-50%,-50%);cursor:pointer}.core b{font-size:13px;letter-spacing:-.04em}.core small{display:none}.core.pulse{animation:corePulse .58s var(--ease)}
    .o1 .node.focused{box-shadow:0 0 10px 4px rgba(var(--rgb),.3),0 0 24px rgba(var(--rgb),.22)}.o2 .node{box-shadow:0 0 5px rgba(var(--rgb),.24),0 0 0 3px rgba(var(--rgb),.05)}.o2 .node.focused{box-shadow:0 0 0 3px rgba(var(--rgb),.13),0 0 9px 4px rgba(var(--rgb),.35),0 0 25px 8px rgba(var(--rgb),.17)}.o2 .focus{border-style:double;border-width:3px}.o3 .wheel::after{position:absolute;inset:9px;border:1px dashed color-mix(in srgb,var(--primary) 12%,transparent);border-radius:50%;content:"";animation:ring 8s linear infinite}.o3 .node.focused{box-shadow:0 0 7px 3px rgba(var(--rgb),.44),-10px 8px 15px rgba(var(--rgb),.17)}.o3 .focus::before{position:absolute;inset:-7px;border:1px solid rgba(var(--primary),.18);border-radius:50%;content:"";animation:ripple 1.8s ease-out infinite}
    .detail{--rgb:var(--epic);position:relative;margin:-1px 9px 0;padding:7px 42px 7px 9px;border:1px solid rgba(var(--rgb),.18);border-radius:13px;background:var(--glass-up);box-shadow:0 8px 20px rgba(55,45,95,.06)}.detail strong{display:block;margin-bottom:3px;color:rgb(var(--rgb));font-size:7px}.detail p{min-height:25px;margin:0;color:var(--muted);font-size:6px;line-height:1.45}.maps{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}.maps div{padding:4px 6px;border-radius:8px;background:rgba(var(--rgb),.05)}.maps small{display:block;color:var(--faint);font-size:5px}.maps b{color:rgb(var(--rgb));font-size:6px}.select-normal{position:absolute;right:8px;bottom:8px;display:grid;width:28px;height:28px;padding:0;place-items:center;border:0;border-radius:9px;background:rgb(var(--rgb));color:white}.select-normal svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
    .bottom{position:absolute;right:0;bottom:0;left:0;z-index:50;padding:6px 10px 7px;border-top:1px solid var(--border);background:var(--glass);backdrop-filter:blur(12px)}.bar{display:flex;align-items:center;justify-content:space-between}.action{display:grid;width:34px;height:32px;padding:0;place-items:center;border:1px solid var(--border);border-radius:10px;background:var(--glass-up);color:var(--muted)}.action.primary{border-color:var(--primary-strong);background:var(--primary-strong);color:white}.action svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}.bottom-hint{color:var(--faint);font-size:5px}
    .scrim{position:absolute;z-index:80;inset:0;background:rgba(36,29,64,.18);opacity:0;pointer-events:none;transition:opacity .25s}.scrim.open{opacity:1;pointer-events:auto}.library{position:absolute;z-index:90;right:6px;bottom:52px;left:6px;visibility:hidden;max-height:340px;padding:10px;border:1px solid var(--border);border-radius:18px;background:var(--modal);box-shadow:0 -12px 32px rgba(55,45,95,.14);opacity:0;overflow:hidden;transform:translateY(calc(100% + 60px));transition:.3s var(--ease)}.library.open{visibility:visible;opacity:1;transform:translateY(0)}.lib-head{display:flex;justify-content:space-between}.lib-head b{font-size:9px}.lib-head p{margin:2px 0;color:var(--muted);font-size:5px}.mythic-list{display:grid;max-height:240px;gap:5px;margin-top:7px;overflow-y:auto}.mythic-card{display:grid;grid-template-columns:1fr auto;gap:7px;padding:7px;border:1px solid var(--border);border-radius:10px;background:var(--glass);color:var(--text);text-align:left}.mythic-card.selected{border-color:rgba(var(--mythic),.54);background:rgba(var(--mythic),.08)}.mythic-card b{font-size:7px}.mythic-card p{margin:2px 0;color:var(--muted);font-size:5px}.mythic-card span{align-self:center;color:rgb(var(--mythic));font-size:5px}.lib-foot{display:flex;justify-content:space-between;margin-top:7px}.lib-foot small{color:var(--faint);font-size:5px}.option-note{margin:0 18px 15px;padding:9px 11px;border-radius:11px;background:var(--bg2);color:var(--muted);font-size:11px;line-height:1.55}
    @keyframes corePulse{50%{filter:brightness(1.1);transform:translate(-50%,-50%) scale(1.075)}}@keyframes ripple{to{opacity:0;transform:scale(1.3)}}@keyframes ring{to{transform:rotate(360deg)}}
    @media(max-width:1180px){.option-grid{grid-template-columns:minmax(0,1fr)}.option-card{width:min(100%,430px);margin-inline:auto}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.core small{display:none}}
  </style>
</head>
<body><main class="shell"><div class="topbar"><a href="index.html">← 返回神话传承历史</a><span data-selection>尚未选择</span></div><p class="eyebrow">MYTHIC INHERITANCE · ROUND 05 · N2</p><h1>N2 下一轮：左轮式十二命格光效</h1><p class="subtitle">固定 N2 两行神话传承细轨、三个普通命槽与半高跨世界总库。本轮只比较圆形命格在固定顶部焦点中的光芒与运动反馈。</p><section class="option-grid" id="options"></section><p class="selection">点击 O1、O2 或 O3 继续优胜劣汰。三稿均每 4 秒顺时针移动一格；点击中央名称可暂停或继续，当前顶部圆点始终与详情同步。</p></main>
<script>
const ordinary=[['见微知命','fine','细微变化常常比宏大征兆更早显露。','悟性 +2','洞察事件 +12%'],['雨幕听心','rare','雨声帮助你辨认他人未说出口的情绪。','心智 +3','共情事件 +15%'],['不燃之烬','legendary','真正熄灭之物也会留下拒绝消散的余温。','体魄 +5','逆境成长 +24%'],['簿命长风','common','漂泊时你更容易适应新的生活节奏。','魅力 +1','迁徙适应 +6%'],['山海余响','epic','古老地域会在你心中留下难以磨灭的回声。','悟性 +3','传承事件 +18%'],['借月生花','fine','寂静时刻更容易孕育清晰而温柔的创造。','魅力 +2','创作灵感 +10%'],['逆鳞','rare','重要之物受威胁时，你会异常坚定。','体魄 +3','守护意志 +15%'],['人间烟火','common','寻常生活更容易恢复精力与安定感。','心智 +1','日常恢复 +6%'],['星骨','legendary','遥远未知会持续牵引你越过既定边界。','悟性 +5','探索机遇 +24%'],['守拙','fine','缓慢练习会换来不易崩塌的根基。','体魄 +2','成长稳定 +10%'],['渡鸦信使','rare','失散的信息会沿意外路径重新抵达。','魅力 +3','信息事件 +15%'],['梦中故园','epic','重要地点会在梦中保存未理解的记忆。','心智 +4','记忆回响 +18%']];
const mythics=[['长夜见灯','绝路之中，微小而真实的希望更容易被你看见。'],['未竟之愿','真正重要却未完成的愿望，会留下仍可追寻的回声。'],['凡心不灭','宏大力量改变一切时，你仍保留重新选择自己的余地。'],['与潮同归','失去无法避免时，你更容易理解告别并留下新的连接。']];
const icon={library:'<svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M8 7h8"/></svg>',shuffle:'<svg viewBox="0 0 24 24"><path d="M3 7h3c5 0 5 10 10 10h5M18 14l3 3-3 3M3 17h3c2 0 3-.8 4-2M15 7h6M18 4l3 3-3 3"/></svg>',back:'<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',ok:'<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',add:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',close:'<svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>'};
const variants=[['O1','柔光晕染','soft halo','柔和单层光晕强调当前命格，信息最安静。'],['O2','分层绽放','layered bloom','三层光晕随稀有度绽放，等级差异最清楚。'],['O3','轨迹涟漪','trail / ripple','旋转轨道与焦点涟漪共同提示运动方向。']];
function phone(v){return `<article class="option-card" data-choice="${v[0]} ${v[1]}" onclick="selectChoice(this)"><div class="phone ${v[0].toLowerCase()}"><div class="screen"><header class="head"><div class="step">NEW LIFE · 05</div><div class="head-row"><h4>选择命格</h4><span class="count"><b>0</b> / 3</span></div></header><div class="tray">${[1,2,3].map(i=>`<button class="slot"><em>命槽 ${i}</em></button>`).join('')}</div><div class="rail"><i class="mark">◇</i><div class="rail-copy"><b data-mythic-name>长夜见灯</b><p data-mythic-summary>${mythics[0][1]}</p></div><button class="icon-btn open-library" aria-label="打开神话总库">${icon.library}</button></div><div class="utility"><span>十二命格 · 顶部聚焦</span><button class="icon-btn" aria-label="重抽未选命格">${icon.shuffle}</button></div><div class="content"><div class="wheel"><div class="focus"></div>${ordinary.map((x,i)=>`<button class="node ${x[1]}" data-i="${i}">${x[0]}</button>`).join('')}<button class="core" aria-label="暂停自动旋转"><b></b><small>点击暂停</small></button></div><div class="detail"><strong></strong><p></p><div class="maps"><div><small>属性映射</small><b></b></div><div><small>系统映射</small><b></b></div></div><button class="select-normal" aria-label="选入命槽">${icon.add}</button></div></div><div class="scrim"></div><section class="library" aria-hidden="true"><div class="lib-head"><div><b>神话总库</b><p>所有世界通用 · 可选一项或留空</p></div><button class="icon-btn close" aria-label="关闭总库">${icon.close}</button></div><div class="mythic-list">${mythics.map((m,i)=>`<button class="mythic-card ${i===0?'selected':''}" data-mi="${i}"><div><b>${m[0]}</b><p>${m[1]}</p></div><span>${i===0?'已携带':'选择'}</span></button>`).join('')}</div><div class="lib-foot"><small>不占用三个普通命槽</small><button class="icon-btn clear" aria-label="本局不携带">${icon.close}</button></div></section><footer class="bottom"><div class="bar"><button class="action" aria-label="返回">${icon.back}</button><span class="bottom-hint">神话传承可留空</span><button class="action primary" aria-label="确认命格">${icon.ok}</button></div></footer></div></div><div class="option-copy"><span class="tag">${v[0]} · ${v[2]}</span><h3>${v[1]}</h3><p>${v[3]}</p></div><p class="option-note">交互固定：4 秒顺时针轮转、顶部虚线框聚焦、中央名称切换暂停与继续。</p></article>`}
document.querySelector('#options').innerHTML=variants.map(phone).join('');
function bind(p){let active=0,paused=false,timer;const nodes=[...p.querySelectorAll('.node')],core=p.querySelector('.core'),detail=p.querySelector('.detail'),rgb={common:'var(--common)',fine:'var(--fine)',rare:'var(--rare)',epic:'var(--epic)',legendary:'var(--legendary)'};
 function draw(pulse=true){nodes.forEach((n,i)=>{const pos=(i-active+12)%12,a=(-90+pos*30)*Math.PI/180;n.style.left=(50+Math.cos(a)*42)+'%';n.style.top=(50+Math.sin(a)*42)+'%';n.classList.toggle('focused',i===active)});const x=ordinary[active],r=rgb[x[1]];core.style.setProperty('--rgb',r);core.querySelector('b').textContent=x[0];detail.style.setProperty('--rgb',r);detail.querySelector('strong').textContent=x[0];detail.querySelector('p').textContent=x[2];detail.querySelectorAll('.maps b')[0].textContent=x[3];detail.querySelectorAll('.maps b')[1].textContent=x[4];if(pulse){core.classList.remove('pulse');void core.offsetWidth;core.classList.add('pulse')}}
 function cycle(){active=(active+11)%12;draw()}function reset(){clearInterval(timer);if(!paused&&!matchMedia('(prefers-reduced-motion: reduce)').matches)timer=setInterval(cycle,4000)}draw(false);reset();
 nodes.forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();active=+n.dataset.i;draw();reset()}));core.addEventListener('click',e=>{e.stopPropagation();paused=!paused;core.querySelector('small').textContent=paused?'点击继续':'点击暂停';core.setAttribute('aria-label',paused?'继续自动旋转':'暂停自动旋转');reset()});
 p.querySelector('.select-normal').addEventListener('click',e=>{e.stopPropagation();const s=[...p.querySelectorAll('.slot')].find(x=>!x.classList.contains('filled'));if(s){s.classList.add('filled');s.innerHTML=`<b>${ordinary[active][0]}</b>`;p.querySelector('.count b').textContent=p.querySelectorAll('.slot.filled').length}});p.querySelectorAll('.slot').forEach((s,i)=>s.addEventListener('click',e=>{e.stopPropagation();if(s.classList.contains('filled')){s.classList.remove('filled');s.innerHTML=`<em>命槽 ${i+1}</em>`;p.querySelector('.count b').textContent=p.querySelectorAll('.slot.filled').length}}));
 const lib=p.querySelector('.library'),scrim=p.querySelector('.scrim'),open=()=>{lib.classList.add('open');scrim.classList.add('open');lib.setAttribute('aria-hidden','false')},close=()=>{lib.classList.remove('open');scrim.classList.remove('open');lib.setAttribute('aria-hidden','true')};p.querySelector('.open-library').onclick=e=>{e.stopPropagation();open()};p.querySelector('.close').onclick=e=>{e.stopPropagation();close()};scrim.onclick=e=>{e.stopPropagation();close()};p.querySelectorAll('.mythic-card').forEach(c=>c.onclick=e=>{e.stopPropagation();const m=mythics[+c.dataset.mi];p.querySelector('[data-mythic-name]').textContent=m[0];p.querySelector('[data-mythic-summary]').textContent=m[1];p.querySelectorAll('.mythic-card').forEach(x=>x.classList.toggle('selected',x===c));close()});p.querySelector('.clear').onclick=e=>{e.stopPropagation();p.querySelector('[data-mythic-name]').textContent='本局不携带';p.querySelector('[data-mythic-summary]').textContent='你可以从跨世界总库重新选择一项传承。';p.querySelectorAll('.mythic-card').forEach(x=>x.classList.remove('selected'));close()};p.addEventListener('click',e=>e.stopPropagation())}
document.querySelectorAll('.phone').forEach(bind);
</script></body></html>
