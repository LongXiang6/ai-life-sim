      {id:'S1',cls:'s1',name:'清晰星名',tag:'clear constellation',desc:'十二个名称保持接近同等可见度，压缩光晕融合并提高灰、绿词条对比；信息最完整。',kicker:'星名观测'},
      {id:'S2',cls:'s2',name:'天顶聚焦',tag:'zenith focus',desc:'非焦点星位主动降权，天顶焦点扩大并加强详情呼应；当前选项主次最明确。',kicker:'天顶命格'},
      {id:'S3',cls:'s3',name:'经轴导读',tag:'meridian guide',desc:'以克制的云紫观测经轴串联天顶、星核与详情，建立连续的信息阅读路径。',kicker:'经轴所指'}
    ];
    function nameHtml(name){return name.length===4?`${name.slice(0,2)}<br>${name.slice(2)}`:name}
    function phone(v){return `<article class="option-card" data-choice="${v.id} ${v.name}" onclick="selectChoice(this)"><div class="phone ${v.cls}"><div class="screen"><header class="head"><div class="step">NEW LIFE · 05</div><div class="head-row"><h4>选择命格</h4><span class="count"><b>0</b> / 3</span></div></header><div class="contracts">${[1,2,3].map(i=>`<button class="contract" aria-label="普通命槽 ${i}，空"><small>星契 0${i}</small></button>`).join('')}</div><div class="mythic-rail"><span class="mythic-glyph"><i></i></span><div class="rail-copy"><b data-mythic-name>${mythics[0][0]}</b><p data-mythic-summary>${mythics[0][1]}</p></div><button class="mythic-trigger open-library" aria-label="打开神话总库">${svg.library}</button></div><div class="utility"><span class="utility-label">十二星位 · 天顶观测</span><button class="icon reroll" aria-label="重排待选命格">${svg.shuffle}</button></div><div class="content"><div class="astrolabe"><div class="cloud"><i class="layer l5"></i><i class="layer l4"></i><i class="layer l3"></i><i class="layer l2"></i><i class="layer l1"></i></div><div class="orbit"></div><div class="inner"></div><div class="stars"></div><div class="meridian"></div><div class="zenith"></div>${ordinary.map((x,i)=>`<button class="celestial ${x.rarity}" data-i="${i}" aria-label="查看命格：${x.name}"><span aria-hidden="true">${nameHtml(x.name)}</span></button>`).join('')}<button class="core" aria-label="暂停星盘轮转"><b></b></button></div><div class="detail"><span class="detail-kicker">${v.kicker}</span><strong></strong><p></p><div class="maps"><div><small>属性映射</small><b></b></div><div><small>系统映射</small><b></b></div></div><button class="add" aria-label="将当前命格加入普通命槽">${svg.add}</button></div></div><div class="scrim"></div><section class="library" aria-hidden="true" aria-label="神话总库"><div class="lib-head"><div><b>神话总库</b><p>跨世界共用 · 本局可留空</p></div><button class="lib-close" aria-label="关闭神话总库">${svg.close}</button></div><div class="mythic-list">${mythics.map((m,i)=>`<button class="mythic-card ${i===0?'selected':''}" data-mi="${i}" aria-label="${i===0?'当前神话传承：':'选择神话传承：'}${m[0]}" aria-pressed="${i===0}"><div><b>${m[0]}</b><p>${m[1]}</p></div><span class="mark" aria-hidden="true">${idle}${check}</span></button>`).join('')}</div><div class="lib-foot"><small>独立于三个普通星契</small><button class="clear-mythic" aria-label="清空本局神话传承">${svg.clear}</button></div></section><footer class="bottom"><div class="footer"><button class="footer-btn secondary" aria-label="返回上一步">${svg.back}</button><span class="footer-hint">完成命格选择</span><button class="footer-btn primary confirm" aria-label="确认命格选择" disabled>${svg.ok}<span>确认</span></button></div></footer></div></div><div class="option-copy"><span class="tag">${v.id} · ${v.tag}</span><h3>${v.name}</h3><p>${v.desc}</p></div><p class="option-note">共同基线：R3 星核稳定保留，十二个词条沿轨道顺时针轮转；稀有度仅影响节点光源与详情强调，中心始终保持云紫。</p></article>`}
    document.querySelector('#options').innerHTML=variants.map(phone).join('');
    function bind(phone){
      let active=0,paused=false,timer;
      const nodes=[...phone.querySelectorAll('.celestial')],core=phone.querySelector('.core'),detail=phone.querySelector('.detail'),slots=[...phone.querySelectorAll('.contract')];
      const rgb={common:'var(--common)',fine:'var(--fine)',rare:'var(--rare)',epic:'var(--epic)',legendary:'var(--legendary)'};
      function pulse(){core.classList.remove('pulse');void core.offsetWidth;core.classList.add('pulse')}
      function draw(animate=true){
        nodes.forEach((node,i)=>{const pos=(i-active+12)%12;const angle=(-90+pos*30)*Math.PI/180;node.style.setProperty('--x',Math.cos(angle)*104+'px');node.style.setProperty('--y',Math.sin(angle)*104+'px');node.classList.toggle('focused',i===active)});
        const item=ordinary[active],rarity=rgb[item.rarity];core.querySelector('b').textContent=item.name;detail.style.setProperty('--rgb',rarity);detail.querySelector('strong').textContent=item.name;detail.querySelector('p').textContent=item.copy;detail.querySelectorAll('.maps b')[0].textContent=item.attr;detail.querySelectorAll('.maps b')[1].textContent=item.system;
        if(animate)pulse();
      }
      function cycle(){active=(active+11)%12;draw()}
      function resetTimer(){clearInterval(timer);if(!paused)timer=setInterval(cycle,4000)}
      function count(){const amount=slots.filter(slot=>slot.classList.contains('filled')).length;phone.querySelector('.count b').textContent=amount;phone.querySelector('.confirm').disabled=amount===0}
      draw(false);resetTimer();
      nodes.forEach(node=>node.addEventListener('click',event=>{event.stopPropagation();active=Number(node.dataset.i);draw();resetTimer()}));
      core.addEventListener('click',event=>{event.stopPropagation();paused=!paused;core.classList.toggle('paused',paused);core.setAttribute('aria-label',paused?'继续星盘轮转':'暂停星盘轮转');resetTimer()});
      phone.querySelector('.reroll').addEventListener('click',event=>{event.stopPropagation();active=(active+7)%12;draw();resetTimer()});
      phone.querySelector('.add').addEventListener('click',event=>{event.stopPropagation();const item=ordinary[active];if(slots.some(slot=>slot.dataset.name===item.name))return;const slot=slots.find(candidate=>!candidate.classList.contains('filled'));if(!slot)return;slot.classList.add('filled');slot.dataset.name=item.name;slot.style.setProperty('--slot',rgb[item.rarity]);slot.innerHTML=`<small>已签订</small><b>${item.name}</b>`;slot.setAttribute('aria-label',`移除普通命格：${item.name}`);count()});
      slots.forEach((slot,i)=>slot.addEventListener('click',event=>{event.stopPropagation();if(!slot.classList.contains('filled'))return;slot.classList.remove('filled');delete slot.dataset.name;slot.style.removeProperty('--slot');slot.innerHTML=`<small>星契 0${i+1}</small>`;slot.setAttribute('aria-label',`普通命槽 ${i+1}，空`);count()}));
      const library=phone.querySelector('.library'),scrim=phone.querySelector('.scrim');
      const openLibrary=()=>{library.classList.add('open');scrim.classList.add('open');library.setAttribute('aria-hidden','false')};
      const closeLibrary=()=>{library.classList.remove('open');scrim.classList.remove('open');library.setAttribute('aria-hidden','true')};
      phone.querySelector('.open-library').addEventListener('click',event=>{event.stopPropagation();openLibrary()});phone.querySelector('.lib-close').addEventListener('click',event=>{event.stopPropagation();closeLibrary()});scrim.addEventListener('click',event=>{event.stopPropagation();closeLibrary()});
      phone.querySelectorAll('.mythic-card').forEach(card=>card.addEventListener('click',event=>{event.stopPropagation();const item=mythics[Number(card.dataset.mi)];phone.querySelector('[data-mythic-name]').textContent=item[0];phone.querySelector('[data-mythic-summary]').textContent=item[1];phone.querySelectorAll('.mythic-card').forEach(candidate=>{const selected=candidate===card;candidate.classList.toggle('selected',selected);candidate.setAttribute('aria-pressed',String(selected))});closeLibrary()}));
      phone.querySelector('.clear-mythic').addEventListener('click',event=>{event.stopPropagation();phone.querySelector('[data-mythic-name]').textContent='本局不携带';phone.querySelector('[data-mythic-summary]').textContent='仍可从跨世界总库选择一项神话传承。';phone.querySelectorAll('.mythic-card').forEach(card=>{card.classList.remove('selected');card.setAttribute('aria-pressed','false')});closeLibrary()});
      phone.addEventListener('click',event=>event.stopPropagation());
    }
    document.querySelectorAll('.phone').forEach(bind);
  </script>
</body>
</html>
