          <div class="candidate-list" data-candidates aria-live="polite"></div>
        </div>
        <footer class="cf-footer"><button class="cf-back" type="button" data-flow-to="talent-draw" aria-label="返回命格抽取" title="返回命格抽取"><span data-icon="back"></span></button><button class="cf-next" type="button" data-flow-to="attribute-alloc" disabled><span class="cf-next-number">06</span><span class="cf-next-copy"><strong>确认命格</strong><small data-selection-status>还需选择 3 条普通命格</small></span><span class="cf-next-arrow" data-icon="arrow"></span></button></footer>
        <div class="rebirth-sheet" data-rebirth-sheet aria-hidden="true"><button class="rebirth-sheet-backdrop" type="button" data-close-rebirth-sheet aria-label="关闭转世天赋选择"></button><section class="rebirth-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="rebirth-sheet-title"><header class="rebirth-sheet-head"><div><p>转世天赋</p><strong id="rebirth-sheet-title" data-rebirth-sheet-title>选择转世天赋</strong></div><button class="rebirth-sheet-close" type="button" data-close-rebirth-sheet aria-label="关闭转世天赋选择" title="关闭">×</button></header><div class="rebirth-options" data-rebirth-options aria-label="转世天赋选择"></div></section></div>
        <div class="cf-toast" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <script>
    (function () {
      const candidates = [
        { name: '冷静', rarity: '普通', copy: '危机里更容易维持清晰判断。', attrBonus: { mind: 1 } },
        { name: '坚韧体魄', rarity: '精良', copy: '长期劳作与恢复更容易维持节律。', attrBonus: { physique: 1 } },
        { name: '察言观色', rarity: '精良', copy: '更容易分辨交谈中的真实态度。', attrBonus: { charisma: 1 } },
        { name: '见微知命', rarity: '稀有', copy: '事件中的细小征兆更容易显露。', attrBonus: { mind: 2 }, systemModifiers: { luckPointModifier: 1.06 } },
        { name: '工匠之手', rarity: '稀有', copy: '重复练习更容易转化为可靠技艺。', attrBonus: { talentAptitude: 2, mind: 1 }, systemModifiers: { incomeModifier: 1.07 } },
        { name: '长途行者', rarity: '稀有', copy: '陌生环境与连续奔波更容易适应。', attrBonus: { physique: 1, talentAptitude: 1 }, systemModifiers: { staminaRecoveryModifier: 1.07 } },
        { name: '雨幕听心', rarity: '史诗', copy: '未说出口的情绪更容易被你辨认。', attrBonus: { mind: 2, charisma: 1 }, systemModifiers: { luckPointModifier: 1.1, hpRecoveryModifier: 1.08, socialMobilityModifier: 1.06 } },
        { name: '不燃之烬', rarity: '史诗', copy: '逆境中仍保有再次生长的余温。', attrBonus: { physique: 2, talentAptitude: 1 }, systemModifiers: { hpRecoveryModifier: 1.12, attributeDecayModifier: 0.92, disasterFrequencyModifier: 0.94 } },
        { name: '山海余响', rarity: '史诗', copy: '古老地域会留下可追寻的回声。', attrBonus: { mind: 2, charisma: 1 }, systemModifiers: { staminaRecoveryModifier: 1.1, luckPointModifier: 1.08, migrationRateModifier: 1.08 } },
        { name: '概率偏斜', rarity: '传世', copy: '重大风险更容易留下可以争取的转机。', attrBonus: { talentAptitude: 3, charisma: 1 }, systemModifiers: { luckPointModifier: 1.18, breakthroughChanceModifier: 1.12, deathRateModifier: 0.92, techProgressModifier: 1.1 } },
        { name: '警觉过载', rarity: '稀有', copy: '细节判断更敏锐，但难以轻易放松。', attrBonus: { mind: 2, charisma: -1 }, systemModifiers: { breakthroughChanceModifier: 1.06 } },
        { name: '逆风拓荒', rarity: '史诗', copy: '愿意承担压力开拓新路，但恢复需要更谨慎。', attrBonus: { talentAptitude: 2, physique: -1 }, systemModifiers: { incomeModifier: 1.12, staminaRecoveryModifier: 0.94, migrationRateModifier: 1.1 } },
      ]
      const attrLabels = { physique: '体魄', mind: '心智', talentAptitude: '悟性', charisma: '魅力' }
      const modifierLabels = { luckPointModifier: '气运获取', hpRecoveryModifier: '生命恢复', staminaRecoveryModifier: '体力恢复', breakthroughChanceModifier: '突破成功率', incomeModifier: '收入获得', attributeDecayModifier: '属性衰减', socialMobilityModifier: '社会流动', disasterFrequencyModifier: '灾害频率', migrationRateModifier: '迁徙机会', deathRateModifier: '死亡风险', techProgressModifier: '技术进展' }
      const rebirths = [
        { name: '长夜见灯', effect: '在困顿阶段更容易发现可行动的转机，并保留一次重整方向的机会。', bonus: '气运获取 +' },
        { name: '未竟之愿', effect: '前世未完成的重要目标会化作微弱指引，帮助你辨认与它相关的人和事件。', bonus: '突破成功率 +' },
        { name: '凡心不灭', effect: '经历重大得失后仍能较快恢复稳定，关键关系不易因一时动摇而彻底失去。', bonus: '生命恢复 +' },
      ]
      const slots = Array.from(document.querySelectorAll('[data-slot]'))
      const rebirthSlots = Array.from(document.querySelectorAll('[data-rebirth-slot]'))
      const next = document.querySelector('.cf-next')
      const status = document.querySelector('[data-selection-status]')
      const count = document.querySelector('[data-slot-count]')
      const candidateHost = document.querySelector('[data-candidates]')
      const candidateCount = document.querySelector('[data-candidate-count]')
      const rebirthCount = document.querySelector('[data-rebirth-count]')
      const rebirthOptions = document.querySelector('[data-rebirth-options]')
      const rebirthSheet = document.querySelector('[data-rebirth-sheet]')
      const rebirthSheetTitle = document.querySelector('[data-rebirth-sheet-title]')
      let ordinary = candidates.slice(0, 12).map(function (item) { return Object.assign({}, item) })
      let rebirthTarget = 0
      let redrawRound = 0

      function selectedNames() { return new Set(slots.map(function (slot) { return slot.dataset.name }).filter(Boolean)) }
      function formatAttrBonuses(item) {
        return Object.entries(item.attrBonus || {}).map(function (entry) {
          const key = entry[0]; const value = Number(entry[1]); if (!value) return ''
          return `${attrLabels[key] || key} ${value > 0 ? '+' : '−'}`
        }).filter(Boolean)
      }
      function formatSystemModifiers(item) {
        return Object.entries(item.systemModifiers || {}).map(function (entry) {
          const key = entry[0]; const value = Number(entry[1]); const delta = Math.round((value - 1) * 100)
          return `${modifierLabels[key] || key} ${delta >= 0 ? '+' : '−'}`
        })
      }
      function renderCandidateEffects(item) {
        const attrs = formatAttrBonuses(item).map(function (label) { return `<span class="candidate-effect">${label}</span>` })
        const systems = formatSystemModifiers(item).map(function (label) { return `<span class="candidate-effect system">${label}</span>` })
        return attrs.concat(systems).join('') || '<span class="candidate-effect">叙事规则</span>'
      }
      function renderSlotBonuses(effects) {
        return `<span class="slot-bonuses">${effects.map(function (label) { return `<span class="slot-bonus">${label}</span>` }).join('')}</span>`
      }
      function renderSlot(slot, item) {
        if (!item) { delete slot.dataset.name; delete slot.dataset.rarity; slot.className = 'ordinary-slot'; slot.innerHTML = `<strong>待选择</strong><span class="slot-placeholder">从候选中选择</span>`; return }
        const bonuses = formatAttrBonuses(item).concat(formatSystemModifiers(item))
        slot.dataset.name = item.name; slot.dataset.rarity = item.rarity; slot.className = 'ordinary-slot is-filled'; slot.innerHTML = `<strong>${item.name}</strong><span class="slot-description">${item.copy}</span>${renderSlotBonuses(bonuses)}`
      }
      function renderRebirthSlot(slot, item) {
        if (!item) { delete slot.dataset.name; slot.className = 'rebirth-slot'; slot.innerHTML = `<strong>待选择</strong><span class="slot-placeholder">选择传承</span>`; return }
        slot.dataset.name = item.name; slot.className = 'rebirth-slot is-filled'; slot.innerHTML = `<strong>${item.name}</strong><span class="slot-description">${item.effect}</span>${renderSlotBonuses([item.bonus])}`
      }
      function selectedTalentItems() {
        return slots.map(function (slot) { return candidates.find(function (item) { return item.name === slot.dataset.name }) }).filter(Boolean)
      }
      function selectedRebirthItems() {
        return rebirthSlots.map(function (slot) {
          return rebirths.find(function (item) { return item.name === slot.dataset.name })
        }).filter(Boolean)
      }
      function update() {
        const amount = selectedNames().size
        const selectedRebirths = selectedRebirthItems()
        rebirthCount.textContent = `${selectedRebirths.length} / 2`
        count.textContent = `${amount} / 3`
        const remaining = 3 - amount
        next.disabled = remaining !== 0
        next.setAttribute('aria-label', remaining ? `还需选择${remaining}条普通命格` : '确认命格并进入属性分配')
        status.textContent = remaining ? `还需选择 ${remaining} 条普通命格` : '三条普通命格已选择 · 进入属性分配'
        if (window.PrototypeFlow) PrototypeFlow.state.write({ talents: selectedTalentItems(), rebirths: selectedRebirths, rebirth: selectedRebirths[0] || null })
        renderCandidates()
      }
      function renderCandidates() {
        const chosen = selectedNames()
        candidateCount.textContent = `${ordinary.length} 条`
        candidateHost.innerHTML = ordinary.map(function (item, index) {
          const selected = chosen.has(item.name)
          return `<button class="candidate${selected ? ' is-selected' : ''}" type="button" data-candidate="${index}" data-rarity="${item.rarity}" ${selected ? 'aria-disabled="true"' : ''}><span class="candidate-copy"><strong>${item.name}</strong><span class="candidate-description">${item.copy}</span><span class="candidate-effects">${renderCandidateEffects(item)}</span></span><span class="candidate-rarity">${item.rarity}</span></button>`
        }).join('')
      }
      function renderRebirths() {
        const used = new Set(rebirthSlots.map(function (slot) { return slot.dataset.name }).filter(Boolean))
        rebirthOptions.innerHTML = rebirths.map(function (item, index) { return `<button class="rebirth-option" type="button" data-rebirth="${index}" ${used.has(item.name) ? 'disabled' : ''}><small>转世天赋</small><strong>${item.name}</strong><span>${item.effect}</span></button>` }).join('')
      }
      candidateHost.addEventListener('click', function (event) {
        const button = event.target.closest('[data-candidate]')
        if (!button || button.getAttribute('aria-disabled') === 'true') return
        const item = ordinary[Number(button.dataset.candidate)]
        const slot = slots.find(function (current) { return !current.dataset.name })
        if (!slot) { CreationFlow.notify('三个普通命格槽已满'); return }
        renderSlot(slot, item); update()
      })
      slots.forEach(function (slot) { slot.addEventListener('click', function () { if (!slot.dataset.name) return; const name = slot.dataset.name; renderSlot(slot, null); update(); CreationFlow.notify(`已移除${name}`) }) })
      document.querySelector('[data-reroll]').addEventListener('click', function () {
        const locked = selectedNames(); redrawRound += 1
        const unlocked = candidates.filter(function (item) { return !locked.has(item.name) })
        const offset = unlocked.length ? redrawRound % unlocked.length : 0
        const reordered = unlocked.slice(offset).concat(unlocked.slice(0, offset))
        let cursor = 0
        ordinary = ordinary.map(function (item) { return locked.has(item.name) ? item : Object.assign({}, reordered[cursor++]) })
        update(); CreationFlow.notify('已重抽未选择的命格')
      })
      function closeRebirthSheet() { rebirthSheet.classList.remove('is-open'); rebirthSheet.setAttribute('aria-hidden', 'true') }
      rebirthSlots.forEach(function (slot) { slot.addEventListener('click', function () { rebirthTarget = Number(slot.dataset.rebirthSlot); rebirthSheetTitle.textContent = `选择转世 ${String(rebirthTarget + 1).padStart(2, '0')}`; renderRebirths(); rebirthSheet.classList.add('is-open'); rebirthSheet.setAttribute('aria-hidden', 'false') }) })
      rebirthOptions.addEventListener('click', function (event) {
        const button = event.target.closest('[data-rebirth]'); if (!button) return
        const item = rebirths[Number(button.dataset.rebirth)]; renderRebirthSlot(rebirthSlots[rebirthTarget], item); closeRebirthSheet(); renderRebirths(); update(); CreationFlow.notify(`转世天赋 · ${item.name}`)
      })
      document.querySelectorAll('[data-close-rebirth-sheet]').forEach(function (button) { button.addEventListener('click', closeRebirthSheet) })
      document.addEventListener('DOMContentLoaded', function () {
        const flow = PrototypeFlow.state.read()
        const storedTalents = Array.isArray(flow.talents) ? flow.talents : []
        slots.forEach(function (slot, index) {
          const stored = storedTalents[index]
          const item = stored && candidates.find(function (candidate) { return candidate.name === stored.name })
          renderSlot(slot, item || null)
        })
        const storedRebirths = Array.isArray(flow.rebirths) ? flow.rebirths : flow.rebirth ? [flow.rebirth] : []
        rebirthSlots.forEach(function (slot, index) {
          const stored = storedRebirths[index]
          const item = stored && rebirths.find(function (candidate) { return candidate.name === stored.name })
          renderRebirthSlot(slot, item || null)
        })
        renderRebirths()
        update()
      }, { once: true })
      renderRebirths(); update()
    })()
  </script>
</body>
</html>
