<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色创建 · 最终首版 · Pi C 青绿身份簿</title><link rel="stylesheet" href="../assets/library-history.css">
  <link rel="stylesheet" href="../assets/library.css"><script src="../assets/prototype.js" defer></script><style>
:root{--canvas:#f3f1ec;--paper:#fbfaf7;--surface:#fffefd;--ink:#292724;--soft:#6e6961;--faint:#9a9389;--line:#d9d3c9;--light:#e9e5de;--mist:#9ca9ac}*{box-sizing:border-box}body{background:var(--canvas);color:var(--ink)}button,input,textarea,select{font:inherit}.shell{width:min(900px,calc(100% - 24px));padding:18px 0 42px}.topbar{margin-bottom:18px;color:var(--soft);font-size:12px}.eyebrow{color:var(--soft)}h1{font-family:"Songti SC","STSong","SimSun",serif;font-size:28px}.subtitle{color:var(--soft);font-size:12px}.stage{display:grid;justify-items:center;margin-top:18px}.phone{width:min(292px,calc(100vw - 32px));height:692px;margin:0;border-color:var(--line);background:var(--paper);box-shadow:0 13px 30px rgba(62,55,44,.075)}.screen{height:100%;overflow:auto;padding:22px 15px 72px}.step{color:var(--faint);font-size:7px;font-weight:700;letter-spacing:.16em}.title{margin-top:6px;font-family:"Songti SC","STSong","SimSun",serif;font-size:20px;font-weight:600}.sub{margin-top:5px;color:var(--soft);font-size:8px;line-height:1.55}.summary{display:grid;grid-template-columns:35px 1fr;gap:9px;margin-top:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}.avatar{display:grid;width:35px;height:35px;place-items:center;border:1px solid var(--line);border-radius:50%;font-family:"Songti SC",serif}.summary b{font-family:"Songti SC",serif;font-size:10px;font-weight:600}.summary p{margin:3px 0 0;color:var(--soft);font-size:6px}.facts{display:grid;grid-column:1/-1;grid-template-columns:repeat(3,1fr);gap:5px}.fact{padding-top:6px;border-top:1px solid var(--light)}.fact b,.fact span{display:block}.fact b{font-family:inherit;font-size:6px}.fact span{margin-top:2px;color:var(--faint);font-size:5px}.section-label{display:flex;justify-content:space-between;margin:13px 0 6px;color:var(--soft);font-size:7px}.section-label span:last-child{color:var(--faint);font-size:6px}.groups{border-top:1px solid var(--line)}.group{padding:9px 0;border-bottom:1px solid var(--light)}.group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.group-head span{font-family:"Songti SC",serif;font-size:8px}.group-head b{color:var(--faint);font-size:5px;font-weight:500}.input-row{display:grid;grid-template-columns:1fr 52px;gap:6px}.field{width:100%;height:33px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:7px;outline:none}.random{height:33px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--soft);font-size:7px}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{min-height:30px;padding:0 10px;border:1px solid var(--light);border-radius:8px;background:transparent;color:var(--soft);font-size:7px}.chip.active{border-color:var(--mist);background:var(--surface);color:var(--ink);box-shadow:inset 0 -2px 0 var(--mist)}.caption{margin-top:6px;color:var(--faint);font-size:5px}.life-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.life-grid label{color:var(--faint);font-size:5px}.life-grid select,.life-grid input{margin-top:4px}.background{height:56px;padding:8px;resize:none;line-height:1.45}.bottom{position:absolute;right:0;bottom:0;left:0;padding:7px 15px 10px;border-top:1px solid var(--line);background:rgba(251,250,247,.95);backdrop-filter:blur(10px)}.bar{display:flex;justify-content:space-between}.action{width:64px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--soft);font-size:7px}.primary{width:112px;border-color:var(--ink);background:var(--ink);color:var(--surface);font-family:"Songti SC",serif;font-size:9px}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>  <link rel="stylesheet" href="round-05-pi-c.css">
</head><body data-screen="character-create" data-pi-variant="C"><a class="pi-history-back" href="index.html">← Pi C · 青绿身份簿</a><main class="shell"><div class="topbar"><span>移动端创建流程</span><span>03 / 06</span></div><p class="eyebrow">CHARACTER CREATE · FINAL V1</p><h1>角色创建</h1><p class="subtitle">沿用 N2A 的同色轻分组与角色档案摘要，补齐寿命、起始年龄和人生背景的可操作字段。</p><section class="stage"><div class="phone"><div class="screen"><div class="step">NEW LIFE · 03</div><div class="title">塑造你的角色</div><div class="sub">先完成核心身份，再补充寿命与人生背景。</div><section class="summary" aria-live="polite"><div class="avatar">人</div><div><b class="summary-name">未命名角色</b><p class="summary-line">男性 · 人类 · 尚未填写背景</p></div><div class="facts"><div class="fact"><b>寿命</b><span class="summary-life">80 年</span></div><div class="fact"><b>起始</b><span class="summary-age">出生</span></div><div class="fact"><b>世界</b><span>现代地球</span></div></div></section><div class="section-label"><span>核心身份</span><span>必填</span></div><div class="groups"><section class="group"><div class="group-head"><span>角色姓名</span><b>可随机</b></div><div class="input-row"><input class="field name" placeholder="输入角色姓名…" aria-label="角色姓名"><button class="random" type="button">随机</button></div></section><section class="group choice" data-kind="gender"><div class="group-head"><span>性别</span><b>更多选择</b></div><div class="chips"><button class="chip active" data-value="男性">男</button><button class="chip" data-value="女性">女</button><button class="chip" data-value="自定义性别">自定义</button></div></section><section class="group choice" data-kind="race"><div class="group-head"><span>种族</span><b>种族目录</b></div><div class="chips"><button class="chip active" data-value="人类">人类</button><button class="chip" data-value="自定义种族">自定义种族</button></div><div class="caption">人类 · 基础寿命约 80 年</div></section></div><div class="section-label"><span>寿命与背景</span><span>完整字段</span></div><div class="life-grid"><label>预期寿命<input class="field lifespan" type="number" min="1" value="80"></label><label>起始年龄<select class="field age"><option value="出生">出生</option><option value="18 岁">18 岁</option><option value="自定义">自定义</option></select></label></div><textarea class="field background" aria-label="人生背景" placeholder="写下家庭、成长环境或人生起点…"></textarea></div><footer class="bottom"><div class="bar"><button class="action" data-flow-to="world-customize" data-flow-back>返回</button><button class="action primary" data-flow-to="talent-draw">确认角色</button></div></footer></div></section></main>
<script>
const names=['林晚舟','沈清衡','顾星河','叶知秋','苏明远','陈予安'];let ni=0,gender='男性',race='人类';const name=document.querySelector('.name'),bg=document.querySelector('.background'),life=document.querySelector('.lifespan'),age=document.querySelector('.age');function update(){document.querySelector('.summary-name').textContent=name.value.trim()||'未命名角色';document.querySelector('.summary-line').textContent=gender+' · '+race+' · '+(bg.value.trim()?'已填写背景':'尚未填写背景');document.querySelector('.summary-life').textContent=(life.value||80)+' 年';document.querySelector('.summary-age').textContent=age.value}document.querySelector('.random').onclick=()=>{name.value=names[ni++%names.length];update()};[name,bg,life,age].forEach(x=>x.addEventListener('input',update));document.querySelectorAll('.choice').forEach(group=>group.querySelectorAll('.chip').forEach(chip=>chip.onclick=()=>{group.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));chip.classList.add('active');if(group.dataset.kind==='gender')gender=chip.dataset.value;else{race=chip.dataset.value;document.querySelector('.caption').textContent=race==='人类'?'人类 · 基础寿命约 80 年':'自定义种族 · 寿命待设定'}update()}));
</script></body></html>
