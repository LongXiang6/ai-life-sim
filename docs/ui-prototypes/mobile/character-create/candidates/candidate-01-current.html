<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>角色塑造 · 第一轮候选 01 · 当前基线</title>
  <style>
    /* Purpose: Static interactive prototype: reproduce the current runtime character-create baseline (blue-white paper, serif title, blue-violet accent) for comparison. Owner: Interface system. Responsibility: Candidate only; pure DOM interaction, no localStorage/sessionStorage/fetch. */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #eef1f7;
      color: #28324b;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      position: relative;
      isolation: isolate;
      display: grid;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      place-items: stretch;
      color-scheme: light;
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    @media (min-width: 48rem) {
      .viewport {
        width: min(100%, 30rem);
      }
    }

    .page {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scrollbar-width: none;
      background: #eef1f7;
      color: #28324b;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    }

    .page::-webkit-scrollbar {
      display: none;
    }

    .paper {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100%;
      padding: 15px 16px 86px;
      border: 1px solid #d8deea;
      border-radius: 26px;
      background: linear-gradient(135deg, rgba(255, 215, 95, 0.1) 0%, rgba(255, 215, 95, 0) 34%), linear-gradient(#fafbff, #f2f4f9);
    }

    .runningHead {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      color: #929bb0;
      font-size: 8.5px;
      font-weight: 650;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .header {
      margin-bottom: 10px;
    }

    .header h1 {
      margin: 0;
      color: #28324b;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.2;
    }

    .header p {
      display: none;
    }

    .profileSummary {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #d8deea;
      border-radius: 18px;
      background: #fff;
    }

    .profileAvatar {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border-radius: 50%;
      background: #edf0fb;
      color: #7382bb;
      font-size: 20px;
      font-weight: 700;
    }

    .profileCopy {
      min-width: 0;
    }

    .profileCopy strong {
      display: block;
      color: #28324b;
      font-size: 15px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .profileCopy span {
      display: block;
      margin-top: 3px;
      color: #707b92;
      font-size: 11px;
      line-height: 1.4;
    }

    .profileFacts {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 4px;
    }

    .profileFacts div {
      display: grid;
      gap: 2px;
      padding: 8px;
      border-radius: 12px;
      background: #f1f3fa;
    }

    .profileFacts span {
      color: #929bb0;
      font-size: 9px;
    }

    .profileFacts strong {
      color: #28324b;
      font-size: 12px;
      font-weight: 700;
    }

    .section {
      margin-bottom: 12px;
      padding: 13px 14px;
      border: 1px solid #d8deea;
      border-radius: 18px;
      background: #fff;
    }

    .sectionHeading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .sectionHeading h2 {
      margin: 0;
      color: #28324b;
      font-size: 14px;
      font-weight: 700;
    }

    .sectionHeading h2 .semantic-emoji {
      margin-right: 4px;
      font-size: 13px;
    }

    .sectionHeading span {
      color: #929bb0;
      font-size: 10px;
    }

    .softGroup {
      margin-bottom: 12px;
    }

    .softGroup:last-child {
      margin-bottom: 0;
    }

    .groupHeading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .groupHeading label,
    .groupHeading span {
      color: #28324b;
      font-size: 11.5px;
      font-weight: 600;
    }

    .groupHeading > span {
      color: #929bb0;
      font-size: 9.5px;
      font-weight: 400;
    }

    .groupHeading button {
      padding: 0;
      border: 0;
      background: transparent;
      color: #7382bb;
      font: inherit;
      font-size: 10px;
      cursor: pointer;
    }

    .nameRow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .nameRow input,
    .inlineInputRow input {
      width: 100%;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid #d8deea;
      border-radius: 12px;
      background: #fafbff;
      color: #28324b;
      font: inherit;
      font-size: 12px;
    }

    .nameRow button {
      min-width: 56px;
      border: 1px solid #d8deea;
      border-radius: 12px;
      background: #edf0fb;
      color: #7382bb;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .chipRow {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chipRow button,
    .removableChip button {
      min-height: 28px;
      padding: 0 12px;
      border: 1px solid #d8deea;
      border-radius: 14px;
      background: #fafbff;
      color: #707b92;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    .chipRow button.chipActive {
      border-color: #7382bb;
      background: #edf0fb;
      color: #28324b;
      font-weight: 700;
    }

    .inlinePanel {
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #d8deea;
      border-radius: 12px;
      background: #f1f3fa;
    }

    .inlineInputRow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .inlineInputRow button {
      min-width: 52px;
      border: 1px solid #d8deea;
      border-radius: 12px;
      background: #edf0fb;
      color: #7382bb;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .groupCaption {
      margin: 6px 0 0;
      color: #707b92;
      font-size: 10.5px;
    }

    .lifespanFields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr)) auto;
      align-items: end;
      gap: 8px;
    }

    .lifespanFields label {
      display: grid;
      gap: 4px;
    }

    .lifespanFields label span {
      color: #707b92;
      font-size: 9.5px;
    }

    .lifespanFields input {
      width: 100%;
      min-height: 34px;
      padding: 0 9px;
      border: 1px solid #d8deea;
      border-radius: 12px;
      background: #fafbff;
      color: #28324b;
      font: inherit;
      font-size: 12px;
    }

    .lifespanFields button {
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid #d8deea;
      border-radius: 12px;
      background: #edf0fb;
      color: #7382bb;
      font: inherit;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .lifespanResult {
      margin: 10px 0 0;
      color: #707b92;
      font-size: 11px;
    }

    .lifespanResult strong {
      color: #28324b;
      font-weight: 700;
    }

    .backgroundTextarea {
      width: 100%;
      min-height: 84px;
      padding: 9px 10px;
      border: 1px solid #d8deea;
      border-radius: 12px;
      background: #fafbff;
      color: #28324b;
      font: inherit;
      font-size: 12px;
      line-height: 1.5;
      resize: none;
    }

    .backgroundPresets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .backgroundPresetWrap {
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .backgroundPresetWrap button:first-child {
      min-height: 26px;
      padding: 0 10px;
      border: 1px solid #d8deea;
      border-radius: 13px;
      background: #fafbff;
      color: #707b92;
      font: inherit;
      font-size: 10.5px;
      cursor: pointer;
    }

    .backgroundPresetWrap button.backgroundPresetActive {
      border-color: #7382bb;
      background: #edf0fb;
      color: #28324b;
      font-weight: 700;
    }

    .backgroundPresetWrap .removePreset {
      width: 18px;
      height: 18px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #929bb0;
      font-size: 12px;
      cursor: pointer;
      line-height: 1;
    }

    .backgroundFooter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }

    .backgroundFooter > span {
      color: #929bb0;
      font-size: 9.5px;
    }

    .backgroundFooter > button {
      padding: 4px 10px;
      border: 1px solid #d8deea;
      border-radius: 12px;
      background: transparent;
      color: #7382bb;
      font: inherit;
      font-size: 10.5px;
      cursor: pointer;
    }

    .presetSaveForm {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 6px;
    }

    .presetSaveForm input {
      width: 100%;
      min-height: 30px;
      padding: 0 8px;
      border: 1px solid #d8deea;
      border-radius: 10px;
      background: #fafbff;
      color: #28324b;
      font: inherit;
      font-size: 10.5px;
    }

    .presetSaveForm button {
      padding: 0 10px;
      border: 1px solid #d8deea;
      border-radius: 10px;
      background: #edf0fb;
      color: #7382bb;
      font: inherit;
      font-size: 10.5px;
      cursor: pointer;
    }

    .bottomBar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: 10px;
      padding: 10px 20px 16px;
      border-top: 1px solid #d8deea;
      background: #eef1f7;
    }

    .backButton,
    .confirmButton {
      display: grid;
      min-height: 46px;
      place-items: center;
      gap: 0;
      padding: 8px 12px;
      border: 1px solid #d8deea;
      border-radius: 24px;
      background: #fff;
      color: #28324b;
      cursor: pointer;
      font: inherit;
      text-align: center;
    }

    .confirmButton {
      border-color: #7382bb;
      background: #7382bb;
      color: #fff;
    }

    .backButton strong,
    .backButton small,
    .confirmButton strong,
    .confirmButton small {
      display: block;
    }

    .backButton strong,
    .confirmButton strong {
      font-size: 14px;
      font-weight: 650;
    }

    .backButton small,
    .confirmButton small {
      margin-top: 2px;
      color: #929bb0;
      font-size: 11px;
      font-weight: 500;
    }

    .confirmButton small {
      color: #dde2f4;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="viewport">
      <div class="page">
        <main class="paper">
          <div class="runningHead" aria-hidden="true"><span>AI LIFE SIM · 命书</span><span>03 / 08</span></div>
          <header class="header">
            <h1>塑造角色</h1>
            <p>写下这段人生的起点。</p>
          </header>

          <section class="profileSummary" aria-live="polite">
            <span class="profileAvatar" aria-hidden="true">人</span>
            <div class="profileCopy">
              <strong id="profileName">未命名角色</strong>
              <span id="profileMeta">男性 · 人类 · 尚未填写背景</span>
            </div>
            <div class="profileFacts">
              <div><span>寿命</span><strong id="factLifespan">自动</strong></div>
              <div><span>起始</span><strong id="factStart">出生</strong></div>
              <div><span>世界</span><strong>星际纪元</strong></div>
            </div>
          </section>

          <section class="section" aria-labelledby="identity-title">
            <div class="sectionHeading">
              <h2 id="identity-title"><span class="semantic-emoji" aria-hidden="true">👤</span>核心身份</h2>
              <span>01 / 03 · 姓名、性别与种族</span>
            </div>

            <div class="softGroup">
              <div class="groupHeading"><label for="character-name">角色姓名</label><span>必填 · 可随机</span></div>
              <div class="nameRow">
                <input id="character-name" placeholder="输入角色姓名...">
                <button type="button" id="diceButton">随机</button>
              </div>
            </div>

            <div class="softGroup">
              <div class="groupHeading"><span>性别</span><button type="button" id="moreGender">更多选择⌄</button></div>
              <div class="chipRow" id="genderRow">
                <button type="button" class="chipActive" data-gender="男">男</button>
                <button type="button" data-gender="女">女</button>
              </div>
              <div class="inlinePanel" id="genderPanel" hidden>
                <div class="inlineInputRow">
                  <input id="customGenderInput" placeholder="输入性别名称...">
                  <button type="button" id="addGender">添加</button>
                </div>
              </div>
            </div>

            <div class="softGroup">
              <div class="groupHeading"><span>种族</span><button type="button" id="moreRace">种族目录⌄</button></div>
              <div class="chipRow">
                <button type="button" class="chipActive" data-race="人类">人类</button>
                <button type="button" id="customRaceChip">自定义种族</button>
              </div>
              <p class="groupCaption" id="raceCaption">人类 · 基础寿命 78 年</p>
              <div class="inlinePanel" id="racePanel" hidden>
                <div class="inlineInputRow">
                  <input id="customRaceInput" placeholder="输入种族名称...">
                  <button type="button" id="addRace">添加</button>
                </div>
              </div>
            </div>
          </section>

          <section class="section" aria-labelledby="lifespan-title">
            <div class="sectionHeading">
              <h2 id="lifespan-title"><span class="semantic-emoji" aria-hidden="true">⏳</span>寿命与起始</h2>
              <span>02 / 03 · 人生跨度与开篇时点</span>
            </div>
            <div class="lifespanFields">
              <label><span>寿命上限</span><input id="lifespanInput" inputmode="numeric" placeholder="自动"></label>
              <label><span>起始年龄</span><input id="startAgeInput" inputmode="numeric" placeholder="出生"></label>
              <button type="button" id="detectButton">重新检测</button>
            </div>
            <p class="lifespanResult" role="status" id="lifespanResult">预计寿命 <strong>78 岁</strong><span> · 从出生开始</span></p>
          </section>

          <section class="section" aria-labelledby="background-title">
            <div class="sectionHeading">
              <h2 id="background-title"><span class="semantic-emoji" aria-hidden="true">📜</span>人生背景</h2>
              <span>03 / 03 · <span id="bgCount">0</span> 字</span>
            </div>
            <div class="backgroundPresets" id="bgPresets">
              <span class="backgroundPresetWrap"><button type="button" data-bg="贵族">贵族</button></span>
              <span class="backgroundPresetWrap"><button type="button" data-bg="平民">平民</button></span>
              <span class="backgroundPresetWrap"><button type="button" data-bg="科学家">科学家</button></span>
              <span class="backgroundPresetWrap"><button type="button" data-bg="武士">武士</button></span>
            </div>
            <textarea class="backgroundTextarea" id="bgTextarea" placeholder="告诉命运编织者更多关于你的角色的事..."></textarea>
            <div class="backgroundFooter">
              <span>留空也可以继续</span>
              <button type="button" id="savePreset">+ 保存为预设</button>
            </div>
          </section>
        </main>
      </div>
      <div class="bottomBar">
        <button type="button" class="backButton" title="返回世界配置">
          <strong>返回</strong>
          <small>回到世界配置</small>
        </button>
        <button type="button" class="confirmButton" title="确认角色">
          <strong>确认角色</strong>
          <small id="confirmHint">未命名角色 · 进入命格抽取</small>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var names = ['林晚星', '沈墨', '苏念', '顾长风', '楚云舒', '陆沉舟', '姜月', '白泽']
      var races = {
        '人类': { lifespan: 78 },
        '妖族': { lifespan: 300 },
        '魔族': { lifespan: 500 },
        '精灵': { lifespan: 1000 },
        '龙裔': { lifespan: 800 }
      }
      var bgContents = {
        '贵族': '出身显赫世家，自幼接受精英教育。',
        '平民': '平凡人家的孩子，靠双手谋生。',
        '科学家': '沉迷于解开世界底层规律的学者。',
        '武士': '以剑为伴，守护心中道义。'
      }

      var state = {
        name: '',
        gender: 'male',
        race: '人类',
        lifespan: 78,
        startAge: 0
      }

      var profileName = document.getElementById('profileName')
      var profileMeta = document.getElementById('profileMeta')
      var factLifespan = document.getElementById('factLifespan')
      var factStart = document.getElementById('factStart')
      var nameInput = document.getElementById('character-name')
      var confirmHint = document.getElementById('confirmHint')

      function refreshProfile() {
        var name = nameInput.value.trim()
        state.name = name
        profileName.textContent = name || '未命名角色'
        var genderText = state.gender === 'male' ? '男性' : '女性'
        var bgText = document.getElementById('bgTextarea').value.trim() ? '已填写背景' : '尚未填写背景'
        profileMeta.textContent = genderText + ' · ' + state.race + ' · ' + bgText
        confirmHint.textContent = (name || '未命名角色') + ' · 进入命格抽取'
      }

      document.getElementById('diceButton').addEventListener('click', function () {
        nameInput.value = names[Math.floor(Math.random() * names.length)]
        refreshProfile()
      })
      nameInput.addEventListener('input', refreshProfile)

      document.querySelectorAll('#genderRow button').forEach(function (button) {
        button.addEventListener('click', function () {
          document.querySelectorAll('#genderRow button').forEach(function (el) { el.classList.remove('chipActive') })
          button.classList.add('chipActive')
          state.gender = button.dataset.gender === '男' ? 'male' : 'female'
          refreshProfile()
        })
      })

      document.getElementById('moreGender').addEventListener('click', function () {
        var panel = document.getElementById('genderPanel')
        panel.hidden = !panel.hidden
      })

      document.getElementById('addGender').addEventListener('click', function () {
        var input = document.getElementById('customGenderInput')
        var value = input.value.trim()
        if (!value) return
        var chip = document.createElement('button')
        chip.type = 'button'
        chip.dataset.gender = value
        chip.textContent = value
        document.querySelectorAll('#genderRow button').forEach(function (el) { el.classList.remove('chipActive') })
        chip.classList.add('chipActive')
        document.getElementById('genderRow').appendChild(chip)
        state.gender = value
        input.value = ''
        refreshProfile()
        chip.addEventListener('click', function () {
          document.querySelectorAll('#genderRow button').forEach(function (el) { el.classList.remove('chipActive') })
          chip.classList.add('chipActive')
          state.gender = value
          refreshProfile()
        })
      })

      function selectRace(name) {
        state.race = name
        document.querySelectorAll('.chipRow button[data-race]').forEach(function (el) {
          el.classList.toggle('chipActive', el.dataset.race === name)
        })
        var info = races[name]
        var caption = info ? (name + ' · 基础寿命 ' + info.lifespan + ' 年') : name
        document.getElementById('raceCaption').textContent = caption
        if (info) {
          state.lifespan = info.lifespan
          refreshLifespan()
        }
        refreshProfile()
      }

      document.querySelectorAll('.chipRow button[data-race]').forEach(function (button) {
        button.addEventListener('click', function () { selectRace(button.dataset.race) })
      })

      document.getElementById('moreRace').addEventListener('click', function () {
        document.getElementById('racePanel').hidden = !document.getElementById('racePanel').hidden
      })

      document.getElementById('customRaceChip').addEventListener('click', function () {
        document.getElementById('racePanel').hidden = false
      })

      document.getElementById('addRace').addEventListener('click', function () {
        var input = document.getElementById('customRaceInput')
        var value = input.value.trim()
        if (!value) return
        races[value] = { lifespan: 120 }
        selectRace(value)
        input.value = ''
        document.getElementById('racePanel').hidden = true
      })

      function refreshLifespan() {
        var manual = document.getElementById('lifespanInput').value.trim()
        var startManual = document.getElementById('startAgeInput').value.trim()
        var lifespan = manual ? Number.parseInt(manual, 10) : state.lifespan
        var start = startManual ? Number.parseInt(startManual, 10) : 0
        if (!manual) document.getElementById('lifespanInput').value = ''
        var result = document.getElementById('lifespanResult')
        result.innerHTML = '预计寿命 <strong>' + lifespan + ' 岁</strong><span> · 从 ' + (start === 0 ? '出生' : start + ' 岁') + ' 开始</span>'
        factLifespan.textContent = manual ? (lifespan + ' 年') : '自动'
        factStart.textContent = startManual ? (start + ' 岁') : '出生'
      }

      document.getElementById('detectButton').addEventListener('click', refreshLifespan)
      document.getElementById('lifespanInput').addEventListener('blur', refreshLifespan)
      document.getElementById('startAgeInput').addEventListener('blur', refreshLifespan)

      var bgTextarea = document.getElementById('bgTextarea')
      var bgCount = document.getElementById('bgCount')
      bgTextarea.addEventListener('input', function () {
        bgCount.textContent = bgTextarea.value.length
        refreshProfile()
      })

      document.querySelectorAll('#bgPresets button[data-bg]').forEach(function (button) {
        button.addEventListener('click', function () {
          bgTextarea.value = bgContents[button.dataset.bg]
          bgCount.textContent = bgTextarea.value.length
          refreshProfile()
        })
      })

      document.getElementById('savePreset').addEventListener('click', function () {
        var content = bgTextarea.value.trim()
        if (!content) return
        var wrap = document.createElement('span')
        wrap.className = 'backgroundPresetWrap'
        var btn = document.createElement('button')
        btn.type = 'button'
        btn.textContent = '自定义'
        btn.addEventListener('click', function () {
          bgTextarea.value = content
          bgCount.textContent = content.length
          refreshProfile()
        })
        wrap.appendChild(btn)
        document.getElementById('bgPresets').appendChild(wrap)
      })

      refreshProfile()
      refreshLifespan()
    })()
  </script>
</body>
</html>
