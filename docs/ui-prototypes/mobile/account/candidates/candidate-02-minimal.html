<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号与云端 · 第一轮候选 02 · 精简单列统一</title>
  <style>
    /* Purpose: Static prototype of the refined minimal single-column account candidate. Owner: Interface system. Responsibility: Candidate only; inherits the finalized baseline (warm-paper color, original button specs, unified rhythm, equal-width bottom bar). */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #2e2922;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      position: relative;
      isolation: isolate;
      display: grid;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      place-items: stretch;
      background: #fdf9f1;
      color-scheme: light;
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    @media (min-width: 48rem) {
      .viewport {
        width: min(100%, 30rem);
      }
    }

    .page {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      background: #fdf9f1;
      color: #2e2922;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    }

    .screen {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      padding: 22px 28px 16px;
      overflow: hidden;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #8a7f6e;
      font-size: 11px;
      font-weight: 650;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 20px 4px 12px;
    }

    .header h1 {
      margin: 0;
      color: #241f18;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .header p {
      margin: 6px 0 0;
      color: #8a7f6e;
      font-size: 11px;
    }

    .tabs {
      display: flex;
      flex: 0 0 auto;
      gap: 16px;
      padding: 0 4px;
      border-bottom: 1px solid #eadfce;
    }

    .tabs button {
      min-height: 46px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: #8a7f6e;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }

    .tabs button[aria-selected="true"] {
      border-bottom-color: #977026;
      color: #241f18;
      font-weight: 700;
    }

    .content {
      min-height: 0;
      flex: 1;
      padding: 16px 0 0;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    .panel {
      padding: 18px;
      border: 1px solid #e5e1d6;
      border-radius: 20px;
      background: #fffdf8;
    }

    .form,
    .rows {
      display: grid;
      gap: 12px;
    }

    .field {
      display: block;
      min-width: 0;
    }

    .field > span {
      display: block;
      margin: 0 0 6px;
      color: #8a7f6e;
      font-size: 11px;
    }

    .field input {
      display: block;
      width: 100%;
      min-width: 0;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #e5e1d6;
      border-radius: 20px;
      outline: 0;
      background: #fffdf8;
      font-size: 12px;
    }

    .field input:focus {
      border-color: #977026;
    }

    /* 定版按钮规格：白底、浅边框、24px 圆角、带阴影 */
    .primary,
    .secondary {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid #cfd7ee;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(62, 70, 100, 0.06);
      color: #2e2922;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
    }

    .bottomBar {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: 10px;
      padding: 10px 20px 16px;
      border-top: 1px solid #eadfce;
      background: #fdf9f1;
    }

    .backButton,
    .confirmButton {
      display: grid;
      min-height: 46px;
      place-items: center;
      gap: 0;
      padding: 8px 12px;
      border: 1px solid #e5e1d6;
      border-radius: 24px;
      background: #fff;
      color: #2e2922;
      cursor: pointer;
      font: inherit;
      text-align: center;
    }

    .backButton strong,
    .backButton small,
    .confirmButton strong,
    .confirmButton small {
      display: block;
    }

    .backButton strong,
    .confirmButton strong {
      font-size: 14px;
      font-weight: 650;
    }

    .backButton small,
    .confirmButton small {
      margin-top: 2px;
      color: #8a7f6e;
      font-size: 11px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="viewport">
      <main class="page">
        <div class="screen">
          <div class="meta" aria-hidden="true"><span>AI LIFE SIM · 命书</span><span>附 · 账号</span></div>
          <header class="header">
            <div><h1>账号与云端</h1><p>登录同步后，存档与配置可跨设备继续。</p></div>
          </header>
          <nav class="tabs" aria-label="账号页面">
            <button type="button" data-active="true">登录</button>
            <button type="button" data-active="false">云存档</button>
            <button type="button" data-active="false">个人数据</button>
          </nav>
          <section class="content" aria-label="登录账号">
            <section class="panel">
              <div class="form">
                <label class="field">
                  <span>账号</span>
                  <input value="" placeholder="输入账号" autocomplete="off" />
                </label>
                <label class="field">
                  <span>密码</span>
                  <input type="password" value="" placeholder="输入密码" autocomplete="off" />
                </label>
                <button type="button" class="primary">登录并同步</button>
                <button type="button" class="secondary">注册账号</button>
              </div>
            </section>
          </section>
        </div>
        <div class="bottomBar">
          <button type="button" class="backButton" title="返回上一页">
            <strong>返回上一页</strong>
            <small>退出账号页</small>
          </button>
          <button type="button" class="confirmButton" title="完成">
            <strong>完成</strong>
            <small>返回欢迎界面</small>
          </button>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
