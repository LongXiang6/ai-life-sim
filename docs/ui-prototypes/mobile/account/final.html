<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>账号与云端 · AI Life Sim</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../assets/library.css?v=20260723-ui-sync-2">
  <link rel="stylesheet" href="../assets/creation-flow-unified.css?v=20260723-ui-sync-2">
  <link rel="stylesheet" href="../assets/relative-phone-layout.css?v=20260723-ui-sync-2">
  <script src="../assets/prototype.js?v=20260723-ui-sync-2" defer></script>
  <script src="../assets/creation-flow-unified.js?v=20260723-ui-sync-2" defer></script>
  <script src="../assets/relative-phone-layout.js?v=20260723-ui-sync-2" defer></script>
  <style>
    body.auxiliary-b1{background:#eef1f7}.auxiliary-b1 .creation-shell{width:min(100% - 24px,900px);padding:18px 0 42px}.auxiliary-b1 .creation-phone{--cf-paper:#fafbff;--cf-surface:#fff;--cf-soft:#f1f3fa;--cf-ink:#28324b;--cf-muted:#707b92;--cf-faint:#929bb0;--cf-line:#d8deea;--cf-line-strong:#d8deea;--cf-accent:#7382bb;--cf-accent-soft:#edf0fb;--cf-ornament:#7787c0;width:min(100%,320px);height:674px;container-type:size;border-color:#d8deea;border-radius:34px;background:linear-gradient(135deg,rgba(255,215,95,.11),rgba(255,215,95,0) 34%),linear-gradient(#fafbff,#f2f4f9);box-shadow:0 20px 48px rgba(62,70,100,.09)}
    .auxiliary-b1 .cf-screen{inset:0;padding:15px 16px 78px}.auxiliary-b1 .cf-meta span:last-child{display:none}.auxiliary-b1 .cf-title-row h2{color:#28324b;font-size:22px}.auxiliary-b1 .cf-title-row p,.auxiliary-b1 .cf-title-mark{display:none}.auxiliary-b1 .cf-tabs{margin-top:11px;background:#eef1f8}.auxiliary-b1 .cf-tabs button{font-size:8.5px}.auxiliary-b1 .cf-section{margin-top:9px;border-color:#d8deea;background:rgba(255,255,255,.94)}
    .aux-label{display:block;margin:0 0 5px;color:#929bb0;font-size:8.5px}.aux-grid{display:grid;gap:8px}.aux-action{min-height:32px;border:1px solid #d8deea;border-radius:8px;background:#edf0fb;color:#6576b2;font-size:9px;font-weight:700}.aux-action.secondary{background:#fff;color:#707b92;font-weight:600}.aux-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid #e5e9f2}.aux-row:first-child{padding-top:0;border-top:0}.aux-row strong,.aux-row small{display:block}.aux-row strong{font-size:9px}.aux-row small{margin-top:3px;color:#929bb0;font-size:8.5px}.aux-value{color:#6576b2;font-size:8.5px;font-weight:700}.aux-panel[hidden]{display:none}.auxiliary-b1 .cf-footer{border-color:rgba(207,215,238,.84);background:rgba(255,255,255,.8);backdrop-filter:blur(16px)}.auxiliary-b1 .cf-next-arrow{background:#7382bb}
  </style>
</head>
<body class="auxiliary-b1" data-screen="account">
  <main class="creation-shell">
    <header class="creation-review"><p class="creation-review-label">ACCOUNT · FINAL</p><h1>账号与云端</h1><p class="creation-review-copy">沿用创建流程的原定版材质，只补充账号与云存档功能。</p></header>
    <section class="creation-stage" aria-label="账号与云端移动端界面">
      <div class="creation-phone" data-relative-phone data-relative-phone-width="320" data-relative-phone-height="694">
        <div data-flow-art></div>
        <div class="cf-screen">
          <header class="cf-header" data-creation-header data-title="账号与云端"></header>
          <nav class="cf-tabs" role="tablist"><button type="button" data-tab="login" aria-selected="true">登录</button><button type="button" data-tab="cloud" aria-selected="false">云存档</button><button type="button" data-tab="data" aria-selected="false">个人数据</button></nav>
          <section class="cf-section aux-panel" data-panel="login"><div class="aux-grid"><label><span class="aux-label">账号</span><input class="cf-field" value="shenyan" aria-label="账号"></label><label><span class="aux-label">密码</span><input class="cf-field" type="password" value="prototype" aria-label="密码"></label><button class="aux-action" type="button" data-notify="登录成功">登录并同步</button><button class="aux-action secondary" type="button" data-notify="已切换注册">注册账号</button></div></section>
          <section class="cf-section aux-panel" data-panel="cloud" hidden><div class="aux-row"><div><strong>云端人生</strong><small>潮汐城邦 · 第 18 轮</small></div><span class="aux-value">刚刚同步</span></div><div class="aux-row"><div><strong>覆盖云存档</strong><small>账号独立栏位</small></div><button class="aux-action" type="button" data-notify="云存档已覆盖">保存</button></div></section>
          <section class="cf-section aux-panel" data-panel="data" hidden><div class="aux-row"><div><strong>API Key</strong><small>服务端加密</small></div><span class="aux-value">已同步</span></div><div class="aux-row"><div><strong>角色设定</strong><small>跨设备同步</small></div><span class="aux-value">管理</span></div><div class="aux-row"><div><strong>转世天赋</strong><small>6 / 10</small></div><span class="aux-value">查看</span></div></section>
        </div>
        <footer class="cf-footer"><button class="cf-back" type="button" data-flow-to="welcome" aria-label="返回欢迎界面"><span data-icon="back"></span></button><button class="cf-next" type="button" data-flow-to="welcome"><span class="cf-next-number">00</span><span class="cf-next-copy"><strong>完成</strong></span><span class="cf-next-arrow" data-icon="arrow"></span></button></footer>
        <div class="cf-toast" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <script>
    document.addEventListener('click',function(event){const tab=event.target.closest('[data-tab]');if(tab){document.querySelectorAll('[data-tab]').forEach(item=>item.setAttribute('aria-selected',String(item===tab)));document.querySelectorAll('[data-panel]').forEach(panel=>panel.hidden=panel.dataset.panel!==tab.dataset.tab)}const notify=event.target.closest('[data-notify]');if(notify&&window.CreationFlow)window.CreationFlow.notify(notify.dataset.notify)})
  </script>
</body>
</html>
