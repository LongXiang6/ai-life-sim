<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>存档栏位 · 候选 01 · 当前运行基线</title>
  <style>
    /* Purpose: Static prototype of the current running save-sheet baseline. Owner: Interface system. Responsibility: Candidate only; restores WelcomeSaveSheet visuals as of runtime for comparison. */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      position: relative;
      isolation: isolate;
      display: grid;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      place-items: stretch;
      background: #1b2436;
      color-scheme: light;
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    @media (min-width: 48rem) {
      .viewport {
        width: min(100%, 30rem);
      }
    }

    .container {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      background: linear-gradient(165deg, #22304a, #161e2e);
      color: #f0f4fb;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    }

    .runningHead {
      display: flex;
      justify-content: space-between;
      padding: 24px 24px 0;
      color: #93a2bc;
      font-size: 11px;
      font-weight: 650;
    }

    .intro {
      padding: 64px 28px 32px;
    }

    .brand {
      margin: 0;
      color: #b7c4dc;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .title {
      margin: 22px 0 0;
      color: #f4f7fd;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 32px;
      font-weight: 600;
      line-height: 1.5;
    }

    .actions {
      width: 100%;
      max-width: 400px;
      margin: auto auto 24px;
      padding: 0 24px;
    }

    .routeAction {
      display: grid;
      width: 100%;
      min-height: 64px;
      grid-template-columns: 40px minmax(0, 1fr) 28px;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      border: 1px solid rgba(174, 184, 202, 0.42);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      color: #eef2fa;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .routeIndex {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      color: #9fb0cc;
      font-size: 13px;
      font-weight: 600;
    }

    .routeCopy strong,
    .routeCopy small {
      display: block;
    }

    .routeCopy strong {
      font-size: 17px;
      font-weight: 650;
    }

    .routeCopy small {
      margin-top: 3px;
      color: #9aa9c4;
      font-size: 12px;
    }

    .routeArrow {
      color: #93a2bc;
    }

    .routeArrow svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentcolor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    /* Save sheet (opened state) */
    .saveSheet {
      position: absolute;
      z-index: 30;
      right: 18px;
      bottom: 18px;
      left: 18px;
      max-height: 74vh;
      padding: 18px;
      overflow-y: auto;
      border: 1px solid rgba(174, 184, 202, 0.48);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 14px 32px rgba(12, 18, 30, 0.42);
      color: #20283a;
    }

    .saveSheetHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .saveSheetHead strong,
    .saveSheetHead small {
      display: block;
    }

    .saveSheetHead strong {
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 21px;
      font-weight: 600;
    }

    .saveSheetHead small {
      margin-top: 6px;
      color: #8995a5;
      font-size: 12px;
    }

    .saveSheetClose {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(174, 184, 202, 0.62);
      border-radius: 50%;
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.94), rgba(239, 242, 247, 0.78));
      color: #68738a;
      cursor: pointer;
    }

    .saveSheetClose svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentcolor;
      stroke-linecap: round;
      stroke-width: 1.8;
    }

    .saveList {
      display: grid;
      max-height: 42vh;
      gap: 8px;
      overflow-y: auto;
    }

    .saveItem {
      display: grid;
      width: 100%;
      min-height: 60px;
      grid-template-columns: minmax(0, 1fr) 30px;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border: 1px solid rgba(174, 184, 202, 0.42);
      border-radius: 18px;
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.88), rgba(239, 242, 247, 0.7));
      color: #20283a;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .saveItem strong,
    .saveItem small {
      display: block;
    }

    .saveItem strong {
      overflow: hidden;
      font-size: 15px;
      font-weight: 680;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .saveItem small {
      margin-top: 4px;
      overflow: hidden;
      color: #8995a5;
      font-size: 11.5px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .saveCheck {
      position: relative;
      width: 20px;
      height: 20px;
      border: 1px solid #cbd5e2;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.72);
    }

    .saveItem[aria-pressed="true"] {
      border-color: rgba(109, 127, 148, 0.62);
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.96), rgba(226, 234, 244, 0.8));
    }

    .saveItem[aria-pressed="true"] .saveCheck {
      border-color: #6d7f94;
      background: #6d7f94;
    }

    .saveItem[aria-pressed="true"] .saveCheck::after {
      position: absolute;
      top: 4px;
      left: 3px;
      width: 9px;
      height: 5px;
      border-bottom: 2px solid #fff;
      border-left: 2px solid #fff;
      content: "";
      transform: rotate(-45deg);
    }

    .saveSheetStatus {
      margin: 12px 4px 0;
      color: #626e82;
      font-size: 12px;
      line-height: 1.5;
    }

    .deleteSelected,
    .continueSave {
      display: block;
      width: 100%;
      min-height: 48px;
      margin-top: 8px;
      padding: 10px 14px;
      border: 1px solid rgba(174, 184, 202, 0.52);
      border-radius: 18px;
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.9), rgba(239, 242, 247, 0.72));
      color: #697589;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
    }

    .continueSave {
      display: flex;
      min-height: 58px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-color: rgba(109, 127, 148, 0.62);
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.96), rgba(226, 234, 244, 0.82));
      color: #293449;
      text-align: left;
    }

    .continueSave strong,
    .continueSave small {
      display: block;
    }

    .continueSave strong {
      font-size: 15px;
    }

    .continueSave small {
      margin-top: 3px;
      color: #697589;
      font-size: 11.5px;
    }

    .continueSave svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentcolor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="viewport">
      <main class="container">
        <div class="runningHead" aria-hidden="true">
          <span>AI LIFE SIM · 命书</span>
          <span>00 / 欢迎</span>
        </div>

        <section class="intro" aria-labelledby="welcome-title">
          <p class="brand">人生序章</p>
          <h1 id="welcome-title" class="title">
            一生很长，
            <br />
            也只由几次选择组成。
          </h1>
        </section>

        <section class="actions" aria-label="开始与辅助操作">
          <button type="button" class="routeAction" aria-expanded="true" title="展开存档栏位，选择一段人生继续">
            <span class="routeIndex">02</span>
            <span class="routeCopy">
              <strong>继续人生</strong>
              <small>2 个存档 · 最近：朝雨</small>
            </span>
            <span class="routeArrow" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" /></svg>
            </span>
          </button>
        </section>
      </main>

      <section class="saveSheet" role="dialog" aria-modal="true" aria-labelledby="save-title">
        <div class="saveSheetHead">
          <div>
            <strong id="save-title">选择存档</strong>
            <small>继续一段尚未写完的人生</small>
          </div>
          <button type="button" class="saveSheetClose" aria-label="关闭存档">
            <svg viewBox="0 0 14 14" aria-hidden="true"><path d="m3 3 8 8M11 3l-8 8" /></svg>
          </button>
        </div>

        <div class="saveList" aria-label="存档栏位">
          <button type="button" class="saveItem" aria-pressed="true">
            <span>
              <strong>朝雨</strong>
              <small>幻海洲 · 第 12 轮 · 自动存档 · 8/7 15:20</small>
            </span>
            <span class="saveCheck" aria-hidden="true"></span>
          </button>
          <button type="button" class="saveItem" aria-pressed="false">
            <span>
              <strong>沈星河</strong>
              <small>苍澜界 · 第 3 轮 · 槽位 1 · 8/5 09:42</small>
            </span>
            <span class="saveCheck" aria-hidden="true"></span>
          </button>
        </div>

        <p class="saveSheetStatus" role="status">已选择：朝雨</p>
        <button type="button" class="deleteSelected">删除已选择的存档</button>
        <button type="button" class="continueSave">
          <span>
            <strong>继续此人生</strong>
            <small>朝雨</small>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </button>
      </section>
    </div>
  </div>
</body>
</html>
