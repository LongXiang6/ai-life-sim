<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>设置重构第十四轮 · 树状权重</title>
  <link rel="stylesheet" href="../assets/library-history.css">
  <script src="../assets/prototype.js" defer></script>
  <style>
    :root {
      --page:#f2f4f3;--paper:#fff;--ink:#202724;--soft:#616d67;--faint:#929d98;
      --rule:#dce3df;--rule-light:#edf1ef;--control:#f2f5f3;--accent:#557067;--accent-soft:#e8f0ed;
      --serif:"Songti SC","STSong","SimSun",serif;--sans:"SF Pro Text","PingFang SC","Microsoft YaHei UI",sans-serif;
    }
    * { box-sizing:border-box; }
    body { background:var(--page); color:var(--ink); font-family:var(--sans); }
    button,textarea { font:inherit; }
    .shell { width:min(calc(100% - 28px),1510px); }
    .topbar { margin-bottom:24px; }
    .eyebrow { letter-spacing:0; }
    .round-head { display:grid; max-width:960px; gap:8px; margin-bottom:24px; }
    .round-head h1 { margin:0; font-family:var(--serif); font-weight:600; letter-spacing:0; }
    .round-head .subtitle { margin:0; }
    .round-status { color:#5d756d; font-size:12px; }
    .option-grid { grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
    .option-card { min-width:0; border-radius:8px; background:rgba(255,255,255,.88); box-shadow:0 9px 26px rgba(35,49,43,.055); }
    .option-card:hover { transform:translateY(-2px); box-shadow:0 13px 30px rgba(35,49,43,.09); }
    .option-card.selected { outline:2px solid #5d756d; outline-offset:3px; }
    .option-copy { padding:0 16px 16px; }
    .option-copy h2 { margin:0 0 7px; font-family:var(--serif); font-size:17px; font-weight:600; letter-spacing:0; }
    .option-copy p { min-height:60px; margin:0 0 12px; color:#65716b; font-size:12px; line-height:1.65; }
    .route-tag { color:#5d756d; font-size:10px; }
    .choose-route { width:100%; min-height:36px; margin-top:12px; border:1px solid #d7dfdb; border-radius:7px; background:#fbfcfb; color:#28312d; cursor:pointer; }
    .selected .choose-route { border-color:#5d756d; background:#eaf1ee; color:#405a52; }

    .book-phone.phone {
      --title-size:20.5px;--tab-size:9.8px;--node-size:9.2px;--leaf-size:8.3px;--context-size:7px;--support-size:5.8px;
      --row-height:43px;--leaf-indent:10px;--group-gap:4px;--node-dot:5px;--branch-opacity:.58;
      position:relative;width:min(292px,calc(100% - 24px));height:590px;border-color:var(--rule);border-radius:24px;
      background:var(--paper);color:var(--ink);box-shadow:0 14px 32px rgba(37,50,44,.085);font-family:var(--sans);
    }
    .book-phone::after { position:absolute; z-index:5; right:18px; bottom:12px; left:18px; height:1px; background:var(--rule-light); content:""; pointer-events:none; }
    .phone-head { height:74px; padding:18px 16px 8px; border-bottom:1px solid var(--rule-light); }
    .running { display:flex; justify-content:space-between; color:var(--faint); font-size:var(--support-size); letter-spacing:0; }
    .title-line { display:flex; align-items:end; justify-content:space-between; gap:8px; margin-top:9px; }
    .title-line h3 { margin:0; font-family:var(--serif); font-size:var(--title-size); font-weight:600; line-height:1; letter-spacing:0; }
    .title-line span { color:var(--faint); font-size:var(--support-size); }
    .folio-tabs { display:grid; height:50px; grid-template-columns:repeat(4,1fr); gap:3px; margin:2px 14px 0; border:0; }
    .folio-tabs button { min-width:0; padding:0 2px; border:0; border-radius:7px; background:transparent; color:var(--soft); font-size:var(--tab-size); cursor:pointer; }
    .folio-tabs button small,.folio-tabs button span { display:block; }
    .folio-tabs button small { margin-bottom:2px; color:var(--faint); font-size:var(--support-size); font-weight:400; }
    .folio-tabs button span { font-size:var(--tab-size); font-weight:600; line-height:1.15; }
    .folio-tabs button[aria-selected="true"] { background:var(--accent-soft); color:var(--accent); }
    .settings-body { height:416px; overflow:hidden; }
    .view-area { height:368px; overflow:hidden; padding:10px 16px 9px; }
    .settings-view { display:none; }
    .settings-view.active { display:block; animation:reveal .16s ease both; }
    .view-intro { margin:0 0 9px; color:var(--soft); font-size:var(--context-size); line-height:1.45; }
    .section-cap { display:flex; min-height:21px; align-items:center; justify-content:space-between; margin-top:7px; color:var(--faint); font-size:var(--support-size); }
    .section-cap b { color:var(--ink); font-family:var(--serif); font-size:var(--node-size); font-weight:600; }
    .ruled,.model-list { border:0; }
    .setting-row { display:grid; min-height:var(--row-height); grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:8px; padding:4px 0; }
    .setting-copy { min-width:0; }
    .setting-copy b { display:block; font-size:var(--leaf-size); font-weight:600; line-height:1.2; }
    .setting-copy small { display:block; margin-top:2px; overflow-wrap:anywhere; color:var(--faint); font-size:var(--support-size); line-height:1.3; }
    .toggle { position:relative; width:34px; height:20px; padding:0; border:0; border-radius:999px; background:var(--control); box-shadow:inset 0 0 0 1px var(--rule); cursor:pointer; }
    .toggle::after { position:absolute; top:4px; left:4px; width:12px; height:12px; border-radius:50%; background:var(--faint); content:""; transition:.15s ease; }
    .toggle[aria-checked="true"] { background:var(--accent-soft); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent); }
    .toggle[aria-checked="true"]::after { left:18px; background:var(--accent); }
    .book-phone .value-action { min-width:52px; min-height:29px; padding:0 8px; border:0; border-radius:7px; background:var(--control); color:var(--soft); font-size:var(--leaf-size); text-align:center; cursor:pointer; box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rule) 55%,transparent); }
    .stepper { display:grid; overflow:hidden; grid-template-columns:28px 46px 28px; align-items:center; border-radius:8px; background:var(--control); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rule) 55%,transparent); }
    .stepper button { width:28px; height:31px; padding:0; border:0; background:transparent; color:var(--soft); cursor:pointer; }
    .stepper button:disabled { color:var(--rule); }
    .stepper output { color:var(--soft); font-family:var(--serif); font-size:var(--leaf-size); text-align:center; }
    .segments { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; padding:3px; border-radius:8px; background:var(--control); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rule) 55%,transparent); }
    .segments button { min-height:29px; padding:0; border:0; border-radius:6px; background:transparent; color:var(--faint); font-size:var(--leaf-size); cursor:pointer; }
    .segments button.active { background:var(--paper); color:var(--accent); box-shadow:0 1px 4px rgba(42,56,50,.08); }
    .model-list { display:grid; gap:3px; margin-top:2px; }
    .model-list button { display:flex; width:100%; min-height:35px; align-items:center; justify-content:space-between; padding:0 9px; border:0; border-radius:7px; background:transparent; color:var(--soft); font-size:var(--leaf-size); cursor:pointer; }
    .model-list button.active { background:var(--control); color:var(--ink); }
    .model-list button.active::after { color:var(--accent); font-size:var(--support-size); content:"当前"; }
    .prompt { width:100%; height:112px; margin-top:6px; padding:10px; resize:none; border:1px solid var(--rule-light); border-radius:8px; outline:0; background:var(--control); color:var(--soft); font-size:var(--leaf-size); line-height:1.55; }
    .note { margin:6px 0 0; color:var(--faint); font-size:var(--support-size); line-height:1.4; }
    .phone-footer { position:absolute; right:12px; bottom:13px; left:12px; z-index:18; display:flex; height:45px; align-items:center; justify-content:space-between; gap:8px; padding:0 4px; border-top:1px solid var(--rule-light); background:color-mix(in srgb,var(--paper) 96%,transparent); }
    .phone-footer small { color:var(--faint); font-size:var(--support-size); }
    .book-phone .restore { min-width:76px; min-height:30px; padding:0 10px; border:0; border-radius:8px; background:var(--accent-soft); color:var(--accent); font-size:var(--leaf-size); cursor:pointer; }
    .book-phone .restore:disabled { background:transparent; color:var(--faint); cursor:default; }
    .toast { position:absolute; z-index:30; right:14px; bottom:62px; left:14px; padding:8px; border:1px solid var(--rule); border-radius:8px; background:var(--paper); color:var(--soft); font-size:var(--context-size); text-align:center; opacity:0; transform:translateY(5px); transition:.16s ease; pointer-events:none; }
    .toast.show { opacity:1; transform:none; }
    .page-number { position:absolute; z-index:20; right:20px; bottom:5px; color:var(--faint); font-family:var(--serif); font-size:var(--support-size); pointer-events:none; }

    .tree-groups .function-group { position:relative; padding-left:15px; }
    .tree-groups .function-group + .function-group { margin-top:var(--group-gap); }
    .tree-groups .function-group .section-cap { margin-top:0; }
    .tree-groups .function-group::before { position:absolute; top:10px; bottom:1px; left:3px; width:1px; background:var(--rule); content:""; }
    .tree-groups .function-group::after { position:absolute; top:8px; left:calc(3.5px - var(--node-dot) / 2); width:var(--node-dot); height:var(--node-dot); border:1px solid var(--accent); border-radius:50%; background:var(--paper); content:""; }
    .tree-groups .function-group .setting-row { position:relative; }
    .tree-groups .function-group .setting-row::before { position:absolute; top:50%; left:-11px; width:calc(var(--leaf-indent) + 9px); height:1px; background:var(--rule); content:""; opacity:var(--branch-opacity); }
    .tree-groups .function-group .setting-copy { padding-left:var(--leaf-indent); }
    .tree-groups .function-group .segments { width:calc(100% - var(--leaf-indent)); margin-left:var(--leaf-indent); }

    .book-phone.tree-stable { --node-size:9.2px;--leaf-size:8.3px;--context-size:7px;--support-size:5.8px;--row-height:43px;--leaf-indent:10px;--group-gap:4px;--node-dot:5px;--branch-opacity:.58; }
    .book-phone.tree-node { --node-size:9.7px;--leaf-size:8.3px;--context-size:6.9px;--support-size:5.7px;--row-height:43px;--leaf-indent:11px;--group-gap:5px;--node-dot:6px;--branch-opacity:.62; }
    .book-phone.tree-readable { --node-size:9.6px;--leaf-size:8.7px;--context-size:7.3px;--support-size:6px;--row-height:44px;--leaf-indent:10px;--group-gap:4px;--node-dot:5px;--branch-opacity:.54; }
    .book-phone.tree-complete { --tab-size:10.2px;--node-size:9.8px;--leaf-size:8.5px;--context-size:7px;--support-size:5.6px;--row-height:44px;--leaf-indent:13px;--group-gap:5px;--node-dot:6px;--branch-opacity:.86; }
    .tree-node .function-group::after,.tree-complete .function-group::after { background:var(--accent-soft); }

    button:focus-visible,textarea:focus-visible { outline:1px solid var(--accent); outline-offset:2px; }
    @keyframes reveal { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:none; } }
    @media (max-width:1320px) { .option-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:720px) { .shell { width:min(calc(100% - 18px),430px); padding-top:18px; } .option-grid { grid-template-columns:1fr; } .option-copy p { min-height:0; } .book-phone.phone { width:min(320px,calc(100vw - 54px)); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar"><a href="index.html">← 返回设置界面历史</a><span class="status wait" data-selection>待选择 · ST-RF14-1 / 2 / 3 / 4</span></div>
    <header class="round-head">
      <p class="eyebrow">SETTINGS · REFACTOR ROUND 14</p>
      <h1>ST-RF13-1 树状权重</h1>
      <p class="subtitle">第十三轮选择 ST-RF13-1。本轮保持主选项卡与清墨主题，放大下层文字，并按目录树逻辑区分功能节点、叶子子项和辅助信息。</p>
      <span class="round-status">主选项卡 ＞ 功能节点 ＞ 叶子子项 ＞ 上下文 ＞ 辅助；节点与子项错位，右侧信息统一对齐。</span>
    </header>
    <section class="option-grid" aria-label="设置重构第十四轮候选" data-option-grid></section>
  </main>

  <template id="phone-template">
    <div class="phone book-phone tree-groups" data-prototype>
      <header class="phone-head"><div class="running"><span>偏好 · 四章</span><span data-code></span></div><div class="title-line"><h3>设置</h3><span>即时生效</span></div></header>
      <nav class="folio-tabs" role="tablist" aria-label="设置章节"><button type="button" role="tab" data-view-target="personal" aria-selected="false"><small>01</small><span>个性化</span></button><button type="button" role="tab" data-view-target="model" aria-selected="true"><small>02</small><span>模型设置</span></button><button type="button" role="tab" data-view-target="calls" aria-selected="false"><small>03</small><span>模型调用</span></button><button type="button" role="tab" data-view-target="prompt" aria-selected="false"><small>04</small><span>Prompt</span></button></nav>
      <div class="settings-body"><div class="view-area" data-views-root></div></div>
      <footer class="phone-footer"><small data-dirty-label>当前为默认设置</small><button class="restore" type="button" data-restore disabled>恢复默认</button></footer>
      <div class="toast" role="status" aria-live="polite"></div><span class="page-number" data-page-number>附 · 02</span>
    </div>
  </template>

  <template id="views-template">
    <section class="settings-view" data-view="personal"><p class="view-intro">阅读与动效偏好，不改变模拟事实。</p><div class="section-cap"><b>阅读体验</b><span>即时生效</span></div><div class="ruled"><div class="setting-row"><div class="setting-copy"><b>段落舒展</b><small>为长叙事增加少量行间距</small></div><button class="toggle" type="button" data-toggle-key="paragraph" role="switch" aria-label="段落舒展"></button></div><div class="setting-row"><div class="setting-copy"><b>减少动态效果</b><small>保留必要变化，降低装饰动画</small></div><button class="toggle" type="button" data-toggle-key="motion" role="switch" aria-label="减少动态效果"></button></div></div></section>
    <section class="settings-view active" data-view="model"><p class="view-intro">连续检查生成方式、推理、字数与预生成。</p><div class="function-group"><div class="section-cap"><b>AI 内容</b><span>生成方式</span></div><div class="ruled"><div class="setting-row"><div class="setting-copy"><b>AI 命格生成</b><small>调用 AI 实时生成随机命格</small></div><button class="toggle" type="button" data-toggle-key="fate" role="switch" aria-label="AI 命格生成"></button></div></div></div><div class="function-group"><div class="section-cap"><b>推理模式</b><span>按用途设置</span></div><div class="ruled"><div class="setting-row"><div class="setting-copy"><b>全局推理</b><small>所有可用请求的默认方式</small></div><button class="value-action" type="button" data-value-key="globalReason"></button></div><div class="setting-row"><div class="setting-copy"><b>命格生成</b><small>可独立覆盖全局设置</small></div><button class="value-action" type="button" data-value-key="fateReason"></button></div></div></div><div class="function-group"><div class="section-cap"><b>叙事长度</b><span>完整句优先</span></div><div class="ruled"><div class="setting-row"><div class="setting-copy"><b>每轮叙事大致字数</b><small>生成目标，不硬截断完整句</small></div><div class="stepper"><button type="button" data-delta="-50" aria-label="减少叙事字数">−</button><output data-words></output><button type="button" data-delta="50" aria-label="增加叙事字数">＋</button></div></div></div></div><div class="function-group"><div class="section-cap"><b>预生成轮数</b><span>降低等待感</span></div><div class="segments" data-option-group="pregen"><button type="button" data-option="关闭">关闭</button><button type="button" data-option="1 轮">1 轮</button><button type="button" data-option="2 轮">2 轮</button><button type="button" data-option="3 轮">3 轮</button></div></div></section>
    <section class="settings-view" data-view="calls"><p class="view-intro">按调用用途选择模型，当前项在原位标记。</p><div class="section-cap"><b>主叙事模型</b><span>当前配置</span></div><div class="model-list" data-option-group="primary"><button type="button" data-option="默认模型">默认模型</button><button type="button" data-option="高速模型">高速模型</button><button type="button" data-option="深度模型">深度模型</button></div><div class="section-cap"><b>后台任务</b><span>独立选择</span></div><div class="model-list" data-option-group="background"><button type="button" data-option="跟随默认">跟随默认</button><button type="button" data-option="高速模型">高速模型</button></div></section>
    <section class="settings-view" data-view="prompt"><p class="view-intro">补充叙事偏好，不覆盖世界事实与结构化契约。</p><div class="section-cap"><b>叙事偏好</b><span>可选</span></div><textarea class="prompt" data-prompt aria-label="叙事偏好"></textarea><p class="note">仅作为玩家偏好附加到叙事上下文。</p></section>
  </template>

  <script>
    document.addEventListener('DOMContentLoaded',function(){
      const candidates=[
        {code:'ST-RF14-1',name:'树级对齐',tag:'最稳',className:'tree-stable',description:'节点 9.2px、子项 8.3px；子项缩进 10px，右侧说明和控件共用一条边界。'},
        {code:'ST-RF14-2',name:'节点增强',tag:'节点优先',className:'tree-node',description:'节点放大至 9.7px并强化圆点，子项保持 8.3px，父子权重差更明显。'},
        {code:'ST-RF14-3',name:'子项舒展',tag:'阅读优先',className:'tree-readable',description:'节点 9.6px、子项 8.7px、辅助 6px，整体提高下层信息的阅读舒适度。'},
        {code:'ST-RF14-4',name:'完整目录树',tag:'结构上限',className:'tree-complete',description:'更深缩进、更强分支线和 9.8 / 8.5px 父子级差，目录关系最完整。'}
      ];
      const promptDefault='更关注人物关系的渐变与选择带来的长期回声；保持叙事克制，不提前替角色总结一生。';
      const defaults={paragraph:true,motion:false,fate:true,globalReason:'关闭',fateReason:'关闭',words:200,pregen:'关闭',primary:'默认模型',background:'跟随默认',prompt:promptDefault};
      const pageNumbers={personal:'01',model:'02',calls:'03',prompt:'04'};
      const grid=document.querySelector('[data-option-grid]'),phoneTemplate=document.getElementById('phone-template'),viewsTemplate=document.getElementById('views-template');
      candidates.forEach(function(candidate){const card=document.createElement('article');card.className='option-card';card.dataset.choice=candidate.code+' '+candidate.name;card.appendChild(phoneTemplate.content.cloneNode(true));const phone=card.querySelector('[data-prototype]');phone.dataset.prototype=candidate.code.toLowerCase();phone.classList.add(candidate.className);phone.querySelector('[data-code]').textContent=candidate.code;const copy=document.createElement('div');copy.className='option-copy';copy.innerHTML='<span class="route-tag">'+candidate.code+' · '+candidate.tag+'</span><h2>'+candidate.name+'</h2><p>'+candidate.description+'</p><button class="choose-route" type="button">选择 '+candidate.code+'</button>';card.appendChild(copy);grid.appendChild(card);});
      function freshState(){return Object.assign({},defaults);}
      function isDirty(state){return Object.keys(defaults).some(function(key){return state[key]!==defaults[key];});}
      function toast(phone,message){const node=phone.querySelector('.toast');node.textContent=message;node.classList.add('show');clearTimeout(node._timer);node._timer=setTimeout(function(){node.classList.remove('show');},1100);}
      function switchView(phone,key){phone.querySelectorAll('[data-view-target]').forEach(function(tab){tab.setAttribute('aria-selected',String(tab.dataset.viewTarget===key));});phone.querySelectorAll('[data-view]').forEach(function(view){view.classList.toggle('active',view.dataset.view===key);});phone.querySelector('[data-page-number]').textContent='附 · '+pageNumbers[key];}
      function render(phone){const state=phone._state;phone.querySelectorAll('[data-toggle-key]').forEach(function(button){button.setAttribute('aria-checked',String(Boolean(state[button.dataset.toggleKey])));});phone.querySelectorAll('[data-value-key]').forEach(function(button){button.textContent=state[button.dataset.valueKey];});phone.querySelectorAll('[data-words]').forEach(function(output){output.textContent=state.words+' 字';});phone.querySelectorAll('[data-delta="-50"]').forEach(function(button){button.disabled=state.words<=100;});phone.querySelectorAll('[data-delta="50"]').forEach(function(button){button.disabled=state.words>=1000;});phone.querySelectorAll('[data-option-group]').forEach(function(group){group.querySelectorAll('[data-option]').forEach(function(button){button.classList.toggle('active',state[group.dataset.optionGroup]===button.dataset.option);});});phone.querySelectorAll('[data-prompt]').forEach(function(field){if(document.activeElement!==field)field.value=state.prompt;});const dirty=isDirty(state);phone.querySelector('[data-restore]').disabled=!dirty;phone.querySelector('[data-dirty-label]').textContent=dirty?'有未恢复的调整':'当前为默认设置';}
      document.querySelectorAll('[data-prototype]').forEach(function(phone){phone.querySelector('[data-views-root]').appendChild(viewsTemplate.content.cloneNode(true));phone._state=freshState();phone.addEventListener('click',function(event){const target=event.target.closest('button');if(!target||!phone.contains(target)||target.disabled)return;event.stopPropagation();if(target.dataset.viewTarget){switchView(phone,target.dataset.viewTarget);}else if(target.dataset.toggleKey){const key=target.dataset.toggleKey;phone._state[key]=!phone._state[key];toast(phone,target.getAttribute('aria-label')+' · '+(phone._state[key]?'已开启':'已关闭'));}else if(target.dataset.valueKey){const key=target.dataset.valueKey;phone._state[key]=phone._state[key]==='关闭'?'开启':'关闭';toast(phone,'推理模式 · '+phone._state[key]);}else if(target.dataset.delta){phone._state.words=Math.max(100,Math.min(1000,phone._state.words+Number(target.dataset.delta)));}else if(target.dataset.option){const group=target.closest('[data-option-group]');phone._state[group.dataset.optionGroup]=target.dataset.option;toast(phone,'已选择 · '+target.dataset.option);}else if(target.hasAttribute('data-restore')){phone._state=freshState();toast(phone,'已恢复默认设置');}render(phone);});phone.querySelector('[data-prompt]').addEventListener('input',function(event){event.stopPropagation();phone._state.prompt=event.target.value;render(phone);});render(phone);});
      document.querySelectorAll('.option-card').forEach(function(card){card.querySelector('.choose-route').addEventListener('click',function(event){event.stopPropagation();window.selectChoice(card);card.scrollIntoView({block:'nearest',behavior:'smooth'});});card.addEventListener('click',function(event){if(!event.target.closest('button,textarea'))window.selectChoice(card);});});
    });
  </script>
</body>
