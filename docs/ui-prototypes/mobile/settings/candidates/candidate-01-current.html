<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置 · 候选 01 · 当前运行基线</title>
  <style>
    /* Purpose: Static prototype of the current settings modal. Owner: Interface system. Responsibility: Candidate only; restores the running settings visual language (blue-white sheet, capsule tabs, floating done bar). */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #28324b;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      position: relative;
      isolation: isolate;
      display: grid;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      place-items: stretch;
      background: #eef1f7;
      color-scheme: light;
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    @media (min-width: 48rem) {
      .viewport {
        width: min(100%, 30rem);
      }
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      overflow: hidden;
      place-items: stretch;
      background: rgb(238 241 247 / 88%);
    }

    .sheet {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      background: #fafbff;
      color: #28324b;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      font-size: 10px;
      line-height: 1.5;
    }

    .header {
      flex: 0 0 auto;
      padding: 14px 15px 0;
    }

    .metaRow {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #929bb0;
      font-size: 7px;
      font-weight: 700;
    }

    .titleRow {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-top: 6px;
    }

    .title {
      margin: 0;
      color: #28324b;
      font-family: "Songti SC", STSong, SimSun, serif;
      font-size: 21px;
      font-weight: 600;
      line-height: 1.15;
    }

    .titleRow p {
      margin: 3px 0 0;
      color: #707b92;
      font-size: 7px;
    }

    .tabBar {
      display: flex;
      flex: 0 0 auto;
      gap: 3px;
      overflow-x: auto;
      margin: 5px 15px 0;
      padding: 3px;
      border-radius: 11px;
      background: #f1f3fa;
      white-space: nowrap;
    }

    .tab {
      min-width: 78px;
      min-height: 31px;
      flex: 0 0 78px;
      padding: 4px 3px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: #929bb0;
      cursor: pointer;
      font: inherit;
      font-size: 7px;
    }

    .tab small,
    .tab span {
      display: block;
      overflow: hidden;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab small {
      margin-bottom: 2px;
      font-size: 5.5px;
    }

    .tab[data-active="true"] {
      border-color: #d8deea;
      background: #fff;
      color: #7382bb;
      font-weight: 700;
    }

    .settingsTools {
      display: flex;
      min-height: 31px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 8px 15px 0;
      padding: 0 2px 7px;
      border-bottom: 1px solid #d8deea;
    }

    .settingsTools small {
      color: #929bb0;
      font-size: 6px;
    }

    .restoreAction {
      min-height: 26px;
      padding: 0 8px;
      border: 1px solid #d8deea;
      border-radius: 8px;
      background: #fff;
      color: #7382bb;
      cursor: pointer;
      font: inherit;
      font-size: 6.5px;
    }

    .tabContent {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 0 15px 80px;
      color: #28324b;
    }

    .preferenceIntro {
      margin: 8px 0 10px;
      color: #707b92;
      font-size: 7px;
      line-height: 1.5;
    }

    .section {
      margin: 0;
      padding: 9px 0;
      border-top: 1px solid #d8deea;
    }

    .section:first-of-type {
      border-top: 0;
    }

    .sectionLabel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 4px;
      padding-inline: 3px;
    }

    .sectionLabel h3 {
      margin: 0;
      color: #28324b;
      font-family: "Songti SC", STSong, SimSun, serif;
      font-size: 10px;
      font-weight: 600;
    }

    .sectionLabel span {
      color: #929bb0;
      font-size: 6px;
    }

    .sectionCard {
      padding: 5px 11px;
      border: 1px solid #e5e9f2;
      border-radius: 8px;
      background: #fff;
    }

    .settingRow {
      display: grid;
      min-height: 41px;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }

    .settingCopy strong,
    .settingCopy small {
      display: block;
    }

    .settingCopy strong {
      color: #28324b;
      font-family: "Songti SC", STSong, SimSun, serif;
      font-size: 8px;
      font-weight: 650;
      line-height: 1.25;
    }

    .settingCopy small {
      margin-top: 2px;
      color: #929bb0;
      font-size: 5.8px;
      line-height: 1.35;
    }

    .toggle {
      position: relative;
      width: 34px;
      min-width: 34px;
      height: 20px;
      padding: 0;
      border: 1px solid #d8deea;
      border-radius: 999px;
      background: #f1f3fa;
      cursor: pointer;
    }

    .toggle::after {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #929bb0;
      content: "";
    }

    .toggle[aria-checked="true"] {
      border-color: #d1dbe5;
      background: #e7ebf6;
    }

    .toggle[aria-checked="true"]::after {
      left: 17px;
      background: #7382bb;
    }

    .groupHeading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 3px 0 5px;
      font-size: 6px;
      color: #929bb0;
    }

    .fontGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 5px;
    }

    .fontButton {
      min-height: 26px;
      border: 1px solid #d8deea;
      border-radius: 7px;
      background: #fff;
      color: #28324b;
      cursor: pointer;
      font: inherit;
      font-size: 6.5px;
    }

    .fontButton[aria-pressed="true"] {
      border-color: #7382bb;
      background: #e7ebf6;
      color: #7382bb;
      font-weight: 700;
    }

    .streamGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .choiceButton {
      padding: 6px 8px;
      border: 1px solid #d8deea;
      border-radius: 8px;
      background: #fff;
      color: #28324b;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .choiceButton[aria-pressed="true"] {
      border-color: #7382bb;
      background: #e7ebf6;
    }

    .choiceTitle,
    .choiceDescription {
      display: block;
    }

    .choiceTitle {
      font-size: 7px;
      font-weight: 650;
    }

    .choiceDescription {
      margin-top: 1px;
      color: #929bb0;
      font-size: 5.5px;
    }

    .supportingText {
      margin: 5px 0;
      color: #707b92;
      font-size: 6.5px;
      line-height: 1.5;
    }

    .importModeRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 5px 0;
      font-size: 6.5px;
      color: #707b92;
    }

    .segmentedControl {
      display: flex;
      gap: 2px;
      padding: 2px;
      border-radius: 7px;
      background: #f1f3fa;
    }

    .segmentedControl button {
      min-height: 22px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #929bb0;
      cursor: pointer;
      font: inherit;
      font-size: 6.5px;
    }

    .segmentedControl button[aria-pressed="true"] {
      background: #fff;
      color: #28324b;
      font-weight: 650;
    }

    .dataActions {
      display: flex;
      gap: 6px;
      margin: 6px 0 2px;
    }

    .secondaryButton,
    .dangerButton {
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid #d8deea;
      border-radius: 7px;
      background: #fff;
      color: #28324b;
      cursor: pointer;
      font: inherit;
      font-size: 6.5px;
    }

    .dangerButton {
      border-color: #d8c9c9;
      color: #8d6d73;
    }

    .footer {
      position: absolute;
      z-index: 5;
      right: 14px;
      bottom: 12px;
      left: 14px;
      display: flex;
      min-height: 52px;
      align-items: center;
      gap: 8px;
      padding: 2px 7px;
      border: 1px solid rgb(207 215 238 / 90%);
      border-radius: 18px;
      background: rgb(255 255 255 / 80%);
      box-shadow: 0 12px 30px rgb(62 70 100 / 13%), 0 2px 7px rgb(62 70 100 / 6%);
      backdrop-filter: blur(16px);
    }

    .closeBtn {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      place-items: center;
      padding: 0;
      border: 1px solid #d8deea;
      border-radius: 50%;
      background: #fff;
      color: #707b92;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
    }

    .doneBtn {
      display: flex;
      min-width: 0;
      min-height: 48px;
      flex: 1;
      align-items: center;
      gap: 8px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #28324b;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .doneIndex {
      width: 19px;
      flex: 0 0 19px;
      color: #929bb0;
      font-size: 6.5px;
      text-align: center;
    }

    .doneCopy {
      min-width: 0;
      flex: 1;
    }

    .doneCopy strong,
    .doneCopy small {
      display: block;
    }

    .doneCopy strong {
      font-size: 12px;
      line-height: 1.2;
    }

    .doneCopy small {
      margin-top: 2px;
      overflow: hidden;
      color: #929bb0;
      font-size: 6.5px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .doneArrow {
      display: grid;
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
      place-items: center;
      border-radius: 50%;
      background: #7382bb;
      color: #fff;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="viewport">
      <div class="overlay">
        <main class="sheet">
          <header class="header">
            <div class="metaRow" aria-hidden="true"><span>AI LIFE SIM · 命书</span><span>附 · 01</span></div>
            <div class="titleRow">
              <div>
                <h2 class="title">设置</h2>
                <p>偏好即时生效，不改变已经发生的模拟事实。</p>
              </div>
            </div>
          </header>

          <div class="tabBar" role="tablist" aria-label="设置分类">
            <button type="button" class="tab" data-active="true" role="tab" aria-selected="true"><small>01</small><span>阅读与界面</span></button>
            <button type="button" class="tab" data-active="false" role="tab" aria-selected="false"><small>02</small><span>叙事偏好</span></button>
            <button type="button" class="tab" data-active="false" role="tab" aria-selected="false"><small>03</small><span>模型与调用</span></button>
            <button type="button" class="tab" data-active="false" role="tab" aria-selected="false"><small>04</small><span>数据统计</span></button>
          </div>

          <div class="settingsTools">
            <small>当前为默认设置</small>
            <button type="button" class="restoreAction" disabled>恢复默认</button>
          </div>

          <div class="tabContent" role="tabpanel">
            <p class="preferenceIntro">阅读与动效偏好只调整呈现方式。</p>

            <section class="section">
              <div class="sectionLabel"><h3>阅读排版</h3><span>阅读体验</span></div>
              <div class="sectionCard">
                <div class="settingRow">
                  <div class="settingCopy"><strong>段落舒展</strong><small>为长叙事增加少量行间距</small></div>
                  <button type="button" class="toggle" role="switch" aria-checked="false" aria-label="段落舒展" />
                </div>
              </div>
            </section>

            <section class="section">
              <div class="sectionLabel"><h3>动态表现</h3><span>即时生效</span></div>
              <div class="sectionCard">
                <div class="settingRow">
                  <div class="settingCopy"><strong>减少动态效果</strong><small>保留必要变化，降低装饰动画</small></div>
                  <button type="button" class="toggle" role="switch" aria-checked="false" aria-label="减少动态效果" />
                </div>
              </div>
            </section>

            <section class="section">
              <div class="sectionLabel"><h3>阅读排版</h3><span>当前字体：默认</span></div>
              <div class="sectionCard">
                <div class="groupHeading"><span>字体选择</span><span>当前：默认</span></div>
                <div class="fontGrid" role="group" aria-label="字体选择">
                  <button type="button" class="fontButton" aria-pressed="true">默认</button>
                  <button type="button" class="fontButton" aria-pressed="false">苹方</button>
                  <button type="button" class="fontButton" aria-pressed="false">雅黑</button>
                  <button type="button" class="fontButton" aria-pressed="false">思源黑</button>
                  <button type="button" class="fontButton" aria-pressed="false">宋体</button>
                  <button type="button" class="fontButton" aria-pressed="false">黑体</button>
                  <button type="button" class="fontButton" aria-pressed="false">楷体</button>
                </div>
              </div>
            </section>

            <section class="section">
              <div class="sectionLabel"><h3>叙事显示</h3><span>完整显示</span></div>
              <div class="sectionCard">
                <div class="groupHeading"><span>显示方式</span><span>稳定性优先</span></div>
                <div class="streamGrid" role="group" aria-label="叙事显示方式">
                  <button type="button" class="choiceButton" aria-pressed="true"><span class="choiceTitle">完整显示</span><span class="choiceDescription">接收完成后一次显示，稳定性优先</span></button>
                  <button type="button" class="choiceButton" aria-pressed="false"><span class="choiceTitle">流式显示</span><span class="choiceDescription">边接收边显示，响应速度优先</span></button>
                </div>
              </div>
            </section>

            <section class="section">
              <div class="sectionLabel"><h3>数据管理</h3><span>配置与进度</span></div>
              <div class="sectionCard">
                <p class="supportingText">导出文件包含当前设置；导入时可选择合并现有设置或先恢复默认后覆盖。</p>
                <div class="importModeRow">
                  <span>导入方式</span>
                  <div class="segmentedControl" role="group" aria-label="导入方式">
                    <button type="button" aria-pressed="true">合并</button>
                    <button type="button" aria-pressed="false">覆盖</button>
                  </div>
                </div>
                <div class="dataActions">
                  <button type="button" class="secondaryButton">导出数据</button>
                  <button type="button" class="secondaryButton">导入数据</button>
                  <button type="button" class="dangerButton">重置游戏数据</button>
                </div>
              </div>
            </section>
          </div>

          <footer class="footer">
            <button type="button" class="closeBtn" aria-label="关闭设置">×</button>
            <button type="button" class="doneBtn">
              <span class="doneIndex">返</span>
              <span class="doneCopy"><strong>完成设置</strong><small>所有调整已即时生效</small></span>
              <span class="doneArrow" aria-hidden="true">→</span>
            </button>
          </footer>
        </main>
      </div>
    </div>
  </div>
</body>
</html>
