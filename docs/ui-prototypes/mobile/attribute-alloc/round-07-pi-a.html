<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>属性分配 · 最终首版 · Pi A 冷蓝属性卡</title><link rel="stylesheet" href="../assets/library-history.css">

ht)}.attr-head{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}.name{font-family:"Songti SC",serif;font-size:9px}.bonus{margin-left:5px;color:#69826d;font-family:inherit;font-size:5px}.semantic{margin-top:4px;color:var(--positive);font-size:7px;font-weight:600}.semantic.negative{color:var(--negative)}.base{margin-top:2px;color:var(--faint);font-size:5px}.stepper{display:grid;grid-template-columns:28px 32px 28px;gap:3px;align-items:center}.stepper button{width:28px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--soft);font-size:11px}.value{text-align:center;font-size:10px;font-weight:700}.axis{display:grid;grid-template-columns:repeat(15,1fr);gap:2px;margin-top:8px}.axis i{height:5px;border-radius:4px;background:var(--light);opacity:.75}.axis i.far{height:2px;align-self:center;opacity:.35}.axis i.mid{height:3px;align-self:center;opacity:.55}.axis i.on{background:var(--positive);opacity:1}.axis i.neg{background:var(--negative);opacity:1}.tools{display:grid;grid-template-columns:1fr 1fr;margin:11px auto 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}.tools button{height:33px;border:0;background:var(--surface);color:var(--soft);font-size:7px}.tools button+button{border-left:1px solid var(--line)}.bottom{position:absolute;right:0;bottom:0;left:0;padding:7px 15px 10px;border-top:1px solid var(--line);background:rgba(251,250,247,.95);backdrop-filter:blur(10px)}.bar{display:flex;justify-content:space-between}.action{width:64px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--soft);font-size:7px}.primary{width:112px;border-color:var(--ink);background:var(--ink);color:var(--surface);font-family:"Songti SC",serif;font-size:9px}.dialog{position:absolute;inset:0;z-index:20;display:grid;place-items:end center;padding:18px;background:rgba(41,39,36,.16);opacity:0;visibility:hidden;transition:.2s}.dialog.open{opacity:1;visibility:visible}.dialog-panel{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transform:translateY(8px);transition:.2s}.dialog.open .dialog-panel{transform:none}.dialog-panel h3{margin:0;font-family:"Songti SC",serif;font-size:13px}.dialog-panel p{margin:7px 0 12px;color:var(--soft);font-size:7px;line-height:1.55}.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.dialog-actions button{height:33px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--soft);font-size:7px}.dialog-actions .continue{background:var(--ink);color:var(--surface)}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</head><body data-screen="attribute-alloc" data-pi-variant="A"><a class="pi-history-back" href="index.html">← Pi A · 冷蓝属性卡</a><main class="shell"><div class="topbar"><span>移动端创建流程</span><span>05 / 06</span></div><p class="eyebrow">ATTRIBUTE ALLOCATION · FINAL V1</p><h1>属性分配</h1><p class="subtitle">沿用 F2 四项自由属性、预算分段与远端渐隐轴，并补上剩余点数二次确认。</p><section class="stage"><div class="phone"><div class="screen"><div class="step">NEW LIFE · 05</div><div class="title">塑造你的起点</div><div class="sub">四项属性自由增减；离当前值越远，分段越轻。</div><section class="budget"><div class="score"><div><b class="used">10</b><small>/ 30</small></div></div><div class="budget-copy"><b>剩余点数 <span class="remain">20</span></b><p>命格加成单独显示，不消耗自由属性预算。</p><div class="segments"></div></div></section><div class="caption"><span>四项自由属性</span><span>远端渐隐</span></div><div class="attrs"></div><div class="tools"><button class="reset" type="button">↺ 重置</button><button class="average" type="button">平均分配</button></div></div><footer class="bottom"><div class="bar"><button class="action" data-flow-to="mythic-inheritance">返回</button><button class="action primary confirm" type="button">确认属性</button></div></footer><div class="dialog" role="dialog" aria-modal="true" aria-hidden="true"><div class="dialog-panel"><h3>仍有属性点未使用</h3><p>剩余 <b class="dialog-remain"></b> 点将不会自动分配。你可以返回继续调整，或保留当前配置进入命运预览。</p><div class="dialog-actions"><button class="close" type="button">继续分配</button><button class="continue" data-flow-to="fate-preview">仍然确认</button></div></div></div></div></section></main>
<script>
const attrs=[['体魄',2],['心智',1],['悟性',0],['魅力',0]],initial=[6,4,2,-2],total=30;let values=[...initial];const desc=(v)=>v<0?['略显拘谨','耐力不足','体质虚弱'][Math.min(2,Math.abs(v)-1)]||'属性失衡':v===0?'常人水平':v<5?'渐入佳境':v<9?'天赋出众':'凡俗巅峰';function signed(v){return(v>0?'+':'')+v}function render(){const used=values.reduce((a,b)=>a+b,0),remain=total-used;document.querySelector('.used').textContent=used;document.querySelector('.remain').textContent=remain;document.querySelector('.segments').innerHTML=Array.from({length:15},(_,i)=>'<i class="'+(i<Math.round(Math.max(0,used)/total*15)?'on':'')+'"></i>').join('');document.querySelector('.attrs').innerHTML=attrs.map((a,i)=>{const v=values[i],pos=Math.max(0,Math.min(14,7+Math.round(v/2)));return '<section class="attr"><div class="attr-head"><div><div class="name">'+a[0]+(a[1]?'<span class="bonus">命格 +'+a[1]+'</span>':'')+'</div><div class="semantic '+(v<0?'negative':'')+'">'+desc(v)+'</div><div class="base">基础值 '+signed(v)+'</div></div><div class="stepper"><button data-i="'+i+'" data-d="-1">−</button><span class="value">'+signed(v)+'</span><button data-i="'+i+'" data-d="1">＋</button></div></div><div class="axis">'+Array.from({length:15},(_,n)=>'<i class="'+(Math.abs(n-pos)>5?'far ':Math.abs(n-pos)>2?'mid ':'')+(n===pos?(v<0?'neg':'on'):'')+'"></i>').join('')+'</div></section>'}).join('');document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,d=+b.dataset.d,next=values[i]+d;if(next>=-5&&values.reduce((a,x,j)=>a+(j===i?next:x),0)<=total){values[i]=next;render()}})}document.querySelector('.reset').onclick=()=>{values=[0,0,0,0];render()};document.querySelector('.average').onclick=()=>{values=[8,8,7,7];render()};const dialog=document.querySelector('.dialog');document.querySelector('.confirm').onclick=()=>{const remain=total-values.reduce((a,b)=>a+b,0);if(remain>0){document.querySelector('.dialog-remain').textContent=remain;dialog.classList.add('open');dialog.setAttribute('aria-hidden','false')}else PrototypeFlow.go('fate-preview')};document.querySelector('.close').onclick=()=>{dialog.classList.remove('open');dialog.setAttribute('aria-hidden','true')};render();
</script></body></html>
