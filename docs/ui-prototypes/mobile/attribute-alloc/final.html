<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>属性分配 · AA-RF1-1 布局</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../assets/library.css?v=20260724-semantic-icons-final-1">
  <link rel="stylesheet" href="../assets/creation-flow-unified.css?v=20260723-ui-sync-4">
  <link rel="stylesheet" href="../assets/relative-phone-layout.css?v=20260723-ui-sync-4">
  <script src="../assets/prototype.js?v=20260723-ui-sync-4" defer></script>
  <script src="../assets/creation-flow-unified.js?v=20260723-ui-sync-4" defer></script>
  <script src="../assets/relative-phone-layout.js?v=20260723-ui-sync-4" defer></script>
  <style>
    body.attribute-aa { background: #eef1f7; }
    .attribute-aa .creation-phone {
      --cf-paper: #fafbff;
      --cf-surface: #fff;
      --cf-soft: #f1f3fa;
      --cf-ink: #28324b;
      --cf-muted: #707b92;
      --cf-faint: #929bb0;
      --cf-line: #d8deea;
      --cf-line-strong: #d8deea;
      --cf-accent: #7382bb;
      --cf-accent-soft: #edf0fb;
      width: min(100%, 320px);
      height: 694px;
      border-color: #d8deea;
      border-radius: 34px;
      background: linear-gradient(180deg, #fafbff 0%, #f2f4f9 100%);
      box-shadow: 0 20px 48px rgba(62, 70, 100, .09);
    }
    .attribute-aa .cf-screen { inset: 0; padding: 15px 16px 84px; }
    .attribute-aa .cf-section { margin-top: 10px; border-color: #d8deea; background: rgba(255, 255, 255, .9); }
    .attribute-aa .cf-stepper button:disabled { cursor: not-allowed; opacity: .36; }
    .attribute-aa .cf-tools .cf-secondary-button { min-height: 33px; }
    .attribute-aa .cf-footer {
      z-index: 8;
      border-color: rgba(207, 215, 238, .84);
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 12px 30px rgba(62, 70, 100, .13), 0 2px 7px rgba(62, 70, 100, .06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .attribute-aa .cf-back { border-color: #d8deea; background: rgba(255, 255, 255, .8); color: #707b92; }
    .attribute-aa .cf-next { color: #28324b; }
    .attribute-aa .cf-next-number,
    .attribute-aa .cf-next-copy small { color: #929bb0; }
    .attribute-aa .cf-next-copy strong { font-size: 12.2px; font-weight: 680; }
    .attribute-aa .cf-next-arrow { background: #7382bb; color: #fff; }
    .attribute-aa .cf-dialog-actions .is-primary { border-color: #7382bb; background: #7382bb; color: #fff; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body class="attribute-aa" data-screen="attribute-alloc" data-creation-step="6">
  <main class="creation-shell">
    <header class="creation-review">
      <p class="creation-review-label">CREATION FLOW · 06 / 08</p>
      <h1>属性分配</h1>
      <p class="creation-review-copy">沿用 AA-RF1-1 的预算优先布局，四项基础属性共用 15 点。</p>
    </header>

    <section class="creation-stage" aria-label="属性分配移动端界面">
      <div class="creation-phone" data-relative-phone data-relative-phone-width="320" data-relative-phone-height="694">
        <div class="cf-screen">
          <header class="cf-header" data-creation-header data-title="属性分配" data-subtitle="塑造这段人生的先天起点。"></header>

          <section class="cf-section" aria-labelledby="budget-title">
            <div class="cf-section-head"><strong id="budget-title">基础点数</strong><small>命格加成不占预算</small></div>
            <div class="cf-budget">
              <div class="cf-budget-score"><div><b data-used>12</b><span>/ 15</span></div></div>
              <div class="cf-budget-copy">
                <strong>剩余 <span data-remain aria-live="polite">3</span> 点</strong>
                <p>四项可在 0 至 10 之间调整。</p>
                <div class="cf-meter" data-budget-meter role="progressbar" aria-label="已使用属性点" aria-valuemin="0" aria-valuemax="15" aria-valuenow="12"></div>
              </div>
            </div>
          </section>

          <section class="cf-section" aria-labelledby="attribute-title">
            <div class="cf-section-head"><strong id="attribute-title">四项基础属性</strong><small>数值越高，倾向越明显</small></div>
            <ol class="cf-attribute-list" data-attribute-list></ol>
            <div class="cf-tools">
              <button class="cf-secondary-button" type="button" data-reset>重置</button>
              <button class="cf-secondary-button" type="button" data-average>平均分配</button>
            </div>
          </section>
        </div>

        <footer class="cf-footer">
          <button class="cf-back" type="button" data-flow-to="mythic-inheritance" data-flow-back aria-label="返回命格选择" title="返回命格选择"><span data-icon="back"></span></button>
          <button class="cf-next" type="button" data-confirm><span class="cf-next-number">07</span><span class="cf-next-copy"><strong>确认属性</strong><small data-footer-status>尚余 3 点 · 下一步核对命运</small></span><span class="cf-next-arrow" data-icon="arrow"></span></button>
        </footer>

        <div class="cf-dialog" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="unused-title" data-unused-dialog inert>
          <div class="cf-dialog-panel">
            <h3 id="unused-title">仍有属性点未使用</h3>
            <p>剩余 <strong data-dialog-remain></strong> 点将保留。你可以继续调整，或按当前配置进入命运预览。</p>
            <div class="cf-dialog-actions">
              <button class="cf-secondary-button" type="button" data-dialog-close>继续分配</button>
              <button class="cf-secondary-button is-primary" type="button" data-flow-to="fate-preview">确认并继续</button>
            </div>
          </div>
        </div>
        <div class="cf-toast" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const attributeKeys = ['physique', 'mind', 'talentAptitude', 'charisma']
      const attributeLabels = ['体魄', '心智', '悟性', '魅力']
      const attributeIcons = ['💪', '🧠', '✨', '💫']
      const initial = [6, 4, 2, 0]
      const total = 15
      const minimum = 0
      const maximum = 10
      let values = initial.slice()
      let bonuses = [2, 1, 0, 0]

      const list = document.querySelector('[data-attribute-list]')
      const dialog = document.querySelector('[data-unused-dialog]')
      const closeButton = document.querySelector('[data-dialog-close]')

      function describe(value) {
        if (value === 0) return '常人水平'
        if (value < 5) return '渐入佳境'
        if (value < 9) return '天赋出众'
        return '凡俗巅峰'
      }

      function usedPoints() {
        return values.reduce(function (sum, value) { return sum + value }, 0)
      }

      function talentBonuses(talents) {
        return attributeKeys.map(function (key) {
          return talents.reduce(function (sum, talent) { return sum + Number(talent?.attrBonus?.[key] || 0) }, 0)
        })
      }

      function persistAttributes(used, remain) {
        if (!window.PrototypeFlow) return
        PrototypeFlow.state.write({
          attributes: {
            base: Object.fromEntries(attributeKeys.map(function (key, index) { return [key, values[index]] })),
            used: used,
            remaining: remain,
          },
        })
      }

      function closeDialog() {
        dialog.classList.remove('is-open')
        dialog.setAttribute('aria-hidden', 'true')
        dialog.inert = true
        document.querySelector('[data-confirm]').focus()
      }

      function render() {
        const used = usedPoints()
        const remain = total - used
        persistAttributes(used, remain)
        document.querySelector('[data-used]').textContent = used
        document.querySelector('[data-remain]').textContent = remain
        document.querySelector('[data-footer-status]').textContent = remain > 0
          ? `尚余 ${remain} 点 · 下一步核对命运`
          : '预算已分配 · 下一步核对命运'
        const meter = document.querySelector('[data-budget-meter]')
        meter.setAttribute('aria-valuenow', used)
        meter.setAttribute('aria-valuetext', `已使用 ${used} 点，剩余 ${remain} 点`)
        meter.innerHTML = Array.from({ length: 15 }, function (_, index) {
          return `<i class="${index < used ? 'is-on' : ''}"></i>`
        }).join('')

        list.innerHTML = attributeLabels.map(function (label, index) {
          const value = values[index]
          const axisPosition = Math.round(value / maximum * 14)
          const cannotDecrease = value <= minimum
          const cannotIncrease = value >= maximum || remain <= 0
          const bonus = bonuses[index] ? ` · 命格 ${bonuses[index] > 0 ? '+' : ''}${bonuses[index]}` : ''
          const axis = Array.from({ length: 15 }, function (_, axisIndex) {
            const distance = Math.abs(axisIndex - axisPosition)
            const classes = [distance > 5 ? 'is-far' : distance > 2 ? 'is-mid' : '', axisIndex === axisPosition ? 'is-on' : ''].filter(Boolean).join(' ')
            return `<i class="${classes}"></i>`
          }).join('')
          return `<li class="cf-attribute">
            <div class="cf-attribute-name"><strong><span class="semantic-emoji" aria-hidden="true">${attributeIcons[index]}</span>${label}</strong><span>${describe(value)}${bonus}</span><span class="cf-attribute-base">基础值 ${value}</span></div>
            <div class="cf-stepper">
              <button type="button" data-index="${index}" data-delta="-1" aria-label="降低${label}"${cannotDecrease ? ' disabled' : ''}>−</button>
              <b>${value}</b>
              <button type="button" data-index="${index}" data-delta="1" aria-label="提高${label}"${cannotIncrease ? ' disabled' : ''}>＋</button>
            </div>
            <div class="cf-axis" aria-hidden="true">${axis}</div>
          </li>`
        }).join('')
      }

      list.addEventListener('click', function (event) {
        const button = event.target.closest('[data-delta]')
        if (!button || button.disabled) return
        const index = Number(button.dataset.index)
        const next = values[index] + Number(button.dataset.delta)
        const nextUsed = values.reduce(function (sum, value, valueIndex) {
          return sum + (valueIndex === index ? next : value)
        }, 0)
        if (next < minimum || next > maximum || nextUsed > total) return
        values[index] = next
        render()
      })

      document.querySelector('[data-reset]').addEventListener('click', function () {
        values = initial.slice()
        render()
        CreationFlow.notify('已恢复初始属性')
      })

      document.querySelector('[data-average]').addEventListener('click', function () {
        values = [4, 4, 4, 3]
        render()
        CreationFlow.notify('15 点已平均分配')
      })

      document.querySelector('[data-confirm]').addEventListener('click', function () {
        const remain = total - usedPoints()
        if (remain <= 0) {
          PrototypeFlow.go('fate-preview')
          return
        }
        document.querySelector('[data-dialog-remain]').textContent = remain
        dialog.classList.add('is-open')
        dialog.setAttribute('aria-hidden', 'false')
        dialog.inert = false
        closeButton.focus()
      })

      closeButton.addEventListener('click', closeDialog)
      dialog.addEventListener('click', function (event) { if (event.target === dialog) closeDialog() })
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && dialog.classList.contains('is-open')) closeDialog()
      })

      document.addEventListener('DOMContentLoaded', function () {
        const flow = PrototypeFlow.state.read()
        bonuses = talentBonuses(Array.isArray(flow.talents) ? flow.talents : [])
        const stored = flow.attributes?.base
        if (stored) {
          const restored = attributeKeys.map(function (key) { return Number(stored[key]) })
          if (restored.every(function (value) { return Number.isFinite(value) && value >= minimum && value <= maximum })
            && restored.reduce(function (sum, value) { return sum + value }, 0) <= total) values = restored
        }
        render()
      }, { once: true })

      render()
    })()
  </script>
</body>
</html>
