  <script>
    (() => {
      const presetWorlds = {
        '现代地球': { name: '现代地球', era: '公元 2000 年', description: '互联网正在改变生活，平凡人生也会被时代推动。' },
        '武道割据': { name: '武道割据', era: '乱世江湖', description: '门派林立、恩怨纠葛，一技之长即可改写命运。' },
        'SCP基金会': { name: 'SCP 基金会', era: '当代异常收容', description: '日常表象之下，异常项目被严密收容与研究。' },
        '战锤40K': { name: '战锤 40K', era: '遥远的未来', description: '帝国与异族永世征战，个体在星海中微不足道。' },
        '赛博2077': { name: '赛博 2077', era: '公元 2077 年', description: '义体改造与企业统治交织，街头是普通人争取自由的地方。' },
        '修真世界': { name: '修真世界', era: '仙道纪元', description: '灵根与功法决定起点，长生之路布满试炼。' },
        '蒸汽纪元': { name: '蒸汽纪元', era: '工业历 77 年', description: '浮空舰与蒸汽机关连接群岛，远航者重新绘制世界边界。' },
        '末日废土': { name: '末日废土', era: '灾变后 19 年', description: '旧秩序崩塌之后，聚落在匮乏与互助之间艰难重建。' },
        '星海联邦': { name: '星海联邦', era: '联邦历 406 年', description: '人类跨越星门建立联邦，身份与故乡都有了新的尺度。' },
        '魔法学院': { name: '魔法学院', era: '银塔历 312 年', description: '年轻施法者在古老学院学习秘术，也承担知识带来的代价。' },
        '神话洪荒': { name: '神话洪荒', era: '诸神纪元', description: '天地初定、神祇行世，凡人的选择也会卷入宏大因果。' },
        '寂静极地': { name: '寂静极地', era: '远征第 8 年', description: '长夜笼罩极地城站，补给、信任与归途同样珍贵。' }
      };
      const initialSaved = [
        { id: 'tide', original: { name: '潮汐城邦', era: '群岛历 218 年', description: '潮汐决定城市的贸易节律、迁徙方向与每个人回家的时间。' }, updated: '最近修改' },
        { id: 'ember', original: { name: '余烬花园', era: '灾后 31 年', description: '人们在旧城废墟的温室里重建共同体，水与种子比货币更珍贵。' }, updated: '昨日保存' }
      ];
      const levels = ['轻松', '普通', '艰难'];
      const clone = value => JSON.parse(JSON.stringify(value));
      const sourceNames = { saved: '保存世界', custom: '自定义世界', preset: '预设世界' };

      document.querySelectorAll('[data-app]').forEach((app, index) => {
        app.append(document.querySelector('#page-template').content.cloneNode(true));
        app.append(document.querySelector('#overlay-template').content.cloneNode(true));
        const sourceArea = app.querySelector('.source-area');
        const presetSection = sourceArea.querySelector('[data-source-panel="preset"]');
        sourceArea.prepend(presetSection);
        presetSection.querySelector('.section-body').append(presetSection.querySelector('[data-open-more]'));
        const sourceTabs = app.querySelector('.source-tabs');
        sourceTabs.prepend(sourceTabs.querySelector('[data-source-tab="preset"]'));
        sourceTabs.setAttribute('role', 'tablist');
        sourceTabs.querySelectorAll('[data-source-tab]').forEach(button => {
          const source = button.dataset.sourceTab;
          const panel = app.querySelector(`[data-source-panel="${source}"]`);
          button.id = `world-source-tab-${index + 1}-${source}`;
          button.setAttribute('role', 'tab');
          button.setAttribute('aria-controls', `world-source-panel-${index + 1}-${source}`);
          panel.id = `world-source-panel-${index + 1}-${source}`;
          panel.setAttribute('role', 'tabpanel');
          panel.setAttribute('aria-labelledby', button.id);
        });
        const title = app.querySelector('[data-dialog-title]');
        title.id = `world-select-final-dialog-title-${index + 1}`;
        app.querySelector('.dialog').setAttribute('aria-labelledby', title.id);
      });

      const showToast = (app, message) => {
        const toast = app.querySelector('.phone-toast');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.remove('show'), 1500);
      };
      const hideToast = app => {
        const toast = app.querySelector('.phone-toast');
        clearTimeout(toast._timer);
        toast.classList.remove('show');
      };
      const closeOverlays = app => {
        const active = document.activeElement;
        const activeOverlay = active instanceof HTMLElement && app.contains(active) && (active.closest('.sheet.open') || active.closest('[data-dialog-layer].open'));
        if (activeOverlay) {
          const fallback = app._overlayTrigger?.isConnected ? app._overlayTrigger : app.querySelector('[data-confirm]');
          fallback?.focus({ preventScroll: true });
        }
        app.querySelectorAll('.sheet.open').forEach(sheet => {
          sheet.classList.remove('open');
          sheet.setAttribute('aria-hidden', 'true');
        });
        const layer = app.querySelector('[data-dialog-layer]');
        layer.classList.remove('open');
        layer.setAttribute('aria-hidden', 'true');
        app._overlayTrigger = null;
      };
      const openSheet = (app, name) => {
        const trigger = document.activeElement;
        hideToast(app);
        closeOverlays(app);
        app._overlayTrigger = trigger instanceof HTMLElement && app.contains(trigger) ? trigger : null;
        const sheet = app.querySelector(`[data-sheet="${name}"]`);
        sheet.classList.add('open');
        sheet.setAttribute('aria-hidden', 'false');
      };

      const activatePanel = (app, state, panel) => {
        state.activePanel = panel;
        app.querySelectorAll('[data-source-tab]').forEach(button => {
          const selected = button.dataset.sourceTab === panel;
          button.setAttribute('aria-selected', String(selected));
          button.tabIndex = selected ? 0 : -1;
        });
        app.querySelectorAll('[data-source-panel]').forEach(section => section.classList.toggle('is-tab-active', section.dataset.sourcePanel === panel));
      };
      const openAccordion = (app, state, panel) => {
        state.openPanel = panel;
        app.querySelectorAll('[data-source-panel]').forEach(section => {
          const open = section.dataset.sourcePanel === panel;
          section.classList.toggle('is-open', open);
          section.querySelector('[data-section-toggle]').setAttribute('aria-expanded', String(open));
        });
      };
      const updateSelection = (app, state) => {
        const draft = state.draft || { name: '', era: '', description: '' };
        const world = state.selectedWorld;
        const display = world || (state.source === 'custom' ? {
          name: draft.name || '未命名世界',
          era: draft.era || '年代未定',
          description: draft.description || '继续写下这个世界的样子与一条核心规则。'
        } : { name: '尚未选择', era: '等待选择', description: '选择或写下一方世界，作为这段人生的开端。' });
        app.dataset.selectedWorld = world?.name || '';
        app.dataset.source = state.source;
        app.querySelector('[data-source-label]').textContent = sourceNames[state.source] || '当前世界';
        app.querySelector('[data-current-label]').textContent = display.name;
        app.querySelector('[data-current-era]').textContent = display.era;
        app.querySelector('[data-current-rule]').textContent = display.description;
        app.querySelector('[data-fact-source]').textContent = { saved: '已保存', custom: '自定义', preset: '预设' }[state.source] || '待选择';
        app.querySelector('[data-fact-era]').textContent = display.era;
        app.querySelector('[data-fact-level]').textContent = levels[state.difficultyIndex];
        app.querySelector('[data-confirm-label]').textContent = world ? '确认世界' : '补全自定义世界';
        app.querySelector('[data-confirm-hint]').textContent = world ? `${world.name} · 下一步世界配置` : '名称、年代与描述缺一不可';
        app.querySelector('[data-confirm]').disabled = !world;
      };
      const setPresetState = (app, state) => app.querySelectorAll('[data-preset]').forEach(button => button.setAttribute('aria-selected', String(state.source === 'preset' && button.dataset.preset === state.selectedPreset)));
      const renderSaved = (app, state) => {
        const list = app.querySelector('[data-saved-list]');
        list.replaceChildren();
        state.saved.forEach(entry => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'saved-choice';
          button.dataset.savedId = entry.id;
          button.setAttribute('aria-pressed', String(state.source === 'saved' && state.selectedSavedId === entry.id));
          const copy = document.createElement('span');
          const name = document.createElement('strong');
          const summary = document.createElement('small');
          const description = document.createElement('p');
          const status = document.createElement('span');
          name.textContent = entry.current.name;
          summary.textContent = `${entry.current.era} · ${entry.updated}`;
          description.className = 'saved-description';
          description.textContent = entry.current.description;
          status.textContent = '已选';
          copy.append(name, summary, description);
          button.append(copy, status);
          button.addEventListener('click', () => selectSaved(app, state, entry.id));
          list.append(button);
        });
        app.querySelector('[data-saved-count]').textContent = `${state.saved.length} 个`;
        app.querySelector('[data-manage-row]').hidden = !(state.source === 'saved' && state.selectedSavedId);
      };
      const selectSaved = (app, state, id) => {
        const entry = state.saved.find(item => item.id === id);
        if (!entry) return;
        state.source = 'saved';
        state.selectedSavedId = id;
        state.selectedPreset = '';
        state.selectedWorld = clone(entry.current);
        activatePanel(app, state, 'saved');
        openAccordion(app, state, 'saved');
        renderSaved(app, state);
        setPresetState(app, state);
        updateSelection(app, state);
        showToast(app, `已选择保存世界 · ${entry.current.name}`);
      };
      const selectPreset = (app, state, key) => {
        const world = presetWorlds[key];
        if (!world) return;
        state.source = 'preset';
        state.selectedSavedId = '';
        state.selectedPreset = key;
        state.selectedWorld = clone(world);
        activatePanel(app, state, 'preset');
        openAccordion(app, state, 'preset');
        renderSaved(app, state);
        setPresetState(app, state);
        updateSelection(app, state);
        closeOverlays(app);
        showToast(app, `已选择预设世界 · ${world.name}`);
      };
      const syncCustom = (app, state) => {
        const fields = Object.fromEntries([...app.querySelectorAll('[data-custom-field]')].map(field => [field.dataset.customField, field.value.trim()]));
        if (!Object.values(fields).some(Boolean) && state.source !== 'custom') return;
        state.source = 'custom';
        state.draft = fields;
        state.selectedSavedId = '';
        state.selectedPreset = '';
        state.selectedWorld = Object.values(fields).every(Boolean) ? fields : null;
        activatePanel(app, state, 'custom');
        openAccordion(app, state, 'custom');
        renderSaved(app, state);
        setPresetState(app, state);
        updateSelection(app, state);
      };
      const openEdit = (app, state) => {
        const entry = state.saved.find(item => item.id === state.selectedSavedId);
        if (!entry) return;
        state.editingId = entry.id;
        const form = app.querySelector('[data-edit-form]');
        form.elements.name.value = entry.current.name;
        form.elements.era.value = entry.current.era;
        form.elements.description.value = entry.current.description;
        form.querySelector('[data-edit-status]').textContent = '';
        openSheet(app, 'edit');
        form.elements.name.focus({ preventScroll: true });
      };
      const openDialog = (app, state, action) => {
        const entry = state.saved.find(item => item.id === state.selectedSavedId);
        if (!entry) return;
        hideToast(app);
        app._overlayTrigger = document.activeElement instanceof HTMLElement && app.contains(document.activeElement) ? document.activeElement : null;
        state.pendingAction = action;
        const deleting = action === 'delete';
        app.querySelector('[data-dialog-title]').textContent = deleting ? '删除保存世界？' : '重置保存世界？';
        app.querySelector('[data-dialog-copy]').textContent = deleting ? `“${entry.current.name}”将从保存列表移除，此操作无法撤销。` : `“${entry.current.name}”将恢复为首次保存时的名称、年代与描述。`;
        app.querySelector('[data-dialog-confirm]').textContent = deleting ? '确认删除' : '确认重置';
        const layer = app.querySelector('[data-dialog-layer]');
        layer.classList.add('open');
        layer.setAttribute('aria-hidden', 'false');
        app.querySelector('[data-dialog-confirm]').focus({ preventScroll: true });
      };

      document.querySelectorAll('[data-app]').forEach(app => {
        const state = {
          saved: initialSaved.map(entry => ({ ...clone(entry), current: clone(entry.original) })),
          source: 'saved', selectedSavedId: 'tide', selectedPreset: '', selectedWorld: clone(initialSaved[0].original),
          draft: { name: '', era: '', description: '' }, difficultyIndex: 1, editingId: '', pendingAction: '', activePanel: 'saved', openPanel: 'saved'
        };
        app._state = state;
        renderSaved(app, state);
        setPresetState(app, state);
        updateSelection(app, state);
        activatePanel(app, state, 'saved');
        openAccordion(app, state, 'saved');
        app.querySelectorAll('[data-source-tab]').forEach(button => button.addEventListener('click', () => activatePanel(app, state, button.dataset.sourceTab)));
        app.querySelectorAll('[data-section-toggle]').forEach(button => button.addEventListener('click', () => {
          const panel = button.closest('[data-source-panel]').dataset.sourcePanel;
          activatePanel(app, state, panel);
          openAccordion(app, state, panel);
        }));
        app.querySelectorAll('[data-preset]').forEach(button => button.addEventListener('click', () => selectPreset(app, state, button.dataset.preset)));
        app.querySelectorAll('[data-more-preset]').forEach(button => button.addEventListener('click', () => selectPreset(app, state, button.dataset.morePreset)));
        const autosizeDescription = textarea => {
          textarea.style.height = 'auto';
          const maxHeight = Math.round(app.closest('.phone').clientHeight * .21);
          textarea.style.height = `${Math.min(textarea.scrollHeight, maxHeight)}px`;
        };
        app.querySelectorAll('textarea[data-custom-field="description"]').forEach(autosizeDescription);
        app.querySelectorAll('[data-custom-field]').forEach(field => field.addEventListener('input', () => {
          if (field instanceof HTMLTextAreaElement) autosizeDescription(field);
          syncCustom(app, state);
        }));
        app.querySelectorAll('[data-manage]').forEach(button => button.addEventListener('click', () => button.dataset.manage === 'edit' ? openEdit(app, state) : openDialog(app, state, button.dataset.manage)));
        app.querySelectorAll('[data-close-overlay], [data-dialog-cancel]').forEach(button => button.addEventListener('click', () => closeOverlays(app)));
        app.querySelector('[data-open-more]').addEventListener('click', event => { event.stopPropagation(); openSheet(app, 'more'); });
        app.querySelector('[data-difficulty-cycle]').addEventListener('click', () => {
          state.difficultyIndex = (state.difficultyIndex + 1) % levels.length;
          const value = levels[state.difficultyIndex];
          app.dataset.difficultyValue = value;
          app.querySelector('[data-difficulty-label]').textContent = value;
          app.querySelector('[data-fact-level]').textContent = value;
          showToast(app, `人生难度 · ${value}`);
        });
        app.querySelector('[data-edit-form]').addEventListener('submit', event => {
          event.preventDefault();
          const form = event.currentTarget;
          const values = { name: form.elements.name.value.trim(), era: form.elements.era.value.trim(), description: form.elements.description.value.trim() };
          if (!Object.values(values).every(Boolean)) { form.querySelector('[data-edit-status]').textContent = '请补全名称、年代与描述。'; return; }
          const entry = state.saved.find(item => item.id === state.editingId);
          if (!entry) return;
          entry.current = values;
          entry.updated = '刚刚修改';
          if (state.source === 'saved' && state.selectedSavedId === entry.id) state.selectedWorld = clone(values);
          closeOverlays(app);
          renderSaved(app, state);
          updateSelection(app, state);
          showToast(app, `已保存修改 · ${values.name}`);
        });
        app.querySelector('[data-dialog-confirm]').addEventListener('click', () => {
          const entry = state.saved.find(item => item.id === state.selectedSavedId);
          if (!entry) return;
          if (state.pendingAction === 'reset') {
            entry.current = clone(entry.original);
            entry.updated = '已重置';
            state.selectedWorld = clone(entry.current);
            closeOverlays(app);
            renderSaved(app, state);
            updateSelection(app, state);
            showToast(app, `已重置 · ${entry.current.name}`);
            return;
          }
          if (state.pendingAction === 'delete') {
            const deletedName = entry.current.name;
            state.saved = state.saved.filter(item => item.id !== entry.id);
            closeOverlays(app);
            if (state.saved.length) selectSaved(app, state, state.saved[0].id); else selectPreset(app, state, '现代地球');
            showToast(app, `已删除 · ${deletedName}`);
          }
        });
        app.querySelector('[data-back]').addEventListener('click', () => showToast(app, '返回欢迎页 · 当前选择将保留'));
        app.querySelector('[data-confirm]').addEventListener('click', () => { if (state.selectedWorld) showToast(app, `已确认“${state.selectedWorld.name}” · 下一步：世界配置`); });
      });
      document.addEventListener('keydown', event => { if (event.key === 'Escape') document.querySelectorAll('[data-app]').forEach(closeOverlays); });
    })();
  </script>
</body>
</html>
