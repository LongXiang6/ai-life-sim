<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>世界选择 · 第一轮候选 02 · 精简单列统一</title>
  <style>
    /* Purpose: Static prototype of the refined minimal single-column world-select candidate. Owner: Interface system. Responsibility: Candidate only; inherits the finalized baseline (warm-paper color, original button specs, unified rhythm, equal-width bottom bar). */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #2e2922;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      position: relative;
      isolation: isolate;
      display: grid;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      place-items: stretch;
      background: #fdf9f1;
      color-scheme: light;
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    @media (min-width: 48rem) {
      .viewport {
        width: min(100%, 30rem);
      }
    }

    .page {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      background: #fdf9f1;
      color: #2e2922;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    }

    .screen {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      padding: 22px 28px 16px;
      overflow: hidden;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #8a7f6e;
      font-size: 11px;
      font-weight: 650;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      padding: 20px 4px 12px;
    }

    .header h1 {
      margin: 0;
      color: #241f18;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    /* 世界聚焦 Stage：卡片化 20px 圆角 */
    .stage {
      position: relative;
      margin-top: 4px;
      padding: 18px 16px 14px;
      border: 1px solid #e5e1d6;
      border-radius: 20px;
      background: #fffdf8;
    }

    .difficultyOptions {
      position: absolute;
      top: 16px;
      right: 16px;
      display: grid;
      min-width: 92px;
      min-height: 42px;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      align-items: center;
      column-gap: 6px;
      row-gap: 1px;
      padding: 6px 8px 6px 12px;
      border: 1px solid #cfd7ee;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(62, 70, 100, 0.06);
      cursor: pointer;
      color: inherit;
      font: inherit;
      text-align: left;
    }

    .difficultyOptions > span {
      grid-column: 1;
      grid-row: 1;
      color: #8a7f6e;
      font-size: 10px;
      font-weight: 650;
      line-height: 1.15;
    }

    .difficultyActive {
      grid-column: 1;
      grid-row: 2;
      color: #2e2922;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
    }

    .difficultyArrow {
      display: grid;
      grid-column: 2;
      grid-row: 1 / span 2;
      width: 10px;
      height: 10px;
      place-items: center;
      padding: 3px;
      border-radius: 50%;
      background: #977026;
      box-sizing: content-box;
      color: #fff;
    }

    .difficultyArrow path {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .stageCopy {
      max-width: calc(100% - 110px);
      padding-top: 4px;
    }

    .stageSource {
      display: block;
      color: #977026;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
    }

    .stageTitle {
      margin: 6px 0 0;
      overflow: hidden;
      color: #241f18;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stageEra {
      margin-top: 3px;
      overflow: hidden;
      color: #8a7f6e;
      font-size: 11px;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ruleSummary {
      display: grid;
      min-height: 38px;
      grid-template-columns: 48px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 12px;
      background: #faf4e8;
    }

    .ruleSummary span {
      color: #a0907a;
      font-size: 10px;
      line-height: 1.45;
    }

    .ruleSummary p {
      display: block;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: #6b4d1d;
      font-size: 11px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ruleGrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .ruleItem {
      min-width: 0;
      padding: 9px 10px;
      border-radius: 12px;
      background: #faf4e8;
    }

    .ruleItem span,
    .ruleItem strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ruleItem span {
      color: #a0907a;
      font-size: 10px;
    }

    .ruleItem strong {
      margin-top: 3px;
      color: #6b4d1d;
      font-size: 11px;
      font-weight: 650;
    }

    /* 来源 Tabs：金色下划线 */
    .sourceTabs {
      display: grid;
      flex: 0 0 auto;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      margin-top: 14px;
      padding: 0 4px;
      border-bottom: 1px solid #eadfce;
    }

    .sourceTabs button {
      min-height: 44px;
      padding: 0 4px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: #8a7f6e;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.15;
    }

    .sourceTabs button[data-active="true"] {
      border-bottom-color: #977026;
      color: #241f18;
      font-weight: 700;
    }

    /* 来源面板：预设世界 */
    .content {
      min-height: 0;
      flex: 1;
      padding: 14px 0 0;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    .mainGrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .worldCard {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 44px;
      align-items: center;
      gap: 4px;
      padding: 6px 6px;
      border: 1px solid #e5e1d6;
      border-radius: 12px;
      background: #fffdf8;
      color: #6b4d1d;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 650;
      line-height: 1.2;
      text-align: left;
    }

    .worldCard[data-selected="true"] {
      border-color: #d8c9a8;
      background: #faf4e8;
      color: #6b4d1d;
      font-weight: 700;
    }

    .worldIcon {
      display: inline-grid;
      width: 1.2em;
      place-items: center;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      font-size: 1.05em;
      line-height: 1;
    }

    .worldName {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .moreTrigger {
      display: flex;
      width: 100%;
      min-height: 34px;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
      padding: 3px 0;
      border: 0;
      background: transparent;
      color: #977026;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      text-align: center;
    }

    /* 底部：双文字等宽纯白同底按钮（定版） */
    .bottomBar {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: 10px;
      padding: 10px 20px 16px;
      border-top: 1px solid #eadfce;
      background: #fdf9f1;
    }

    .backButton,
    .confirmButton {
      display: grid;
      min-height: 46px;
      place-items: center;
      gap: 0;
      padding: 8px 12px;
      border: 1px solid #e5e1d6;
      border-radius: 24px;
      background: #fff;
      color: #2e2922;
      cursor: pointer;
      font: inherit;
      text-align: center;
    }

    .backButton strong,
    .backButton small,
    .confirmButton strong,
    .confirmButton small {
      display: block;
    }

    .backButton strong,
    .confirmButton strong {
      font-size: 14px;
      font-weight: 650;
    }

    .backButton small,
    .confirmButton small {
      margin-top: 2px;
      color: #8a7f6e;
      font-size: 11px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="viewport">
      <main class="page">
        <div class="screen">
          <div class="meta" aria-hidden="true"><span>AI LIFE SIM · 命书</span><span>01 / 08</span></div>
          <header class="header">
            <div><h1>选择世界</h1></div>
          </header>

          <section class="stage" aria-label="当前世界规则摘要">
            <button type="button" class="difficultyOptions" aria-label="切换人生难度，当前均衡">
              <span>难度</span>
              <strong class="difficultyActive">均衡</strong>
              <svg class="difficultyArrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
            </button>
            <div class="stageCopy">
              <span class="stageSource">预设世界</span>
              <h2 class="stageTitle">星际纪元</h2>
              <p class="stageEra">公元 2200 年</p>
            </div>
            <div class="ruleSummary">
              <span>规则摘要</span>
              <p>人类踏入深空，文明在星海间重新书写秩序与命运。</p>
            </div>
            <div class="ruleGrid" aria-label="世界概览">
              <div class="ruleItem"><span>来源</span><strong>预设世界</strong></div>
              <div class="ruleItem"><span>年代</span><strong>公元 2200</strong></div>
              <div class="ruleItem"><span>难度</span><strong>均衡</strong></div>
            </div>
          </section>

          <nav class="sourceTabs" role="tablist" aria-label="世界来源">
            <button type="button" role="tab" data-active="false">已保存</button>
            <button type="button" role="tab" data-active="false">自定义</button>
            <button type="button" role="tab" data-active="true">预设世界</button>
          </nav>

          <section class="content" role="tabpanel" aria-label="预设世界">
            <div class="mainGrid">
              <button type="button" class="worldCard" data-selected="true">
                <span class="worldIcon">🌌</span><span class="worldName">星际纪元</span>
              </button>
              <button type="button" class="worldCard" data-selected="false">
                <span class="worldIcon">🏔️</span><span class="worldName">灵山古境</span>
              </button>
              <button type="button" class="worldCard" data-selected="false">
                <span class="worldIcon">🏙️</span><span class="worldName">霓虹都市</span>
              </button>
            </div>
            <button type="button" class="moreTrigger">更多预设世界</button>
          </section>
        </div>
        <div class="bottomBar">
          <button type="button" class="backButton" title="返回上一页">
            <strong>返回上一页</strong>
            <small>退出世界选择</small>
          </button>
          <button type="button" class="confirmButton" title="确认世界">
            <strong>确认世界</strong>
            <small>下一步世界配置</small>
          </button>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
