<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>世界选择 · 第一轮候选 01 · 当前运行基线</title>
  <style>
    /* Purpose: Static prototype reproducing the current world-select runtime. Owner: Interface system. Responsibility: Candidate only; restores the B1 colorway and runtime structure without runtime state logic. */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      position: relative;
      isolation: isolate;
      display: grid;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      place-items: stretch;
      background: #f2f4f9;
      color-scheme: light;
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    @media (min-width: 48rem) {
      .viewport {
        width: min(100%, 30rem);
      }
    }

    /* B1 蓝白色系（还原运行时） */
    .page {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scrollbar-width: none;
      -ms-overflow-style: none;
      background: linear-gradient(135deg, rgba(255, 215, 95, .11) 0%, rgba(255, 215, 95, 0) 34%), linear-gradient(#fafbff, #f2f4f9);
      color: #28324b;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      font-size: 14px;
    }

    .page::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .container {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      padding: 0;
    }

    .paper {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 100%;
      padding: 15px 16px calc(78px + env(safe-area-inset-bottom));
      background: transparent;
    }

    .paper::before,
    .paper::after {
      position: absolute;
      z-index: 0;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, transparent 16%, #7787c0 16%, #7787c0 17%, transparent 17%),
        radial-gradient(circle at center, transparent 29%, #7787c0 29%, #7787c0 30%, transparent 30%),
        radial-gradient(circle at center, transparent 42%, #7787c0 42%, #7787c0 43%, transparent 43%),
        radial-gradient(circle at center, transparent 52%, #7787c0 52%, #7787c0 53%, transparent 53%);
      opacity: 0.04;
      content: '';
      pointer-events: none;
    }

    .paper::before {
      top: 0;
      left: 0;
      transform: translate(-50%, -50%);
    }

    .paper::after {
      top: 0;
      right: 0;
      transform: translate(50%, -50%);
    }

    .header {
      position: relative;
      z-index: 1;
    }

    .runningHead {
      display: flex;
      min-height: 12px;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      color: #929bb0;
      font-size: 7px;
      font-weight: 650;
      line-height: 1.3;
    }

    .titleRow {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-top: 5px;
    }

    .headerTitle {
      margin: 0;
      color: #28324b;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.15;
    }

    /* 世界聚焦 Stage */
    .stage {
      position: relative;
      z-index: 1;
      min-height: 0;
      margin-top: 9px;
      padding: 13px 15px;
      overflow: hidden;
      border: 1px solid #d8deea;
      border-radius: 16px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 10px 28px rgba(24, 28, 34, .055);
    }

    .difficultySection {
      position: absolute;
      z-index: 2;
      top: 24px;
      right: 15px;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .difficultyOptions {
      display: grid;
      min-width: 88px;
      min-height: 42px;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      align-items: center;
      column-gap: 6px;
      row-gap: 1px;
      padding: 6px 7px 6px 10px;
      border: 1px solid #d8deea;
      border-radius: 13px;
      background: rgba(255, 255, 255, .8);
      box-shadow: inset 0 1px rgba(255, 255, 255, .96), 0 4px 11px rgba(62, 70, 100, .045);
      cursor: pointer;
      color: inherit;
      font: inherit;
      text-align: left;
    }

    .difficultyOptions > span {
      grid-column: 1;
      grid-row: 1;
      color: #929bb0;
      font-size: 7.2px;
      font-weight: 650;
      line-height: 1.15;
    }

    .difficultyActive {
      grid-column: 1;
      grid-row: 2;
      color: #28324b;
      font-size: 10.5px;
      font-weight: 680;
      line-height: 1.2;
    }

    .difficultyArrow {
      display: grid;
      grid-column: 2;
      grid-row: 1 / span 2;
      width: 9px;
      height: 9px;
      place-items: center;
      padding: 3px;
      border-radius: 50%;
      background: #7382bb;
      box-sizing: content-box;
      color: #fff;
    }

    .difficultyArrow path {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .stageCopy {
      position: relative;
      min-width: 0;
    }

    .focusTop {
      display: flex;
      max-width: calc(100% - 100px);
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .stageSource {
      display: block;
      color: #7382bb;
      font-size: 7px;
      font-weight: 700;
      line-height: 1.3;
    }

    .focusIndex {
      color: #929bb0;
      font-size: 7px;
      font-variant-numeric: tabular-nums;
      line-height: 1.3;
    }

    .stageTitle {
      max-width: calc(100% - 100px);
      margin: 5px 0 0;
      overflow: hidden;
      color: #28324b;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stageEra {
      max-width: calc(100% - 100px);
      margin-top: 3px;
      overflow: hidden;
      color: #707b92;
      font-size: 8px;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ruleSummary {
      display: grid;
      height: 32px;
      min-height: 0;
      grid-template-columns: 44px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      margin-top: 9px;
      padding: 7px 8px;
      border-radius: 9px;
      background: #f7f8f9;
    }

    .ruleSummary span {
      color: #929bb0;
      font-size: 7px;
      line-height: 1.45;
    }

    .ruleSummary p {
      display: block;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: #707b92;
      font-size: 7.1px;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ruleGrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      margin-top: 7px;
    }

    .ruleItem {
      min-width: 0;
      padding: 6px 7px;
      border-radius: 9px;
      background: #f1f3fa;
    }

    .ruleItem span,
    .ruleItem strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ruleItem span {
      color: #929bb0;
      font-size: 6px;
    }

    .ruleItem strong {
      margin-top: 3px;
      color: #707b92;
      font-size: 7.1px;
      font-weight: 650;
    }

    /* 来源 Tabs */
    .sourceTabs {
      display: grid;
      height: 38px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 3px;
      margin-top: 9px;
    }

    .sourceTabs button {
      min-width: 0;
      padding: 0 3px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #707b92;
      cursor: pointer;
      font: inherit;
      font-size: 8.8px;
      font-weight: 600;
      line-height: 1.15;
    }

    .sourceTabs button[data-active="true"] {
      background: #edf0fb;
      color: #7382bb;
    }

    /* 来源面板：预设世界 */
    .sourcePanel {
      margin-top: 7px;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .mainGrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
    }

    .worldCard {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 30px;
      align-items: center;
      gap: 3px;
      padding: 4px 3px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: rgba(255, 255, 255, .94);
      color: #707b92;
      cursor: pointer;
      font: inherit;
      font-size: 8px;
      font-weight: 600;
      line-height: 1.2;
      text-align: left;
    }

    .worldCard[data-selected="true"] {
      border-color: #d9e0e8;
      background: #edf0fb;
      color: #28324b;
      font-weight: 700;
    }

    .worldIcon {
      display: inline-grid;
      width: 1.2em;
      place-items: center;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      font-size: 1.05em;
      line-height: 1;
    }

    .worldName {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .moreTrigger {
      display: flex;
      width: 100%;
      min-height: 26px;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
      padding: 3px 0;
      border: 0;
      background: transparent;
      color: #7382bb;
      cursor: pointer;
      font: inherit;
      font-size: 8.5px;
      font-weight: 700;
      text-align: center;
    }

    /* 底部：圆形返回 + 02 确认世界（还原运行时） */
    .bottomBar {
      position: absolute;
      z-index: 20;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      min-height: 68px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid #d8deea;
      background: linear-gradient(180deg, rgba(250, 251, 255, .92), #f2f4f9);
    }

    .backButton {
      display: grid;
      width: 44px;
      min-width: 44px;
      height: 44px;
      place-items: center;
      padding: 0;
      border: 1px solid #d8deea;
      border-radius: 50%;
      background: rgba(255, 255, 255, .96);
      color: #707b92;
      cursor: pointer;
      font: inherit;
    }

    .backButton svg {
      width: 20px;
      height: 20px;
    }

    .backButton path {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .confirmButton {
      display: flex;
      min-height: 44px;
      align-items: center;
      gap: 8px;
      padding: 0 18px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #93a3d1, #5d6cab);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 6px 14px rgba(93, 108, 171, .28);
    }

    .confirmButton small {
      display: inline-grid;
      min-width: 22px;
      height: 22px;
      place-items: center;
      border-radius: 8px;
      background: rgba(255, 255, 255, .18);
      font-size: 11px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="viewport">
      <main class="page">
        <div class="container">
          <div class="paper">
            <header class="header">
              <div class="runningHead"><span>AI LIFE SIM · 命书</span><span>01 / 08</span></div>
              <div class="titleRow">
                <h1 class="headerTitle">选择世界</h1>
              </div>
            </header>

            <section class="stage" aria-label="当前世界规则摘要">
              <section class="difficultySection" aria-label="人生难度">
                <button type="button" class="difficultyOptions" aria-label="切换人生难度，当前均衡">
                  <span>难度</span>
                  <strong class="difficultyActive">均衡</strong>
                  <svg class="difficultyArrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
                </button>
              </section>
              <div class="stageCopy">
                <div class="focusTop">
                  <span class="stageSource">预设世界</span>
                  <span class="focusIndex">当前选择</span>
                </div>
                <h2 class="stageTitle">星际纪元</h2>
                <p class="stageEra">公元 2200 年</p>
              </div>
              <div class="ruleSummary">
                <span>规则摘要</span>
                <p>人类踏入深空，文明在星海间重新书写秩序与命运。</p>
              </div>
              <div class="ruleGrid" aria-label="世界概览">
                <div class="ruleItem"><span>来源</span><strong>预设世界</strong></div>
                <div class="ruleItem"><span>年代</span><strong>公元 2200</strong></div>
                <div class="ruleItem"><span>难度</span><strong>均衡</strong></div>
              </div>
            </section>

            <nav class="sourceTabs" role="tablist" aria-label="世界来源">
              <button type="button" role="tab" data-active="false">已保存</button>
              <button type="button" role="tab" data-active="false">自定义</button>
              <button type="button" role="tab" data-active="true">预设世界</button>
            </nav>

            <section class="sourcePanel" role="tabpanel" aria-label="预设世界">
              <div class="mainGrid">
                <button type="button" class="worldCard" data-selected="true">
                  <span class="worldIcon">🌌</span><span class="worldName">星际纪元</span>
                </button>
                <button type="button" class="worldCard" data-selected="false">
                  <span class="worldIcon">🏔️</span><span class="worldName">灵山古境</span>
                </button>
                <button type="button" class="worldCard" data-selected="false">
                  <span class="worldIcon">🏙️</span><span class="worldName">霓虹都市</span>
                </button>
              </div>
              <button type="button" class="moreTrigger">更多预设世界</button>
            </section>
          </div>

          <div class="bottomBar">
            <button type="button" class="backButton" title="返回上一页" aria-label="返回上一页">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6" /></svg>
            </button>
            <button type="button" class="confirmButton">
              <span>确认世界</span>
              <small>02</small>
            </button>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
