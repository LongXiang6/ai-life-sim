<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>世界选择 · 重构第三轮</title>
  <link rel="icon" href="data:,">
  <style>
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: page-out 160ms ease both; }
    ::view-transition-new(root) { animation: page-in 190ms ease both; }
    @keyframes page-out { to { opacity: 0; transform: translateY(-3px); } }
    @keyframes page-in { from { opacity: 0; transform: translateY(3px); } }

    :root {
      color-scheme: light;
      --canvas: #e9e9e6;
      --paper: #fffefa;
      --paper-strong: #fff;
      --ink: #262522;
      --ink-soft: #66635d;
      --ink-faint: #969189;
      --rule: #d7d3ca;
      --rule-light: #e9e6df;
      --accent: #756aa5;
      --accent-rgb: 117, 106, 165;
      --serif: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
      --sans: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 0; background: var(--canvas); }
    body { min-width: 0; margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--sans); font-size: 14px; letter-spacing: 0; }
    button, input, textarea { color: inherit; font: inherit; letter-spacing: 0; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 1px dotted var(--ink-soft); outline-offset: 3px; }
    a { color: inherit; text-decoration: none; }

    .review-shell { width: min(100%, 1440px); margin: 0 auto; padding: 22px 12px 34px; }
    .review-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 18px; padding: 0 4px 18px; border-bottom: 1px solid #c9c9c4; }
    .review-back { display: inline-block; min-height: 34px; margin-bottom: 8px; padding: 7px 0; color: #5f5d58; font-size: 11px; text-decoration: underline; text-decoration-color: #bbb9b2; text-underline-offset: 4px; }
    .review-head h1 { margin: 0; font-family: var(--serif); font-size: 30px; font-weight: 600; line-height: 1.25; }
    .review-intro { max-width: 52em; margin: 8px 0 0; color: #67655f; font-family: var(--serif); font-size: 13px; line-height: 1.75; }
    .review-status { padding-bottom: 3px; color: #77746e; font-size: 10px; line-height: 1.5; text-align: right; }
    .review-status strong { display: block; color: var(--ink); font-family: var(--serif); font-size: 14px; font-weight: 600; }

    .candidate-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
    .candidate { min-width: 0; padding: 12px 10px 14px; border: 1px solid #d4d4cf; background: #f1f1ee; transition: border-color 180ms ease, background 180ms ease, box-shadow 180ms ease, transform 180ms ease; }
    .candidate:hover { border-color: #bcbab2; transform: translateY(-2px); }
    .candidate.selected { border-color: var(--accent); background: #f5f4f7; box-shadow: 0 0 0 2px rgba(var(--accent-rgb), .18); }
    .candidate-meta { display: grid; min-height: 76px; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 0 2px 10px; }
    .candidate-code { color: #77746e; font-size: 9px; font-weight: 700; line-height: 1.4; }
    .candidate-title { margin: 4px 0 0; font-family: var(--serif); font-size: 16px; font-weight: 600; line-height: 1.35; }
    .candidate-note { margin: 3px 0 0; color: #79766f; font-size: 9px; line-height: 1.45; }
    .candidate-pick { min-height: 34px; padding: 5px 0 5px 8px; border: 0; background: transparent; color: #6c6962; cursor: pointer; font-size: 9px; text-decoration: underline; text-decoration-color: #bbb8af; text-underline-offset: 4px; }
    .candidate-pick[aria-pressed="true"] { color: var(--accent); text-decoration-color: var(--accent); }

    .phone { position: relative; width: min(100%, 318px); height: 640px; margin: 0 auto; overflow: hidden; border: 1px solid #cbc8bf; border-radius: 5px; background: var(--paper); box-shadow: 0 16px 34px rgba(38, 37, 34, .1); isolation: isolate; }
    .phone-page { position: absolute; z-index: 1; inset: 0 0 57px; overflow: hidden; padding: 17px 19px 12px; }
    .running-head { display: flex; min-height: 22px; align-items: flex-start; justify-content: space-between; gap: 10px; color: var(--ink-faint); font-size: 7px; font-weight: 700; line-height: 1.4; text-transform: uppercase; }
    .page-head { margin-top: 8px; }
    .page-head h2 { margin: 0; font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.3; }
    .page-head p { margin: 4px 0 0; color: var(--ink-soft); font-family: var(--serif); font-size: 9px; line-height: 1.55; }

    .focus-index { display: grid; grid-template-columns: 1.35fr repeat(6, minmax(0, 1fr)); margin-top: 11px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
    .focus-index button { min-width: 0; min-height: 38px; padding: 4px 1px; border: 0; border-right: 1px solid var(--rule-light); background: transparent; color: var(--ink-faint); cursor: pointer; font-size: 7px; text-align: center; }
    .focus-index button:last-child { border-right: 0; }
    .focus-index button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
    .focus-index .custom-index { color: var(--accent); font-family: var(--serif); font-size: 8px; font-weight: 600; }

    .world-focus { position: relative; margin-top: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--rule); transition: opacity 150ms ease, transform 150ms ease; }
    .world-focus.updating { opacity: .34; transform: translateY(3px); }
    .world-mark { display: grid; width: 31px; height: 31px; place-items: center; border: 1px solid var(--rule); border-radius: 50%; color: var(--ink-soft); font-family: var(--serif); font-size: 10px; }
    .world-counter { position: absolute; top: 7px; right: 0; color: var(--ink-faint); font-size: 7px; font-variant-numeric: tabular-nums; }
    .world-focus h3 { margin: 18px 0 0; font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1.25; }
    .world-era { margin: 4px 0 0; color: var(--ink-faint); font-size: 7px; line-height: 1.4; }
    .world-description { min-height: 48px; margin: 10px 0 0; color: var(--ink-soft); font-family: var(--serif); font-size: 10px; line-height: 1.7; }
    .world-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 13px 0 0; border-top: 1px solid var(--rule-light); }
    .world-facts div { min-width: 0; padding: 7px 3px 0 0; }
    .world-facts dt, .world-facts dd { margin: 0; }
    .world-facts dt { color: var(--ink-faint); font-size: 6px; }
    .world-facts dd { margin-top: 2px; color: var(--ink-soft); font-size: 7px; line-height: 1.35; }

    .utility-row { display: grid; margin-top: 11px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
    .utility-row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .utility-row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .utility-row button { min-height: 41px; padding: 4px 2px; border: 0; border-right: 1px solid var(--rule-light); background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 7px; }
    .utility-row button:last-child { border-right: 0; }

    .difficulty { display: grid; grid-template-columns: 48px repeat(3, minmax(0, 1fr)); align-items: center; margin-top: 8px; border-top: 1px solid var(--rule-light); border-bottom: 1px solid var(--rule-light); }
    .difficulty > span { color: var(--ink-faint); font-size: 7px; }
    .difficulty button { min-height: 31px; padding: 3px 0; border: 0; background: transparent; color: var(--ink-faint); cursor: pointer; font-size: 8px; }
    .difficulty button.active { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }

    .custom-lead { display: grid; width: 100%; min-height: 58px; grid-template-columns: minmax(0, 1fr) 17px; align-items: center; margin-top: 12px; padding: 5px 0; border: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; text-align: left; }
    .custom-lead strong, .custom-lead small { display: block; }
    .custom-lead strong { font-family: var(--serif); font-size: 14px; font-weight: 600; }
    .custom-lead small { margin-top: 3px; color: var(--ink-faint); font-size: 7px; }
    .custom-lead > span:last-child { color: var(--accent); font-size: 13px; text-align: right; }
    .minor-label { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 9px 0 4px; color: var(--ink-faint); font-size: 7px; }
    .preset-index { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--rule-light); border-bottom: 1px solid var(--rule-light); }
    .preset-index button { min-height: 34px; padding: 3px 2px; border: 0; border-right: 1px solid var(--rule-light); border-bottom: 1px solid var(--rule-light); background: transparent; color: var(--ink-faint); cursor: pointer; font-size: 7px; }
    .preset-index button:nth-child(3n) { border-right: 0; }
    .preset-index button:nth-child(n+4) { border-bottom: 0; }
    .preset-index button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
    .route-custom .world-focus { min-height: 176px; margin-top: 11px; padding-bottom: 12px; }
    .route-custom .world-focus h3 { margin-top: 10px; font-size: 19px; }
    .route-custom .world-description { min-height: 32px; margin-top: 7px; font-size: 9px; }
    .route-custom .world-facts { margin-top: 8px; }

    .route-unified .world-focus { min-height: 326px; margin-top: 24px; }
    .route-unified .world-focus h3 { margin-top: 25px; font-size: 27px; }
    .route-unified .world-description { min-height: 64px; margin-top: 14px; font-size: 11px; line-height: 1.8; }
    .route-unified .world-facts { margin-top: 18px; }
    .change-world { display: grid; width: 100%; min-height: 49px; grid-template-columns: minmax(0, 1fr) 18px; align-items: center; margin-top: 12px; padding: 4px 0; border: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; font-family: var(--serif); font-size: 11px; font-weight: 600; text-align: left; }
    .change-world span:last-child { font-family: var(--sans); text-align: right; }

    .route-immersive .running-head { min-height: 26px; }
    .route-immersive .world-focus { min-height: 390px; margin-top: 31px; padding-bottom: 24px; }
    .route-immersive .world-mark { width: 35px; height: 35px; }
    .route-immersive .world-focus h3 { margin-top: 34px; font-size: 30px; }
    .route-immersive .world-era { margin-top: 7px; }
    .route-immersive .world-description { min-height: 82px; margin-top: 18px; font-size: 12px; line-height: 1.9; }
    .route-immersive .world-facts { margin-top: 22px; }
    .route-immersive .change-world { margin-top: 16px; }

    .phone-footer { position: absolute; z-index: 5; right: 0; bottom: 0; left: 0; display: grid; height: 57px; grid-template-columns: 74px minmax(0, 1fr); align-items: center; gap: 8px; padding: 7px 18px; border-top: 1px solid var(--rule); background: rgba(255, 254, 250, .97); }
    .phone-footer.triple { grid-template-columns: 52px 70px minmax(0, 1fr); }
    .phone-footer button { min-height: 38px; padding: 4px 0; border: 0; background: transparent; cursor: pointer; }
    .back-action { color: var(--ink-soft); font-size: 8px; text-align: left; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
    .footer-difficulty { color: var(--ink-soft); font-size: 8px; text-align: left; }
    .footer-difficulty span { display: block; color: var(--ink-faint); font-size: 6px; }
    .confirm-action { display: grid; grid-template-columns: minmax(0, 1fr) 15px; align-items: center; color: var(--ink); font-family: var(--serif); font-size: 11px; font-weight: 600; text-align: left; }
    .confirm-action span:last-child { font-family: var(--sans); font-size: 12px; text-align: right; }

    .sheet { position: absolute; z-index: 20; inset: 0 0 57px; overflow: hidden; padding: 18px 19px 14px; border-top: 3px solid var(--accent); background: var(--paper); clip-path: inset(100% 0 0 0); opacity: 0; pointer-events: none; transition: clip-path 260ms cubic-bezier(.22, .74, .24, 1), opacity 180ms ease; }
    .sheet.open { clip-path: inset(0); opacity: 1; pointer-events: auto; }
    .sheet-head { display: grid; min-height: 42px; grid-template-columns: minmax(0, 1fr) 34px; align-items: start; gap: 10px; padding-bottom: 9px; border-bottom: 1px solid var(--rule); }
    .sheet-head h3 { margin: 0; font-family: var(--serif); font-size: 18px; font-weight: 600; line-height: 1.35; }
    .sheet-head p { margin: 3px 0 0; color: var(--ink-faint); font-size: 7px; line-height: 1.45; }
    .sheet-close { display: grid; width: 34px; height: 34px; place-items: center; padding: 0; border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 20px; line-height: 1; }
    .sheet-section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 13px 0 6px; color: var(--ink-faint); font-size: 7px; }
    .sheet-section-title strong { color: var(--ink); font-family: var(--serif); font-size: 11px; font-weight: 600; }
    .sheet-empty { margin: 17px 0 0; padding: 15px 0; border-top: 1px solid var(--rule-light); border-bottom: 1px solid var(--rule-light); color: var(--ink-soft); font-family: var(--serif); font-size: 11px; line-height: 1.7; }

    .world-directory { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--rule); }
    .world-choice { position: relative; display: grid; min-width: 0; min-height: 36px; grid-template-columns: 22px minmax(0, 1fr); align-items: center; gap: 2px; padding: 3px 5px 3px 0; border: 0; border-bottom: 1px solid var(--rule-light); background: transparent; color: var(--ink-soft); cursor: pointer; text-align: left; }
    .world-choice:nth-child(odd) { border-right: 1px solid var(--rule-light); }
    .world-choice .choice-index { color: var(--ink-faint); font-size: 7px; }
    .world-choice .choice-name { overflow-wrap: anywhere; font-family: var(--serif); font-size: 9px; line-height: 1.3; }
    .world-choice[aria-selected="true"] { color: var(--ink); }
    .world-choice[aria-selected="true"]::after { position: absolute; right: 5px; bottom: -1px; left: 22px; height: 2px; background: var(--accent); content: ""; }
    .chooser-custom { display: grid; width: 100%; min-height: 53px; grid-template-columns: minmax(0, 1fr) 15px; align-items: center; margin-top: 11px; padding: 4px 0; border: 0; border-bottom: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; text-align: left; }
    .chooser-custom strong, .chooser-custom small { display: block; }
    .chooser-custom strong { font-family: var(--serif); font-size: 12px; font-weight: 600; }
    .chooser-custom small { margin-top: 2px; color: var(--ink-faint); font-size: 7px; }
    .chooser-custom > span:last-child { color: var(--accent); text-align: right; }
    .chooser-links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid var(--rule); }
    .chooser-links button { min-height: 42px; padding: 4px 0; border: 0; border-right: 1px solid var(--rule-light); background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 8px; }
    .chooser-links button:last-child { border-right: 0; }

    .custom-form { display: grid; margin-top: 8px; border-top: 1px solid var(--rule); }
    .field { display: grid; grid-template-columns: 68px minmax(0, 1fr); align-items: start; border-bottom: 1px solid var(--rule-light); }
    .field label { padding: 11px 7px 8px 0; color: var(--ink-faint); font-size: 7px; }
    .field input, .field textarea { width: 100%; min-width: 0; min-height: 36px; padding: 8px 0; border: 0; outline: 0; background: transparent; color: var(--ink); font-family: var(--serif); font-size: 10px; line-height: 1.5; }
    .field textarea { min-height: 67px; resize: none; }
    .form-submit { justify-self: end; min-height: 38px; margin-top: 6px; padding: 4px 0 4px 14px; border: 0; background: transparent; color: var(--ink); cursor: pointer; font-family: var(--serif); font-size: 10px; font-weight: 600; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 4px; }
    .form-status { min-height: 16px; margin: 4px 0 0; color: var(--accent); font-size: 7px; line-height: 1.45; }
    .sheet-difficulty { display: grid; margin-top: 16px; border-top: 1px solid var(--rule); }
    .sheet-difficulty button { min-height: 49px; padding: 4px 0; border: 0; border-bottom: 1px solid var(--rule-light); background: transparent; color: var(--ink-soft); cursor: pointer; font-family: var(--serif); font-size: 11px; text-align: left; }
    .sheet-difficulty button.active { color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); padding-left: 12px; }

    .phone-toast { position: absolute; z-index: 50; right: 12px; bottom: 68px; left: 12px; padding: 8px 10px; border: 1px solid var(--rule); background: var(--paper-strong); color: var(--ink-soft); font-size: 8px; line-height: 1.5; text-align: center; opacity: 0; pointer-events: none; transform: translateY(5px); transition: opacity 160ms ease, transform 160ms ease; }
    .phone-toast.show { opacity: 1; transform: none; }

    @media (max-width: 1099px) {
      .candidate-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .candidate-meta { min-height: 72px; }
    }
    @media (max-width: 559px) {
      .review-shell { padding: 15px 12px 28px; }
      .review-head { grid-template-columns: 1fr; gap: 9px; }
      .review-head h1 { font-size: 26px; }
      .review-status { text-align: left; }
      .candidate-grid { grid-template-columns: 1fr; }
      .candidate { padding-right: 8px; padding-left: 8px; }
      .candidate-meta { min-height: 0; padding: 2px 4px 11px; }
      .phone { width: min(100%, 330px); }
    }
    @media (max-width: 389px) {
      .review-shell { padding-right: 10px; padding-left: 10px; }
      .review-head { padding-right: 3px; padding-left: 3px; }
      .candidate { padding-right: 7px; padding-left: 7px; }
      .phone { width: min(100%, 326px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="review-shell">
    <header class="review-head">
      <div>
        <a class="review-back" href="index.html">← 返回世界选择历史</a>
        <h1>世界选择 · 重构第三轮</h1>
        <p class="review-intro">第二轮由 WS-RF2-4 晋级。本轮沿用无书脊的当前世界焦点页，从“索引可见”逐步收敛到“单一焦点”，只比较主次层级与极简程度。</p>
      </div>
      <div class="review-status"><strong data-review-selection>当前选择 · WS-RF3-1</strong>待用户选择 · 01 稳妥 / 04 大胆</div>
    </header>

    <section class="candidate-grid" aria-label="世界选择重构第三轮候选">
      <article class="candidate selected" data-choice="WS-RF3-1">
        <header class="candidate-meta"><div><div class="candidate-code">WS-RF3-1 · 稳妥收敛</div><h2 class="candidate-title">清晰焦点</h2><p class="candidate-note">索引可见，当前世界成为绝对正文。</p></div><button class="candidate-pick" type="button" aria-pressed="true">已选此案</button></header>
        <section class="phone route-clear" data-app="rf3-1" data-page-template="clear" data-selected-world="现代地球" data-difficulty-value="普通"></section>
      </article>
      <article class="candidate" data-choice="WS-RF3-2">
        <header class="candidate-meta"><div><div class="candidate-code">WS-RF3-2 · 自定优先</div><h2 class="candidate-title">一主一次</h2><p class="candidate-note">自定义独占主入口，预设退为次级索引。</p></div><button class="candidate-pick" type="button" aria-pressed="false">选择此案</button></header>
        <section class="phone route-custom" data-app="rf3-2" data-page-template="custom-first" data-selected-world="现代地球" data-difficulty-value="普通"></section>
      </article>
      <article class="candidate" data-choice="WS-RF3-3">
        <header class="candidate-meta"><div><div class="candidate-code">WS-RF3-3 · 目录收纳</div><h2 class="candidate-title">单一命令</h2><p class="candidate-note">首屏只读当前世界，用一个入口更换世界。</p></div><button class="candidate-pick" type="button" aria-pressed="false">选择此案</button></header>
        <section class="phone route-unified" data-app="rf3-3" data-page-template="unified" data-selected-world="现代地球" data-difficulty-value="普通"></section>
      </article>
      <article class="candidate" data-choice="WS-RF3-4">
        <header class="candidate-meta"><div><div class="candidate-code">WS-RF3-4 · 最大胆</div><h2 class="candidate-title">沉浸单页</h2><p class="candidate-note">只留下世界正文与确认，难度收进页尾。</p></div><button class="candidate-pick" type="button" aria-pressed="false">选择此案</button></header>
        <section class="phone route-immersive" data-app="rf3-4" data-page-template="immersive" data-selected-world="现代地球" data-difficulty-value="普通"></section>
      </article>
    </section>
  </main>

  <template id="clear-template">
    <div class="phone-page">
      <div class="running-head"><span>AI LIFE SIM · 世界</span><span>01 / 06</span></div>
      <header class="page-head"><h2>选择世界</h2><p>先选择，再专注阅读当前一页。</p></header>

    <section class="sheet" data-sheet="chooser" aria-hidden="true"><header class="sheet-head"><div><h3>选择世界</h3><p>自定义优先，其余世界收在同一目录。</p></div><button class="sheet-close" type="button" data-close-sheet aria-label="关闭世界目录" title="关闭">×</button></header><button class="chooser-custom" type="button" data-open-sheet="custom"><span><strong>自定义世界</strong><small>写下名称、年代与世界描述</small></span><span>→</span></button><div class="sheet-section-title"><strong>预设世界 · 01—06</strong><span>点击即选择</span></div><div class="world-directory"><button class="world-choice" type="button" data-world="现代地球" aria-selected="true"><span class="choice-index">01</span><span class="choice-name">现代地球</span></button><button class="world-choice" type="button" data-world="武道割据" aria-selected="false"><span class="choice-index">02</span><span class="choice-name">武道割据</span></button><button class="world-choice" type="button" data-world="SCP基金会" aria-selected="false"><span class="choice-index">03</span><span class="choice-name">SCP 基金会</span></button><button class="world-choice" type="button" data-world="战锤40K" aria-selected="false"><span class="choice-index">04</span><span class="choice-name">战锤 40K</span></button><button class="world-choice" type="button" data-world="赛博2077" aria-selected="false"><span class="choice-index">05</span><span class="choice-name">赛博 2077</span></button><button class="world-choice" type="button" data-world="修真世界" aria-selected="false"><span class="choice-index">06</span><span class="choice-name">修真世界</span></button></div><div class="chooser-links"><button type="button" data-open-sheet="more">更多世界</button><button type="button" data-open-sheet="saved">已保存</button></div></section>

    <section class="sheet" data-sheet="saved" aria-hidden="true"><header class="sheet-head"><div><h3>已保存世界</h3><p>保存记录会在这里成为可选目录。</p></div><button class="sheet-close" type="button" data-close-sheet aria-label="关闭已保存世界" title="关闭">×</button></header><p class="sheet-empty">此页尚无保存记录。创建并保存过的世界会保留名称、年代与描述摘要。</p></section>
    <section class="sheet" data-sheet="difficulty" aria-hidden="true"><header class="sheet-head"><div><h3>人生难度</h3><p>难度改变世界给予角色的阻力。</p></div><button class="sheet-close" type="button" data-close-sheet aria-label="关闭难度选择" title="关闭">×</button></header><div class="sheet-difficulty"><button type="button" data-difficulty="轻松">轻松</button><button class="active" type="button" data-difficulty="普通">普通</button><button type="button" data-difficulty="艰难">艰难</button></div></section>
    <div class="phone-toast" role="status" aria-live="polite"></div>
  </template>

  <script>
    (() => {
      const worlds = {
        '现代地球': { mark: '现', counter: '01 / 24', name: '现代地球', era: '公元 2000 年 · 写实世界', description: '互联网正在改变生活，平凡人生也会被时代推动。', facts: ['快速发展', '近乎不存在', '现实尺度'] },
        '武道割据': { mark: '武', counter: '02 / 24', name: '武道割据', era: '乱世江湖 · 武侠世界', description: '门派林立、恩怨纠葛，一技之长即可改写命运。', facts: ['冷兵器时代', '内功外劲', '江湖杀机'] },
        'SCP基金会': { mark: '异', counter: '03 / 24', name: 'SCP 基金会', era: '当代 · 异常收容', description: '日常表象之下，异常项目被严密收容与研究。', facts: ['保密前沿', '异常现象', '收容失效'] },
        '战锤40K': { mark: '40K', counter: '04 / 24', name: '战锤 40K', era: '遥远的未来 · 只有战争', description: '帝国与异族永世征战，个体在星海中微不足道。', facts: ['失落高科', '亚空间', '全面战争'] },
        '赛博2077': { mark: '霓', counter: '05 / 24', name: '赛博 2077', era: '2077 · 霓虹废土', description: '义体改造与企业统治交织，街头是唯一的自由。', facts: ['义体网络', '几乎没有', '都市丛林'] },
        '修真世界': { mark: '仙', counter: '06 / 24', name: '修真世界', era: '仙道纪元 · 灵气复苏', description: '灵根与功法决定起点，长生之路布满试炼。', facts: ['法宝阵法', '修真飞升', '天劫秘境'] },
        '蒸汽纪元': { mark: '汽', counter: '07 / 24', name: '蒸汽纪元', era: '机炉历 88 年 · 工业奇想', description: '黄铜机芯与城市烟塔一起运转，发明也制造新的阶层。', facts: ['蒸汽机械', '秘术传闻', '工坊事故'] },
        '末日废土': { mark: '烬', counter: '08 / 24', name: '末日废土', era: '灾后 17 年 · 生存世界', description: '旧文明只剩废墟，水源、信任与迁徙路线决定明天。', facts: ['遗留科技', '变异未知', '资源匮乏'] },
        '星际文明': { mark: '星', counter: '09 / 24', name: '星际文明', era: '联盟历 632 年 · 群星时代', description: '航道连接远方殖民地，选择会跨越星系留下回声。', facts: ['星际航行', '意识技术', '深空风险'] },
        '魔法学院': { mark: '术', counter: '10 / 24', name: '魔法学院', era: '学院历 304 年 · 魔法世界', description: '古老学派守护知识，每一次天赋显现都伴随代价。', facts: ['炼金器具', '体系魔法', '试炼失控'] },
        '神话洪荒': { mark: '古', counter: '11 / 24', name: '神话洪荒', era: '上古纪元 · 神话世界', description: '山海初定，神祇与众生共享天地秩序。', facts: ['先天器物', '神通法则', '天地劫数'] }
      };

      document.querySelectorAll('[data-page-template]').forEach((app) => {
        app.append(document.querySelector(`#${app.dataset.pageTemplate}-template`).content.cloneNode(true));
        app.append(document.querySelector('#aux-template').content.cloneNode(true));
      });

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const candidates = [...document.querySelectorAll('.candidate')];
      const selectCandidate = (candidate) => {
        candidates.forEach((item) => {
          const selected = item === candidate;
          item.classList.toggle('selected', selected);
          const button = item.querySelector('.candidate-pick');
          button.setAttribute('aria-pressed', String(selected));
          button.textContent = selected ? '已选此案' : '选择此案';
        });
        document.querySelector('[data-review-selection]').textContent = `当前选择 · ${candidate.dataset.choice}`;
      };
      candidates.forEach((candidate) => {
        candidate.addEventListener('click', () => selectCandidate(candidate));
        candidate.querySelector('.candidate-pick').addEventListener('click', (event) => { event.stopPropagation(); selectCandidate(candidate); });
      });

      const closeSheets = (app) => app.querySelectorAll('.sheet.open').forEach((sheet) => { sheet.classList.remove('open'); sheet.setAttribute('aria-hidden', 'true'); });
      const openSheet = (app, key) => {
        closeSheets(app);
        const sheet = app.querySelector(`[data-sheet="${key}"]`);
        if (!sheet) return;
        sheet.classList.add('open');
        sheet.setAttribute('aria-hidden', 'false');
        sheet.querySelector('button, input, textarea')?.focus({ preventScroll: true });
      };
      const showToast = (app, message) => {
        const toast = app.querySelector('.phone-toast');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.remove('show'), 1500);
      };
      const writeText = (app, selector, value) => app.querySelectorAll(selector).forEach((node) => { node.textContent = value; });
      const selectWorld = (app, data, sourceName) => {
        const reading = app.querySelector('.world-focus');
        reading.classList.add('updating');
        setTimeout(() => {
          writeText(app, '[data-current-mark]', data.mark);
          writeText(app, '[data-current-counter]', data.counter);
          writeText(app, '[data-current-name]', data.name);
          writeText(app, '[data-current-era]', data.era);
          writeText(app, '[data-current-desc]', data.description);
          writeText(app, '[data-rule-tech]', data.facts[0]);
          writeText(app, '[data-rule-power]', data.facts[1]);
          writeText(app, '[data-rule-danger]', data.facts[2]);
          reading.classList.remove('updating');
        }, reducedMotion ? 0 : 120);
        app.dataset.selectedWorld = data.name;
        app.querySelectorAll('[data-world]').forEach((button) => button.setAttribute('aria-selected', String(button.dataset.world === sourceName)));
      };

      document.querySelectorAll('[data-app]').forEach((app) => {
        app.querySelectorAll('[data-open-sheet]').forEach((button) => button.addEventListener('click', () => openSheet(app, button.dataset.openSheet)));
        app.querySelectorAll('[data-close-sheet]').forEach((button) => button.addEventListener('click', () => closeSheets(app)));
        app.querySelectorAll('[data-world]').forEach((button) => button.addEventListener('click', () => {
          const data = worlds[button.dataset.world];
          if (!data) return;
          selectWorld(app, data, button.dataset.world);
          closeSheets(app);
          showToast(app, `已选择世界 · ${data.name}`);
        }));
        app.querySelectorAll('[data-difficulty]').forEach((button) => button.addEventListener('click', () => {
          app.querySelectorAll('[data-difficulty]').forEach((item) => item.classList.toggle('active', item.dataset.difficulty === button.dataset.difficulty));
          app.dataset.difficultyValue = button.dataset.difficulty;
          writeText(app, '[data-difficulty-label]', button.dataset.difficulty);
          closeSheets(app);
          showToast(app, `人生难度 · ${button.dataset.difficulty}`);
        }));
        app.querySelector('[data-custom-form]').addEventListener('submit', (event) => {
          event.preventDefault();
          const form = event.currentTarget;
          const name = form.elements.name.value.trim();
          const era = form.elements.era.value.trim();
          const description = form.elements.description.value.trim();
          const status = form.querySelector('[data-form-status]');
          if (!name || !era || !description) { status.textContent = '请补全世界名称、起始年代与世界描述。'; return; }
          selectWorld(app, { mark: '创', counter: '自定义', name, era, description, facts: ['由设定决定', '由设定决定', '由设定决定'] }, '');
          status.textContent = `“${name}”已成为当前世界。`;
          closeSheets(app);
          showToast(app, `已选择自定义世界 · ${name}`);
        });
        app.querySelector('[data-back]').addEventListener('click', () => showToast(app, '返回欢迎页 · 当前选择将保留'));
        app.querySelector('[data-confirm]').addEventListener('click', () => showToast(app, `已确认“${app.dataset.selectedWorld}” · 下一步：世界配置`));
      });
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape') document.querySelectorAll('[data-app]').forEach(closeSheets); });
    })();
  </script>
</body>
