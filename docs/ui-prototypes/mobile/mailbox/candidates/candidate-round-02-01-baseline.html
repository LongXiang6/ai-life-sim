<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>邮箱 · 第二轮候选 01 · 精简单列基线微调</title>
  <style>
    /* Purpose: Static prototype of the refined minimal single-column mailbox candidate. Owner: Interface system. Responsibility: Candidate only; inherits the finalized baseline (warm-paper color, original button specs, unified rhythm). */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #2e2922;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      position: relative;
      isolation: isolate;
      display: grid;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      place-items: stretch;
      background: #fdf9f1;
      color-scheme: light;
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    @media (min-width: 48rem) {
      .viewport {
        width: min(100%, 30rem);
      }
    }

    .page {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      background: #fdf9f1;
      color: #2e2922;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    }

    .screen {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      padding: 22px 28px 16px;
      overflow: hidden;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #8a7f6e;
      font-size: 11px;
      font-weight: 650;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 22px 4px 14px;
      border-bottom: 1px solid #eadfce;
    }

    .header h1 {
      margin: 0;
      color: #241f18;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .header p {
      margin: 6px 0 0;
      color: #8a7f6e;
      font-size: 11px;
    }

    .composeButton {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid #cfd7ee;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 5px 14px rgba(62, 70, 100, 0.1);
      color: #2e2922;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
    }

    .folderTabs {
      display: flex;
      flex: 0 0 auto;
      gap: 18px;
      padding: 0 4px;
      border-bottom: 1px solid #eadfce;
    }

    .folderTabs button {
      min-height: 48px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: #8a7f6e;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }

    .folderTabs button[data-active="true"] {
      border-bottom-color: #977026;
      color: #241f18;
      font-weight: 700;
    }

    .content {
      min-height: 0;
      flex: 1;
      padding: 12px 0;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .mailList {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .mail {
      border: 1px solid #e5e1d6;
      border-radius: 20px;
      background: #fffdf8;
      overflow: hidden;
    }

    .mail[data-unread="true"] {
      border-color: #d8c9a8;
      background: #faf4e8;
    }

    .mailSummary {
      position: relative;
      display: grid;
      width: 100%;
      min-height: 66px;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 4px 14px;
      padding: 13px 16px;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .mailIdentity {
      grid-column: 1;
      overflow: hidden;
      color: #8a7f6e;
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mailSummary strong {
      grid-column: 1;
      overflow: hidden;
      font-size: 15px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mailPreview {
      grid-column: 1;
      overflow: hidden;
      color: #8a7f6e;
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mailTime {
      grid-column: 2;
      grid-row: 1;
      color: #a0907a;
      font-size: 10px;
    }

    .unreadDot {
      position: absolute;
      right: 16px;
      bottom: 12px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #977026;
    }

    .mailBody {
      padding: 0 16px 14px;
      border-top: 1px solid #ece6d9;
    }

    .mailBody > p {
      margin: 12px 0;
      color: #5c5447;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .portrait {
      width: min(100%, 260px);
      height: auto;
      border: 1px solid #e5e1d6;
      border-radius: 12px;
      object-fit: cover;
    }

    .talentAttachment {
      margin-top: 10px;
      padding: 10px 14px;
      border: 1px solid #d8c9a8;
      border-radius: 16px;
      background: #faf4e8;
    }

    .talentAttachment small,
    .talentAttachment strong {
      display: block;
    }

    .talentAttachment small {
      color: #8a7f6e;
      font-size: 10px;
    }

    .talentAttachment strong {
      margin-top: 3px;
      font-size: 14px;
      font-weight: 650;
    }

    .talentAttachment p {
      margin: 6px 0 0;
      color: #5c5447;
      font-size: 11px;
      line-height: 1.55;
    }

    .talentAttachment button {
      margin-top: 8px;
      min-height: 38px;
      padding: 0 16px;
      border: 1px solid #cfd7ee;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 5px 14px rgba(62, 70, 100, 0.1);
      color: #2e2922;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 650;
    }

    .mailActions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      color: #a0907a;
    }

    .mailActions small {
      font-size: 10px;
    }

    .mailActions button {
      min-height: 36px;
      padding: 0 16px;
      border: 1px solid #d8c9a8;
      border-radius: 20px;
      background: #faf4e8;
      color: #7a4a3f;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
    }

    .bottomBar {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: 10px;
      padding: 10px 20px 16px;
      border-top: 1px solid #eadfce;
      background: #fdf9f1;
    }

    .backButton,
    .confirmButton {
      display: grid;
      min-height: 46px;
      place-items: center;
      gap: 0;
      padding: 8px 12px;
      border: 1px solid #e5e1d6;
      border-radius: 24px;
      background: #fff;
      color: #2e2922;
      cursor: pointer;
      font: inherit;
      text-align: center;
    }

    .backButton strong,
    .backButton small,
    .confirmButton strong,
    .confirmButton small {
      display: block;
    }

    .backButton strong,
    .confirmButton strong {
      font-size: 14px;
      font-weight: 650;
    }

    .backButton small,
    .confirmButton small {
      margin-top: 2px;
      color: #8a7f6e;
      font-size: 11px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="viewport">
      <main class="page">
        <div class="screen">
          <div class="meta" aria-hidden="true"><span>AI LIFE SIM · 命书</span><span>附 · 邮箱</span></div>
          <header class="header">
            <div><h1>邮箱</h1><p>我的诊断编号 AI-2026-0042</p></div>
            <button type="button" class="composeButton">写邮件</button>
          </header>
          <nav class="folderTabs" aria-label="邮箱分类">
            <button type="button" data-active="true">收件箱 (2)</button>
            <button type="button" data-active="false">已发送</button>
          </nav>
          <section class="content" aria-label="收件箱">
            <ul class="mailList">
              <li class="mail" data-unread="true">
                <button type="button" class="mailSummary" aria-expanded="false">
                  <span class="mailIdentity">引路人</span>
                  <strong>轮回天赋 · 记忆馈赠</strong>
                  <span class="mailPreview">你下一世将携带一段前世记忆……</span>
                  <span class="mailTime">08/06 21:30</span>
                  <span class="unreadDot" aria-label="未读" />
                </button>
              </li>
              <li class="mail" data-unread="false">
                <button type="button" class="mailSummary" aria-expanded="true">
                  <span class="mailIdentity">命书司</span>
                  <strong>本命年度总结</strong>
                  <span class="mailPreview">这是你今年的人生轨迹回顾……</span>
                  <span class="mailTime">08/01 09:12</span>
                </button>
                <div class="mailBody">
                  <p>这是你今年的人生轨迹回顾。你以诚待人，情谊与学识并进，终局评分 98。</p>
                  <div class="talentAttachment">
                    <div><small>轮回天赋</small><strong>记忆馈赠</strong></div>
                    <p>下世开局时携带一段可选的记忆片段。</p>
                    <button type="button">接受天赋</button>
                  </div>
                  <div class="mailActions">
                    <small>7 天后到期</small>
                    <button type="button">删除</button>
                  </div>
                </div>
              </li>
            </ul>
          </section>
        </div>
        <div class="bottomBar">
          <button type="button" class="backButton" title="返回上一页">
            <strong>返回上一页</strong>
            <small>退回上一界面</small>
          </button>
          <button type="button" class="confirmButton" title="返回欢迎界面">
            <strong>返回欢迎界面</strong>
            <small>回到欢迎界面</small>
          </button>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
