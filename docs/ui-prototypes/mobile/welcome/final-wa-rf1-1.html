  <script>
    (()=>{const phone=document.querySelector('.phone'),sheet=phone.querySelector('[data-sheet]'),toast=phone.querySelector('.toast');const show=message=>{toast.textContent=message;toast.classList.add('show');clearTimeout(toast._timer);toast._timer=setTimeout(()=>toast.classList.remove('show'),1400)};const close=()=>{sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true')};phone.addEventListener('click',event=>{const save=event.target.closest('[data-save]');const action=event.target.closest('[data-action]');if(save){phone.querySelectorAll('[data-save]').forEach(item=>item.setAttribute('aria-pressed',String(item===save)));phone.querySelector('[data-current-save]').textContent=save.dataset.save+' · 3 个记录';show('已选择存档 · '+save.dataset.save);setTimeout(close,260);return}if(!action)return;if(action.dataset.action==='load'){event.preventDefault();sheet.classList.add('open');sheet.setAttribute('aria-hidden','false')}if(action.dataset.action==='close')close()});document.addEventListener('keydown',event=>{if(event.key==='Escape')close()})})();
