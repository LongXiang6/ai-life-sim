  <style>
    :root {

      --review-bg: #f6f3ee;
      --ink: #17191d;
      --ink-soft: #626870;
      --ink-faint: #969ba2;
      --line: #e5e7ea;
      --soft: #f7f8f9;
      --accent: #6d7f94;
      --accent-soft: #f0f3f6;
      --ornament: #9a7966;
      --serif: "Songti SC", "STSong", "SimSun", serif;
      --sans: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 0; background: var(--review-bg); }
    body { min-width: 0; min-height: 100vh; margin: 0; background: var(--review-bg); color: var(--ink); font-family: var(--sans); letter-spacing: 0; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; font: inherit; letter-spacing: 0; }
    button:focus-visible, a:focus-visible { outline: 2px solid rgba(105, 126, 153, .48); outline-offset: 2px; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }

    .shell { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 56px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    .topbar a, .eyebrow { color: var(--ink-soft); }
    .eyebrow { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .16em; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 10px; font-family: var(--serif); font-size: clamp(28px, 4vw, 44px); font-weight: 600; }
    .status { display: inline-flex; padding: 5px 9px; border: 1px solid #dfe3e8; border-radius: 999px; background: #fff; color: var(--ink-soft); font-size: 11px; }
    .subtitle { max-width: 720px; color: var(--ink-soft); font-size: 13px; line-height: 1.7; }
    .final-stage { display: grid; justify-items: center; gap: 4px; margin-top: 28px; }
    .final-label { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 3px; color: var(--ink-soft); font-size: 10px; font-weight: 650; }
    .final-label::before { width: 5px; height: 5px; border-radius: 50%; background: #94a5b5; content: ""; }
    .spec-summary { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px 17px; max-width: 640px; margin: 4px auto 0; color: var(--ink-soft); font-size: 11px; line-height: 1.6; text-align: center; }
    .spec-summary span { white-space: nowrap; }
    .spec-summary b { color: var(--ink); font-weight: 620; }
    .prototype-transition-layer { position: fixed; z-index: 99999; inset: 0; background: var(--review-bg); opacity: 0; pointer-events: none; transition: opacity .22s cubic-bezier(.4, 0, .2, 1); }
    html.flow-entering .prototype-transition-layer { opacity: 1; transition: none; }
    html.flow-leaving .prototype-transition-layer { opacity: 1; }
    html.embedded-preview body[data-screen] { min-height: 100vh; background: var(--review-bg); }
    html.embedded-preview body[data-screen] > .shell { width: 100%; min-height: 100vh; padding: 12px 0 28px; }
    html.embedded-preview body[data-screen] > .shell > .topbar,
    html.embedded-preview body[data-screen] > .shell > .eyebrow,
    html.embedded-preview body[data-screen] > .shell > h1,
    html.embedded-preview body[data-screen] > .shell > .subtitle,
    html.embedded-preview body[data-screen] .final-label,
    html.embedded-preview body[data-screen] .spec-summary { display: none !important; }
    html.embedded-preview body[data-screen] .final-stage { margin-top: 0; }

    .phone {
      position: relative;
      width: 320px;
      height: 674px;
      margin: 0;
      overflow: hidden;
      border: 1px solid #dfe3e8;
      border-radius: 34px;
      background: #fff;
      box-shadow: 0 20px 48px rgba(17, 24, 39, .105);
      color: var(--ink);
      isolation: isolate;
    }

    .geometry-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .scenery-art { position: absolute; z-index: 1; inset: 0; overflow: hidden; pointer-events: none; }
    .corner-medallion { position: absolute; width: 154px; height: 154px; color: var(--ornament); opacity: .14; }
    .corner-medallion use { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
    .medallion-tl { top: 0; left: 0; transform: translate(-50%, -50%); }
    .medallion-tr { top: 0; right: 0; transform: translate(50%, -50%); }
    .medallion-bl { bottom: 0; left: 0; opacity: .06; transform: translate(-50%, 50%); }
    .medallion-br { right: 0; bottom: 0; opacity: .06; transform: translate(50%, 50%); }
    .ink-wash { position: absolute; right: -5px; bottom: -16px; width: 350px; height: 218px; opacity: .84; }
    .wash-far { fill: #555b60; opacity: .032; }
    .wash-mist { fill: #72777c; opacity: .03; }
    .wash-mid { fill: #4f555a; opacity: .042; }
    .wash-near { fill: #686e73; opacity: .033; }
    .wash-line, .wash-ripple { fill: none; stroke: #5d6368; stroke-linecap: round; }
    .wash-line { stroke-width: .85; opacity: .055; }

    .screen { position: absolute; z-index: 2; inset: 0 0 150px; overflow: hidden; padding: 14px 15px 8px; }

    .chapter-copy { min-width: 0; }
    .chapter-kicker { display: flex; align-items: center; gap: 7px; color: var(--ink-faint); font-family: var(--serif); font-size: 7px; }
    .chapter-kicker svg { width: 35px; height: 9px; color: var(--accent); opacity: .48; }
    .chapter-mark { position: relative; display: grid; flex: 0 0 30px; width: 30px; height: 30px; place-items: center; border: 1px solid #e2e6ea; border-radius: 10px; color: var(--accent); font-family: var(--serif); font-size: 10px; }
    .chapter-mark svg { position: absolute; inset: -6px; width: 42px; height: 42px; color: var(--accent); opacity: .32; }

    .bottom-bar { position: absolute; z-index: 15; right: 14px; bottom: 12px; left: 14px; overflow: hidden; border: 1px solid #e3e5e8; border-radius: 18px; background: #fff; box-shadow: 0 9px 26px rgba(24, 28, 34, .08); }
    .route-row { display: grid; width: 100%; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 0 8px; border: 0; background: transparent; cursor: pointer; text-align: left; }

    .route-copy { min-width: 0; }

    .route-copy strong { font-size: 12.2px; font-weight: 680; line-height: 1.2; }
    .route-copy small { margin-top: 3px; overflow: hidden; color: var(--ink-faint); font-size: 6.2px; line-height: 1.2; text-overflow: ellipsis; white-space: nowrap; }

    .community { overflow: hidden; color: var(--ink-faint); font-size: 5.8px; text-overflow: ellipsis; white-space: nowrap; }

    .sheet { position: absolute; z-index: 25; right: 12px; bottom: 12px; left: 12px; padding: 13px; border: 1px solid #dde2e7; border-radius: 22px; background: rgba(255, 255, 255, .99); box-shadow: 0 18px 42px rgba(17, 24, 39, .16); opacity: 0; pointer-events: none; transform: translateY(14px); transition: opacity 170ms ease, transform 190ms ease; }
    .sheet.open { opacity: 1; pointer-events: auto; transform: none; }

    .close { display: grid; width: 30px; height: 30px; place-items: center; padding: 0; border: 1px solid #e7e9eb; border-radius: 50%; background: #fff; color: var(--ink-soft); cursor: pointer; }

    .save-list { display: grid; gap: 5px; }

    .save-check { width: 8px; height: 8px; border: 1px solid #d9dde2; border-radius: 50%; background: #fff; }
    .save-item[aria-pressed="true"] { border-color: #d9e0e8; background: var(--accent-soft); }

    .continue-save { display: flex; width: 100%; min-height: 42px; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; padding: 0 7px 0 10px; border: 0; border-radius: 12px; background: var(--ink); color: #fff; cursor: pointer; text-align: left; }
    .continue-save span strong, .continue-save span small { display: block; }

    .continue-save span small { margin-top: 2px; color: #bec4cb; font-size: 6px; }
    .continue-save svg { width: 14px; height: 14px; }
    .continue-save svg path { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .toast { position: absolute; z-index: 35; right: 24px; bottom: 154px; left: 24px; padding: 8px 10px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 7px; text-align: center; opacity: 0; pointer-events: none; transform: translateY(6px); transition: opacity 160ms ease, transform 160ms ease; }
    .phone.sheet-open .toast { bottom: 285px; }
    .toast.show { opacity: 1; transform: none; }

    @media (max-width: 520px) {
      .shell { width: min(100% - 22px, 900px); padding-top: 18px; }

    @media (max-width: 389px) { .phone { width: min(100%, 326px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  </style>

  <script>
    (() => {
      const phone = document.querySelector('.phone');
      const sheet = phone.querySelector('[data-sheet]');
      const loadButton = phone.querySelector('[data-action="load"]');
      const closeButton = phone.querySelector('[data-action="close"]');
      const toast = phone.querySelector('.toast');
      let returnFocus = loadButton;

      const show = (message) => {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.remove('show'), 1400);
      };

      const open = () => {
        returnFocus = document.activeElement;
        sheet.classList.add('open');
        sheet.setAttribute('aria-hidden', 'false');
        loadButton.setAttribute('aria-expanded', 'true');
        phone.classList.add('sheet-open');
        phone.querySelector('.chevron').style.transform = 'rotate(180deg)';
        closeButton.focus();
      };

      const close = (restoreFocus = true) => {
        sheet.classList.remove('open');
        sheet.setAttribute('aria-hidden', 'true');
        loadButton.setAttribute('aria-expanded', 'false');
        phone.classList.remove('sheet-open');
        phone.querySelector('.chevron').style.transform = '';
        if (restoreFocus && returnFocus && typeof returnFocus.focus === 'function') returnFocus.focus();
      };

      phone.addEventListener('click', (event) => {
        const save = event.target.closest('[data-save]');
        const action = event.target.closest('[data-action]');
        if (save) {
          phone.querySelectorAll('[data-save]').forEach((item) => item.setAttribute('aria-pressed', String(item === save)));
          phone.querySelector('[data-current-save]').textContent = `${save.dataset.save} · 3 个记录`;
          phone.querySelector('[data-sheet-current]').textContent = save.dataset.save;
          show(`已选择存档 · ${save.dataset.save}`);
          return;
        }
        if (!action) return;
        if (action.dataset.action === 'load') open();
        if (action.dataset.action === 'close') close();
      });

      document.addEventListener('keydown', (event) => {
        if (!sheet.classList.contains('open')) return;
        if (event.key === 'Escape') {
          event.preventDefault();
          close();
          return;
        }
        if (event.key !== 'Tab') return;
        const focusable = [...sheet.querySelectorAll('button:not([disabled])')];
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      });
    })();
  </script>
</body>
</html>
