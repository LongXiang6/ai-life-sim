<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>欢迎界面最终定版 · S2-A2a-17C</title>
  <link rel="stylesheet" href="../assets/library.css">
  <style>
    :root {
      color-scheme: light;
      --ew-canvas: #f3f1ec;
      --ew-paper: #fbfaf7;
      --ew-surface: #fffefd;
      --ew-ink: #292724;
      --ew-ink-soft: #6e6961;
      --ew-ink-faint: #9a9389;
      --ew-line: #d9d3c9;
      --ew-line-light: #e9e5de;
      --ew-mist: #9ca9ac;
    }

    * { box-sizing: border-box; }
    body { background: var(--ew-canvas); color: var(--ew-ink); }
    .shell { max-width: 900px; }
    .topbar a, .eyebrow { color: var(--ew-ink-soft); }
    .status {
      border: 1px solid var(--ew-line);
      border-radius: 999px;
      background: var(--ew-surface);
      color: var(--ew-ink-soft);
    }
    h1 { color: var(--ew-ink); }
    .subtitle {
      max-width: 720px;
      color: var(--ew-ink-soft);
      font-size: 13px;
      line-height: 1.7;
    }
    .final-stage {
      display: grid;
      justify-items: center;
      gap: 3px;
      margin-top: 28px;
    }
    .final-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 3px;
      color: var(--ew-ink-soft);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .08em;
    }
    .final-label::before {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--ew-mist);
      content: "";
    }
    .spec-summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px 17px;
      max-width: 620px;
      margin: 3px auto 0;
      color: var(--ew-ink-soft);
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }
    .spec-summary span { white-space: nowrap; }
    .spec-summary b { color: var(--ew-ink); font-weight: 620; }

    .phone { height: 590px; }
    .welcome-phone {
      overflow: hidden;
      border-color: var(--ew-line);
      border-radius: 32px;
      background: #fdfcf9;
      box-shadow: 0 13px 30px rgba(62, 55, 44, .075);
    }
    .welcome-phone::before {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 78% 86%, rgba(255, 254, 253, .88), transparent 48%);
      content: "";
      opacity: .82;
    }
    .curve {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .spine { position: absolute; z-index: 2; width: 1px; }
    .copy, .actions { position: absolute; z-index: 3; }
    .brand {
      position: absolute;
      z-index: 4;
      color: var(--ew-ink-soft);
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      font-size: 6.4px;
      font-weight: 680;
      letter-spacing: 1.58px;
      white-space: nowrap;
      transform: rotate(-90deg);
      transform-origin: left top;
    }
    .headline {
      margin: 0;
      color: var(--ew-ink);
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 21px;
      font-weight: 600;
      line-height: 1.34;
      letter-spacing: -.92px;
    }
    .intro {
      max-width: 181px;
      margin: 12px 0 0;
      color: var(--ew-ink-soft);
      font-size: 8.7px;
      font-weight: 440;
      line-height: 1.8;
      letter-spacing: .04px;
    }
    .ui-button {
      display: flex;
      min-height: 42px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: var(--ew-ink);
      cursor: pointer;
      transition: opacity .16s ease, transform .16s ease;
    }
    .ui-button:active { opacity: .56; transform: translateY(1px); }
    .ui-button:focus-visible, .utility-links button:focus-visible {
      outline: 1px dotted var(--ew-ink-soft);
      outline-offset: 2px;
    }
    .entry-label {
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 12.4px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 1.08px;
    }
    .load-stack { display: grid; gap: 3px; }
    .load-stack b {
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 10.1px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: .76px;
    }
    .load-stack span {
      color: var(--ew-ink-faint);
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      font-size: 6.2px;
      font-weight: 520;
      line-height: 1;
      letter-spacing: .2px;
    }
    .utility-links { display: flex; align-items: center; gap: 17px; }
    .utility-links button {
      min-height: 18px;
      padding: 3px 1px;
      border: 0;
      background: transparent;
      color: var(--ew-ink-soft);
      font-family: inherit;
      font-size: 7px;
      font-weight: 520;
      letter-spacing: .15px;
      cursor: pointer;
    }
    .utility-links button + button { position: relative; }
    .utility-links button + button::before {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: -9px;
      width: 1px;
      background: var(--ew-line);
      content: "";
    }
    .footer {
      color: var(--ew-ink-faint);
      font-size: 6.5px;
      letter-spacing: .02px;
      white-space: nowrap;
    }
    .toast {
      position: absolute;
      bottom: 76px;
      left: 50%;
      z-index: 30;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--ew-ink);
      color: var(--ew-surface);
      font-size: 6px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity .18s, transform .18s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* S2-A2a-17C · 双刻页标：17C 定版视觉与交互。 */
    .folio-final .spine {
      top: 44px;
      bottom: 44px;
      left: 26px;
      background: linear-gradient(var(--ew-line-light) 0 12%, var(--ew-line) 12% 65%, var(--ew-line-light) 65% 100%);
    }
    .folio-final .brand { top: 69px; left: 15px; }
    .folio-final .copy { top: 137px; right: 27px; left: 57px; }
    .folio-final .route-guide {
      position: absolute;
      right: 27px;
      bottom: 186px;
      left: 57px;
      z-index: 3;
      height: 1px;
      background: linear-gradient(90deg, var(--ew-line-light) 0 76%, transparent 76% 79%, var(--ew-mist) 79% 100%);
    }
    .folio-final .route-guide::before {
      position: absolute;
      top: -2px;
      right: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--ew-mist);
      content: "";
    }
    .folio-final .actions { right: 27px; bottom: 29px; left: 57px; }
    .folio-final .route-label {
      margin: 0 0 1px;
      color: var(--ew-ink-faint);
      font-family: "SF Pro Text", "PingFang SC", sans-serif;
      font-size: 5.6px;
      font-weight: 620;
      letter-spacing: .66px;
    }
    .folio-final .route-entry {
      position: relative;
      align-items: center;
      width: 100%;
      padding-left: 28px;
      text-align: left;
    }
    .folio-final .route-entry .ui-button {
      align-items: center;
      flex: 1;
      text-align: left;
    }
    .folio-final .route-entry.soft { margin-top: 0; }
    .folio-final .action-mark {
      position: absolute;
      top: 50%;
      left: 0;
      width: 21px;
      height: 14px;
      color: var(--ew-ink-faint);
      transform: translateY(-50%);
    }
    .folio-final .mark-number {
      position: absolute;
      top: 50%;
      left: 0;
      font-family: "SF Pro Text", "PingFang SC", sans-serif;
      font-size: 5.7px;
      font-weight: 660;
      letter-spacing: .15px;
      line-height: 1;
      transform: translateY(-50%);
    }
    .folio-final .route-entry.primary .action-mark { color: var(--ew-ink-soft); }
    .folio-final .route-entry.soft .action-mark { color: var(--ew-ink-faint); }
    .folio-final .action-mark::before {
      position: absolute;
      top: 1px;
      right: 8px;
      bottom: 1px;
      width: 1px;
      background: currentColor;
      content: "";
      opacity: .68;
    }
    .folio-final .action-mark::after {
      position: absolute;
      top: 4px;
      right: 0;
      width: 5px;
      height: 1px;
      background: currentColor;
      box-shadow: 0 6px 0 currentColor;
      content: "";
      opacity: .68;
    }
    .folio-final .route-entry.soft .action-mark::before,
    .folio-final .route-entry.soft .action-mark::after {
      color: var(--ew-mist);
      opacity: .52;
    }
    .folio-final .utility-links { margin-top: 9px; padding-left: 28px; }
    .folio-final .footer { margin-top: 9px; padding-left: 28px; }
    .folio-final .curve-main path { stroke: var(--ew-line-light); }
    .folio-final .curve-main circle { fill: var(--ew-ink-faint); }
    .folio-final .curve-main circle:first-of-type { fill: var(--ew-ink-faint); }
    .folio-final .curve-main circle:last-of-type { fill: var(--ew-mist); }

    @media (max-width: 520px) {
      .shell { width: min(100% - 22px, 900px); padding-top: 18px; }
      .topbar { margin-bottom: 22px; }
      .final-stage { margin-top: 20px; }
      .spec-summary { max-width: 320px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .toast, .ui-button { transition: none; }
    }
  </style>
</head>
<body data-screen="welcome">
  <main class="shell">
    <div class="topbar">
      <a href="../index.html">← 返回界面总览</a>
      <span class="status">最终定版</span>
    </div>
    <p class="eyebrow">WELCOME · FINAL</p>
    <h1>欢迎界面最终定版 · S2-A2a-17C</h1>
    <p class="subtitle">定版「双刻页标」：自研优雅白、左侧书脊与页尾路径收束。入口保持纯文字形态，不使用实体按钮、底板或投影。</p>

    <section class="final-stage" aria-label="S2-A2a-17C 最终界面">
      <div class="final-label">S2-A2a-17C · 双刻页标</div>
      <div class="phone welcome-phone folio-final">
        <span class="spine" aria-hidden="true"></span>
        <div class="brand">AI LIFE SIM</div>
        <span class="route-guide" aria-hidden="true"></span>
        <svg class="curve curve-main" viewBox="0 0 292 590" aria-hidden="true">
          <path d="M272 8 C228 98,275 181,239 272 S213 421,254 503 S260 568,242 610" fill="none" stroke-width="1"/>
          <circle cx="272" cy="8" r="3"/>
          <circle cx="239" cy="272" r="2.6"/>
          <circle cx="254" cy="503" r="1.7"/>
        </svg>
        <div class="copy">
          <div class="headline">一生很长，<br>也只由几次选择组成。</div>
          <div class="intro">选择世界与出身，走过关系、机会、代价和告别。</div>
        </div>
        <div class="actions">
          <div class="route-label">路径终点 / 选择</div>
          <div class="route-entry primary">
            <span class="action-mark" aria-hidden="true"><span class="mark-number">01</span></span>
            <button class="ui-button new-life" data-flow-to="world-select"><span class="entry-label">开始新人生</span></button>
          </div>
          <div class="route-entry soft">
            <span class="action-mark" aria-hidden="true"><span class="mark-number">02</span></span>
            <button class="ui-button load-save" data-flow-to="game-story" aria-label="读取存档，3 个记录">
              <span class="load-stack"><b>读取存档</b><span>3 个记录</span></span>
            </button>
          </div>
          <div class="utility-links">
            <button class="settings" data-flow-to="settings">设置</button>
            <button class="help" data-flow-to="help">说明</button>
          </div>
          <div class="footer">故事小分队交流群 · 1097782298</div>
        </div>
        <div class="toast" role="status" aria-live="polite"></div>
      </div>
      <div class="spec-summary" aria-label="定版规格">
        <span><b>横线</b> 上移 40px</span>
        <span><b>入口字号</b> 12.4 / 10.1 / 6.2px</span>
        <span><b>点击区域</b> ≥ 42px</span>
        <span><b>强调符号</b> 双刻页标</span>
      </div>
    </section>
  </main>
  <script src="../assets/prototype.js"></script>
</body>
</html>
