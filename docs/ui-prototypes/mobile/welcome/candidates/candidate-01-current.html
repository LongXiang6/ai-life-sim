<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>欢迎页 · 候选 01 · 当前运行样式</title>
  <style>
    /* Purpose: Static prototype restoring the current runtime welcome style full-screen. Owner: Interface system. Responsibility: Baseline candidate only; no runtime behavior or state. */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #20283a;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Runtime-matching full-bleed frame. */
    .final-flow-frame {
      position: relative;
      isolation: isolate;
      display: grid;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      place-items: stretch;
      background:
        linear-gradient(135deg, rgba(255, 215, 95, 0.07), rgba(255, 215, 95, 0) 32%),
        linear-gradient(#fafbff, #f3f5f9);
      color-scheme: light;
    }

    .flow-responsive-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    .flow-responsive-layout {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      --final-flow-inline-unit: clamp(3.84px, 1.2vw, 5.16px);
      --final-flow-block-unit: clamp(7.68px, 1.2vh, 11.184px);
      --final-flow-block-unit: clamp(7.68px, 1.2dvh, 11.184px);
      --final-flow-density-px: 1.2px;
    }

    @media (min-width: 48rem) {
      .flow-responsive-viewport {
        width: min(100%, 30rem);
      }
    }

    .container {
      position: relative;
      isolation: isolate;
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      color: #20283a;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    }

    .runningHead {
      display: flex;
      justify-content: space-between;
      padding: calc(2.5 * var(--final-flow-block-unit)) calc(5.1 * var(--final-flow-inline-unit)) 0;
      color: #718099;
      font-size: calc(1.1 * var(--final-flow-block-unit));
      font-weight: 650;
    }

    .quickActions {
      position: absolute;
      z-index: 4;
      top: calc(5.2 * var(--final-flow-block-unit));
      right: calc(5.1 * var(--final-flow-inline-unit));
      display: flex;
      gap: calc(2.2 * var(--final-flow-inline-unit));
    }

    .quickActions button {
      display: grid;
      width: calc(8.4 * var(--final-flow-inline-unit));
      height: calc(8.4 * var(--final-flow-inline-unit));
      place-items: center;
      padding: 0;
      border: calc(0.2 * var(--final-flow-inline-unit)) solid rgba(174, 184, 202, 0.72);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 calc(1 * var(--final-flow-inline-unit)) calc(2.6 * var(--final-flow-inline-unit)) rgba(62, 70, 100, 0.08);
      color: #617086;
      cursor: pointer;
    }

    .quickActions svg {
      width: calc(4.2 * var(--final-flow-inline-unit));
      height: calc(4.2 * var(--final-flow-inline-unit));
      fill: none;
      stroke: currentcolor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.55;
    }

    .intro {
      position: relative;
      z-index: 2;
      padding: calc(8.4 * var(--final-flow-block-unit)) calc(6 * var(--final-flow-inline-unit)) calc(4.2 * var(--final-flow-block-unit));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: calc(1.6 * var(--final-flow-inline-unit));
      margin: 0;
      color: #718099;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: calc(1.05 * var(--final-flow-block-unit));
      font-weight: 600;
    }

    .brand::after {
      width: calc(7 * var(--final-flow-inline-unit));
      height: calc(0.2 * var(--final-flow-inline-unit));
      background: #dce3ed;
      content: "";
    }

    .title {
      margin: calc(3 * var(--final-flow-block-unit)) 0 0;
      color: #171e35;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: calc(6.9 * var(--final-flow-inline-unit));
      font-weight: 600;
      line-height: 1.34;
    }

    .subtitle {
      max-width: calc(78 * var(--final-flow-inline-unit));
      margin: calc(2 * var(--final-flow-block-unit)) 0 0;
      color: #617086;
      font-size: calc(1.1 * var(--final-flow-block-unit));
      line-height: 1.7;
    }

    .actions {
      position: relative;
      z-index: 2;
      width: calc(100% - calc(12 * var(--final-flow-inline-unit)));
      margin: auto calc(6 * var(--final-flow-inline-unit)) calc(3.8 * var(--final-flow-block-unit));
    }

    .routeHeading,
    .utilityHeading {
      display: flex;
      align-items: center;
      gap: calc(1.6 * var(--final-flow-inline-unit));
      margin: 0 0 calc(1 * var(--final-flow-block-unit));
      color: #718099;
      font-size: calc(1.1 * var(--final-flow-block-unit));
      font-weight: 650;
    }

    .routeHeading::after {
      height: calc(0.15 * var(--final-flow-inline-unit));
      flex: 1;
      background: #dce3ed;
      content: "";
    }

    .utilityHeading {
      margin-top: calc(1.8 * var(--final-flow-block-unit));
    }

    .routeAction {
      position: relative;
      display: grid;
      width: 100%;
      min-width: 0;
      min-height: calc(7.2 * var(--final-flow-block-unit));
      grid-template-columns: calc(8 * var(--final-flow-inline-unit)) minmax(0, 1fr) auto;
      align-items: center;
      gap: calc(2 * var(--final-flow-inline-unit));
      padding: calc(1 * var(--final-flow-block-unit)) calc(2 * var(--final-flow-inline-unit));
      overflow: hidden;
      border: calc(0.2 * var(--final-flow-inline-unit)) solid #d8deea;
      border-radius: calc(5.2 * var(--final-flow-inline-unit));
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 calc(1 * var(--final-flow-inline-unit)) calc(3 * var(--final-flow-inline-unit)) rgba(62, 70, 100, 0.08);
      color: inherit;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .routeAction + .routeAction {
      margin-top: calc(0.8 * var(--final-flow-block-unit));
    }

    .primaryBtn {
      min-height: calc(7.5 * var(--final-flow-block-unit));
      border-color: #cfd7ee;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 calc(1.2 * var(--final-flow-inline-unit)) calc(3.4 * var(--final-flow-inline-unit)) rgba(62, 70, 100, 0.1);
    }

    .routeIndex {
      position: relative;
      align-self: stretch;
      display: grid;
      place-items: center;
      color: #8995a5;
      font-size: calc(1.1 * var(--final-flow-block-unit));
      font-weight: 700;
    }

    .routeIndex::after {
      position: absolute;
      top: 20%;
      right: 0;
      bottom: 20%;
      width: calc(0.2 * var(--final-flow-inline-unit));
      background: #dce3ed;
      content: "";
    }

    .routeCopy {
      min-width: 0;
    }

    .routeCopy strong,
    .routeCopy small {
      display: block;
    }

    .routeCopy strong {
      font-size: calc(1.75 * var(--final-flow-block-unit));
      font-weight: 650;
      line-height: 1.2;
    }

    .routeCopy small {
      margin-top: calc(0.45 * var(--final-flow-block-unit));
      overflow: hidden;
      color: #697589;
      font-size: calc(1.05 * var(--final-flow-block-unit));
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .routeArrow {
      display: grid;
      width: calc(6.8 * var(--final-flow-inline-unit));
      height: calc(6.8 * var(--final-flow-inline-unit));
      place-items: center;
      border: calc(0.2 * var(--final-flow-inline-unit)) solid rgba(109, 127, 148, 0.68);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.72);
      color: #6d7f94;
    }

    .routeArrow svg {
      width: calc(3 * var(--final-flow-inline-unit));
      height: calc(3 * var(--final-flow-inline-unit));
      fill: none;
      stroke: currentcolor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.5;
    }

    .primaryBtn .routeArrow {
      border-color: #6d7f94;
      background: #6d7f94;
      color: #fff;
    }

    .secondaryActions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: calc(4 * var(--final-flow-inline-unit));
      row-gap: calc(1 * var(--final-flow-block-unit));
    }

    .secondaryActions .routeAction + .routeAction {
      margin-top: 0;
    }

    .secondaryBtn {
      height: calc(6.1 * var(--final-flow-block-unit));
      grid-template-columns: calc(8 * var(--final-flow-inline-unit)) minmax(0, 1fr);
    }

    .secondaryBtn .routeCopy {
      min-width: 0;
      overflow: hidden;
    }

    .secondaryBtn .routeCopy strong {
      display: block;
      overflow: hidden;
      font-size: calc(1.55 * var(--final-flow-block-unit));
      font-weight: 600;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="final-flow-frame">
    <div class="flow-responsive-viewport">
      <div class="flow-responsive-layout">
        <main class="container">
          <div class="runningHead" aria-hidden="true">
            <span>AI LIFE SIM · 命书</span>
            <span>00 / 欢迎</span>
          </div>

          <nav class="quickActions" aria-label="排行榜与邮箱">
            <button type="button" aria-label="打开排行榜" title="排行榜">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 4h8v3a4 4 0 0 1-8 0V4Z" />
                <path d="M8 6H5v1a4 4 0 0 0 4 4M16 6h3v1a4 4 0 0 1-4 4M12 11v5M8 20h8M9 16h6v4" />
              </svg>
            </button>
            <button type="button" aria-label="打开邮箱" title="邮箱">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16v12H4zM4 7l8 6 8-6" />
              </svg>
            </button>
          </nav>

          <section class="intro" aria-labelledby="welcome-title">
            <p class="brand">人生序章</p>
            <h1 id="welcome-title" class="title">
              一生很长，
              <br />
              也只由几次选择组成。
            </h1>
            <p class="subtitle">选择世界与角色。</p>
          </section>

          <section class="actions" aria-label="开始与辅助操作">
            <p class="routeHeading">从这里开始</p>
            <button type="button" class="routeAction primaryBtn" title="进入世界选择界面，创建一个全新的人生">
              <span class="routeIndex">01</span>
              <span class="routeCopy"><strong>开始新人生</strong></span>
              <span class="routeArrow" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
              </span>
            </button>

            <button type="button" class="routeAction" title="展开存档栏位，选择一段人生继续">
              <span class="routeIndex">02</span>
              <span class="routeCopy">
                <strong>继续人生</strong>
                <small>2 个存档 · 最近：朝雨</small>
              </span>
              <span class="routeArrow" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" /></svg>
              </span>
            </button>

            <p class="utilityHeading">辅助入口</p>
            <div class="secondaryActions">
              <button type="button" class="routeAction secondaryBtn">
                <span class="routeIndex">03</span>
                <span class="routeCopy"><strong>账号与云端</strong></span>
              </button>
              <button type="button" class="routeAction secondaryBtn">
                <span class="routeIndex">04</span>
                <span class="routeCopy"><strong>设置</strong></span>
              </button>
              <button type="button" class="routeAction secondaryBtn">
                <span class="routeIndex">05</span>
                <span class="routeCopy"><strong>游戏说明</strong></span>
              </button>
              <button type="button" class="routeAction secondaryBtn">
                <span class="routeIndex">06</span>
                <span class="routeCopy"><strong>反馈与建议</strong></span>
              </button>
            </div>
          </section>
        </main>
      </div>
    </div>
  </div>
</body>
</html>
