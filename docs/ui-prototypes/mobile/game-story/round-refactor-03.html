<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>核心模拟重构第三轮 · 主次与极简</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #efeee9;
      --paper: #ffffff;
      --ink: #252421;
      --soft: #66625c;
      --faint: #928d85;
      --rule: #d8d3ca;
      --rule-light: #e9e5de;
      --accent: #70649d;
      --accent-deep: #514875;
      --green: #526b61;
      --serif: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
      --sans: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      --shadow: 0 18px 50px rgba(42, 40, 34, .08);
    }
    * { box-sizing: border-box; letter-spacing: 0; }
    html { min-width: 0; background: var(--canvas); }
    body { min-width: 0; margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--sans); }
    button, textarea, input { color: inherit; font: inherit; letter-spacing: 0; }
    button, a, label { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    button:focus-visible, a:focus-visible, textarea:focus-visible, label:focus-within { outline: 1px dotted currentColor; outline-offset: 3px; }
    a { color: inherit; }
    svg { display: block; width: 18px; height: 18px; }
    [hidden] { display: none !important; }

    .review-head { display: grid; width: min(100% - 32px, 1760px); grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; margin: 0 auto; padding: 34px 0 24px; border-bottom: 1px solid #c9c5bd; }
    .review-head h1 { max-width: 19em; margin: 0; font-family: var(--serif); font-size: 30px; font-weight: 600; line-height: 1.35; }
    .review-head p { max-width: 64em; margin: 8px 0 0; color: var(--soft); font-size: 13px; line-height: 1.75; }
    .back-link { min-height: 38px; padding: 9px 0; color: var(--soft); font-size: 12px; text-underline-offset: 5px; }
    .candidate-grid { display: grid; width: min(100% - 32px, 1760px); grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; align-items: start; margin: 0 auto; padding: 26px 0 64px; }
    .candidate { min-width: 0; }
    .candidate-label { min-height: 116px; padding: 0 2px 16px; }
    .candidate-code { color: var(--accent-deep); font-size: 11px; font-weight: 700; }
    .candidate-label h2 { margin: 7px 0 0; font-family: var(--serif); font-size: 20px; font-weight: 600; line-height: 1.4; }
    .candidate-label p { margin: 6px 0 0; color: var(--soft); font-size: 11px; line-height: 1.65; }
    .candidate-stage { padding: 12px; background: #e6e4de; }
    .sim { container-type: inline-size; position: relative; min-width: 0; min-height: 1510px; overflow: clip; background: var(--paper); box-shadow: var(--shadow); --bar-height: 46px; }

    .sticky-shell { position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,.97); }
    .reader-bar { position: relative; z-index: 2; display: grid; min-height: var(--bar-height); gap: 6px; align-items: center; padding: 0 14px; border-bottom: 1px solid var(--rule); background: rgba(255,255,255,.97); backdrop-filter: blur(10px); }
    .bar-primary { min-width: 0; overflow: hidden; font-family: var(--serif); font-size: 11px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .bar-primary small { display: block; margin-top: 2px; color: var(--faint); font-family: var(--sans); font-size: 7px; font-weight: 400; }
    .bar-time { color: var(--faint); font-size: 8px; line-height: 1.25; text-align: right; white-space: nowrap; }
    .bar-time b { display: block; color: var(--ink); font-family: var(--serif); font-size: 12px; font-weight: 600; }
    .icon-button { display: grid; width: 34px; height: 38px; place-items: center; padding: 0; border: 0; background: transparent; color: var(--soft); }
    .info-toggle[aria-expanded="true"] { color: var(--accent-deep); }

    .force-button { position: relative; min-height: 40px; padding: 4px 4px; border: 0; background: transparent; color: var(--ink); font-size: 9px; font-weight: 650; white-space: nowrap; }
    .force-button::after { position: absolute; right: 4px; bottom: 4px; left: 4px; height: 1px; background: var(--accent); content: ""; transform: scaleX(.35); transition: transform .16s ease; }
    .force-button:hover::after, .force-button:focus-visible::after, .force-button[aria-pressed="true"]::after { transform: scaleX(1); }
    .force-button[aria-pressed="true"] { color: var(--accent-deep); }
    .force-button[aria-pressed="true"]::before { display: inline-block; width: 5px; height: 5px; margin: 0 5px 1px 0; border-radius: 50%; background: var(--accent); content: ""; }
    .force-button:disabled { color: var(--faint); }
    .force-button:disabled::after { background: var(--rule); transform: scaleX(.35); }

    .mode-balanced .reader-bar { grid-template-columns: minmax(0,1fr) auto auto 34px; }
    .mode-action .reader-bar { grid-template-columns: auto minmax(0,1fr) auto 34px; }
    .mode-action .force-button { color: var(--accent-deep); font-family: var(--serif); font-size: 10px; }
    .mode-stacked { --bar-height: 54px; }
    .mode-stacked .reader-bar { grid-template-columns: minmax(0,1fr) auto 34px; }
    .mode-stacked .bar-primary { font-size: 12px; }
    .mode-stacked .force-button { min-width: 62px; }
    .mode-margin .reader-bar { grid-template-columns: minmax(0,1fr) auto 34px; }
    .force-rail-wrap { position: sticky; top: calc(var(--bar-height) + 8px); z-index: 36; display: flex; height: 0; justify-content: flex-end; padding-right: 1px; pointer-events: none; }
    .force-rail { width: 40px; min-height: 78px; padding: 7px 5px; border: 1px solid var(--rule); border-right: 0; background: rgba(255,255,255,.97); color: var(--ink); line-height: 1.25; white-space: normal; writing-mode: vertical-rl; pointer-events: auto; }
    .force-rail::after { top: 8px; right: auto; bottom: 8px; left: 3px; width: 1px; height: auto; transform: scaleY(.35); }
    .force-rail:hover::after, .force-rail:focus-visible::after, .force-rail[aria-pressed="true"]::after { transform: scaleY(1); }
    .mode-margin .reading { padding-right: 46px; }

    .reading { padding: 28px 20px 40px; }
    .chapter-head { margin: 0; }
    .chapter-head small { color: var(--faint); font-size: 10px; }
    .chapter-head h3 { margin: 8px 0 0; font-family: var(--serif); font-size: 27px; font-weight: 600; line-height: 1.35; }
    .chapter-rule { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; margin-top: 22px; color: var(--faint); font-size: 9px; }
    .chapter-rule::before { height: 1px; background: var(--rule); content: ""; }
    .timeline-heading { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule-light); color: var(--faint); font-size: 9px; }
    .look-back { width: 100%; min-height: 38px; padding: 8px 0; border: 0; background: transparent; color: var(--faint); font-size: 9px; text-align: center; }
    .story-entry { padding: 18px 0; }
    .entry-meta { display: flex; justify-content: space-between; gap: 12px; color: var(--faint); font-size: 9px; }
    .story-prose { font-family: var(--serif); font-size: 15px; line-height: 1.98; }
    .story-prose p { margin: 12px 0 0; }
    .story-prose .opening::first-letter { float: left; margin: 7px 7px 0 0; font-size: 35px; line-height: .8; }
    .story-separator { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; color: var(--faint); font-family: var(--serif); font-size: 10px; }
    .story-separator::before, .story-separator::after { height: 1px; background: var(--rule-light); content: ""; }
    .state-change { display: flex; flex-wrap: wrap; gap: 7px 14px; margin-top: 12px; color: var(--green); font-size: 9px; }

    .branch { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--rule); }
    .branch.manual { border-top-color: var(--accent); }
    .branch-kicker { margin: 0 0 6px; color: var(--accent-deep); font-size: 8px; }
    .branch h4 { margin: 0 0 8px; font-family: var(--serif); font-size: 15px; font-weight: 600; line-height: 1.7; }
    .branch-option { position: relative; display: grid; min-height: 58px; grid-template-columns: 30px minmax(0,1fr); align-items: center; border-top: 1px solid var(--rule-light); color: var(--soft); cursor: pointer; font-size: 11px; line-height: 1.6; }
    .branch-option input { position: absolute; opacity: 0; }
    .branch-number { color: var(--faint); font-size: 9px; }
    .branch-option.selected { color: var(--ink); }
    .branch-option.selected .branch-number { color: var(--accent-deep); text-decoration: underline; text-underline-offset: 4px; }
    .branch-input { width: 100%; min-height: 82px; resize: vertical; padding: 13px 0; border: 0; border-top: 1px solid var(--rule-light); border-bottom: 1px solid var(--rule); outline: 0; background: transparent; font-family: var(--serif); font-size: 11px; line-height: 1.7; }
    .branch-input::placeholder { color: var(--faint); }
    .branch-actions { display: flex; justify-content: space-between; gap: 18px; margin-top: 5px; }
    .branch-actions button { min-height: 40px; padding: 6px 0; border: 0; background: transparent; font-size: 10px; }
    .clear-choice { color: var(--faint); }
    .confirm-choice { font-family: var(--serif); font-size: 12px !important; font-weight: 600; }
    .confirm-choice:disabled { color: var(--faint); }
    .resolved { margin: 14px 0 0; padding-top: 13px; border-top: 1px solid var(--rule-light); color: var(--soft); font-family: var(--serif); font-size: 11px; line-height: 1.7; }
    .advance { display: grid; width: 100%; min-height: 70px; grid-template-columns: 30px minmax(0,1fr) 20px; gap: 10px; align-items: center; margin-top: 24px; padding: 5px 0; border: 0; border-top: 1px solid var(--rule); background: transparent; text-align: left; }
    .advance .page-number { color: var(--faint); font-size: 9px; }
    .advance strong, .advance small { display: block; }
    .advance strong { font-family: var(--serif); font-size: 14px; font-weight: 600; }
    .advance small { margin-top: 3px; color: var(--faint); font-size: 8px; line-height: 1.45; }
    .advance svg { color: var(--faint); }
    .advance:disabled { color: var(--faint); }
    .settlement-link { display: block; min-height: 38px; margin-top: 8px; padding: 10px 0; color: var(--soft); font-size: 9px; text-underline-offset: 5px; }

    .info-panel { display: none; position: absolute; top: var(--bar-height); right: 0; left: 0; max-height: min(70dvh,560px); overflow-y: auto; border-bottom: 1px solid var(--rule); background: var(--paper); box-shadow: 0 18px 32px rgba(37,36,33,.08); }
    .info-panel.open { display: block; animation: reveal .18s ease both; }
    .info-inner { padding: 16px 18px 20px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel-head strong { font-family: var(--serif); font-size: 14px; font-weight: 600; }
    .panel-head small { color: var(--faint); font-size: 9px; }
    .identity-index { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-top: 1px solid var(--rule-light); border-bottom: 1px solid var(--rule-light); color: var(--soft); font-size: 9px; }
    .attributes { display: flex; min-height: 34px; align-items: center; justify-content: space-between; gap: 12px; overflow-x: auto; color: var(--faint); font-size: 9px; font-variant-numeric: tabular-nums; white-space: nowrap; scrollbar-width: none; }
    .attributes::-webkit-scrollbar { display: none; }
    .attributes b { color: var(--soft); font-weight: 650; }
    .attributes .rise { color: var(--accent-deep); }
    .section-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 12px; }
    .section-line strong { font-family: var(--serif); font-size: 12px; font-weight: 600; }
    .section-line small { color: var(--faint); font-size: 8px; }
    .step-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); margin-top: 7px; border-top: 1px solid var(--rule-light); }
    .step-grid button { min-height: 39px; padding: 4px 2px; border: 0; border-right: 1px solid var(--rule-light); border-bottom: 1px solid var(--rule-light); background: transparent; color: var(--faint); font-size: 9px; }
    .step-grid button:nth-child(4n) { border-right: 0; }
    .step-grid button.active { color: var(--ink); box-shadow: inset 0 -2px var(--accent); }
    .ledger-label { margin: 13px 0 4px; color: var(--faint); font-size: 8px; }
    .talent { display: grid; grid-template-columns: 26px minmax(0,1fr); padding: 7px 0; border-top: 1px solid var(--rule-light); font-family: var(--serif); font-size: 10px; line-height: 1.55; }
    .talent::before { color: var(--faint); font-family: var(--sans); font-size: 8px; content: attr(data-index); }
    .state-list { display: flex; flex-wrap: wrap; gap: 7px 15px; padding-top: 8px; border-top: 1px solid var(--rule-light); color: var(--soft); font-size: 9px; }
    .state-list span::before { margin-right: 4px; color: var(--accent); content: "·"; }
    .more-actions { margin-top: 12px; border-top: 1px solid var(--rule); }
    .menu-action { display: flex; width: 100%; min-height: 42px; align-items: center; padding: 7px 0; border: 0; border-bottom: 1px solid var(--rule-light); background: transparent; color: var(--soft); font-size: 10px; text-align: left; text-decoration: none; }

    .save-overlay { display: none; position: fixed; z-index: 90; inset: 0; place-items: center; padding: 24px; background: rgba(37,36,33,.28); backdrop-filter: blur(3px); }
    .save-overlay.open { display: grid; }
    .save-dialog { width: min(100%,380px); padding: 20px; border: 1px solid var(--rule); background: var(--paper); box-shadow: 0 22px 50px rgba(37,36,33,.14); }
    .save-dialog h4 { margin: 0 0 10px; font-family: var(--serif); font-size: 18px; font-weight: 600; }
    .save-slot { min-height: 46px; padding: 12px 0; border-bottom: 1px solid var(--rule-light); color: var(--soft); font-size: 10px; }
    .save-actions { display: flex; justify-content: flex-end; gap: 20px; margin-top: 10px; }
    .save-actions button { min-height: 38px; padding: 5px 0; border: 0; background: transparent; color: var(--soft); font-size: 10px; }
    .toast { position: fixed; right: 18px; bottom: 18px; left: 18px; z-index: 110; max-width: 420px; margin: auto; padding: 9px 12px; border: 1px solid var(--rule); background: var(--paper); color: var(--soft); font-size: 9px; line-height: 1.5; text-align: center; opacity: 0; pointer-events: none; transform: translateY(8px); transition: .18s ease; }
    .toast.show { opacity: 1; transform: none; }

    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: page-old .22s cubic-bezier(.4,0,.2,1) both; }
    ::view-transition-new(root) { animation: page-new .28s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes page-old { to { opacity: 0; transform: translateY(-7px) scale(.995); } }
    @keyframes page-new { from { opacity: 0; transform: translateY(9px) scale(.995); } }
    @keyframes reveal { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
    @media (max-width:1279px) { .candidate-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media (max-width:700px) {
      .review-head { width: min(100% - 24px,540px); grid-template-columns: 1fr; gap: 8px; padding-top: 24px; }
      .review-head h1 { font-size: 26px; }
      .back-link { justify-self: start; }
      .candidate-grid { width: min(100% - 24px,540px); grid-template-columns: 1fr; gap: 30px; padding-top: 20px; }
      .candidate-label { min-height: 0; }
      .candidate-stage { padding: 8px; }
      .sim { min-height: 0; }
    }
    @container (max-width:340px) {
      .reader-bar { padding-right: 10px; padding-left: 12px; }
      .mode-balanced .reader-bar { grid-template-columns: minmax(0,1fr) auto auto 32px; }
      .reading { padding-right: 18px; padding-left: 18px; }
      .story-prose { font-size: 14px; }
      .force-button { font-size: 8px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="review-head">
    <div><h1>核心模拟重构第三轮</h1><p>GS-RF2-1 晋级。本轮固定锚定薄页眉，以主次清晰和极简主义比较常驻“强制分支”按钮的位置；该按钮切换下一轮强制分支，不再收纳于“更多”。</p></div>
    <a class="back-link" href="index.html">返回故事页历史</a>
  </header>
  <main class="candidate-grid">
    <article class="candidate" data-candidate="GS-RF3-1"><header class="candidate-label"><span class="candidate-code">GS-RF3-1</span><h2>均衡单行</h2><p>人物是主信息；强制分支、年龄与信息入口依次退后。</p></header><div class="candidate-stage"><section class="sim mode-balanced" data-mode="balanced" aria-label="GS-RF3-1 均衡单行"></section></div></article>
    <article class="candidate" data-candidate="GS-RF3-2"><header class="candidate-label"><span class="candidate-code">GS-RF3-2</span><h2>主操作前置</h2><p>强制分支位于页眉首位，适合频繁主动干预叙事。</p></header><div class="candidate-stage"><section class="sim mode-action" data-mode="action" aria-label="GS-RF3-2 主操作前置"></section></div></article>
    <article class="candidate" data-candidate="GS-RF3-3"><header class="candidate-label"><span class="candidate-code">GS-RF3-3</span><h2>身份叠排</h2><p>人物、地点和年龄收成主信息块，右侧只留下两个动作。</p></header><div class="candidate-stage"><section class="sim mode-stacked" data-mode="stacked" aria-label="GS-RF3-3 身份叠排"></section></div></article>
    <article class="candidate" data-candidate="GS-RF3-4"><header class="candidate-label"><span class="candidate-code">GS-RF3-4</span><h2>页边常驻</h2><p>页眉保持安静，强制分支沿右侧页边持续可见。</p></header><div class="candidate-stage"><section class="sim mode-margin" data-mode="margin" aria-label="GS-RF3-4 页边常驻"></section></div></article>
  </main>

  <template id="save-template"><div class="save-overlay"><section class="save-dialog" role="dialog" aria-modal="true" aria-label="手动存档"><h4>手动存档</h4><div class="save-slot">槽位 1 · 林清和 · 第 12 轮</div><div class="save-slot">槽位 2 · 空</div><div class="save-slot">槽位 3 · 空</div><div class="save-actions"><button type="button" data-save-close>取消</button><button type="button" data-save-confirm>保存</button></div></section></div></template>

  <script>
    (() => {
      const steps = ['日','月','季','年','3年','5年','10年','50年','100年','200年','500年','1000年'];
      const months = ['霜月','杏月','桃月','槐月','榴月','荷月','兰月','桂月','菊月','露月','葭月','冰月'];
      const infoIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 11v6M12 7.5h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      const arrowIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      function barMarkup(mode) {
        const name = '<span class="bar-primary">林清和</span>';
        const time = '<span class="bar-time"><b class="age-label">6岁</b><span class="era-label">2006 · 桃月</span></span>';
        const force = '<button class="force-button" type="button" aria-pressed="false">强制分支</button>';
        const info = `<button class="icon-button info-toggle" type="button" aria-expanded="false" aria-label="展开当前信息">${infoIcon}</button>`;
        if (mode === 'action') return `${force}${name}${time}${info}`;
        if (mode === 'stacked') return `<span class="bar-primary">林清和<small>滨海旧城 · <span class="age-label">6岁</span> · <span class="era-label">2006 桃月</span></small></span>${force}${info}`;
        if (mode === 'margin') return `<span class="bar-primary">林清和 · 滨海旧城</span>${time}${info}`;
        return `${name}${force}${time}${info}`;
      }

      function infoMarkup() {
        return `<div class="info-inner"><div class="panel-head"><strong>当前信息</strong><button class="icon-button info-close" type="button" aria-label="关闭当前信息"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button></div><div class="identity-index"><span>林清和 · 女 · 人类</span><span>现代地球 · 滨海旧城</span></div><div class="attributes"><span>体魄 <b>−1</b></span><span>心智 <b class="rise">+4</b></span><span>悟性 <b class="rise">+3</b></span><span>魅力 <b>−1</b></span><span>生命 <b>100</b></span></div><div class="section-line"><strong>推进步长</strong><small class="step-label">月</small></div><div class="step-grid"></div><div class="section-line"><strong>世界与角色账簿</strong><small>第 12 轮</small></div><p class="ledger-label">角色词条</p><span class="talent" data-index="01">体能守恒织网与冬夜回声的共振契约</span><span class="talent" data-index="02">完美主义的选择刑</span><span class="talent" data-index="03">旧日信标</span><p class="ledger-label">世界与当前状态</p><div class="state-list"><span>城市为主</span><span>温带气候</span><span>市场经济</span><span>无超自然</span><span>体力 100</span><span>精神 100</span></div><div class="more-actions"><div class="section-line"><strong>更多</strong><small>当前章节</small></div><button class="menu-action" type="button" data-save>手动存档</button><a class="menu-action" href="../fate-preview/final.html">返回命运预览</a></div></div>`;
      }

      function storyMarkup() {
        return `<header class="chapter-head"><small>第十二回 · 故事进程</small><h3>故事进行中</h3><div class="chapter-rule"><span class="round-state">第 12 轮 · 岁月流转</span></div></header><div class="timeline-heading"><span>故事进程</span><span class="round-label">第 12 轮</span></div><button class="look-back" type="button" aria-expanded="false">向上回望更早的十二段人生</button><article class="story-entry earlier-entry" hidden><div class="entry-meta"><span>2005年 · 冰月</span><span>5 岁</span></div><div class="story-prose"><p>那年冬天，你第一次在父亲的旧抽屉里见到底片盒。盒盖没有题字，只有一道被反复摩挲过的浅痕。</p></div></article><article class="story-entry"><div class="entry-meta"><span>2006年 · 杏月</span><span>6 岁</span></div><div class="story-prose"><p class="opening">午后的旧书店里，窗格把阳光切成细长的方块。你趴在柜台边，用放大镜对着那张旧底片一寸寸移动。</p><p>底片深处的人影终于露出轮廓：他站在沈家废园的砖墙旁，手里握着一根没有鱼线的旧鱼竿。孙伯盯着那个人影看了很久，最后只说，废园的墙会记得比人更久。</p></div><div class="state-change"><span>心智 +0.4</span><span>旧城传闻 +1</span></div></article><div class="story-separator">章中</div><article class="story-entry"><div class="entry-meta"><span>2006年 · 桃月 · 上旬</span><span>6 岁</span></div><div class="story-prose"><p>接下来的几天，你把底片藏在国语课本里。放学后经过海堤，潮声总让你想起鱼竿末端那截空白：像有人刻意剪断了它与水面的联系。</p><p>父亲察觉你常常走神，却没有追问。他只在晚饭后把一串旧钥匙挂回门边，其中最小的一把，形状恰好和底片盒背面的凹槽相似。</p></div></article><div class="story-separator">桃月十七</div><article class="story-entry"><div class="entry-meta"><span>2006年 · 桃月</span><span>6 岁</span></div><div class="story-prose"><p>周六清晨，孙伯带你绕到废园背后。墙根刻着一行已经模糊的字，他蹲下擦去青苔，只辨认出“存米七斗”四个字。</p><p>巡街的脚步声从巷口逼近。孙伯把底片塞回你手里。你没有立刻回答，只把底片收好，等巡街人影消失在巷口。</p></div></article><span class="continuation-anchor"></span><button class="advance" type="button" data-state="ready"><span class="page-number">13</span><span><strong>轻触，让岁月流转</strong><small>下一段故事已经准备好</small></span>${arrowIcon}</button><a class="settlement-link" href="../game-over/final.html">原型串联 · 跳到人生结算</a>`;
      }

      function branchBlock(name) {
        const wrap = document.createElement('div');
        wrap.className = 'branch-block';
        wrap.innerHTML = `<section class="branch manual branch-pending"><p class="branch-kicker">手动强制 · 命运分叉</p><h4>废园的线索再次交到你手中。你准备主动把故事推向哪里？</h4><label class="branch-option"><input type="radio" name="${name}" value="继续追查废园，先找到墙内木门的钥匙。"><span class="branch-number">01</span><span>继续追查废园，先找到墙内木门的钥匙。</span></label><label class="branch-option"><input type="radio" name="${name}" value="带着底片回家，直接询问父亲照片中的人。"><span class="branch-number">02</span><span>带着底片回家，直接询问父亲照片中的人。</span></label><textarea class="branch-input" aria-label="自定义选择" placeholder="也可以写下你的做法……"></textarea><div class="branch-actions"><button class="clear-choice" type="button">清空</button><button class="confirm-choice" type="button" disabled>确认选择</button></div></section><p class="resolved" hidden>你决定：<span></span></p>`;
        return wrap;
      }

      function init(root,index) {
        const mode = root.dataset.mode;
        root.innerHTML = `<div class="sticky-shell"><header class="reader-bar">${barMarkup(mode)}</header><section class="info-panel" aria-label="当前信息">${infoMarkup()}</section></div>${mode === 'margin' ? '<div class="force-rail-wrap"><button class="force-button force-rail" type="button" aria-pressed="false">强制分支</button></div>' : ''}<main class="reading"><div class="story-slot">${storyMarkup()}</div></main><div class="save-mount"></div><div class="toast" role="status" aria-live="polite"></div>`;
        root.querySelector('.save-mount').append(document.querySelector('#save-template').content.cloneNode(true));
        root.querySelectorAll('.step-grid').forEach((grid) => steps.forEach((name) => { const button=document.createElement('button'); button.type='button'; button.dataset.step=name; button.textContent=name; if(name==='月')button.classList.add('active'); grid.append(button); }));

        const info=root.querySelector('.info-panel'); const infoToggle=root.querySelector('.info-toggle');
        const closeInfo=()=>{info.classList.remove('open');infoToggle.setAttribute('aria-expanded','false');};
        infoToggle.addEventListener('click',()=>{const open=!info.classList.contains('open');closeInfo();if(open){info.classList.add('open');infoToggle.setAttribute('aria-expanded','true');}});
        root.querySelector('.info-close').addEventListener('click',closeInfo);

        let step='月',year=2006,month=2,age=6,day=0,round=12,forceNext=false,branchCount=0;
        const force=root.querySelector('.force-button'); const toast=root.querySelector('.toast'); const advance=root.querySelector('.advance');
        const showToast=(message)=>{toast.textContent=message;toast.classList.add('show');clearTimeout(toast._timer);toast._timer=setTimeout(()=>toast.classList.remove('show'),1400);};
        const updateForce=()=>{force.setAttribute('aria-pressed',String(forceNext));force.textContent=force.disabled?'分支进行中':forceNext?'已强制':'强制分支';};
        force.addEventListener('click',()=>{if(force.disabled)return;forceNext=!forceNext;updateForce();showToast(forceNext?'下一轮将强制生成命运分支':'已取消下一轮强制分支');});
        root.querySelectorAll('[data-step]').forEach((button)=>button.addEventListener('click',()=>{root.querySelectorAll('[data-step]').forEach((item)=>item.classList.toggle('active',item.dataset.step===button.dataset.step));step=button.dataset.step;root.querySelector('.step-label').textContent=step;showToast(`下一轮按${step}推进 · 当前时间未改变`);}));

        const save=root.querySelector('.save-overlay');root.querySelector('[data-save]').addEventListener('click',()=>{closeInfo();save.classList.add('open');save.querySelector('[data-save-close]').focus();});
        save.querySelector('[data-save-close]').addEventListener('click',()=>save.classList.remove('open'));save.querySelector('[data-save-confirm]').addEventListener('click',()=>{save.classList.remove('open');showToast('已保存到槽位 1');});save.addEventListener('click',(event)=>{if(event.target===save)save.classList.remove('open');});
        const earlier=root.querySelector('.earlier-entry');const lookBack=root.querySelector('.look-back');lookBack.addEventListener('click',()=>{const open=earlier.hidden;earlier.hidden=!open;lookBack.setAttribute('aria-expanded',String(open));lookBack.textContent=open?'已回望至更早的人生片段':'向上回望更早的十二段人生';});

        const setAdvance=(state,title,hint,disabled)=>{advance.dataset.state=state;advance.querySelector('strong').textContent=title;advance.querySelector('small').textContent=hint;advance.disabled=disabled;};
        const moveClock=()=>{let label;if(step==='日'){day+=1;label=`${year}年 · ${months[month]} · 第${day+1}日`;}else{day=0;const jump=step==='月'?1:step==='季'?3:0;if(jump){const total=month+jump;const years=Math.floor(total/12);month=total%12;year+=years;age+=years;}else{const years=step==='年'?1:(parseInt(step,10)||1);year+=years;age+=years;}label=`${year}年 · ${months[month]}`;}root.querySelectorAll('.era-label').forEach((node)=>node.textContent=label.replace('年 · ',' · '));root.querySelectorAll('.age-label').forEach((node)=>node.textContent=`${age}岁`);return{label,age:`${age} 岁`};};

        const wireBranch=(block)=>{const radios=Array.from(block.querySelectorAll('input'));const custom=block.querySelector('textarea');const confirm=block.querySelector('.confirm-choice');const clear=block.querySelector('.clear-choice');const update=()=>{confirm.disabled=!(custom.value.trim()||radios.some((radio)=>radio.checked));};radios.forEach((radio)=>radio.addEventListener('change',()=>{custom.value='';block.querySelectorAll('.branch-option').forEach((option)=>option.classList.remove('selected'));radio.closest('.branch-option').classList.add('selected');update();}));custom.addEventListener('input',()=>{if(custom.value.trim()){radios.forEach((radio)=>{radio.checked=false;});block.querySelectorAll('.branch-option').forEach((option)=>option.classList.remove('selected'));}update();});clear.addEventListener('click',()=>{radios.forEach((radio)=>{radio.checked=false;});block.querySelectorAll('.branch-option').forEach((option)=>option.classList.remove('selected'));custom.value='';update();});confirm.addEventListener('click',()=>{const selected=radios.find((radio)=>radio.checked);const choice=custom.value.trim()||(selected&&selected.value);if(!choice)return;block.querySelector('.branch-pending').hidden=true;block.querySelector('.resolved').hidden=false;block.querySelector('.resolved span').textContent=choice;force.disabled=false;forceNext=false;updateForce();setAdvance('generating','AI 正在书写命运……','选择已记录，下一段人生正在生成',true);setTimeout(()=>{appendEntry(choice,false);setAdvance('ready','轻触，让岁月流转','故事已经沿着你的选择继续',false);},450);});};

        const appendEntry=(choice,withBranch)=>{round+=1;const next=moveClock();const separator=document.createElement('div');separator.className='story-separator';separator.textContent=withBranch?'命运分叉':'续页';const article=document.createElement('article');article.className='story-entry generated-entry';const meta=document.createElement('div');meta.className='entry-meta';const date=document.createElement('span');date.textContent=next.label;const ageNode=document.createElement('span');ageNode.textContent=next.age;meta.append(date,ageNode);const prose=document.createElement('div');prose.className='story-prose';const first=document.createElement('p');first.textContent=withBranch?'你主动要求命运在此分开。旧城的风从巷口灌入，孙伯终于把那把小钥匙放进你掌心。':'时间继续向前，旧底片背后的线索再次浮现。海风掠过旧城屋脊，每一次选择都让故事通向不同的地方。';const second=document.createElement('p');second.textContent=`“${choice}”——这句话落下后，新的线索也随之展开。`;prose.append(first,second);article.append(meta,prose);if(withBranch){branchCount+=1;const block=branchBlock(`manual-${index}-${branchCount}`);article.append(block);wireBranch(block);force.disabled=true;updateForce();setAdvance('blocked','完成分支后继续','当前故事正在等待你的决定',true);}root.querySelector('.continuation-anchor').before(separator,article);root.querySelector('.round-label').textContent=`第 ${round} 轮`;root.querySelector('.round-state').textContent=withBranch?`第 ${round} 轮 · 强制分支`:`第 ${round} 轮 · 岁月流转`;article.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'center'});};

        advance.addEventListener('click',()=>{if(advance.dataset.state!=='ready')return;setAdvance('generating','岁月正在流转……','AI 正在书写下一段人生',true);setTimeout(()=>{const forced=forceNext;forceNext=false;updateForce();appendEntry('继续向前',forced);if(!forced)setAdvance('ready','轻触，让岁月流转','下一段故事已经准备好',false);},420);});
      }
      document.querySelectorAll('.sim').forEach(init);
    })();
  </script>
</body>
