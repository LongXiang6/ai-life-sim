    .branch{margin:16px 0 0;padding:14px 0 4px;border:0;border-top:1px solid var(--folio-line);background:transparent}.branch-heading{position:relative;margin-bottom:10px;padding-left:25px}.branch-heading::before{position:absolute;top:2px;left:0;width:14px;height:16px;border-left:1px solid var(--folio-mist);border-right:4px double var(--folio-mist);content:"";opacity:.74}.branch-question{margin:0;font-family:"Songti SC","STSong","SimSun",serif;font-size:10.5px;font-weight:600;line-height:1.62}.branch-option{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr);align-items:center;gap:8px;min-height:48px;padding:8px 3px;border-top:1px solid var(--folio-line-light);color:var(--folio-ink);font-size:9.2px;line-height:1.55;cursor:pointer;counter-increment:choice}.branch-option::before{color:var(--folio-faint);font-size:6px;font-weight:650;letter-spacing:.08em;content:"0" counter(choice)}.branch-option input{position:absolute;width:1px;height:1px;opacity:0}.branch-option:has(input:checked),.branch-option.selected{color:var(--color-primary)}.branch-option:has(input:checked)::before,.branch-option.selected::before{color:var(--color-primary);text-decoration:underline;text-underline-offset:4px}.branch-option.selected::after{position:absolute;right:3px;bottom:3px;color:var(--color-primary);font-size:5.9px;content:"已选择"}.branch-input{width:100%;min-height:58px;max-height:104px;margin-top:4px;padding:10px 3px;resize:vertical;border:0;border-top:1px solid var(--folio-line-light);border-bottom:1px solid var(--folio-line);outline:none;background:transparent;color:var(--folio-ink);font-size:9px;line-height:1.55}.branch-input::placeholder{color:var(--folio-faint)}.branch-input:focus{border-bottom-color:var(--color-primary)}.branch-actions{display:grid;grid-template-columns:1fr 1.7fr;gap:8px;align-items:center;margin-top:11px}.branch-actions button,.dialog-actions button{min-height:44px;padding:8px 12px;border:0;font-size:8.5px;white-space:nowrap}.branch-actions .conf     .world-panel.open{background:var(--folio-paper)}

  <main class="shell">
    <div class="topbar"><a href="index.html">← 返回故事页历史</a><span data-selection>尚未选择</span></div>
    <p class="eyebrow">CORE SIMULATION · ROUND 22</p>
    <h1>GS23A 下一代：欢迎页式沉浸叙事</h1>
    <p class="subtitle">GS23A 晋级。本轮以欢迎界面定版 S2-A2a-17C 为视觉真源：继承素白书页、页边书脊、人生路径、双刻页标与无框文字操作，同时重新比较顶部信息栏如何成为叙事的一部分。</p>
    <section class="option-grid" id="optionGrid"></section>
    <p class="selection">手机内功能均可操作；世界面板默认展开以检查完整词条。点击方案说明区域标记选择。</p>

  <template id="phoneTemplate">
    <div class="phone runtime-phone">

      <main class="timeline"><div class="timeline-head"><span>故事进程</span><span>第 12 轮</span></div><div class="load-more">向上回望更早的十二段人生</div><article class="entry"><div class="entry-meta"><span>2006年 · 杏月</span><span>6 岁</span></div><div class="prose"><p>午后的旧书店里，窗格把阳光切成细长的方块。你趴在柜台边，用放大镜对着那张旧底片一寸寸移动。</p><p>底片深处的人影终于露出轮廓：他站在沈家废园的砖墙旁，手里握着一根没有鱼线的旧鱼竿。</p></div></article><div class="separator">✦</div><article class="entry current-entry"><div class="entry-meta"><span>2006年 · 桃月</span><span>6 岁</span></div><div class="prose"><p>周六清晨，孙伯带你绕到废园背后。墙根刻着一行已经模糊的字，他蹲下擦去青苔，只辨认出“存米七斗”四个字。</p><p>巡街的脚步声从巷口逼近。孙伯把底片塞回你手里，低声问你，是继续查下去，还是先把它交给父亲。</p></div><section class="branch branch-pending"><div class="branch-heading"><p class="branch-question">巡街脚步逼近。底片留在你手中——你准备怎么做？</p></div><label class="branch-option"><input type="radio" name="branch"><span>继续跟着孙伯调查废园，先弄清墙上刻字的来历。</span></label><label class="branch-option"><input type="radio" name="branch"><span>把底片交给父亲，问他是否认识照片中的人。</span></label><textarea class="branch-input" aria-label="自定义选择" placeholder="也可以写下你的做法……"></textarea><div class="branch-actions"><button class="confirm" disabled>确认选择</button><button class="cancel">清空</button></div></section><div class="branch-resolved">你决定：<span class="resolved-text"></span></div></article><button class="advance" data-state="blocked" disabled><span class="advance-title">完成选择后继续</span><span class="advance-hint">当前故事仍在等待你的决定</span></button></main>

  <script>
    const variants=[
      {cls:'gs24a',choice:'GS24A 双刻页眉',title:'GS24A · 双刻页眉',copy:'最忠实承接 S2-A2a-17C：书脊、右侧路径、双刻页标和无框文字入口共同组织顶部；人物、时间、世界与属性不再像表格。',tag:'欢迎页直系 · 层级最克制',note:'顶部可点击区域保持足够大，但视觉只显示文字与细刻度。HUD 宽于正文，故事进程随叙事滚动。'},
      {cls:'gs24b',choice:'GS24B 章节题签',title:'GS24B · 章节题签',copy:'把 6 岁作为醒目的章节号，人物和世界成为章节标题，三个工具收进右侧页边目录。',tag:'章节感最强 · 年龄最醒目',note:'结构差异最大，适合让每一轮模拟像人生书稿的新章节，但顶部的年龄权重也更高。'},
      {cls:'gs24c',choice:'GS24C 路径端点',title:'GS24C · 路径端点',copy:'人物、世界、年龄和属性依附一条横向路径，控制入口落到路径下方，正文沿左侧节点继续向下。',tag:'路径意象最完整 · 秩序最明确',note:'顶部仍是宽幅信息面，但不使用卡片、格框和粗分割；分支编号也沿用页边路径语法。'},
      {cls:'gs24d',choice:'GS24D 无框叙事场',title:'GS24D · 无框叙事场',copy:'大胆取消传统顶部栏观感：世界像题记，人物与年龄悬在故事上方，属性只用两道细线收束。',tag:'整体最沉浸 · 传统 HUD 感最弱',note:'最接近一张持续书写的人生扉页；仍完整保留更多、时间、世界、属性和分支机制。'}
    ];
    const grid=document.getElementById('optionGrid'),tpl=document.getElementById('phoneTemplate');variants.forEach((v,i)=>{const card=document.createElement('article');card.className='option-card';card.dataset.choice=v.choice;card.innerHTML=`<div class="phone-host"></div><div class="option-copy"><h3>${v.title}</h3><p>${v.copy}</p><span class="tag">${v.tag}</span></div><p class="option-note">${v.note}</p>`;card.addEventListener('click',()=>window.selectChoice(card));const phone=tpl.content.firstElementChild.cloneNode(true);phone.classList.add(v.cls);phone.querySelectorAll('.branch-option input').forEach(r=>r.name=`branch-${i}`);card.querySelector('.phone-host').appendChild(phone);grid.appendChild(card)});
    function toast(phone,message){const node=phone.querySelector('.toast');node.textContent=message;node.classList.add('show');clearTimeout(node._timer);node._timer=setTimeout(()=>node.classList.remove('show'),1200)}
    document.querySelectorAll('.runtime-phone').forEach(phone=>{
      phone.querySelectorAll('button,textarea,input,label').forEach(el=>el.addEventListener('click',event=>event.stopPropagation()));
      const closePopovers=()=>{phone.querySelectorAll('.popover').forEach(x=>x.classList.remove('open'));phone.querySelectorAll('.tool').forEach(x=>x.setAttribute('aria-expanded','false'))};const closeWorld=()=>{phone.querySelector('.world-panel').classList.remove('open');phone.querySelector('.world-button').setAttribute('aria-expanded','false')};let currentStep='月';
      phone.querySelector('.more-button').addEventListener('click',event=>{const pop=phone.querySelector('.more-popover'),open=!pop.classList.contains('open');closePopovers();closeWorld();if(open){pop.classList.add('open');event.currentTarget.setAttribute('aria-expanded','true')}});
      phone.querySelector('.time-button').addEventListener('click',event=>{const pop=phone.querySelector('.time-popover'),open=!pop.classList.contains('open');closePopovers();closeWorld();if(open){pop.classList.add('open');event.currentTarget.setAttribute('aria-expanded','true')}});
      phone.querySelector('.world-button').addEventListener('click',event=>{closePopovers();const panel=phone.querySelector('.world-panel');panel.classList.toggle('open');event.currentTarget.setAttribute('aria-expanded',String(panel.classList.contains('open')))});
      phone.querySelectorAll('[data-step]').forEach(button=>button.addEventListener('click',()=>{phone.querySelectorAll('[data-step]').forEach(x=>x.classList.remove('active'));button.classList.add('active');currentStep=button.dataset.step;phone.querySelector('.time-button').textContent=currentStep;closePopovers();toast(phone,`下一轮按${currentStep}推进 · 当前时间未改变`)}));
      phone.querySelector('[data-action="save"]').addEventListener('click',()=>{closePopovers();phone.querySelector('.save-overlay').classList.add('open')});phone.querySelector('[data-action="home"]').addEventListener('click',()=>toast(phone,'将返回主界面'));phone.querySelector('.save-close').addEventListener('click',()=>phone.querySelector('.save-overlay').classList.remove('open'));phone.querySelector('.save-confirm').addEventListener('click',()=>{phone.querySelector('.save-overlay').classList.remove('open');toast(phone,'已保存到槽位 1')});
      const advance=phone.querySelector('.advance'),timeline=phone.querySelector('.timeline'),input=phone.querySelector('.branch-input'),confirm=phone.querySelector('.branch-actions .confirm'),cancel=phone.querySelector('.branch-actions .cancel'),radios=[...phone.querySelectorAll('.branch-option input')];let generatedRound=0,simYear=2006,simMonth=2,simAge=6,simDay=0;const monthNames=['霜月','杏月','桃月','槐月','榴月','荷月','兰月','桂月','菊月','露月','葭月','冰月'];
      const setAdvance=(state,title,hint)=>{advance.dataset.state=state;advance.innerHTML=`<span class="advance-title">${title}</span><span class="advance-hint">${hint}</span>`};const updateConfirm=()=>{confirm.disabled=!(input.value.trim()||radios.some(x=>x.checked))};
      const advanceClock=()=>{let label;if(currentStep==='日'){simDay+=1;label=`${simYear}年 · ${monthNames[simMonth]} · 第${simDay+1}日`}else{simDay=0;const monthJump=currentStep==='月'?1:currentStep==='季'?3:0;if(monthJump){const total=simMonth+monthJump;const years=Math.floor(total/12);simMonth=total%12;simYear+=years;simAge+=years}else{const years=currentStep==='年'?1:(parseInt(currentStep,10)||1);simYear+=years;simAge+=years}label=`${simYear}年 · ${monthNames[simMonth]}`}phone.querySelector('.era').textContent=label;phone.querySelector('.age').textContent=`${simAge}岁`;return{label,age:`${simAge} 岁`}};
      const appendGeneratedEntry=choice=>{generatedRound+=1;const next=advanceClock(),separator=document.createElement('div'),article=document.createElement('article');separator.className='separator';separator.textContent='✦';article.className='entry generated-entry';article.innerHTML=`<div class="entry-meta"><span>${next.label}</span><span>${next.age}</span></div><div class="prose"><p>${generatedRound===1?'你在巡街人影转入巷口前做出了决定。孙伯没有催促，只把废园墙上的字又默念了一遍。':'时间继续向前，旧底片背后的线索再次浮现。你开始明白，每一次选择都会让故事通向不同的地方。'}</p><p>${generatedRound===1?`“${choice}”——这句话落下后，新的线索也随之展开。`:'窗外的树影缓慢移动，新的问题已经在前方等待。'}</p></div>`;timeline.insertBefore(separator,advance);timeline.insertBefore(article,advance)};
      radios.forEach(radio=>radio.addEventListener('change',()=>{input.value='';phone.querySelectorAll('.branch-option').forEach(option=>option.classList.remove('selected'));radio.closest('.branch-option').classList.add('selected');updateConfirm()}));input.addEventListener('input',()=>{if(input.value.trim()){radios.forEach(x=>x.checked=false);phone.querySelectorAll('.branch-option').forEach(x=>x.classList.remove('selected'))}updateConfirm()});cancel.addEventListener('click',()=>{radios.forEach(x=>x.checked=false);phone.querySelectorAll('.branch-option').forEach(x=>x.classList.remove('selected'));input.value='';updateConfirm()});
      confirm.addEventListener('click',()=>{const custom=input.value.trim(),radio=radios.find(x=>x.checked),choice=custom||radio?.closest('.branch-option').querySelector('span').textContent.trim();if(!choice)return;phone.querySelector('.branch-pending').style.display='none';phone.querySelector('.resolved-text').textContent=choice;phone.querySelector('.branch-resolved').classList.add('show');confirm.disabled=true;advance.disabled=true;setAdvance('generating','AI 正在书写命运……','选择已记录，下一段人生正在生成');setTimeout(()=>{appendGeneratedEntry(choice);advance.disabled=false;setAdvance('ready','轻触，让岁月流转','故事已经沿着你的选择继续');timeline.scrollTop=timeline.scrollHeight},900)});
      advance.addEventListener('click',()=>{if(advance.dataset.state!=='ready')return;advance.disabled=true;setAdvance('generating','岁月正在流转……','AI 正在书写下一段人生');setTimeout(()=>{appendGeneratedEntry('继续向前');advance.disabled=false;setAdvance('ready','轻触，让岁月流转','下一段故事已经准备好');timeline.scrollTop=timeline.scrollHeight},850)});
    });
  </script>
