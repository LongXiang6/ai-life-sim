<!doctype html>
<html lang="zh-CN" data-theme="light-aurora">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>核心模拟 / 故事页第七轮</title>
  <link rel="stylesheet" href="../assets/library-history.css">
  <link rel="stylesheet" href="../../../../src/foundation/tokens/index.css">
  <script src="../assets/prototype.js" defer></script>
  <style>
    .phone.runtime-phone { --menu-top: 90px; width: 320px; height: 650px; display: flex; flex-direction: column; background: var(--color-bg-primary); color: var(--color-text-primary); font-family: Inter,"Microsoft YaHei",system-ui,sans-serif; }
    .runtime-phone button,.runtime-phone textarea,.runtime-phone input { font: inherit; }
    .hud { position: relative; z-index: 5; flex: 0 0 auto; padding: 6px 8px 5px; border-bottom: 1px solid var(--glass-border); background: linear-gradient(135deg,var(--color-primary-light),transparent 72%),var(--glass-surface-bg); box-shadow: var(--shadow-sm); backdrop-filter: blur(var(--glass-blur-surface)); }
    .top-line { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; min-height: 22px; }
    .identity-line { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; }
    .world-name { overflow: hidden; color: var(--color-text-primary); font-size: 8.5px; font-weight: 760; text-overflow: ellipsis; white-space: nowrap; }
    .race { flex: 0 0 auto; padding: 1px 4px; border-radius: var(--radius-sm); background: var(--color-bg-tertiary); color: var(--color-text-tertiary); font-size: 6.5px; }
    .char { flex: 0 0 auto; color: var(--color-primary); font-size: 7.3px; font-weight: 700; }
    .gender { flex: 0 0 auto; color: var(--color-text-tertiary); font-size: 7px; }
    .clock { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
    .era { color: var(--color-text-secondary); font-size: 7px; }
    .age { color: var(--color-text-primary); font-size: 12px; font-weight: 780; }
    .middle-line { display: grid; grid-template-columns: minmax(0,1fr) 126px; gap: 6px; align-items: center; margin-top: 3px; }
    .talents { display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .talents::-webkit-scrollbar { display: none; }
    .talent { flex: 0 0 auto; padding: 2px 5px; border: 1px solid color-mix(in srgb,var(--color-primary) 18%,transparent); border-radius: var(--radius-sm); background: var(--color-primary-light); color: var(--color-primary); font-size: 6.8px; white-space: nowrap; }
    .tools { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 2px; padding: 2px; border: 1px solid var(--glass-border); border-radius: var(--radius-lg); background: var(--glass-elevated-bg); box-shadow: var(--shadow-sm); }
    .tool { min-height: 28px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--color-text-secondary); font-size: 7px; font-weight: 680; white-space: nowrap; cursor: pointer; }
    .tool.active,.tool[aria-expanded="true"] { background: var(--color-primary-light); color: var(--color-primary); }
    .attrs { display: flex; gap: 8px; margin-top: 4px; padding-top: 4px; overflow-x: auto; border-top: 1px solid color-mix(in srgb,var(--color-border) 62%,transparent); color: var(--color-text-secondary); font-size: 6.9px; scrollbar-width: none; }
    .attrs::-webkit-scrollbar { display: none; }
    .attrs span { flex: 0 0 auto; white-space: nowrap; }
    .attrs b,.life { color: var(--color-success); }
    .world-panel { display: none; flex: 0 0 auto; max-height: 30%; overflow-y: auto; padding: 8px 10px; border-bottom: 1px solid var(--color-border); background: var(--glass-elevated-bg); }
    .world-panel.open { display: block; }
    .panel-title { margin-bottom: 5px; color: var(--color-text-primary); font-size: 9px; font-weight: 760; }
    .panel-sub { margin: 6px 0 3px; color: var(--color-text-secondary); font-size: 7px; font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { padding: 3px 6px; border-radius: 999px; background: color-mix(in srgb,var(--color-primary) 8%,transparent); color: var(--color-text-secondary); font-size: 7px; }
    .timeline { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); }
    .timeline-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; margin: 0; padding: 7px 0 6px; border-bottom: 1px solid color-mix(in srgb,var(--color-border) 62%,transparent); background: color-mix(in srgb,var(--color-bg-primary) 94%,transparent); color: var(--color-text-tertiary); font-size: 8px; backdrop-filter: blur(var(--glass-blur-surface)); }
    .load-more { padding: 7px 0; color: var(--color-text-tertiary); text-align: center; font-size: 7.3px; }
    .entry { padding: 8px 4px 5px; }
    .entry-meta { display: flex; justify-content: space-between; margin-bottom: 7px; color: var(--color-text-tertiary); font-size: 7.5px; }
    .prose { color: var(--color-text-primary); font-family: "Noto Serif SC","Songti SC",serif; font-size: 10.5px; line-height: 1.78; }
    .prose p { margin: 0 0 9px; text-indent: 2em; }
    .separator { display: flex; align-items: center; gap: 8px; margin: 3px 0; color: var(--color-text-tertiary); font-size: 8px; }
    .separator::before,.separator::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--color-border)); }
    .separator::after { background:linear-gradient(90deg,var(--color-border),transparent); }
    .branch { margin-top: 10px; padding: 10px; border: 1px solid color-mix(in srgb,var(--color-warning) 48%,var(--color-border)); border-radius: var(--radius-lg); background: color-mix(in srgb,var(--color-warning) 9%,var(--glass-elevated-bg)); }
    .branch-title { margin:0 0 8px; color:var(--color-warning); font-size:9.5px; font-weight:760; }
    .branch-option { display:flex; align-items:flex-start; gap:8px; min-height:38px; margin-bottom:5px; padding:7px 8px; border:1px solid color-mix(in srgb,var(--color-warning) 22%,transparent); border-radius:var(--radius-md); background:color-mix(in srgb,var(--color-bg-card) 72%,transparent); color:var(--color-text-primary); font-size:8.5px; line-height:1.45; cursor:pointer; }
    .branch-option input { width:14px; height:14px; margin:1px 0 0; accent-color:var(--color-warning); }
    .branch-input { width:100%; min-height:54px; padding:8px; resize:vertical; border:1px solid var(--color-border); border-radius:var(--radius-md); outline:none; background:var(--color-bg-card); color:var(--color-text-primary); font-size:8.5px; }
    .branch-actions { display:flex; gap:6px; margin-top:7px; }
    .branch-actions button,.dialog-actions button { min-height:34px; padding:7px 12px; border-radius:var(--radius-md); font-size:8px; }
    .confirm { border:0; background:var(--color-primary); color:var(--color-text-on-primary); }
    .cancel { border:1px solid var(--color-border); background:transparent; color:var(--color-text-secondary); }
    .branch-resolved { display:none; margin-top:10px; padding:9px; border:1px solid color-mix(in srgb,var(--color-warning) 45%,transparent); border-radius:var(--radius-md); background:color-mix(in srgb,var(--color-warning) 8%,transparent); color:var(--color-text-secondary); font-size:8px; }
    .branch-resolved.show { display:block; }
    .advance { min-height:48px; display:grid; place-items:center; margin-top:9px; border:0; background:transparent; color:var(--color-warning); font-family:"Noto Serif SC","Songti SC",serif; font-size:8.5px; cursor:not-allowed; }
    .popover { display:none; position:absolute; z-index:20; top:var(--menu-top); right:8px; min-width:112px; max-height:190px; overflow-y:auto; padding:4px; border:1px solid var(--glass-border); border-radius:var(--radius-lg); background:var(--glass-popout-bg); box-shadow:var(--shadow-lg); }
    .popover.open { display:block; }
    .popover button { display:block; width:100%; min-height:34px; padding:7px 9px; border:0; border-radius:var(--radius-md); background:transparent; color:var(--color-text-primary); text-align:left; font-size:8px; }
    .popover button.active { background:var(--color-primary-light); color:var(--color-primary); }
    .popover-hint { margin:4px; padding-top:5px; border-top:1px solid var(--color-border); color:var(--color-text-tertiary); font-size:7px; line-height:1.45; }
    .save-overlay { display:none; position:absolute; inset:0; z-index:30; align-items:center; justify-content:center; padding:14px; background:color-mix(in srgb,var(--color-text-primary) 28%,transparent); backdrop-filter:blur(3px); }
    .save-overlay.open { display:flex; }
    .save-dialog { width:100%; padding:13px; border:1px solid var(--glass-border); border-radius:var(--radius-xl); background:var(--glass-modal-bg); box-shadow:var(--shadow-lg); }
    .save-dialog h4 { margin:0 0 8px; font-size:11px; }
    .save-slot { margin-bottom:6px; padding:8px; border:1px solid var(--color-border); border-radius:var(--radius-md); color:var(--color-text-secondary); font-size:8px; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:6px; margin-top:8px; }
    .toast { position:absolute; left:50%; bottom:16px; z-index:40; max-width:85%; padding:7px 10px; border-radius:999px; background:color-mix(in srgb,var(--color-text-primary) 86%,transparent); color:var(--color-bg-card); font-size:8px; opacity:0; transform:translate(-50%,8px); transition:opacity var(--duration-fast),transform var(--duration-fast); }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .option-note { margin:0 18px 15px; padding:9px 11px; border-radius:11px; background:#f2f4fa; color:#69748c; font-size:11px; line-height:1.55; }

    /* GS9A：命格与工具并排，三行全部填满。 */
    .gs9a { --menu-top:88px; }
    .gs9a .hud { min-height:86px; }

    /* GS9B：命格获得更大宽度，工具组略窄，属性最克制。 */
    .gs9b { --menu-top:91px; }
    .gs9b .hud { min-height:89px; }
    .gs9b .middle-line { grid-template-columns:minmax(0,1fr) 112px; }
    .gs9b .talent { padding:3px 6px; font-size:7px; }
    .gs9b .tool { font-size:6.6px; }
    .gs9b .attrs { gap:7px; font-size:6.6px; }

    /* GS9C：右侧工具轨参与正常排版，以内容高度收口，不再制造底部空洞。 */
    .gs9c { --menu-top:75px; }
    .gs9c .hud { min-height:0; padding-bottom:4px; }
    .gs9c .top-line { grid-template-columns:minmax(0,1fr) auto; }
    .gs9c .middle-line { grid-template-columns:minmax(0,1fr) 126px; margin-top:3px; }
    .gs9c .talents { width:100%; }
    .gs9c .attrs { margin-top:3px; padding-top:3px; }

    @media(max-width:980px){.option-copy{padding-top:2px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar"><a href="index.html">← 返回故事页历史</a><span data-selection>本轮结果：GS9A 晋级</span></div>
    <p class="eyebrow">CORE SIMULATION · ROUND 07</p>
    <h1>GS8B 下一代：填满 HUD，故事紧贴</h1>
    <p class="subtitle">三稿共同保留 GS8B 的命格优先方向，并把 HUD 压成连续三行。故事进程与 HUD 之间的外部间距已归零，本轮只比较命格宽度、工具占比和三行对齐方式。</p>
    <section class="option-grid" id="optionGrid"></section>
    <p class="selection">本轮结果：GS9A 晋级。下一轮取消章节头吸顶，缩小顶部控件，并把属性重做为不换行的六格账册。</p>
  </main>
  <template id="phoneTemplate">
    <div class="phone runtime-phone">
      <header class="hud"><div class="top-line"><div class="identity-line"><span class="world-name">现代地球 · 滨海旧城</span><span class="race">人类</span><span class="char">林清和</span><span class="gender">· 女</span></div><div class="clock"><span class="era">2006年·桃月</span><span class="age">6岁</span></div></div><div class="middle-line"><div class="talents"><span class="talent">体能守恒织网</span><span class="talent">完美主义的选择刑</span><span class="talent">旧日信标</span></div><div class="tools"><button type="button" class="tool more-button">更多</button><button type="button" class="tool time-button active">月</button><button type="button" class="tool world-button">世界</button></div></div><div class="attrs"><span>体魄 -1</span><span>心智 <b>+4</b></span><span>悟性 <b>+3</b></span><span>魅力 -1</span><span>出身 <b>+2</b></span><span class="life">生命 100</span></div></header>
      <div class="popover more-popover"><button type="button" data-action="save">存档</button><button type="button" data-action="home">主界面</button></div><div class="popover time-popover"><button data-step="日">日</button><button data-step="月" class="active">月</button><button data-step="季">季</button><button data-step="年">年</button><button data-step="3年">3年</button><button data-step="5年">5年</button><button data-step="10年">10年</button><button data-step="50年">50年</button><button data-step="100年">100年</button><button data-step="200年">200年</button><button data-step="500年">500年</button><button data-step="1000年">1000年</button><p class="popover-hint">切换只影响下一轮；旧预生成失效，当前时间不改变。</p></div>
      <section class="world-panel"><div class="panel-title">世界规则</div><div class="panel-sub">世界标签</div><div class="chips"><span class="chip">社会：城市为主</span><span class="chip">环境：温带气候</span><span class="chip">经济：市场经济</span><span class="chip">超自然：无超自然</span></div><div class="panel-sub">角色状态</div><div class="chips"><span class="chip">生命：100/100</span><span class="chip">体力：100</span><span class="chip">精神：100</span></div></section>
      <main class="timeline"><div class="timeline-head"><span>故事进程</span><span>第 12 轮</span></div><div class="load-more">向上滚动加载更早的叙事（已隐藏 12 条）</div><article class="entry"><div class="entry-meta"><span>2006年 · 杏月</span><span>6 岁</span></div><div class="prose"><p>午后的旧书店里，窗格把阳光切成细长的方块。你趴在柜台边，用放大镜对着那张旧底片一寸寸移动。</p><p>底片深处的人影终于露出轮廓：他站在沈家废园的砖墙旁，手里握着一根没有鱼线的旧鱼竿。</p></div></article><div class="separator">✦</div><article class="entry"><div class="entry-meta"><span>2006年 · 桃月</span><span>6 岁</span></div><div class="prose"><p>周六清晨，孙伯带你绕到废园背后。墙根刻着一行已经模糊的字，他蹲下擦去青苔，只辨认出“存米七斗”四个字。</p><p>巡街的脚步声从巷口逼近。孙伯把底片塞回你手里，低声问你，是继续查下去，还是先把它交给父亲。</p></div><section class="branch branch-pending"><p class="branch-title">⚡ 命运分叉点：你准备如何处理这张底片？</p><label class="branch-option"><input type="radio" name="branch"><span>继续跟着孙伯调查废园，先弄清墙上刻字的来历。</span></label><label class="branch-option"><input type="radio" name="branch"><span>把底片交给父亲，问他是否认识照片中的人。</span></label><textarea class="branch-input" placeholder="或手动输入你的选择..."></textarea><div class="branch-actions"><button class="confirm">确认选择</button><button class="cancel">取消</button></div></section><div class="branch-resolved">你的选择：<span class="resolved-text"></span></div></article><button class="advance">✔ 请先选择命运</button></main>
      <div class="save-overlay"><div class="save-dialog"><h4>手动存档</h4><div class="save-slot">槽位 1 · 林清和 · 第 12 轮</div><div class="save-slot">槽位 2 · 空</div><div class="save-slot">槽位 3 · 空</div><div class="dialog-actions"><button class="cancel save-close">取消</button><button class="confirm save-confirm">保存</button></div></div></div><div class="toast"></div>
    </div>
  </template>
  <script>
    const variants=[{cls:'gs9a',choice:'GS9A 三行咬合',title:'GS9A · 三行咬合',copy:'命格与工具共享第二行，六项状态占满第三行，HUD 没有闲置区域。',tag:'均衡紧凑 · 89px',note:'工具触区最宽；命格区域需要横向浏览完整名称。'},{cls:'gs9b',choice:'GS9B 命格扩展轨',title:'GS9B · 命格扩展轨',copy:'略微缩窄工具组，把更多宽度留给命格名称，属性行进一步减重。',tag:'命格最易读 · 89px',note:'命格阅读最佳；三个工具按钮比 GS9A 更紧，需要关注误触间距。'},{cls:'gs9c',choice:'GS9C 规整信息带',title:'GS9C · 规整信息带',copy:'工具与命格保持同轨并参与正常排版，三行按真实内容高度收口。',tag:'正文最大 · 86px',note:'HUD 最矮且纪年完整；命格可视宽度与 GS9A 相同。'}]
    const grid=document.getElementById('optionGrid'),tpl=document.getElementById('phoneTemplate');variants.forEach((v,i)=>{const a=document.createElement('article');a.className='option-card';a.dataset.choice=v.choice;a.innerHTML=`<div class="phone-host"></div><div class="option-copy"><h3>${v.title}</h3><p>${v.copy}</p><span class="tag">${v.tag}</span></div><p class="option-note">${v.note}</p>`;a.addEventListener('click',()=>window.selectChoice(a));const p=tpl.content.firstElementChild.cloneNode(true);p.classList.add(v.cls);p.querySelectorAll('.branch-option input').forEach(r=>r.name=`branch-${i}`);a.querySelector('.phone-host').appendChild(p);grid.appendChild(a)})
    function toast(p,t){const e=p.querySelector('.toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1000)}
    document.querySelectorAll('.runtime-phone').forEach(p=>{p.querySelectorAll('button,textarea,input,label').forEach(e=>e.addEventListener('click',x=>x.stopPropagation()));const close=()=>p.querySelectorAll('.popover').forEach(x=>x.classList.remove('open'));p.querySelector('.more-button').addEventListener('click',()=>{const x=p.querySelector('.more-popover'),o=!x.classList.contains('open');close();if(o)x.classList.add('open')});p.querySelector('.time-button').addEventListener('click',()=>{const x=p.querySelector('.time-popover'),o=!x.classList.contains('open');close();if(o)x.classList.add('open')});p.querySelector('.world-button').addEventListener('click',()=>{close();p.querySelector('.world-panel').classList.toggle('open')});p.querySelectorAll('[data-step]').forEach(x=>x.addEventListener('click',()=>{p.querySelectorAll('[data-step]').forEach(y=>y.classList.remove('active'));x.classList.add('active');p.querySelector('.time-button').textContent=x.dataset.step;close();toast(p,`下一轮按${x.dataset.step}推进 · 当前时间未改变`)}));p.querySelector('[data-action="save"]').addEventListener('click',()=>{close();p.querySelector('.save-overlay').classList.add('open')});p.querySelector('[data-action="home"]').addEventListener('click',()=>toast(p,'将返回主界面'));p.querySelector('.save-close').addEventListener('click',()=>p.querySelector('.save-overlay').classList.remove('open'));p.querySelector('.save-confirm').addEventListener('click',()=>{p.querySelector('.save-overlay').classList.remove('open');toast(p,'已保存到槽位 1')});const adv=p.querySelector('.advance');p.querySelector('.branch-actions .confirm').addEventListener('click',()=>{const c=p.querySelector('.branch-input').value.trim(),r=p.querySelector('.branch-option input:checked'),choice=c||r?.closest('.branch-option').querySelector('span').textContent.trim();if(!choice){toast(p,'请先选择或输入意图');return}p.querySelector('.branch-pending').style.display='none';p.querySelector('.resolved-text').textContent=choice;p.querySelector('.branch-resolved').classList.add('show');adv.textContent='AI 正在书写命运...';setTimeout(()=>{adv.style.color='var(--color-text-tertiary)';adv.style.cursor='pointer';adv.textContent='轻触，让岁月流转'},1100)});p.querySelector('.branch-actions .cancel').addEventListener('click',()=>{p.querySelectorAll('.branch-option input').forEach(x=>x.checked=false);p.querySelector('.branch-input').value=''})})
  </script>
</body>
</html>
