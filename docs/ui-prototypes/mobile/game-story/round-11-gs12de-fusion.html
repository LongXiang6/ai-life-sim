    .separator::before,.separator::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--color-border)); }
    .separator::after { background:linear-gradient(90deg,var(--color-border),transparent); }

    .branch-heading { display:grid; grid-template-columns:1fr; align-items:start; margin-bottom:10px; text-align:center; }
    .branch-heading::before { content:""; width:34px; height:1px; margin:0 auto 7px; background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--color-warning) 62%,var(--color-border)),transparent); }
    .branch-mark,.branch-kicker { display:none; }

    .branch-option { display:flex; align-items:center; gap:8px; min-height:40px; margin:0; padding:9px 7px; border:0; border-top:1px solid color-mix(in srgb,var(--color-border) 52%,transparent); border-radius:0; background:transparent; color:var(--color-text-primary); font-size:8.2px; line-height:1.5; cursor:pointer; transition:background var(--duration-fast),color var(--duration-fast); }
    .branch-option:has(input:checked),.branch-option.selected { background:var(--color-primary-light); color:var(--color-primary); }

    .branch-actions { display:flex; justify-content:center; gap:6px; margin-top:8px; }
    .branch-actions button,.dialog-actions button { min-height:34px; padding:7px 13px; border-radius:var(--radius-md); font-size:7.8px; white-space:nowrap; }
    .confirm { border:0; background:var(--color-primary); color:var(--color-text-on-primary); }

    .branch-actions .confirm:hover { background:color-mix(in srgb,var(--color-primary) 14%,transparent); }
    .cancel { border:1px solid var(--color-border); background:transparent; color:var(--color-text-secondary); }

    .branch-resolved.show { display:block; }
    .advance { width:100%; min-height:58px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; margin:10px 0 2px; padding:9px 12px; border:0; background:transparent; color:var(--color-text-tertiary); text-align:center; cursor:not-allowed; }
    .advance::before { content:""; width:42px; height:1px; margin-bottom:3px; background:linear-gradient(90deg,transparent,var(--color-border),transparent); }
    .advance-title { color:inherit; font-family:"Noto Serif SC","Songti SC",serif; font-size:10.5px; font-weight:650; letter-spacing:.08em; white-space:nowrap; }

    .popover button { display:block; width:100%; min-height:34px; padding:7px 9px; border:0; border-radius:var(--radius-md); background:transparent; color:var(--color-text-primary); text-align:left; font-size:8px; }
    .popover button.active { background:var(--color-primary-light); color:var(--color-primary); }

    .hud :is(.world-name,.race,.char,.gender,.era,.age,.talent,.tool),
    .timeline-head span,.entry-meta span,.branch-actions button,.popover button,.chip,.save-slot { white-space:nowrap; }

    .gs13a { --menu-top:106px; }

    /* GS13B：连续时间轨，右侧三行形成一条完整的轻玻璃纵轨。 */

    .gs13b .era { display:flex; align-items:center; justify-content:flex-end; border-inline:1px solid var(--glass-border); }
    .gs13b .tools { border:1px solid var(--glass-border); border-top:0; border-radius:0 0 var(--radius-md) var(--radius-md); }
    .gs13b .tool { padding-inline:5px; }
    .gs13b .branch { border-top:1px solid color-mix(in srgb,var(--color-warning) 22%,var(--color-border)); }

    /* GS13C：双列信息格，吸收 GS12E 的规则分块但降低材质强度。 */
    .gs13c { --menu-top:114px; }
    .gs13c .hud { grid-template-columns:minmax(0,1fr) 104px; gap:4px 7px; }
    .gs13c :is(.identity-line,.world-name,.talents,.age,.era,.tools) { min-height:100%; padding-inline:7px; border:1px solid color-mix(in srgb,var(--color-border) 58%,transparent); border-radius:var(--radius-sm); background:color-mix(in srgb,var(--glass-elevated-bg) 48%,transparent); }
    .gs13c :is(.identity-line,.world-name,.talents) { display:flex; align-items:center; }
    .gs13c :is(.age,.era) { display:flex; align-items:center; justify-content:flex-end; }
    .gs13c .tool { padding-inline:5px; }
    .gs13c .attrs span { background:color-mix(in srgb,var(--color-primary-light) 48%,transparent); }
    .gs13c .branch { border-top:1px solid color-mix(in srgb,var(--color-warning) 22%,var(--color-border)); }

    /* GS13D：融合玻璃，时间脊与规则分块同时保留。 */
    .gs13d { --menu-top:106px; }
    .gs13d .hud { grid-template-columns:minmax(0,1fr) 106px; column-gap:8px; }
    .gs13d :is(.identity-line,.world-name,.talents) { padding-inline:8px; border-left:2px solid color-mix(in srgb,var(--color-primary) 28%,var(--color-border)); }

    .gs13d .age { display:flex; align-items:center; justify-content:flex-end; border-radius:var(--radius-md) var(--radius-md) 0 0; }

    .gs13d .tools { border-radius:0 0 var(--radius-md) var(--radius-md); }

    @media(max-width:980px){.option-copy{padding-top:2px}}

      <main class="timeline"><div class="timeline-head"><span>故事进程</span><span>第 12 轮</span></div><div class="load-more">向上滚动加载更早的叙事（已隐藏 12 条）</div><article class="entry"><div class="entry-meta"><span>2006年 · 杏月</span><span>6 岁</span></div><div class="prose"><p>午后的旧书店里，窗格把阳光切成细长的方块。你趴在柜台边，用放大镜对着那张旧底片一寸寸移动。</p><p>底片深处的人影终于露出轮廓：他站在沈家废园的砖墙旁，手里握着一根没有鱼线的旧鱼竿。</p></div></article><div class="separator">✦</div><article class="entry"><div class="entry-meta"><span>2006年 · 桃月</span><span>6 岁</span></div><div class="prose"><p>周六清晨，孙伯带你绕到废园背后。墙根刻着一行已经模糊的字，他蹲下擦去青苔，只辨认出“存米七斗”四个字。</p><p>巡街的脚步声从巷口逼近。孙伯把底片塞回你手里，低声问你，是继续查下去，还是先把它交给父亲。</p></div><section class="branch branch-pending"><div class="branch-heading"><p class="branch-question">巡街脚步逼近。你要如何处理这张底片？</p></div><label class="branch-option"><input type="radio" name="branch"><span>继续跟着孙伯调查废园，先弄清墙上刻字的来历。</span></label><label class="branch-option"><input type="radio" name="branch"><span>把底片交给父亲，问他是否认识照片中的人。</span></label><textarea class="branch-input" placeholder="写下另一种选择…"></textarea><div class="branch-actions"><button class="confirm">确认选择</button><button class="cancel">清空</button></div></section><div class="branch-resolved">你选择了：<span class="resolved-text"></span></div></article><button class="advance" data-state="blocked" disabled><span class="advance-title">完成选择后继续</span><span class="advance-hint">当前故事仍在等待你的决定</span></button></main>

  </template>
  <script>
    const variants=[{cls:'gs13a',choice:'GS13A 对齐时间脊',title:'GS13A · 对齐时间脊',copy:'左侧角色、世界、命格与右侧年龄、纪年、操作逐行对齐，保持开放式 HUD。',tag:'GS12D 直系 · 最克制',note:'结构最轻，行关系最清楚；右侧仅用细线建立时间脊。'},{cls:'gs13b',choice:'GS13B 连续时间轨',title:'GS13B · 连续时间轨',copy:'右侧三行合并为一条连续轻玻璃轨，年龄、纪年和工具共享完整边界。',tag:'右侧最规整 · 工具最集中',note:'比 GS13A 更有规则感，但右侧轨道的存在感更强。'},{cls:'gs13c',choice:'GS13C 双列信息格',title:'GS13C · 双列信息格',copy:'每一行左右都形成轻量信息格，吸收 GS12E 的分块规则并降低装饰强度。',tag:'对齐最明确 · 分块适中',note:'规则性最强；信息格数量较多，需要观察长期阅读噪声。'},{cls:'gs13d',choice:'GS13D 融合玻璃',title:'GS13D · 融合玻璃',copy:'左侧以主色细脊贯穿，右侧保留完整玻璃时间轨，分叉由轻玻璃承托。',tag:'D × E 融合 · 材质最完整',note:'最接近两稿融合定版，但也是四稿中视觉表达最强的一版。'}]
    const grid=document.getElementById('optionGrid'),tpl=document.getElementById('phoneTemplate');variants.forEach((v,i)=>{const a=document.createElement('article');a.className='option-card';a.dataset.choice=v.choice;a.innerHTML=`<div class="phone-host"></div><div class="option-copy"><h3>${v.title}</h3><p>${v.copy}</p><span class="tag">${v.tag}</span></div><p class="option-note">${v.note}</p>`;a.addEventListener('click',()=>window.selectChoice(a));const p=tpl.content.firstElementChild.cloneNode(true);p.classList.add(v.cls);p.querySelectorAll('.branch-option input').forEach(r=>r.name=`branch-${i}`);a.querySelector('.phone-host').appendChild(p);grid.appendChild(a)})
    function toast(p,t){const e=p.querySelector('.toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1000)}
    document.querySelectorAll('.runtime-phone').forEach(p=>{
      p.querySelectorAll('button,textarea,input,label').forEach(e=>e.addEventListener('click',x=>x.stopPropagation()))
      const close=()=>{p.querySelectorAll('.popover').forEach(x=>x.classList.remove('open'));p.querySelectorAll('.tool').forEach(x=>x.setAttribute('aria-expanded','false'))}
      p.querySelector('.more-button').addEventListener('click',e=>{const x=p.querySelector('.more-popover'),o=!x.classList.contains('open');close();if(o){x.classList.add('open');e.currentTarget.setAttribute('aria-expanded','true')}})
      p.querySelector('.time-button').addEventListener('click',e=>{const x=p.querySelector('.time-popover'),o=!x.classList.contains('open');close();if(o){x.classList.add('open');e.currentTarget.setAttribute('aria-expanded','true')}})
      p.querySelector('.world-button').addEventListener('click',e=>{close();const x=p.querySelector('.world-panel');x.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(x.classList.contains('open')))})
      p.querySelectorAll('[data-step]').forEach(x=>x.addEventListener('click',()=>{p.querySelectorAll('[data-step]').forEach(y=>y.classList.remove('active'));x.classList.add('active');p.querySelector('.time-button').textContent=x.dataset.step;close();toast(p,`下一轮按${x.dataset.step}推进 · 当前时间未改变`)}))
      p.querySelector('[data-action="save"]').addEventListener('click',()=>{close();p.querySelector('.save-overlay').classList.add('open')})
      p.querySelector('[data-action="home"]').addEventListener('click',()=>toast(p,'将返回主界面'))
      p.querySelector('.save-close').addEventListener('click',()=>p.querySelector('.save-overlay').classList.remove('open'))
      p.querySelector('.save-confirm').addEventListener('click',()=>{p.querySelector('.save-overlay').classList.remove('open');toast(p,'已保存到槽位 1')})
      const adv=p.querySelector('.advance')
      const setAdvance=(state,title,hint)=>{adv.dataset.state=state;adv.innerHTML=`<span class="advance-title">${title}</span><span class="advance-hint">${hint}</span>`}
      p.querySelectorAll('.branch-option input').forEach(input=>input.addEventListener('change',()=>{p.querySelectorAll('.branch-option').forEach(option=>option.classList.remove('selected'));input.closest('.branch-option').classList.add('selected')}))
      p.querySelector('.branch-actions .confirm').addEventListener('click',()=>{const c=p.querySelector('.branch-input').value.trim(),r=p.querySelector('.branch-option input:checked'),choice=c||r?.closest('.branch-option').querySelector('span').textContent.trim();if(!choice){toast(p,'请先选择或输入意图');return}p.querySelector('.branch-pending').style.display='none';p.querySelector('.resolved-text').textContent=choice;p.querySelector('.branch-resolved').classList.add('show');adv.disabled=true;setAdvance('generating','命运正在续写','AI 正在生成下一段人生');setTimeout(()=>{adv.disabled=false;setAdvance('ready','继续故事','让岁月沿着你的选择流转')},1100)})
      p.querySelector('.branch-actions .cancel').addEventListener('click',()=>{p.querySelectorAll('.branch-option input').forEach(x=>x.checked=false);p.querySelectorAll('.branch-option').forEach(x=>x.classList.remove('selected'));p.querySelector('.branch-input').value=''})
      adv.addEventListener('click',()=>{if(adv.dataset.state!=='ready')return;adv.disabled=true;setAdvance('generating','命运正在续写','新的故事即将展开');setTimeout(()=>{adv.disabled=false;setAdvance('ready','继续故事','轻触后进入下一段人生');toast(p,'下一段叙事已准备')},1000)})
    })
  </script>
</body>
</html>
