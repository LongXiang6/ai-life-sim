      <main class="timeline"><div class="timeline-head"><span>故事进程</span><span>第 12 轮</span></div><div class="load-more">向上滚动加载更早的叙事（已隐藏 12 条）</div><article class="entry"><div class="entry-meta"><span>2006年 · 杏月</span><span>6 岁</span></div><div class="prose"><p>午后的旧书店里，窗格把阳光切成细长的方块。你趴在柜台边，用放大镜对着那张旧底片一寸寸移动。</p><p>底片深处的人影终于露出轮廓：他站在沈家废园的砖墙旁，手里握着一根没有鱼线的旧鱼竿。</p></div></article><div class="separator">✦</div><article class="entry current-entry"><div class="entry-meta"><span>2006年 · 桃月</span><span>6 岁</span></div><div class="prose"><p>周六清晨，孙伯带你绕到废园背后。墙根刻着一行已经模糊的字，他蹲下擦去青苔，只辨认出“存米七斗”四个字。</p><p>巡街的脚步声从巷口逼近。孙伯把底片塞回你手里，低声问你，是继续查下去，还是先把它交给父亲。</p></div><section class="branch branch-pending"><div class="branch-heading"><p class="branch-question">巡街脚步逼近。底片留在你手中——你准备怎么做？</p></div><label class="branch-option"><input type="radio" name="branch"><span>继续跟着孙伯调查废园，先弄清墙上刻字的来历。</span></label><label class="branch-option"><input type="radio" name="branch"><span>把底片交给父亲，问他是否认识照片中的人。</span></label><textarea class="branch-input" aria-label="自定义选择" placeholder="也可以写下你的做法…"></textarea><div class="branch-actions"><button class="confirm" disabled>确认选择</button><button class="cancel">清空</button></div></section><div class="branch-resolved">你决定：<span class="resolved-text"></span></div></article><button class="advance" data-state="blocked" disabled><span class="advance-title">完成选择后继续</span><span class="advance-hint">当前故事仍在等待你的决定</span></button></main>

  </template>
  <script>
    const variants=[{cls:'gs15a',choice:'GS15A 宽幅净轨',title:'GS15A · 宽幅净轨',copy:'删除左侧强调线，保留右侧时间轨；HUD 使用 12px 内边距，叙事收进 18px。',tag:'最稳妥 · HUD 比正文宽 12px',note:'最接近 GS14D，只修正宽度层级与左侧噪声。',confirm:'确认这个选择',cancel:'清空'},{cls:'gs15b',choice:'GS15B 宽幅双区',title:'GS15B · 宽幅双区',copy:'角色信息与时间操作形成两块完整区域；HUD 使用 10px 内边距，叙事保持 18px。',tag:'分区最清楚 · HUD 比正文宽 16px',note:'顶部规则性更强，但双区材质比 GS15A 更明显。',confirm:'确认这个选择',cancel:'清空'},{cls:'gs15c',choice:'GS15C 宽幅横向账簿',title:'GS15C · 宽幅横向账簿',copy:'用横向基线组织左右信息；HUD 为 12px，叙事进一步收进 20px。',tag:'行关系最清楚 · HUD 比正文宽 16px',note:'左右对应最直观，但横线数量会略微增加。',confirm:'确认这个选择',cancel:'清空'},{cls:'gs15d',choice:'GS15D 全幅命令甲板',title:'GS15D · 全幅命令甲板',copy:'更多、步长、世界独占整行并扩大到 64×32px；HUD 为 10px，叙事为 20px。',tag:'大胆方案 · HUD 比正文宽 20px',note:'操作最易点击、宽度层级最强，但 HUD 高度也明显增加。',confirm:'确认这个选择',cancel:'清空'}]
    const grid=document.getElementById('optionGrid'),tpl=document.getElementById('phoneTemplate');variants.forEach((v,i)=>{const a=document.createElement('article');a.className='option-card';a.dataset.choice=v.choice;a.innerHTML=`<div class="phone-host"></div><div class="option-copy"><h3>${v.title}</h3><p>${v.copy}</p><span class="tag">${v.tag}</span></div><p class="option-note">${v.note}</p>`;a.addEventListener('click',()=>window.selectChoice(a));const p=tpl.content.firstElementChild.cloneNode(true);p.classList.add(v.cls);p.querySelectorAll('.branch-option input').forEach(r=>r.name=`branch-${i}`);p.querySelector('.branch-actions .confirm').textContent=v.confirm;p.querySelector('.branch-actions .cancel').textContent=v.cancel;a.querySelector('.phone-host').appendChild(p);grid.appendChild(a)})
    function toast(p,t){const e=p.querySelector('.toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1000)}
    document.querySelectorAll('.runtime-phone').forEach(p=>{
      p.querySelectorAll('button,textarea,input,label').forEach(e=>e.addEventListener('click',x=>x.stopPropagation()))
      const close=()=>{p.querySelectorAll('.popover').forEach(x=>x.classList.remove('open'));p.querySelectorAll('.tool').forEach(x=>x.setAttribute('aria-expanded','false'))}
      p.querySelector('.more-button').addEventListener('click',e=>{const x=p.querySelector('.more-popover'),o=!x.classList.contains('open');close();if(o){x.classList.add('open');e.currentTarget.setAttribute('aria-expanded','true')}})
      p.querySelector('.time-button').addEventListener('click',e=>{const x=p.querySelector('.time-popover'),o=!x.classList.contains('open');close();if(o){x.classList.add('open');e.currentTarget.setAttribute('aria-expanded','true')}})
      p.querySelector('.world-button').addEventListener('click',e=>{close();const x=p.querySelector('.world-panel');x.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(x.classList.contains('open')))})
      p.querySelectorAll('[data-step]').forEach(x=>x.addEventListener('click',()=>{p.querySelectorAll('[data-step]').forEach(y=>y.classList.remove('active'));x.classList.add('active');p.querySelector('.time-button').textContent=x.dataset.step;close();toast(p,`下一轮按${x.dataset.step}推进 · 当前时间未改变`)}))
      p.querySelector('[data-action="save"]').addEventListener('click',()=>{close();p.querySelector('.save-overlay').classList.add('open')})
      p.querySelector('[data-action="home"]').addEventListener('click',()=>toast(p,'将返回主界面'))
      p.querySelector('.save-close').addEventListener('click',()=>p.querySelector('.save-overlay').classList.remove('open'))
      p.querySelector('.save-confirm').addEventListener('click',()=>{p.querySelector('.save-overlay').classList.remove('open');toast(p,'已保存到槽位 1')})
      const adv=p.querySelector('.advance'),timeline=p.querySelector('.timeline'),branchInput=p.querySelector('.branch-input'),confirmButton=p.querySelector('.branch-actions .confirm'),cancelButton=p.querySelector('.branch-actions .cancel'),radios=[...p.querySelectorAll('.branch-option input')]
      let generatedRound=0
      const setAdvance=(state,title,hint)=>{adv.dataset.state=state;adv.innerHTML=`<span class="advance-title">${title}</span><span class="advance-hint">${hint}</span>`}
      const updateConfirm=()=>{confirmButton.disabled=!(branchInput.value.trim()||radios.some(x=>x.checked))}
      const appendGeneratedEntry=choice=>{generatedRound+=1;const month=generatedRound===1?'槐月':'荷月',separator=document.createElement('div'),article=document.createElement('article');separator.className='separator';separator.textContent='✦';article.className='entry generated-entry';article.innerHTML=`<div class="entry-meta"><span>2006年 · ${month}</span><span>6 岁</span></div><div class="prose"><p>${generatedRound===1?'你在巡街人影转入巷口前做出了决定。孙伯没有催促，只把废园墙上的字又默念了一遍。':'几周后，旧底片背后的线索再次浮现。你开始明白，每一次选择都会让故事通向不同的地方。'}</p><p>${generatedRound===1?`“${choice}”——这句话落下后，新的线索也随之展开。`:'窗外的树影缓慢移动，新的问题已经在前方等待。'}</p></div>`;timeline.insertBefore(separator,adv);timeline.insertBefore(article,adv);p.querySelector('.era').textContent=`2006年·${month}`}
      radios.forEach(input=>input.addEventListener('change',()=>{branchInput.value='';p.querySelectorAll('.branch-option').forEach(option=>option.classList.remove('selected'));input.closest('.branch-option').classList.add('selected');updateConfirm()}))
      branchInput.addEventListener('input',()=>{if(branchInput.value.trim()){radios.forEach(x=>x.checked=false);p.querySelectorAll('.branch-option').forEach(x=>x.classList.remove('selected'))}updateConfirm()})
      confirmButton.addEventListener('click',()=>{const custom=branchInput.value.trim(),radio=radios.find(x=>x.checked),choice=custom||radio?.closest('.branch-option').querySelector('span').textContent.trim();if(!choice)return;p.querySelector('.branch-pending').style.display='none';p.querySelector('.resolved-text').textContent=choice;p.querySelector('.branch-resolved').classList.add('show');confirmButton.disabled=true;adv.disabled=true;setAdvance('generating','AI 正在书写命运…','选择已记录，下一段人生正在生成');setTimeout(()=>{appendGeneratedEntry(choice);adv.disabled=false;setAdvance('ready','轻触，让岁月流转','故事已经沿着你的选择继续');timeline.scrollTop=timeline.scrollHeight},1100)})
      cancelButton.addEventListener('click',()=>{radios.forEach(x=>x.checked=false);p.querySelectorAll('.branch-option').forEach(x=>x.classList.remove('selected'));branchInput.value='';updateConfirm()})
      adv.addEventListener('click',()=>{if(adv.dataset.state!=='ready')return;adv.disabled=true;setAdvance('generating','岁月正在流转…','AI 正在书写下一段人生');setTimeout(()=>{appendGeneratedEntry('继续向前');adv.disabled=false;setAdvance('ready','轻触，让岁月流转','下一段故事已经准备好');timeline.scrollTop=timeline.scrollHeight},1000)})
    })
  </script>
</body>
</html>
