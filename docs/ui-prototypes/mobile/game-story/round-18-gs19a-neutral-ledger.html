  <script>
    const variants=[
      {cls:'gs20a',choice:'GS20A 连续基线账簿',title:'GS20A · 连续基线账簿',copy:'身份与世界行使用贯穿左右的连续基线，修正网格间隙造成的断线感。',tag:'直系精修 · 基线最完整',note:'保持 GS19A 的全部判断，只把顶部横向秩序做得更精确。'},
      {cls:'gs20b',choice:'GS20B 三组状态标尺',title:'GS20B · 三组状态标尺',copy:'六项属性通过真实列间距两两成组，与下方三个比例词条形成更明确的纵向关系。',tag:'对应最清楚 · 三组可见',note:'信息分组最明确，但属性行会比 GS20A 更接近仪表标尺。'},
      {cls:'gs20c',choice:'GS20C 开放状态带',title:'GS20C · 开放状态带',copy:'移除属性之间的竖格线，以均匀留白和数字对齐维持秩序，降低表格感。',tag:'最轻盈 · 状态最开放',note:'阅读呼吸感最好，但属性之间的精确边界会更弱。'},
      {cls:'gs20d',choice:'GS20D 故事衔接带',title:'GS20D · 故事衔接带',copy:'取消 HUD 浮起阴影，并让故事进程形成更宽的中性衔接带；它仍然随叙事一起滚动。',tag:'衔接最明确 · 进程不固定',note:'HUD 与故事的关系最清楚，但故事进程栏的存在感也会稍微提高。'}
    ];
    const grid=document.getElementById('optionGrid'),tpl=document.getElementById('phoneTemplate');variants.forEach((v,i)=>{const card=document.createElement('article');card.className='option-card';card.dataset.choice=v.choice;card.innerHTML=`<div class="phone-host"></div><div class="option-copy"><h3>${v.title}</h3><p>${v.copy}</p><span class="tag">${v.tag}</span></div><p class="option-note">${v.note}</p>`;card.addEventListener('click',()=>window.selectChoice(card));const phone=tpl.content.firstElementChild.cloneNode(true);phone.classList.add(v.cls);phone.querySelectorAll('.branch-option input').forEach(r=>r.name=`branch-${i}`);card.querySelector('.phone-host').appendChild(phone);grid.appendChild(card)});
    function toast(phone,message){const node=phone.querySelector('.toast');node.textContent=message;node.classList.add('show');setTimeout(()=>node.classList.remove('show'),1000)}
    document.querySelectorAll('.runtime-phone').forEach(phone=>{
      phone.querySelectorAll('button,textarea,input,label').forEach(el=>el.addEventListener('click',event=>event.stopPropagation()));
      const closePopovers=()=>{phone.querySelectorAll('.popover').forEach(x=>x.classList.remove('open'));phone.querySelectorAll('.tool').forEach(x=>x.setAttribute('aria-expanded','false'))};
      phone.querySelector('.more-button').addEventListener('click',event=>{const pop=phone.querySelector('.more-popover'),open=!pop.classList.contains('open');closePopovers();if(open){pop.classList.add('open');event.currentTarget.setAttribute('aria-expanded','true')}});
      phone.querySelector('.time-button').addEventListener('click',event=>{const pop=phone.querySelector('.time-popover'),open=!pop.classList.contains('open');closePopovers();if(open){pop.classList.add('open');event.currentTarget.setAttribute('aria-expanded','true')}});
      phone.querySelector('.world-button').addEventListener('click',event=>{closePopovers();const panel=phone.querySelector('.world-panel');panel.classList.toggle('open');event.currentTarget.setAttribute('aria-expanded',String(panel.classList.contains('open')))});
      phone.querySelectorAll('[data-step]').forEach(button=>button.addEventListener('click',()=>{phone.querySelectorAll('[data-step]').forEach(x=>x.classList.remove('active'));button.classList.add('active');phone.querySelector('.time-button').textContent=button.dataset.step;closePopovers();toast(phone,`下一轮按${button.dataset.step}推进 · 当前时间未改变`)}));
      phone.querySelector('[data-action="save"]').addEventListener('click',()=>{closePopovers();phone.querySelector('.save-overlay').classList.add('open')});phone.querySelector('[data-action="home"]').addEventListener('click',()=>toast(phone,'将返回主界面'));phone.querySelector('.save-close').addEventListener('click',()=>phone.querySelector('.save-overlay').classList.remove('open'));phone.querySelector('.save-confirm').addEventListener('click',()=>{phone.querySelector('.save-overlay').classList.remove('open');toast(phone,'已保存到槽位 1')});
      const advance=phone.querySelector('.advance'),timeline=phone.querySelector('.timeline'),input=phone.querySelector('.branch-input'),confirm=phone.querySelector('.branch-actions .confirm'),cancel=phone.querySelector('.branch-actions .cancel'),radios=[...phone.querySelectorAll('.branch-option input')];let generatedRound=0;
      const setAdvance=(state,title,hint)=>{advance.dataset.state=state;advance.innerHTML=`<span class="advance-title">${title}</span><span class="advance-hint">${hint}</span>`};const updateConfirm=()=>{confirm.disabled=!(input.value.trim()||radios.some(x=>x.checked))};
      const appendGeneratedEntry=choice=>{generatedRound+=1;const month=generatedRound===1?'槐月':'荷月',separator=document.createElement('div'),article=document.createElement('article');separator.className='separator';separator.textContent='✦';article.className='entry generated-entry';article.innerHTML=`<div class="entry-meta"><span>2006年 · ${month}</span><span>6 岁</span></div><div class="prose"><p>${generatedRound===1?'你在巡街人影转入巷口前做出了决定。孙伯没有催促，只把废园墙上的字又默念了一遍。':'几周后，旧底片背后的线索再次浮现。你开始明白，每一次选择都会让故事通向不同的地方。'}</p><p>${generatedRound===1?`“${choice}”——这句话落下后，新的线索也随之展开。`:'窗外的树影缓慢移动，新的问题已经在前方等待。'}</p></div>`;timeline.insertBefore(separator,advance);timeline.insertBefore(article,advance);phone.querySelector('.era').textContent=`2006年·${month}`};
      radios.forEach(radio=>radio.addEventListener('change',()=>{input.value='';phone.querySelectorAll('.branch-option').forEach(option=>option.classList.remove('selected'));radio.closest('.branch-option').classList.add('selected');updateConfirm()}));input.addEventListener('input',()=>{if(input.value.trim()){radios.forEach(x=>x.checked=false);phone.querySelectorAll('.branch-option').forEach(x=>x.classList.remove('selected'))}updateConfirm()});cancel.addEventListener('click',()=>{radios.forEach(x=>x.checked=false);phone.querySelectorAll('.branch-option').forEach(x=>x.classList.remove('selected'));input.value='';updateConfirm()});
      confirm.addEventListener('click',()=>{const custom=input.value.trim(),radio=radios.find(x=>x.checked),choice=custom||radio?.closest('.branch-option').querySelector('span').textContent.trim();if(!choice)return;phone.querySelector('.branch-pending').style.display='none';phone.querySelector('.resolved-text').textContent=choice;phone.querySelector('.branch-resolved').classList.add('show');confirm.disabled=true;advance.disabled=true;setAdvance('generating','AI 正在书写命运…','选择已记录，下一段人生正在生成');setTimeout(()=>{appendGeneratedEntry(choice);advance.disabled=false;setAdvance('ready','轻触，让岁月流转','故事已经沿着你的选择继续');timeline.scrollTop=timeline.scrollHeight},1100)});
      advance.addEventListener('click',()=>{if(advance.dataset.state!=='ready')return;advance.disabled=true;setAdvance('generating','岁月正在流转…','AI 正在书写下一段人生');setTimeout(()=>{appendGeneratedEntry('继续向前');advance.disabled=false;setAdvance('ready','轻触，让岁月流转','下一段故事已经准备好');timeline.scrollTop=timeline.scrollHeight},1000)});
    });
  </script>
</body>
</html>
