<!doctype html>
<html lang="zh-CN" data-theme="light-aurora">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>核心模拟 / 故事页第六轮</title>
  <link rel="stylesheet" href="../assets/library-history.css">
  <link rel="stylesheet" href="../../../../src/foundation/tokens/index.css">
  <script src="../assets/prototype.js" defer></script>
  <style>
    .phone.runtime-phone { --menu-top: 101px; width: 320px; height: 650px; display: flex; flex-direction: column; background: var(--color-bg-primary); color: var(--color-text-primary); font-family: Inter,"Microsoft YaHei",system-ui,sans-serif; }
    .runtime-phone button,.runtime-phone textarea,.runtime-phone input { font: inherit; }
    .hud { position: relative; z-index: 5; flex: 0 0 auto; min-height: 98px; padding: 8px 9px 7px; border-bottom: 1px solid var(--glass-border); background: linear-gradient(135deg,var(--color-primary-light),transparent 72%),var(--glass-surface-bg); box-shadow: var(--shadow-sm); backdrop-filter: blur(var(--glass-blur-surface)); }
    .hud-main { display: grid; grid-template-columns: minmax(0,1fr) 126px; gap: 8px; align-items: start; }
    .identity { min-width: 0; }
    .world-line,.char-line { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .world-name { overflow: hidden; color: var(--color-text-primary); font-size: 9px; font-weight: 760; text-overflow: ellipsis; white-space: nowrap; }
    .race { flex: 0 0 auto; padding: 2px 5px; border-radius: var(--radius-sm); background: var(--color-bg-tertiary); color: var(--color-text-tertiary); font-size: 7px; }
    .char-line { margin-top: 4px; color: var(--color-text-secondary); font-size: 8px; }
    .char-line b { color: var(--color-primary); }
    .hud-right { text-align: right; }
    .time-line { display: flex; align-items: baseline; justify-content: flex-end; gap: 5px; margin-bottom: 5px; }
    .era { overflow: hidden; color: var(--color-text-secondary); font-size: 7.3px; text-overflow: ellipsis; white-space: nowrap; }
    .age { color: var(--color-text-primary); font-size: 14px; font-weight: 780; white-space: nowrap; }
    .tools { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 2px; padding: 3px; border: 1px solid var(--glass-border); border-radius: var(--radius-lg); background: var(--glass-elevated-bg); box-shadow: var(--shadow-sm); }
    .tool { min-height: 30px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--color-text-secondary); font-size: 7px; font-weight: 680; white-space: nowrap; cursor: pointer; }
    .tool.active,.tool[aria-expanded="true"] { background: var(--color-primary-light); color: var(--color-primary); }
    .talents { display: flex; gap: 4px; margin-top: 5px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .talents::-webkit-scrollbar { display: none; }
    .talent { flex: 0 0 auto; padding: 2px 5px; border: 1px solid color-mix(in srgb,var(--color-primary) 18%,transparent); border-radius: var(--radius-sm); background: var(--color-primary-light); color: var(--color-primary); font-size: 7px; white-space: nowrap; }
    .attrs { display: flex; gap: 8px; margin-top: 5px; overflow-x: auto; color: var(--color-text-secondary); font-size: 7.2px; scrollbar-width: none; }
    .attrs::-webkit-scrollbar { display: none; }
    .attrs span { flex: 0 0 auto; }
    .attrs b { color: var(--color-success); }
    .life { color: var(--color-success); }
    .world-panel { display: none; flex: 0 0 auto; max-height: 30%; overflow-y: auto; padding: 9px 10px; border-bottom: 1px solid var(--color-border); background: var(--glass-elevated-bg); }
    .world-panel.open { display: block; }
    .panel-title { margin-bottom: 6px; color: var(--color-text-primary); font-size: 9px; font-weight: 760; }
    .panel-sub { margin: 7px 0 4px; color: var(--color-text-secondary); font-size: 7px; font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { padding: 3px 6px; border-radius: 999px; background: color-mix(in srgb,var(--color-primary) 8%,transparent); color: var(--color-text-secondary); font-size: 7px; line-height: 1.4; }
    .timeline { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); }
    .timeline-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; padding: 3px 0 6px; border-bottom: 1px solid color-mix(in srgb,var(--color-border) 62%,transparent); background: color-mix(in srgb,var(--color-bg-primary) 92%,transparent); color: var(--color-text-tertiary); font-size: 8px; backdrop-filter: blur(var(--glass-blur-surface)); }
    .load-more { padding: 8px 0; color: var(--color-text-tertiary); text-align: center; font-size: 7.5px; }
    .entry { padding: 9px 4px 5px; }
    .entry-meta { display: flex; justify-content: space-between; margin-bottom: 7px; color: var(--color-text-tertiary); font-size: 7.5px; }
    .prose { color: var(--color-text-primary); font-family: "Noto Serif SC","Songti SC",serif; font-size: 10.5px; line-height: 1.78; }
    .prose p { margin: 0 0 9px; text-indent: 2em; }
    .separator { display: flex; align-items: center; gap: 8px; margin: 3px 0; color: var(--color-text-tertiary); font-size: 8px; }
    .separator::before,.separator::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg,transparent,var(--color-border)); }
    .separator::after { background: linear-gradient(90deg,var(--color-border),transparent); }
    .branch { margin-top: 10px; padding: 10px; border: 1px solid color-mix(in srgb,var(--color-warning) 48%,var(--color-border)); border-radius: var(--radius-lg); background: color-mix(in srgb,var(--color-warning) 9%,var(--glass-elevated-bg)); }
    .branch-title { margin: 0 0 8px; color: var(--color-warning); font-size: 9.5px; font-weight: 760; line-height: 1.45; }
    .branch-option { display: flex; align-items: flex-start; gap: 8px; min-height: 38px; margin-bottom: 5px; padding: 7px 8px; border: 1px solid color-mix(in srgb,var(--color-warning) 22%,transparent); border-radius: var(--radius-md); background: color-mix(in srgb,var(--color-bg-card) 72%,transparent); color: var(--color-text-primary); font-size: 8.5px; line-height: 1.45; cursor: pointer; }
    .branch-option input { flex: 0 0 auto; width: 14px; height: 14px; margin: 1px 0 0; accent-color: var(--color-warning); }
    .branch-input { width: 100%; min-height: 54px; padding: 8px; resize: vertical; border: 1px solid var(--color-border); border-radius: var(--radius-md); outline: none; background: var(--color-bg-card); color: var(--color-text-primary); font-size: 8.5px; line-height: 1.5; }
    .branch-actions { display: flex; gap: 6px; margin-top: 7px; }
    .branch-actions button { min-height: 34px; padding: 7px 12px; border-radius: var(--radius-md); font-size: 8px; cursor: pointer; }
    .confirm { border: 0; background: var(--color-primary); color: var(--color-text-on-primary); }
    .cancel { border: 1px solid var(--color-border); background: transparent; color: var(--color-text-secondary); }
    .branch-resolved { display: none; margin-top: 10px; padding: 9px; border: 1px solid color-mix(in srgb,var(--color-warning) 45%,transparent); border-radius: var(--radius-md); background: color-mix(in srgb,var(--color-warning) 8%,transparent); color: var(--color-text-secondary); font-size: 8px; line-height: 1.5; }
    .branch-resolved.show { display: block; }
    .branch-resolved b { color: var(--color-warning); }
    .advance { min-height: 48px; display: grid; place-items: center; margin-top: 9px; border: 0; background: transparent; color: var(--color-warning); font-family: "Noto Serif SC","Songti SC",serif; font-size: 8.5px; letter-spacing: .08em; cursor: not-allowed; }
    .advance.generating { color: var(--color-text-tertiary); }
    .popover { display: none; position: absolute; z-index: 20; top: var(--menu-top); right: 9px; min-width: 112px; max-height: 190px; overflow-y: auto; padding: 4px; border: 1px solid var(--glass-border); border-radius: var(--radius-lg); background: var(--glass-popout-bg); box-shadow: var(--shadow-lg); backdrop-filter: blur(var(--glass-blur-popout)); }
    .popover.open { display: block; }
    .popover button { display: block; width: 100%; min-height: 34px; padding: 7px 9px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--color-text-primary); text-align: left; font-size: 8px; cursor: pointer; }
    .popover button.active { background: var(--color-primary-light); color: var(--color-primary); }
    .popover-hint { margin: 4px; padding-top: 5px; border-top: 1px solid var(--color-border); color: var(--color-text-tertiary); font-size: 7px; line-height: 1.45; }
    .save-overlay { display: none; position: absolute; inset: 0; z-index: 30; align-items: center; justify-content: center; padding: 14px; background: color-mix(in srgb,var(--color-text-primary) 28%,transparent); backdrop-filter: blur(3px); }
    .save-overlay.open { display: flex; }
    .save-dialog { width: 100%; padding: 13px; border: 1px solid var(--glass-border); border-radius: var(--radius-xl); background: var(--glass-modal-bg); box-shadow: var(--shadow-lg); }
    .save-dialog h4 { margin: 0 0 8px; font-size: 11px; }
    .save-slot { margin-bottom: 6px; padding: 8px; border: 1px solid var(--color-border); border-radius: var(--radius-md); color: var(--color-text-secondary); font-size: 8px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
    .dialog-actions button { min-height: 34px; padding: 7px 10px; border-radius: var(--radius-md); font-size: 8px; }
    .toast { position: absolute; left: 50%; bottom: 16px; z-index: 40; max-width: 85%; padding: 7px 10px; border-radius: 999px; background: color-mix(in srgb,var(--color-text-primary) 86%,transparent); color: var(--color-bg-card); font-size: 8px; opacity: 0; pointer-events: none; transform: translate(-50%,8px); transition: opacity var(--duration-fast) var(--ease-standard),transform var(--duration-fast) var(--ease-standard); }
    .toast.show { opacity: 1; transform: translate(-50%,0); }
    .option-note { margin: 0 18px 15px; padding: 9px 11px; border-radius: 11px; background: #f2f4fa; color: #69748c; font-size: 11px; line-height: 1.55; }

    /* GS8A：低噪声。命格去胶囊化，以文字与分隔点呈现。 */
    .gs8a { --menu-top: 97px; }
    .gs8a .hud { min-height: 95px; }
    .gs8a .talents { gap: 0; color: var(--color-text-tertiary); }
    .gs8a .talent { padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--color-text-secondary); }
    .gs8a .talent + .talent::before { content: " · "; margin: 0 4px; color: var(--color-text-tertiary); }
    .gs8a .attrs { padding-top: 4px; border-top: 1px solid color-mix(in srgb,var(--color-border) 65%,transparent); }

    /* GS8B：命格优先。命格名称单独占一行，属性缩成第二层账册。 */
    .gs8b { --menu-top: 108px; }
    .gs8b .hud { min-height: 106px; }
    .gs8b .talents { margin-top: 7px; gap: 5px; }
    .gs8b .talent { padding: 3px 6px; font-size: 7.3px; }
    .gs8b .attrs { gap: 7px; margin-top: 6px; font-size: 6.8px; }

    /* GS8C：属性优先。属性改为六格微型表，命格作为横向文本带。 */
    .gs8c { --menu-top: 104px; }
    .gs8c .hud { min-height: 102px; }
    .gs8c .talents { gap: 0; margin-top: 5px; }
    .gs8c .talent { padding: 0; border: 0; background: transparent; color: var(--color-text-tertiary); }
    .gs8c .talent + .talent::before { content: " / "; margin: 0 3px; }
    .gs8c .attrs { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 2px; margin-top: 5px; overflow: visible; }
    .gs8c .attrs span { display: grid; min-width: 0; padding: 3px 1px; place-items: center; border-radius: var(--radius-sm); background: color-mix(in srgb,var(--color-bg-card) 55%,transparent); font-size: 6.4px; text-align: center; white-space: nowrap; }

    @media (max-width: 980px) { .option-copy { padding-top: 2px; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar"><a href="index.html">← 返回故事页历史</a><span data-selection>本轮结果：GS8B 晋级</span></div>
    <p class="eyebrow">CORE SIMULATION · ROUND 06</p>
    <h1>GS7A 下一代：全量 HUD 信息重排</h1>
    <p class="subtitle">GS7A 单独晋级。三稿保留相同的正式功能与连续叙事区，只比较命格、属性和身份信息的视觉优先级；不再隐藏任何字段。</p>
    <section class="option-grid" id="optionGrid"></section>
    <p class="selection">本轮结论：GS8B 晋级。下一轮压缩 HUD 无意义空白，并让“故事进程”紧贴顶部信息栏。</p>
  </main>

  <template id="phoneTemplate">
    <div class="phone runtime-phone">
      <header class="hud"><div class="hud-main"><div class="identity"><div class="world-line"><span class="world-name">现代地球 · 滨海旧城</span><span class="race">人类</span></div><div class="char-line"><b>林清和</b><span>· 女</span></div></div><div class="hud-right"><div class="time-line"><span class="era">2006年 · 桃月</span><span class="age">6岁</span></div><div class="tools"><button type="button" class="tool more-button" aria-expanded="false">更多</button><button type="button" class="tool time-button active" aria-expanded="false">月</button><button type="button" class="tool world-button" aria-expanded="false">世界</button></div></div></div><div class="talents"><span class="talent">体能守恒织网</span><span class="talent">完美主义的选择刑</span><span class="talent">旧日信标</span></div><div class="attrs"><span>体魄 -1</span><span>心智 <b>+4</b></span><span>悟性 <b>+3</b></span><span>魅力 -1</span><span>出身 <b>+2</b></span><span class="life">生命 100</span></div></header>
      <div class="popover more-popover"><button type="button" data-action="save">存档</button><button type="button" data-action="home">主界面</button></div>
      <div class="popover time-popover"><button type="button" data-step="日">日</button><button type="button" data-step="月" class="active">月</button><button type="button" data-step="季">季</button><button type="button" data-step="年">年</button><button type="button" data-step="3年">3年</button><button type="button" data-step="5年">5年</button><button type="button" data-step="10年">10年</button><button type="button" data-step="50年">50年</button><button type="button" data-step="100年">100年</button><button type="button" data-step="200年">200年</button><button type="button" data-step="500年">500年</button><button type="button" data-step="1000年">1000年</button><p class="popover-hint">切换只影响下一轮；旧预生成失效，当前时间不改变。</p></div>
      <section class="world-panel"><div class="panel-title">世界规则</div><div class="panel-sub">世界标签</div><div class="chips"><span class="chip">社会：城市为主</span><span class="chip">环境：温带气候</span><span class="chip">经济：市场经济</span><span class="chip">超自然：无超自然</span></div><div class="panel-sub">基础状态</div><div class="chips"><span class="chip">纪元：2006年·桃月</span><span class="chip">季节：春季</span></div><div class="panel-sub">角色状态</div><div class="chips"><span class="chip">生命：100/100</span><span class="chip">体力：100</span><span class="chip">精神：100</span></div></section>
      <main class="timeline"><div class="timeline-head"><span>故事进程</span><span>第 12 轮</span></div><div class="load-more">向上滚动加载更早的叙事（已隐藏 12 条）</div><article class="entry"><div class="entry-meta"><span>2006年 · 杏月</span><span>6 岁</span></div><div class="prose"><p>午后的旧书店里，窗格把阳光切成细长的方块。你趴在柜台边，用放大镜对着那张旧底片一寸寸移动。</p><p>底片深处的人影终于露出轮廓：他站在沈家废园的砖墙旁，手里握着一根没有鱼线的旧鱼竿。</p></div></article><div class="separator">✦</div><article class="entry"><div class="entry-meta"><span>2006年 · 桃月</span><span>6 岁</span></div><div class="prose"><p>周六清晨，孙伯带你绕到废园背后。墙根刻着一行已经模糊的字，他蹲下擦去青苔，只辨认出“存米七斗”四个字。</p><p>巡街的脚步声从巷口逼近。孙伯把底片塞回你手里，低声问你，是继续查下去，还是先把它交给父亲。</p></div><section class="branch branch-pending"><p class="branch-title">⚡ 命运分叉点：你准备如何处理这张底片？</p><label class="branch-option"><input type="radio" name="branch"><span>继续跟着孙伯调查废园，先弄清墙上刻字的来历。</span></label><label class="branch-option"><input type="radio" name="branch"><span>把底片交给父亲，问他是否认识照片中的人。</span></label><textarea class="branch-input" placeholder="或手动输入你的选择..." rows="3"></textarea><div class="branch-actions"><button type="button" class="confirm">确认选择</button><button type="button" class="cancel">取消</button></div></section><div class="branch-resolved"><b>命运分叉点：</b>你的选择：<span class="resolved-text"></span></div></article><button type="button" class="advance">✔ 请先选择命运</button></main>
      <div class="save-overlay"><div class="save-dialog"><h4>手动存档</h4><div class="save-slot">槽位 1 · 林清和 · 第 12 轮</div><div class="save-slot">槽位 2 · 空</div><div class="save-slot">槽位 3 · 空</div><div class="dialog-actions"><button type="button" class="cancel save-close">取消</button><button type="button" class="confirm save-confirm">保存</button></div></div></div><div class="toast"></div>
    </div>
  </template>

  <script>
    const variants = [
      { cls:'gs8a',choice:'GS8A 低噪声层级',title:'GS8A · 低噪声层级',copy:'命格去掉胶囊边框，用文字与分隔点呈现；身份和时间保持第一视觉层。',tag:'最克制 · 阅读干扰最低',note:'信息完整但装饰最少，适合长时间阅读；命格稀有度的视觉区分会变弱。' },
      { cls:'gs8b',choice:'GS8B 命格优先',title:'GS8B · 命格优先',copy:'三条命格单独占据清晰一行，属性压成更轻的账册，强化角色独特性。',tag:'角色感最强 · 命格易读',note:'命格名称最完整，但 HUD 高度稍高，数值扫视速度不如 GS8C。' },
      { cls:'gs8c',choice:'GS8C 属性优先',title:'GS8C · 属性优先',copy:'五项属性与生命组成六格微型表，命格退为横向文字带，状态变化最容易比较。',tag:'数值最清楚 · 扫视最快',note:'状态效率最高，但微型表更像仪表盘，叙事气质会稍弱。' },
    ]
    const grid=document.getElementById('optionGrid');const template=document.getElementById('phoneTemplate')
    variants.forEach((v,i)=>{const article=document.createElement('article');article.className='option-card';article.dataset.choice=v.choice;article.innerHTML=`<div class="phone-host"></div><div class="option-copy"><h3>${v.title}</h3><p>${v.copy}</p><span class="tag">${v.tag}</span></div><p class="option-note">${v.note}</p>`;article.addEventListener('click',()=>window.selectChoice(article));const phone=template.content.firstElementChild.cloneNode(true);phone.classList.add(v.cls);phone.querySelectorAll('.branch-option input').forEach(r=>r.name=`branch-${i}`);article.querySelector('.phone-host').appendChild(phone);grid.appendChild(article)})
    function toast(phone,text){const el=phone.querySelector('.toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1100)}
    document.querySelectorAll('.runtime-phone').forEach(phone=>{phone.querySelectorAll('button,textarea,input,label').forEach(el=>el.addEventListener('click',e=>e.stopPropagation()));const close=()=>{phone.querySelectorAll('.popover').forEach(p=>p.classList.remove('open'));phone.querySelectorAll('.tool').forEach(b=>b.setAttribute('aria-expanded','false'))};phone.querySelector('.more-button').addEventListener('click',e=>{const p=phone.querySelector('.more-popover'),open=!p.classList.contains('open');close();if(open){p.classList.add('open');e.currentTarget.setAttribute('aria-expanded','true')}});phone.querySelector('.time-button').addEventListener('click',e=>{const p=phone.querySelector('.time-popover'),open=!p.classList.contains('open');close();if(open){p.classList.add('open');e.currentTarget.setAttribute('aria-expanded','true')}});phone.querySelector('.world-button').addEventListener('click',e=>{close();const p=phone.querySelector('.world-panel');p.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(p.classList.contains('open')))});phone.querySelectorAll('[data-step]').forEach(item=>item.addEventListener('click',()=>{phone.querySelectorAll('[data-step]').forEach(x=>x.classList.remove('active'));item.classList.add('active');phone.querySelector('.time-button').textContent=item.dataset.step;close();toast(phone,`下一轮按${item.dataset.step}推进 · 当前时间未改变`)}));phone.querySelector('[data-action="save"]').addEventListener('click',()=>{close();phone.querySelector('.save-overlay').classList.add('open')});phone.querySelector('[data-action="home"]').addEventListener('click',()=>{close();toast(phone,'将返回主界面')});phone.querySelector('.save-close').addEventListener('click',()=>phone.querySelector('.save-overlay').classList.remove('open'));phone.querySelector('.save-confirm').addEventListener('click',()=>{phone.querySelector('.save-overlay').classList.remove('open');toast(phone,'已保存到槽位 1')});const advance=phone.querySelector('.advance');phone.querySelector('.branch-actions .confirm').addEventListener('click',()=>{const custom=phone.querySelector('.branch-input').value.trim(),checked=phone.querySelector('.branch-option input:checked'),choice=custom||checked?.closest('.branch-option').querySelector('span').textContent.trim();if(!choice){toast(phone,'请先选择或输入意图');return}phone.querySelector('.branch-pending').style.display='none';phone.querySelector('.resolved-text').textContent=choice;phone.querySelector('.branch-resolved').classList.add('show');advance.classList.add('generating');advance.textContent='AI 正在书写命运...';setTimeout(()=>{advance.classList.remove('generating');advance.style.color='var(--color-text-tertiary)';advance.style.cursor='pointer';advance.textContent='轻触，让岁月流转'},1100)});phone.querySelector('.branch-actions .cancel').addEventListener('click',()=>{phone.querySelectorAll('.branch-option input').forEach(x=>x.checked=false);phone.querySelector('.branch-input').value=''})})
  </script>
</body>
