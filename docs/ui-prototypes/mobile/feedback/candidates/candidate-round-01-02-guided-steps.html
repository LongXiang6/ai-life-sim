<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>反馈与建议 · 候选 02 · 分步向导</title>
  <style>
    /* Purpose: Static prototype of the feedback page, three-step guided flow. Owner: Interface system. Responsibility: Candidate only; inherits the finalized baseline and preserves the runtime contract (four categories, content, diagnostic code, submit with stable id, disclaimer confirmation). */
    * { box-sizing: border-box; }

    a { color: inherit; text-decoration: none; }

    body {
      margin: 0;
      color: #2e2922;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      position: relative;
      isolation: isolate;
      display: grid;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      place-items: stretch;
      background: #fdf9f1;
      color-scheme: light;
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    @media (min-width: 48rem) {
      .viewport { width: min(100%, 30rem); }
    }

    .page {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      background: #fdf9f1;
      color: #2e2922;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    }

    .screen {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      padding: 22px 28px 16px;
      overflow: hidden;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #8a7f6e;
      font-size: 11px;
      font-weight: 650;
    }

    .header {
      padding: 22px 4px 14px;
      border-bottom: 1px solid #eadfce;
    }

    .header h1 {
      margin: 0;
      color: #241f18;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      padding: 14px 4px 10px;
    }

    .stepItem {
      display: grid;
      gap: 4px;
      justify-items: center;
      text-align: center;
    }

    .stepDot {
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      border: 1px solid #d8d2c4;
      border-radius: 50%;
      background: #fdf9f1;
      color: #a0907a;
      font-size: 11px;
      font-weight: 700;
    }

    .stepItem[data-active="true"] .stepDot {
      border-color: #977026;
      background: #977026;
      color: #fff;
    }

    .stepItem[data-done="true"] .stepDot {
      border-color: #c9a24b;
      background: #faf4e8;
      color: #6b4d1d;
    }

    .stepLabel {
      color: #a0907a;
      font-size: 10px;
    }

    .stepItem[data-active="true"] .stepLabel,
    .stepItem[data-done="true"] .stepLabel {
      color: #5c5447;
      font-weight: 650;
    }

    .content {
      min-height: 0;
      flex: 1;
      padding: 6px 0 14px;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar { display: none; }

    .stepPanel[hidden] { display: none; }

    .section { margin: 0 0 14px; }

    .sectionLabel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 4px 6px;
    }

    .sectionLabel h3 {
      margin: 0;
      color: #241f18;
      font-size: 13px;
      font-weight: 700;
    }

    .sectionLabel span { color: #a0907a; font-size: 10px; }

    .sectionCard {
      padding: 4px 16px 12px;
      border: 1px solid #e5e1d6;
      border-radius: 20px;
      background: #fffdf8;
    }

    .categoryGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 8px 0 4px;
    }

    .categoryButton {
      display: grid;
      gap: 3px;
      min-height: 74px;
      padding: 12px;
      border: 1px solid #e5e1d6;
      border-radius: 16px;
      background: #fffdf8;
      color: #2e2922;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .categoryButton[aria-pressed="true"] {
      border-color: #977026;
      background: #faf4e8;
    }

    .categoryTitle,
    .categoryDescription { display: block; }

    .categoryTitle { font-size: 13px; font-weight: 650; }

    .categoryDescription {
      margin-top: 3px;
      color: #8a7f6e;
      font-size: 10px;
      line-height: 1.4;
    }

    .styleInput {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: 1px solid #e5e1d6;
      border-radius: 16px;
      background: #fffdf8;
      color: #2e2922;
      font: inherit;
      font-size: 12px;
      line-height: 1.6;
      resize: none;
    }

    .styleInput::placeholder { color: #c3b8a2; }

    .styleMeta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 2px 0;
      color: #a0907a;
      font-size: 10px;
    }

    .dataRow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px 0 4px;
    }

    .dataRow strong,
    .dataRow small { display: block; }

    .dataRow strong { color: #2e2922; font-size: 12px; font-weight: 650; }

    .dataRow small {
      margin-top: 3px;
      color: #8a7f6e;
      font-size: 10px;
      line-height: 1.4;
    }

    .valueAction {
      min-height: 30px;
      padding: 0 12px;
      border: 1px solid #d8c9a8;
      border-radius: 15px;
      background: #faf4e8;
      color: #6b4d1d;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 650;
    }

    /* 核对摘要 */
    .reviewRow {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px dashed #eadfce;
    }

    .reviewRow:first-child { padding-top: 6px; }

    .reviewRow span { color: #8a7f6e; font-size: 10px; }

    .reviewRow strong {
      max-width: 60%;
      color: #2e2922;
      font-size: 12px;
      font-weight: 650;
      line-height: 1.45;
      text-align: right;
      overflow-wrap: anywhere;
    }

    /* 确认 + 免责声明 */
    .confirmRow {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 10px 0 4px;
      color: #5c5447;
      font-size: 11px;
      line-height: 1.55;
    }

    .confirmRow input { margin: 2px 0 0; accent-color: #977026; }

    .disclaimer {
      margin: 0;
      padding: 8px 10px;
      border-radius: 14px;
      background: #faf4e8;
      color: #8a7f6e;
      font-size: 10px;
      line-height: 1.55;
    }

    .error,
    .success {
      margin: 0 0 10px;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 11px;
      line-height: 1.5;
    }

    .error { background: #f8eef1; color: #936875; }
    .success { background: #eef3e2; color: #5a6b3a; }

    .success strong { font-weight: 700; }

    .success button {
      margin-left: 8px;
      border: 0;
      background: transparent;
      color: #5a6b3a;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 650;
      text-decoration: underline;
    }

    /* 底部操作 */
    .bottomBar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px 20px 16px;
      border-top: 1px solid #eadfce;
      background: #fdf9f1;
    }

    .stepNav {
      min-height: 46px;
      padding: 0 18px;
      border: 1px solid #e5e1d6;
      border-radius: 24px;
      background: #fff;
      color: #5c5447;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
    }

    .stepNav[data-primary="true"] {
      border-color: #977026;
      background: #977026;
      color: #fff;
    }

    .stepNav:disabled {
      border-color: #ede7d9;
      background: #f6f2e8;
      color: #c3b8a2;
      cursor: not-allowed;
    }

    .stepNav[hidden] { display: none; }

    .backButton {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid #e5e1d6;
      border-radius: 50%;
      background: #fff;
      color: #5c5447;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="viewport">
      <main class="page">
        <div class="screen">
          <div class="meta" aria-hidden="true"><span>AI LIFE SIM · 命书</span><span>附 · 反馈</span></div>
          <header class="header">
            <h1>💬 反馈与建议</h1>
            <p>三步完成，先选类型，再写内容。</p>
          </header>

          <nav class="steps" aria-label="反馈步骤">
            <div class="stepItem" data-active="true"><span class="stepDot">1</span><span class="stepLabel">选择类型</span></div>
            <div class="stepItem" data-active="false"><span class="stepDot">2</span><span class="stepLabel">填写内容</span></div>
            <div class="stepItem" data-active="false"><span class="stepDot">3</span><span class="stepLabel">核对提交</span></div>
          </nav>

          <section class="content" aria-label="反馈表单">
            <!-- 步骤 1：选择类型 -->
            <section class="stepPanel" id="step-1">
              <section class="section">
                <div class="sectionLabel"><h3>📋 反馈类型</h3><span>四选一</span></div>
                <div class="sectionCard">
                  <div class="categoryGrid" role="group" aria-label="反馈类型">
                    <button type="button" class="categoryButton" data-category="问题反馈" aria-pressed="false"><span class="categoryTitle">⚠️ 问题反馈</span><span class="categoryDescription">错误、异常或无法继续</span></button>
                    <button type="button" class="categoryButton" data-category="功能建议" aria-pressed="false"><span class="categoryTitle">✨ 功能建议</span><span class="categoryDescription">希望增加或调整的内容</span></button>
                    <button type="button" class="categoryButton" data-category="体验意见" aria-pressed="false"><span class="categoryTitle">🌱 体验意见</span><span class="categoryDescription">叙事、界面或操作感受</span></button>
                    <button type="button" class="categoryButton" data-category="其他" aria-pressed="false"><span class="categoryTitle">📌 其他</span><span class="categoryDescription">不属于以上分类</span></button>
                  </div>
                </div>
              </section>
            </section>

            <!-- 步骤 2：填写内容 -->
            <section class="stepPanel" id="step-2" hidden>
              <section class="section">
                <div class="sectionLabel"><h3>✍️ 反馈内容</h3><span>必填</span></div>
                <div class="sectionCard">
                  <textarea class="styleInput" rows="8" id="feedbackMessage" placeholder="描述问题或建议"></textarea>
                  <div class="styleMeta"><span id="charCount">0 字</span><span>可附截图说明</span></div>
                </div>
              </section>

              <section class="section">
                <div class="sectionLabel"><h3>🔐 六位诊断编号</h3><span>便于定位记录</span></div>
                <div class="sectionCard">
                  <div class="dataRow">
                    <span><strong>U4Q32L</strong><small>反馈后可凭此编号查询近期记录</small></span>
                    <button type="button" class="valueAction" data-copy="U4Q32L">复制编号</button>
                  </div>
                </div>
              </section>
            </section>

            <!-- 步骤 3：核对提交 -->
            <section class="stepPanel" id="step-3" hidden>
              <section class="section">
                <div class="sectionLabel"><h3>📋 核对内容</h3><span>确认无误后提交</span></div>
                <div class="sectionCard">
                  <div class="reviewRow"><span>类型</span><strong id="reviewCategory">功能建议</strong></div>
                  <div class="reviewRow"><span>内容</span><strong id="reviewMessage">希望增加更多角色的可切换外观。</strong></div>
                  <div class="reviewRow"><span>诊断编号</span><strong>U4Q32L</strong></div>
                </div>
              </section>

              <section class="section">
                <div class="sectionCard">
                  <label class="confirmRow">
                    <input type="checkbox" id="confirmCheck" />
                    <span>我已了解：本地存档不会上传；诊断记录限期保存，仅用于定位问题。</span>
                  </label>
                  <p class="disclaimer">反馈会附上最近 20 轮叙事与运行诊断，除你主动提交外，服务器不会保存你的故事内容。</p>
                </div>
              </section>

              <p class="error" id="errorBox" role="alert" hidden>提交失败，请稍后重试。</p>
              <section class="success" id="successBox" role="status" hidden>
                <span>反馈已完整保存</span><strong>FB-20260808-A1B2</strong><button type="button" data-copy="FB-20260808-A1B2">复制编号</button>
              </section>
            </section>
          </section>
        </div>

        <div class="bottomBar">
          <button type="button" class="backButton" aria-label="返回上一页">←</button>
          <div>
            <button type="button" class="stepNav" id="prevButton" hidden>上一步</button>
            <button type="button" class="stepNav" id="nextButton" data-primary="true">下一步</button>
            <button type="button" class="stepNav" id="submitButton" data-primary="true" hidden>提交反馈</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    // Prototype-only interaction; does not own product state.
    (function () {
      var step = 1;
      var panels = { 1: document.getElementById('step-1'), 2: document.getElementById('step-2'), 3: document.getElementById('step-3') };
      var steps = document.querySelectorAll('.stepItem');
      var prev = document.getElementById('prevButton');
      var next = document.getElementById('nextButton');
      var submit = document.getElementById('submitButton');
      var message = document.getElementById('feedbackMessage');
      var count = document.getElementById('charCount');
      var confirmCheck = document.getElementById('confirmCheck');
      var category = '功能建议';

      function render() {
        Object.keys(panels).forEach(function (key) {
          panels[key].hidden = Number(key) !== step;
        });
        steps.forEach(function (item, index) {
          var number = index + 1;
          item.dataset.active = number === step ? 'true' : 'false';
          item.dataset.done = number < step ? 'true' : 'false';
        });
        prev.hidden = step === 1;
        next.hidden = step === 3;
        submit.hidden = step !== 3;
        submit.disabled = !confirmCheck.checked;
        if (step === 1) next.disabled = false;
        if (step === 2) next.disabled = message.value.trim().length === 0;
      }

      next.addEventListener('click', function () {
        if (step < 3) { step += 1; if (step === 3) renderReview(); render(); }
      });

      prev.addEventListener('click', function () {
        if (step > 1) { step -= 1; render(); }
      });

      document.querySelectorAll('.categoryButton').forEach(function (button) {
        button.addEventListener('click', function () {
          document.querySelectorAll('.categoryButton').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
          button.setAttribute('aria-pressed', 'true');
          category = button.dataset.category;
        });
      });

      message.addEventListener('input', function () {
        count.textContent = message.value.length + ' 字';
        if (step === 2) next.disabled = message.value.trim().length === 0;
      });

      confirmCheck.addEventListener('change', render);

      function renderReview() {
        document.getElementById('reviewCategory').textContent = category;
        document.getElementById('reviewMessage').textContent = message.value.trim();
      }

      submit.addEventListener('click', function () {
        if (!confirmCheck.checked) return;
        document.getElementById('successBox').hidden = false;
        render();
      });

      document.querySelectorAll('[data-copy]').forEach(function (button) {
        button.addEventListener('click', function () {
          var original = button.textContent;
          button.textContent = '已复制';
          setTimeout(function () { button.textContent = original; }, 1200);
        });
      });

      render();
    })();
  </script>
</body>
</html>
