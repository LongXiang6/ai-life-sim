<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>反馈与建议 · 候选 03 · 紧凑单列</title>
  <style>
    /* Purpose: Static prototype of the feedback page, compact single column. Owner: Interface system. Responsibility: Candidate only; inherits the finalized baseline and preserves the runtime contract (four categories, content, diagnostic code, submit with stable id). */
    * { box-sizing: border-box; }

    a { color: inherit; text-decoration: none; }

    body {
      margin: 0;
      color: #2e2922;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      position: relative;
      isolation: isolate;
      display: grid;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      place-items: stretch;
      background: #fdf9f1;
      color-scheme: light;
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    @media (min-width: 48rem) {
      .viewport { width: min(100%, 30rem); }
    }

    .page {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      background: #fdf9f1;
      color: #2e2922;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    }

    .screen {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      padding: 22px 28px 16px;
      overflow: hidden;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #8a7f6e;
      font-size: 11px;
      font-weight: 650;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 4px 12px;
      border-bottom: 1px solid #eadfce;
    }

    .header h1 {
      margin: 0;
      color: #241f18;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .content {
      min-height: 0;
      flex: 1;
      padding: 12px 0 14px;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar { display: none; }

    /* 分类 chip 单行 */
    .chipRow {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin: 0 4px 12px;
    }

    .chipButton {
      min-height: 34px;
      padding: 0 6px;
      border: 1px solid #e5e1d6;
      border-radius: 17px;
      background: #fffdf8;
      color: #8a7f6e;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      text-align: center;
    }

    .chipButton[aria-pressed="true"] {
      border-color: #977026;
      background: #faf4e8;
      color: #6b4d1d;
      font-weight: 700;
    }

    .fieldCard {
      padding: 12px 16px 14px;
      border: 1px solid #e5e1d6;
      border-radius: 20px;
      background: #fffdf8;
    }

    .fieldLabel {
      display: block;
      margin-bottom: 6px;
      color: #8a7f6e;
      font-size: 10px;
    }

    .styleInput {
      width: 100%;
      padding: 12px;
      border: 1px solid #e5e1d6;
      border-radius: 16px;
      background: #fbf9f2;
      color: #2e2922;
      font: inherit;
      font-size: 12px;
      line-height: 1.6;
      resize: none;
    }

    .styleInput::placeholder { color: #c3b8a2; }

    .styleMeta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      color: #a0907a;
      font-size: 10px;
    }

    /* 诊断编号折叠行 */
    .codeToggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      min-height: 40px;
      margin-top: 10px;
      padding: 0 4px;
      border: 0;
      border-top: 1px dashed #eadfce;
      background: transparent;
      color: #8a7f6e;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      text-align: left;
    }

    .codeToggle b { color: #6b4d1d; font-weight: 650; }

    .codeRow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      margin: 8px 0 0;
      border: 1px solid #e5e1d6;
      border-radius: 16px;
      background: #fbf9f2;
    }

    .codeRow[hidden] { display: none; }

    .codeRow span { color: #5c5447; font-size: 11px; }

    .codeRow span strong { display: block; color: #2e2922; font-size: 13px; font-weight: 650; }

    .valueAction {
      min-height: 30px;
      padding: 0 12px;
      border: 1px solid #d8c9a8;
      border-radius: 15px;
      background: #faf4e8;
      color: #6b4d1d;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 650;
    }

    .disclaimer {
      margin: 10px 4px 0;
      color: #a0907a;
      font-size: 9.5px;
      line-height: 1.55;
    }

    .error,
    .success {
      margin: 10px 0 0;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 11px;
      line-height: 1.5;
    }

    .error { background: #f8eef1; color: #936875; }
    .success { background: #eef3e2; color: #5a6b3a; }

    .success strong { font-weight: 700; }

    .success button {
      margin-left: 8px;
      border: 0;
      background: transparent;
      color: #5a6b3a;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 650;
      text-decoration: underline;
    }

    /* 底部操作 */
    .bottomBar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px 20px 16px;
      border-top: 1px solid #eadfce;
      background: #fdf9f1;
    }

    .submitButton {
      width: 100%;
      min-height: 46px;
      grid-column: 2 / 3;
      border: 1px solid #977026;
      border-radius: 24px;
      background: #977026;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
    }

    .submitButton:disabled {
      border-color: #d8d2c4;
      background: #ede7d9;
      color: #b5ab96;
      cursor: not-allowed;
    }

    .backButton {
      display: grid;
      width: 46px;
      height: 46px;
      grid-column: 1 / 2;
      place-items: center;
      border: 1px solid #e5e1d6;
      border-radius: 50%;
      background: #fff;
      color: #5c5447;
      font-size: 16px;
    }

    .returnNumber {
      display: grid;
      width: 40px;
      height: 40px;
      grid-column: 3 / 4;
      place-items: center;
      border: 1px solid #e5e1d6;
      border-radius: 50%;
      background: #fff;
      color: #6b4d1d;
      font-size: 11px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="viewport">
      <main class="page">
        <div class="screen">
          <div class="meta" aria-hidden="true"><span>AI LIFE SIM · 命书</span><span>附 · 反馈</span></div>
          <header class="header">
            <h1>💬 反馈与建议</h1>
          </header>

          <section class="content" aria-label="反馈表单">
            <div class="chipRow" role="group" aria-label="反馈类型">
              <button type="button" class="chipButton" aria-pressed="false">⚠️ 问题</button>
              <button type="button" class="chipButton" aria-pressed="true">✨ 建议</button>
              <button type="button" class="chipButton" aria-pressed="false">🌱 体验</button>
              <button type="button" class="chipButton" aria-pressed="false">📌 其他</button>
            </div>

            <div class="fieldCard">
              <label class="fieldLabel" for="feedbackMessage"><span aria-hidden="true">✍️ </span>内容</label>
              <textarea class="styleInput" id="feedbackMessage" rows="10" placeholder="描述问题或建议"></textarea>
              <div class="styleMeta"><span id="charCount">0 字</span><span>可附截图说明</span></div>

              <button type="button" class="codeToggle" id="codeToggle">🔐 六位诊断编号 <b id="codeValue">U4Q32L</b></button>
              <div class="codeRow" id="codeRow" hidden>
                <span><strong>U4Q32L</strong>反馈后可凭此编号查询近期记录</span>
                <button type="button" class="valueAction" data-copy="U4Q32L">复制编号</button>
              </div>
            </div>

            <p class="disclaimer">提交即代表你已了解：本地存档不会上传；诊断记录限期保存，仅用于定位问题。</p>

            <p class="error" id="errorBox" role="alert" hidden>提交失败，请稍后重试。</p>
            <section class="success" id="successBox" role="status" hidden>
              <span>反馈已完整保存</span><strong>FB-20260808-A1B2</strong><button type="button" data-copy="FB-20260808-A1B2">复制编号</button>
            </section>
          </section>
        </div>

        <div class="bottomBar">
          <button type="button" class="backButton" aria-label="返回上一页">←</button>
          <button type="button" class="submitButton" id="submitButton" disabled>提交反馈</button>
          <a href="../../welcome/candidates/candidate-round-06-02-lower-block.html" class="returnNumber" target="_blank" rel="noopener" title="返回欢迎界面">00</a>
        </div>
      </main>
    </div>
  </div>

  <script>
    // Prototype-only interaction; does not own product state.
    (function () {
      var message = document.getElementById('feedbackMessage');
      var count = document.getElementById('charCount');
      var submit = document.getElementById('submitButton');
      var success = document.getElementById('successBox');
      var toggle = document.getElementById('codeToggle');
      var row = document.getElementById('codeRow');

      function update() {
        count.textContent = message.value.length + ' 字';
        submit.disabled = message.value.trim().length === 0;
      }

      message.addEventListener('input', update);

      toggle.addEventListener('click', function () {
        row.hidden = !row.hidden;
      });

      document.querySelectorAll('[data-copy]').forEach(function (button) {
        button.addEventListener('click', function () {
          var original = button.textContent;
          button.textContent = '已复制';
          setTimeout(function () { button.textContent = original; }, 1200);
        });
      });

      document.querySelectorAll('.chipButton').forEach(function (button) {
        button.addEventListener('click', function () {
          document.querySelectorAll('.chipButton').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
          button.setAttribute('aria-pressed', 'true');
        });
      });

      submit.addEventListener('click', function () {
        if (submit.disabled) return;
        success.hidden = false;
        message.value = '';
        update();
      });
    })();
  </script>
</body>
</html>
