<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>反馈与建议 · AI Life Sim</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../assets/library.css?v=20260723-ui-sync-4">
  <link rel="stylesheet" href="../assets/creation-flow-unified.css?v=20260723-ui-sync-4">
  <link rel="stylesheet" href="../assets/relative-phone-layout.css?v=20260723-ui-sync-4">
  <script src="../assets/prototype.js?v=20260723-ui-sync-4" defer></script>
  <script src="../assets/creation-flow-unified.js?v=20260723-ui-sync-4" defer></script>
  <script src="../assets/relative-phone-layout.js?v=20260723-ui-sync-4" defer></script>
  <style>
    body.feedback-b1{background:#eef1f7}.feedback-b1 .creation-shell{width:min(100% - 24px,900px);padding:18px 0 42px}.feedback-b1 .creation-phone{--cf-paper:#fafbff;--cf-surface:#fff;--cf-soft:#f1f3fa;--cf-ink:#28324b;--cf-muted:#707b92;--cf-faint:#929bb0;--cf-line:#d8deea;--cf-line-strong:#d8deea;--cf-accent:#7382bb;--cf-accent-soft:#edf0fb;--cf-ornament:#7787c0;width:min(100%,320px);height:674px;container-type:size;border-color:#d8deea;border-radius:34px;background:linear-gradient(180deg,#fafbff 0%,#f2f4f9 100%);box-shadow:0 20px 48px rgba(62,70,100,.09)}
    .feedback-b1 .cf-screen{inset:0;padding:15px 16px 78px}.feedback-b1 .cf-meta span:last-child{display:none}.feedback-b1 .cf-title-row h2{color:#28324b;font-size:22px}.feedback-b1 .cf-title-row p,.feedback-b1 .cf-title-mark{display:none}.feedback-b1 .cf-section{margin-top:9px;border-color:#d8deea;background:rgba(255,255,255,.94)}.feedback-b1 .cf-textarea{height:126px}.feedback-label{display:block;margin:0 0 5px;color:#929bb0;font-size:8.5px}.feedback-grid{display:grid;gap:9px}.feedback-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #e5e9f2}.feedback-row:first-child{padding-top:0;border-top:0}.feedback-row strong,.feedback-row small{display:block}.feedback-row strong{font-size:9px}.feedback-row small{margin-top:3px;color:#929bb0;font-size:8.5px}.feedback-value{color:#6576b2;font-size:8.5px;font-weight:700}.feedback-submit{width:100%;min-height:34px;margin-top:10px;border:1px solid #cfd7ee;border-radius:9px;background:#edf0fb;color:#6576b2;font-size:9px;font-weight:700}.feedback-b1 .cf-footer{border-color:rgba(207,215,238,.84);background:rgba(255,255,255,.8);backdrop-filter:blur(16px)}.feedback-b1 .cf-next-arrow{background:#7382bb}
  </style>
</head>
<body class="feedback-b1" data-screen="feedback">
  <main class="creation-shell">
    <header class="creation-review"><p class="creation-review-label">FEEDBACK · FINAL</p><h1>反馈与建议</h1><p class="creation-review-copy">沿用原定版创建流程视觉，仅保留提交所需信息。</p></header>
    <section class="creation-stage" aria-label="反馈与建议移动端界面">
      <div class="creation-phone" data-relative-phone data-relative-phone-width="320" data-relative-phone-height="694">
        <div class="cf-screen">
          <header class="cf-header" data-creation-header data-header-index="附 · 反馈" data-title="反馈与建议"></header>
          <section class="cf-section"><div class="feedback-grid"><label><span class="feedback-label">类型</span><select class="cf-select"><option>问题反馈</option><option>功能建议</option><option>叙事体验</option></select></label><label><span class="feedback-label">内容</span><textarea class="cf-textarea" placeholder="描述问题或建议"></textarea></label></div></section>
          <section class="cf-section"><div class="feedback-row"><div><strong>附带诊断</strong><small>不含密钥与密码</small></div><span class="feedback-value">开启</span></div><div class="feedback-row"><div><strong>玩家编号</strong><small>用于查询近期记录</small></div><span class="feedback-value">A7K9Q2</span></div></section>
          <button class="feedback-submit" type="button" data-submit>提交反馈</button>
        </div>
        <footer class="cf-footer"><button class="cf-back" type="button" data-flow-to="welcome" aria-label="返回欢迎界面"><span data-icon="back"></span></button><button class="cf-next" type="button" data-flow-to="welcome"><span class="cf-next-number">00</span><span class="cf-next-copy"><strong>返回</strong></span><span class="cf-next-arrow" data-icon="arrow"></span></button></footer>
        <div class="cf-toast" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <script>document.querySelector('[data-submit]').addEventListener('click',function(){if(window.CreationFlow)window.CreationFlow.notify('反馈已提交')})</script>
</body>
</html>
